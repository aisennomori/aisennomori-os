<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>ここだけは押さえておこう｜G検定 重要用語（第1〜5章）</title>
<style>
  :root{
    --navy-deep:#101b30;
    --navy:#1f3864;
    --navy-soft:#2c4a82;
    --paper:#f6f3ec;
    --card:#ffffff;
    --ink:#20242c;
    --muted:#68707c;
    --line:#e2ddd0;
    --amber:#c1893a;
    --amber-soft:#f4e3c8;
    --amber-deep:#8a5f24;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","YuGothic","Noto Sans JP",system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
    line-height:1.6;
    padding-bottom:64px;
  }
  a{color:inherit;}

  /* ---------- シラバス補完レイヤー ---------- */
  .chip-extra{ background:var(--amber-soft); color:var(--amber-deep); font-weight:800; }
  .chapter-extra .chapter-num{ background:var(--amber); }
  .extra-note{ font-size:12px; color:var(--muted); margin:2px 0 10px; line-height:1.5; }
  .term-card.from-syllabus{ border-left:3px solid var(--amber); }

  /* ---------- Header ---------- */
  header{
    position:sticky;
    top:0;
    z-index:40;
    background:linear-gradient(180deg,var(--navy-deep),var(--navy));
    color:#fff;
    padding:10px 16px 10px;
    box-shadow:0 4px 16px rgba(16,27,48,.28);
  }
  h1{
    font-size:15.5px;
    margin:0 0 8px;
    font-weight:800;
    letter-spacing:.01em;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .controls-row{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .search-row{
    display:flex;
    align-items:center;
    width:50%;
    flex-shrink:0;
  }
  .search-box{
    position:relative;
    flex:1;
    min-width:0;
  }
  .search-box svg{
    position:absolute;
    left:10px;
    top:50%;
    transform:translateY(-50%);
    opacity:.55;
    pointer-events:none;
  }
  #searchInput{
    width:100%;
    padding:8px 10px 8px 32px;
    border-radius:9px;
    border:1px solid rgba(255,255,255,.18);
    background:rgba(255,255,255,.10);
    color:#fff;
    font-size:13.5px;
    outline:none;
  }
  #searchInput::placeholder{color:#b7c3da;}
  #searchInput:focus{
    background:rgba(255,255,255,.16);
    border-color:#9db3d8;
  }
  .clear-btn{
    display:none;
    background:none;
    border:none;
    color:#cdd8ec;
    font-size:18px;
    line-height:1;
    padding:4px 6px;
    cursor:pointer;
    flex-shrink:0;
  }
  .clear-btn.show{display:block;}

  .memo-toggle{
    display:flex;
    align-items:center;
    gap:6px;
    font-size:12.5px;
    color:#cdd8ec;
    margin-left:auto;
    white-space:nowrap;
  }
  .switch{
    position:relative;
    width:34px;
    height:20px;
    background:rgba(255,255,255,.22);
    border-radius:999px;
    cursor:pointer;
    flex-shrink:0;
    transition:background .2s;
    border:none;
    padding:0;
  }
  .switch.on{background:var(--amber);}
  .switch::after{
    content:"";
    position:absolute;
    top:2px;
    left:2px;
    width:16px;
    height:16px;
    border-radius:50%;
    background:#fff;
    transition:transform .2s;
  }
  .switch.on::after{transform:translateX(14px);}
  .memo-toggle button.label{
    background:none;border:none;color:inherit;font:inherit;padding:0;cursor:pointer;
  }

  .chip-row-wrap{
    margin-top:10px;
  }
  .chip-row{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
  }
  .chip{
    flex-shrink:0;
    font-size:12.5px;
    font-weight:600;
    padding:6px 12px;
    border-radius:999px;
    background:rgba(255,255,255,.10);
    border:1px solid rgba(255,255,255,.16);
    color:#dbe4f2;
    white-space:nowrap;
    cursor:pointer;
  }
  .chip.active{
    background:var(--amber);
    border-color:var(--amber);
    color:#241605;
  }

  .status-bar{
    max-width:720px;
    margin:0 auto;
    padding:12px 16px 0;
    font-size:12.5px;
    color:var(--muted);
    display:flex;
    flex-wrap:wrap;
    justify-content:space-between;
    align-items:center;
    gap:8px 14px;
  }
  .status-bar .count b{color:var(--navy);font-size:13.5px;}
  .status-summary{
    display:flex;
    align-items:center;
    gap:12px;
    flex-wrap:wrap;
  }
  .status-summary .stat{
    display:flex;
    align-items:center;
    gap:4px;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  .status-summary .dot{
    width:9px;height:9px;border-radius:50%;flex-shrink:0;
  }
  .status-summary .dot.review{background:#d64545;}
  .status-summary .dot.memorized{background:#3f9142;}
  .status-summary .stat.active{
    font-weight:700;
    color:var(--ink);
    text-decoration:underline;
  }
  .status-right{
    display:flex;
    align-items:center;
    gap:12px;
  }

  main{
    max-width:720px;
    margin:0 auto;
    padding:8px 16px 0;
  }

  /* ---------- Chapter blocks ---------- */
  .chapter{
    margin-top:26px;
  }
  .chapter-head{
    display:flex;
    align-items:baseline;
    gap:10px;
    cursor:pointer;
    padding-bottom:8px;
    border-bottom:2px solid var(--navy);
    -webkit-tap-highlight-color:transparent;
  }
  .chapter-num{
    font-size:26px;
    font-weight:800;
    color:var(--amber);
    font-variant-numeric:tabular-nums;
    line-height:1;
  }
  .chapter-title{
    font-size:17px;
    font-weight:800;
    color:var(--navy);
    flex:1;
  }
  .chapter-toggle-icon{
    color:var(--navy);
    font-size:13px;
    transition:transform .2s;
    flex-shrink:0;
  }
  .chapter.collapsed .chapter-toggle-icon{transform:rotate(-90deg);}
  .chapter-body{
    overflow:hidden;
  }
  .chapter.collapsed .chapter-body{display:none;}

  .section-label{
    font-size:13px;
    font-weight:700;
    color:#fff;
    background:var(--navy-soft);
    display:inline-block;
    padding:4px 10px;
    border-radius:6px;
    margin:18px 0 10px;
  }
  .section-label:first-of-type{margin-top:16px;}

  /* ---------- Term cards ---------- */
  .term-card{
    background:var(--card);
    border:1px solid var(--line);
    border-left:4px solid transparent;
    border-radius:var(--radius);
    padding:12px 14px;
    margin-bottom:8px;
    position:relative;
    transition:border-left-color .15s, background .15s;
  }
  .term-card.status-review{
    border-left-color:#d64545;
    background:#fdf4f4;
  }
  .term-card.status-memorized{
    border-left-color:#3f9142;
    background:#f4f9f4;
  }
  .term-name-row{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:8px;
  }
  .status-dot{
    flex-shrink:0;
    width:22px;
    height:22px;
    border-radius:50%;
    border:2px solid #c7cdd8;
    background:#fff;
    cursor:pointer;
    padding:0;
    margin-top:1px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:12px;
    line-height:1;
    color:transparent;
    transition:all .15s;
  }
  .status-dot:hover{border-color:#9aa5b8;}
  .status-dot.review{
    border-color:#d64545;
    background:#d64545;
    color:#fff;
  }
  .status-dot.memorized{
    border-color:#3f9142;
    background:#3f9142;
    color:#fff;
  }
  .term-name{
    font-weight:800;
    color:var(--navy);
    font-size:14.5px;
    margin:0 0 4px;
  }
  .term-name mark, .term-desc mark, .exam-short mark{
    background:var(--amber-soft);
    color:var(--amber-deep);
    border-radius:3px;
    padding:0 2px;
  }
  .term-desc{
    font-size:14px;
    color:var(--ink);
    margin:0;
  }

  .no-result{

    text-align:center;
    color:var(--muted);
    font-size:14px;
    padding:60px 20px;
    display:none;
  }
  .no-result.show{display:block;}

  /* ---------- クイック検索結果（複数語・スコア順） ---------- */
  .quick-results{display:none; max-width:760px; margin:0 auto;}
  .quick-results.show{display:block;}
  .quick-head{
    font-size:12px; font-weight:800; color:var(--navy); letter-spacing:.04em;
    margin:4px 0 10px; padding-left:9px; border-left:3px solid var(--amber);
  }

  /* ---------- Web検索ボタン（検索欄と同じ行） ---------- */
  .webfb-inline{display:none; gap:6px; flex:0 0 auto;}
  .webfb-inline.show{display:flex;}
  .webfb-btn{
    display:inline-flex; align-items:center; justify-content:center; gap:5px;
    min-height:44px; padding:9px 13px; border-radius:9px;
    font-size:13.5px; font-weight:800; text-decoration:none; cursor:pointer;
    background:#fff; color:var(--navy); border:0; white-space:nowrap; line-height:1.3;
  }
  .webfb-btn:active{background:var(--paper);}
  .webfb-btn.official{background:transparent; color:#fff; border:1.5px solid rgba(255,255,255,.6);}
  .webfb-btn.official:active{background:rgba(255,255,255,.14);}

  /* 説明ブロックは0件・一部一致のときだけ、1行で出す */
  .webfb{display:none; margin:6px 0 0;}
  .webfb.show{display:block;}
  .webfb-msg{font-size:12px; line-height:1.5; color:#f4e3c8; margin:0; font-weight:700;}
  .webfb-q, .webfb-note{display:none;}
  .webfb-off{color:#f4e3c8; font-weight:700;}

  /* 検索中の件数バッジ（ステータスバーの代わり） */
  .hit-count{
    display:none; flex:0 0 auto; align-self:center;
    font-size:12.5px; font-weight:800; color:rgba(255,255,255,.9);
    white-space:nowrap; padding:0 2px;
  }
  body.searching .hit-count{display:inline-block;}

  /* ---------- コンパクト検索モード（検索中だけヘッダーを圧縮） ---------- */
  body.searching header{padding-top:8px; padding-bottom:8px;}
  body.searching header h1{font-size:14px; margin-bottom:7px; letter-spacing:.02em;}
  body.searching .mode-row{display:none;}
  body.searching .chip-row-wrap{display:none;}
  body.searching .controls-row{margin-bottom:0;}
  /* ステータスバーは、絞り込み中だけ細く残す（解除操作のため） */
  body.searching .status-bar{display:none;}
  body.searching.filtering .status-bar{display:flex; padding-top:3px; padding-bottom:3px; font-size:11.5px;}
  body.searching main{padding-top:4px;}
  body.searching .quick-head{display:none;}

  /* スマホでは同一行に詰め込まず、検索欄の下へ折り返す */
  @media(max-width:560px){
    .controls-row{flex-wrap:wrap; row-gap:8px;}
    .search-row{flex-wrap:wrap; row-gap:7px; width:100%; order:2;}
    .memo-toggle{order:1; margin-left:auto;}
    .search-box{flex:1 1 100%; min-width:0;}
    .clear-btn{order:3;}
    .hit-count{order:1; margin-right:auto;}
    .webfb-inline{order:2;}
    body.searching header h1{font-size:13px; margin-bottom:6px;}
    .webfb-btn{min-height:44px; padding:9px 14px;}
  }

  /* ---------- Display mode toggle ---------- */
  .mode-row{
    display:flex;
    align-items:center;
    gap:8px;
    margin-top:8px;
  }
  .mode-row .mode-label{
    font-size:11px;
    color:#9db3d8;
    flex-shrink:0;
  }
  .mode-toggle-group{
    display:flex;
    gap:4px;
    background:rgba(255,255,255,.08);
    border-radius:8px;
    padding:2px;
  }
  .mode-btn{
    font-size:11.5px;
    font-weight:700;
    padding:5px 10px;
    border-radius:6px;
    border:none;
    background:transparent;
    color:#b7c3da;
    cursor:pointer;
  }
  .mode-btn.active{
    background:var(--amber);
    color:#241605;
  }
  .compare-entry-btn{
    margin-left:auto;
    font-size:11.5px;
    font-weight:700;
    padding:5px 10px;
    border-radius:8px;
    border:1px solid rgba(255,255,255,.22);
    background:rgba(255,255,255,.08);
    color:#dbe4f2;
    cursor:pointer;
    flex-shrink:0;
  }
  .compare-entry-btn.active{
    background:var(--amber);
    border-color:var(--amber);
    color:#241605;
  }

  /* ---------- Exam-focused card layers ---------- */
  .label-tag{
    font-size:10px;
    font-weight:700;
    color:var(--muted);
    letter-spacing:.04em;
    margin:0 0 3px;
  }
  .meta-block{
    margin-bottom:8px;
  }
  .exam-short{
    font-size:14.5px;
    font-weight:800;
    color:var(--navy);
    margin:0 0 8px;
    line-height:1.55;
  }
  .keyword-row{
    display:flex;
    flex-wrap:wrap;
    gap:5px;
  }
  .keyword-chip{
    font-size:11px;
    font-weight:700;
    padding:3px 10px;
    border-radius:999px;
    background:var(--amber-soft);
    color:var(--amber-deep);
  }
  .compare-box{
    font-size:12.5px;
    background:#eef1f6;
    border-left:3px solid var(--navy-soft);
    padding:7px 10px;
    border-radius:0 7px 7px 0;
    margin-bottom:8px;
    color:#3a4256;
    line-height:1.5;
  }
  .compare-box b{color:var(--navy);}
  .textbook-block{
    border-top:1px dashed var(--line);
    padding-top:8px;
    margin-top:2px;
  }
  .textbook-block .term-desc{
    color:var(--muted);
    font-size:13px;
  }
  .term-card[data-has-meta="0"] .textbook-block{
    border-top:none;
    padding-top:0;
    margin-top:0;
  }
  .term-card[data-has-meta="0"] .term-desc{
    color:var(--ink);
    font-size:14px;
  }
  body.mode-exam .term-card[data-has-meta="1"] .textbook-block{display:none;}

  /* memorize mode reveal steps (has-meta cards) */
  .term-card.memo[data-has-meta="1"][data-reveal="0"] .meta-block,
  .term-card.memo[data-has-meta="1"][data-reveal="0"] .compare-box,
  .term-card.memo[data-has-meta="1"][data-reveal="0"] .textbook-block{display:none;}
  .term-card.memo[data-has-meta="1"][data-reveal="1"] .compare-box,
  .term-card.memo[data-has-meta="1"][data-reveal="1"] .textbook-block{display:none;}
  .term-card.memo[data-has-meta="1"] .reveal-btn.step1{display:none;}
  .term-card.memo[data-has-meta="1"][data-reveal="0"] .reveal-btn.step1{display:flex;}
  .term-card.memo[data-has-meta="1"] .reveal-btn.step2{display:none;}
  .term-card.memo[data-has-meta="1"][data-reveal="1"].has-step2 .reveal-btn.step2{display:flex;}

  /* memorize mode (no-meta cards, simple 1-step) */
  .term-card.memo[data-has-meta="0"][data-reveal="0"] .textbook-block{display:none;}
  .term-card.memo[data-has-meta="0"] .reveal-btn.step1{display:none;}
  .term-card.memo[data-has-meta="0"][data-reveal="0"] .reveal-btn.step1{display:flex;}

  .reveal-btn{
    display:none;
    width:100%;
    align-items:center;
    justify-content:center;
    gap:6px;
    background:var(--paper);
    border:1px dashed #c8b98f;
    border-radius:10px;
    color:var(--amber-deep);
    font-size:12.5px;
    font-weight:600;
    padding:8px;
    cursor:pointer;
    margin-top:4px;
  }

  /* ---------- Comparison mode ---------- */
  .compare-view{display:none;}
  body.compare-active .compare-view{display:block;}
  body.compare-active #main,
  body.compare-active .status-bar{display:none;}
  .compare-group{
    margin-bottom:26px;
  }
  .compare-group-title{
    font-size:13px;
    font-weight:700;
    color:#fff;
    background:var(--navy);
    display:inline-block;
    padding:5px 12px;
    border-radius:6px;
    margin-bottom:10px;
  }
  .compare-member{
    background:var(--card);
    border:1px solid var(--line);
    border-left:4px solid var(--amber);
    border-radius:var(--radius);
    padding:12px 14px;
    margin-bottom:8px;
  }

  footer{
    max-width:720px;
    margin:36px auto 0;
    padding:16px;
    font-size:11.5px;
    color:var(--muted);
    border-top:1px solid var(--line);
    line-height:1.7;
  }

  /* back to top */
  #topBtn{
    position:fixed;
    right:16px;
    bottom:16px;
    width:42px;
    height:42px;
    border-radius:50%;
    background:var(--navy);
    color:#fff;
    border:none;
    font-size:18px;
    box-shadow:0 4px 14px rgba(16,27,48,.35);
    display:none;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    z-index:30;
  }
  #topBtn.show{display:flex;}

  @media (min-width:600px){
    h1{font-size:22px;}
    .term-desc{font-size:14.5px;}
  }
</style>
</head>
<body>

<header>
  <h1>G検定　対策　ここだけは押さえておこう！</h1>
  <div class="controls-row">
    <div class="search-row">
      <div class="search-box">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input id="searchInput" type="text" placeholder="用語検索 / 迷った2語はスペース区切り" autocomplete="off">
      </div>
      <button class="clear-btn" id="clearBtn" aria-label="検索をクリア">&times;</button>
      <span class="hit-count" id="hitCount"></span>
      <div class="webfb-inline" id="webfbBtns"></div>
    </div>
    <div class="memo-toggle">
      <button class="switch" id="memoSwitch" role="switch" aria-checked="false"></button>
      <button class="label" id="memoLabel">暗記モード</button>
    </div>
  </div>
  <section class="webfb" id="webFallback" aria-live="polite">
    <p class="webfb-msg" id="webfbMsg"></p>
    <p class="webfb-q">検索語：<span id="webfbQuery"></span></p>
    <p class="webfb-note" id="webfbNote"></p>
  </section>

  <div class="mode-row">
    <span class="mode-label">表示</span>
    <div class="mode-toggle-group">
      <button class="mode-btn active" id="modeExamBtn">試験重視</button>
      <button class="mode-btn" id="modeFullBtn">全情報</button>
    </div>
    <button class="compare-entry-btn" id="compareEntryBtn">比較モード</button>
  </div>
  <div class="chip-row-wrap" id="chipRowWrap"><div class="chip-row" id="chipRow"></div></div>
</header>

<div class="status-bar">
  <span class="count"><b id="visibleCount">0</b> / <span id="totalCount">0</span> 語</span>
  <div class="status-summary">
    <span class="stat" id="statReview"><span class="dot review"></span>要確認 <b id="reviewCount">0</b></span>
    <span class="stat" id="statMemorized"><span class="dot memorized"></span>記憶済 <b id="memorizedCount">0</b></span>
    <span class="stat" id="statClearFilter" style="display:none;text-decoration:underline;cursor:pointer;">絞り込み解除</span>
  </div>
  <div class="status-right">
    <span id="collapseAllBtn" style="cursor:pointer;text-decoration:underline;">すべて閉じる</span>
  </div>
</div>

<main id="main"></main>

<div class="compare-view" id="compareView"></div>

<p class="no-result" id="noResult">該当する用語が見つかりません。検索語を変えてお試しください。</p>


<footer>

  教科書の要約表を基礎資料として収録。試験用ひとこと・キーワード・区別ポイントは、G検定学習時に用語を識別しやすくするための補助情報です。原典説明と試験対策補助情報は分離して表示しています。転記の際に誤りが生じる可能性があるため、実際の学習では原典テキストと読み合わせのうえご確認ください。
  <br><span style="opacity:.5;">build: 2026-08-14-v10（記憶状況チェック機能追加）</span>
</footer>

<button id="topBtn" aria-label="トップへ戻る">↑</button>

<script>
const CHAPTERS = [
  {
    title: "人工知能（AI）とは",

  const m = {};

  return m;
})();

// 通常描画・比較モード双方から参照する共通リゾルバ
function getTermMeta(term){
  return STUDY_META[term] || SYLLABUS_EXTRA_META[term] || null;
}

// ---------- Build DOM ----------
const main = document.getElementById('main');
const chipRow = document.getElementById('chipRow');
let totalTerms = 0;
let displayMode = 'exam'; // 'exam' | 'full'

// ---------- Check status（記憶状況チェック。端末ローカル保存） ----------
const STATUS_KEY = 'gkentei_yougo_status_v1';
// states: 0 = 未チェック, 1 = 要確認, 2 = 記憶済
let statusMap = {};
try {
  statusMap = JSON.parse(localStorage.getItem(STATUS_KEY) || '{}');
} catch(e) { statusMap = {}; }

function saveStatusMap(){
  try { localStorage.setItem(STATUS_KEY, JSON.stringify(statusMap)); } catch(e) {}
}

function applyStatus(term, card, dot){
  const state = statusMap[term] || 0;
  card.dataset.status = String(state);
  card.classList.toggle('status-review', state === 1);
  card.classList.toggle('status-memorized', state === 2);
  dot.classList.toggle('review', state === 1);
  dot.classList.toggle('memorized', state === 2);
  dot.textContent = state === 1 ? '!' : state === 2 ? '✓' : '';
  dot.title = state === 1 ? '要確認（タップで記憶済へ）' : state === 2 ? '記憶済（タップで解除）' : '未チェック（タップで要確認へ）';
}

function cycleStatus(term, card, dot){
  const cur = statusMap[term] || 0;
  const next = (cur + 1) % 3;
  if(next === 0) delete statusMap[term];
  else statusMap[term] = next;
  saveStatusMap();
  applyStatus(term, card, dot);
  updateStatusCounts();
  if(statusFilter) runSearch();
}

      kwLabel.className = 'label-tag';

      const kwRow = document.createElement('div');
      kwRow.className = 'keyword-row';
      meta.keywords.forEach(k => {
        const chip = document.createElement('span');
        chip.className = 'keyword-chip';
        chip.textContent = k;
        kwRow.appendChild(chip);
      });
      metaBlock.appendChild(kwRow);
    }
    card.appendChild(metaBlock);

    if(meta.compare){
      const cmp = document.createElement('div');
      cmp.className = 'compare-box';
      const cmpLabel = document.createElement('b');
      cmpLabel.textContent = '区別ポイント　';
      cmp.appendChild(cmpLabel);
      cmp.appendChild(document.createTextNode(meta.compare));
      card.appendChild(cmp);

  }

  const textbookBlock = document.createElement('div');
  textbookBlock.className = 'textbook-block';
  if(meta){
    const tbLabel = document.createElement('p');
    tbLabel.className = 'label-tag';
    tbLabel.textContent = '教科書の説明';
    textbookBlock.appendChild(tbLabel);
  }
  const descEl = document.createElement('p');
  descEl.className = 'term-desc';
  descEl.textContent = desc;
  textbookBlock.appendChild(descEl);
  card.appendChild(textbookBlock);

  // reveal buttons (memo mode)
  const revealBtn1 = document.createElement('button');
  revealBtn1.className = 'reveal-btn step1';
  revealBtn1.textContent = meta ? 'タップして試験用ひとことを表示' : 'タップして説明を表示';
  revealBtn1.addEventListener('click', (e) => { e.stopPropagation(); setReveal(card, 1); });
  card.appendChild(revealBtn1);

  if(meta){
    const revealBtn2 = document.createElement('button');
    revealBtn2.className = 'reveal-btn step2';
    revealBtn2.textContent = displayMode === 'full' ? '教科書説明も見る' : '区別ポイントを見る';
    revealBtn2.addEventListener('click', (e) => { e.stopPropagation(); setReveal(card, 2); });
    card.appendChild(revealBtn2);

function refreshCardStep2Applicability(card){
  const hasMeta = card.dataset.hasMeta === '1';
  if(!hasMeta) return;
  const hasCompare = card.classList.contains('has-compare');
  const willShowDesc = displayMode === 'full';
  const needsStep2 = hasCompare || willShowDesc;
  card.classList.toggle('has-step2', needsStep2);
  const btn2 = card.querySelector('.reveal-btn.step2');
  if(btn2) btn2.textContent = displayMode === 'full' ? '教科書説明も見る' : '区別ポイントを見る';
  // if no step2 content needed, tapping step1 reveals everything directly
  if(!needsStep2 && card.dataset.reveal === '1'){
    card.dataset.reveal = '2';
  }
}

function setReveal(card, step){
  card.dataset.reveal = String(step);
  if(step === 1 && !card.classList.contains('has-step2')){
    card.dataset.reveal = '2';
  }
}

function escapeHtml(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function highlight(text, query){
  /* query は文字列（1語検索）または配列（複数語検索） */
  if(Array.isArray(query)){
    if(!query.length) return escapeHtml(text);
    let out = '', rest = text;
    let guard = 0;
    while(guard++ < 200){
      let best = -1, bestLen = 0;
      query.forEach(t => {
        if(!t) return;
        const i = rest.toLowerCase().indexOf(t.toLowerCase());
        if(i !== -1 && (best === -1 || i < best)){ best = i; bestLen = t.length; }
      });
      if(best === -1) break;
      out += escapeHtml(rest.slice(0,best)) + '<mark>' + escapeHtml(rest.slice(best, best+bestLen)) + '</mark>';
      rest = rest.slice(best + bestLen);
    }
    return out + escapeHtml(rest);
  }
  if(!query) return escapeHtml(text);
  const idx = text.toLowerCase().indexOf(query.toLowerCase());
  if(idx === -1) return escapeHtml(text);
  return escapeHtml(text.slice(0,idx)) + '<mark>' + escapeHtml(text.slice(idx, idx+query.length)) + '</mark>' + escapeHtml(text.slice(idx+query.length));
}

/* ============================================================
   複数語検索（OR＋ランキング）
   1語のときは従来どおり includes() のまま。2語以上のときだけ拡張する。
   ============================================================ */
/* 全角スペースも区切りとして扱う */
function splitTerms(q){
  return q.split(/[\s\u3000]+/).filter(Boolean);
}
/* 一致フィールドごとの重み。用語名 > keywords > short > compare > desc */
const FIELD_WEIGHT = {term:16, keywords:8, short:4, compare:2, desc:1};

/* 表記ゆれの吸収（複数語クイック検索でのみ使用）。
   1語検索の挙動は変えないため、scoreCard の中でしか参照しない。
   教材データ側は一切書き換えず、検索時に別表記も照合するだけ。 */
const SEARCH_SYNONYMS = [
  ['画素', 'ピクセル'],
  ['個体', 'インスタンス'],
  ['誰', '話者'],
  ['見逃し', '偽陰性'],
  ['誤検知', '偽陽性'],
];
function expandTerm(t){
  const lt = t.toLowerCase();
  const out = [lt];
  SEARCH_SYNONYMS.forEach(pair => {
    pair.forEach((wd, i) => {
      if(lt.includes(wd.toLowerCase())) out.push(pair[1-i].toLowerCase());
    });
  });
  return out;
}

/* カード1枚に対する、語ごとの一致情報を返す */
function scoreCard(fields, terms){
  let hitCount = 0, weight = 0;
  const hitTerms = [];
  terms.forEach(t => {
    const variants = expandTerm(t);
    let best = 0;
    for(const k in FIELD_WEIGHT){
      if(!fields[k]) continue;
      if(variants.some(v => fields[k].includes(v))) best = Math.max(best, FIELD_WEIGHT[k]);
    }
    if(best > 0){ hitCount++; weight += best; hitTerms.push(t); }
  });
  return {hitCount, weight, hitTerms};
}

function runSearch(){
  restoreCards();                       // 前回のクイック表示を元に戻してから走査する
  const q = searchInput.value.trim();
  clearBtn.classList.toggle('show', q.length > 0);
  const filtering = !!q || !!statusFilter;
  let visible = 0;

  const terms = splitTerms(q);
  const multi = terms.length >= 2;          // 2語以上のときだけOR検索へ
  const foundTerms = new Set();             // ローカルで拾えた語
  let termNameHit = 0;                      // 用語名に一致したカード数
  const ranked = [];                        // 複数語検索時の並べ替え用

  document.querySelectorAll('.chapter').forEach(chapterEl => {
    let chapterHasMatch = false;
    chapterEl.querySelectorAll('.section-label').forEach(l => l.style.display = filtering ? 'none' : 'inline-block');
    chapterEl.querySelectorAll('.term-card').forEach(card => {
      const term = card.dataset.term;
      const desc = card.dataset.desc;
      const short = card.dataset.short || '';
      const keywords = card.dataset.keywords || '';
      const compare = card.dataset.compare || '';
      const haystack = [term, desc, short, keywords, compare].join(' ').toLowerCase();
      let textMatch, sc = null;
      if(!q){
        textMatch = true;
      } else if(multi){
        const fields = {term:term.toLowerCase(), desc:desc.toLowerCase(), short:short.toLowerCase(),
                        keywords:keywords.toLowerCase(), compare:compare.toLowerCase()};
        sc = scoreCard(fields, terms);
        textMatch = sc.hitCount > 0;
        if(textMatch) sc.hitTerms.forEach(t => foundTerms.add(t));
      } else {
        textMatch = haystack.includes(q.toLowerCase());
        if(textMatch){
          foundTerms.add(terms[0]);
          if(term.toLowerCase().includes(q.toLowerCase())) termNameHit++;
        }
      }
      if(multi && textMatch){
        if(terms.some(t => term.toLowerCase().includes(t.toLowerCase()))) termNameHit++;
        ranked.push({card, sc});
      }
      const cardState = card.dataset.status || '0';
      const statusMatch = !statusFilter || (statusFilter === 'review' && cardState === '1') || (statusFilter === 'memorized' && cardState === '2');
      const match = textMatch && statusMatch;
      card.style.display = match ? '' : 'none';
      if(match){
        visible++;
        chapterHasMatch = true;
        const hq = multi ? (sc && sc.hitTerms.length ? sc.hitTerms : []) : q;
        card.querySelector('.term-name').innerHTML = highlight(term, hq);
        const descNode = card.querySelector('.term-desc');
        if(descNode) descNode.innerHTML = highlight(desc, hq);
        const shortNode = card.querySelector('.exam-short');
        if(shortNode) shortNode.innerHTML = highlight(short, hq);
        if(filtering){
          // reveal all matches while filtering, even in memo mode, so results are actually visible
          setReveal(card, 2);
        } else if(card.classList.contains('memo')){
          card.dataset.reveal = '0';
        }
        // show the section label this card belongs to
        let labelEl = card.previousElementSibling;
        while(labelEl && !labelEl.classList.contains('section-label')) labelEl = labelEl.previousElementSibling;
        if(labelEl && filtering) labelEl.style.display = 'inline-block';
      }
    });
    chapterEl.style.display = (!filtering || chapterHasMatch) ? '' : 'none';
    if(filtering && chapterHasMatch) chapterEl.classList.remove('collapsed');
  });

  /* 複数語クイック検索は、章をまたいで全候補をスコア順に並べる。
     「一致語数 → 重み（用語名16 / keywords8 / short4 / compare2 / desc1）→ 元の章順」で順位付け。
     CHAPTERS の順番そのものは変えず、表示順だけを差し替える。 */
  if(multi && ranked.length){
    ranked.forEach((r,i) => { r.i = i; });            // 元の走査順＝章順をタイブレークに使う
    ranked.sort((a,b) => (b.sc.hitCount - a.sc.hitCount)
                      || (b.sc.weight   - a.sc.weight)
                      || (a.i - b.i));
    const head = document.createElement('div');
    head.className = 'quick-head';
    head.textContent = '一致度の高い順（' + ranked.length + '件）';
    quickResults.appendChild(head);
    ranked.forEach(r => quickResults.appendChild(r.card));
    quickResults.classList.add('show');
    document.querySelectorAll('.chapter').forEach(c => { c.style.display = 'none'; });
  }

  document.getElementById('visibleCount').textContent = visible;
  noResult.classList.toggle('show', visible === 0);
  /* 検索中は件数を検索行に出し、ステータスバーを畳む */
  const hc = document.getElementById('hitCount');
  hc.textContent = q ? (visible + '件' + (multi ? '・一致度順' : '')) : '';
  document.body.classList.toggle('filtering', !!statusFilter);
  updateWebFallback(q, terms, multi, visible, termNameHit, foundTerms);
}

const WEB_PREFIX = 'G検定';

const webFallback = document.getElementById('webFallback');
const webfbMsg    = document.getElementById('webfbMsg');
const webfbQuery  = document.getElementById('webfbQuery');
const webfbBtns   = document.getElementById('webfbBtns');
const webfbNote   = document.getElementById('webfbNote');

function updateWebFallback(q, terms, multi, visible, termNameHit, foundTerms){
  /* 検索中はヘッダーを圧縮する（章ボタン・表示切替・比較モードを隠す） */
  document.body.classList.toggle('searching', !!q);
  if(!q){
    webFallback.classList.remove('show','strong');
    webfbBtns.classList.remove('show');
    return;
  }

  /* 一致の強さを判定する
     none    … 1語も拾えていない
     partial … 複数語のうち一部しか拾えていない
     weak    … 結果はあるが用語名に一致がない（説明文への弱い一致のみ）
     ok      … 十分に拾えている */
  let level;
  if(visible === 0){
    level = 'none';
  } else if(multi && terms.some(t => !foundTerms.has(t))){
    level = 'partial';
  } else if(termNameHit === 0){
    level = 'weak';
  } else {
    level = 'ok';
  }

  const missing = multi ? terms.filter(t => !foundTerms.has(t)) : [];
  const MSG = {
    none:    'ローカル教材では該当する項目が見つかりませんでした。',
    partial: 'ローカル教材では一部の語しか一致しませんでした（未一致：' + missing.join('、') + '）。',
    weak:    'ローカル教材に用語名の一致はありません。説明文への部分一致のみです。',
    ok:      '上の結果で足りない場合は、Webでも調べられます。'
  };
  /* 説明は冗長になるため、0件と一部一致のときだけ1行で出す */
  const needMsg = (level === 'none' || level === 'partial');
  webfbMsg.textContent = needMsg ? MSG[level] : '';        // textContent で挿入（HTMLは入れない）
  webFallback.classList.toggle('strong', needMsg);
  webFallback.classList.toggle('show', needMsg);

  const query = WEB_PREFIX + ' ' + q;
  webfbQuery.textContent = query;

  /* ボタンを組み立て直す（innerHTMLに検索語を入れない） */
  webfbBtns.textContent = '';
  const mk = (label, url, cls, tip) => {
    const a = document.createElement('a');
    a.className = 'webfb-btn' + (cls ? ' ' + cls : '');
    a.href = url;
    a.target = '_blank';
    a.rel = 'noopener noreferrer';
    a.textContent = label;
    if(tip) a.title = tip;                                 // title属性も textContent 相当で安全
    return a;
  };
  webfbBtns.appendChild(mk('🌐 Web', searchUrl(query), '', query + ' をWebで検索'));
  detectOfficial(q).slice(0,2).forEach(o => {
    webfbBtns.appendChild(mk('公式', searchUrl(query + ' site:' + o.site), 'official', o.name + 'を検索'));
  });
  webfbBtns.classList.add('show');

  const offline = (typeof navigator !== 'undefined' && navigator.onLine === false);
  if(offline){
    webfbMsg.textContent = '現在オフラインのためWeb検索は利用できません。';
    webFallback.classList.add('show','strong');
  }
}

searchInput.addEventListener('input', runSearch);
clearBtn.addEventListener('click', () => {
  searchInput.value = '';
  runSearch();
  searchInput.focus();
});

// ---------- Memorize mode ----------
const memoSwitch = document.getElementById('memoSwitch');
const memoLabel = document.getElementById('memoLabel');
let memoOn = false;
function setMemo(on){
  memoOn = on;
  memoSwitch.classList.toggle('on', on);
  memoSwitch.setAttribute('aria-checked', on);
  document.querySelectorAll('.term-card').forEach(card => {
    card.classList.toggle('memo', on);
    card.dataset.reveal = '0';
  });
}
memoSwitch.addEventListener('click', () => setMemo(!memoOn));
memoLabel.addEventListener('click', () => setMemo(!memoOn));

// ---------- Display mode (試験重視 / 全情報) ----------
const modeExamBtn = document.getElementById('modeExamBtn');
const modeFullBtn = document.getElementById('modeFullBtn');
function setDisplayMode(mode){
  displayMode = mode;
  document.body.classList.toggle('mode-exam', mode === 'exam');
  document.body.classList.toggle('mode-full', mode === 'full');
  modeExamBtn.classList.toggle('active', mode === 'exam');
  modeFullBtn.classList.toggle('active', mode === 'full');
  document.querySelectorAll('.term-card[data-has-meta="1"]').forEach(refreshCardStep2Applicability);
}
modeExamBtn.addEventListener('click', () => setDisplayMode('exam'));
modeFullBtn.addEventListener('click', () => setDisplayMode('full'));
setDisplayMode('exam');

// ---------- Comparison mode ----------
const compareEntryBtn = document.getElementById('compareEntryBtn');
const compareView = document.getElementById('compareView');
let compareBuilt = false;
let compareOn = false;

function buildCompareView(){
  COMPARE_GROUPS.forEach(group => {
    const groupEl = document.createElement('div');
    groupEl.className = 'compare-group';

    const titleEl = document.createElement('div');
    titleEl.className = 'compare-group-title';
    titleEl.textContent = group.title;
    groupEl.appendChild(titleEl);

    group.members.forEach(termName => {
      const meta = getTermMeta(termName);
      const memberEl = document.createElement('div');
      memberEl.className = 'compare-member';

      const nameEl = document.createElement('p');
      nameEl.className = 'term-name';
      nameEl.textContent = termName;
      memberEl.appendChild(nameEl);

      if(meta){
        if(meta.short){
          const lbl = document.createElement('p');
          lbl.className = 'label-tag';
          lbl.textContent = '試験用ひとこと';
          memberEl.appendChild(lbl);
          const shortEl = document.createElement('p');
          shortEl.className = 'exam-short';
          shortEl.textContent = meta.short;
          memberEl.appendChild(shortEl);
        }
        if(meta.keywords && meta.keywords.length){
          const kwRow = document.createElement('div');
          kwRow.className = 'keyword-row';
          meta.keywords.forEach(k => {
            const chip = document.createElement('span');
            chip.className = 'keyword-chip';
            chip.textContent = k;
            kwRow.appendChild(chip);
          });
          memberEl.appendChild(kwRow);
        }
        if(meta.compare){
          const cmp = document.createElement('div');
          cmp.className = 'compare-box';
          cmp.style.marginTop = '8px';
          const cmpLabel = document.createElement('b');
          cmpLabel.textContent = '区別ポイント　';
          cmp.appendChild(cmpLabel);
          cmp.appendChild(document.createTextNode(meta.compare));
          memberEl.appendChild(cmp);
        }
      } else {
        const p = document.createElement('p');
        p.className = 'term-desc';
        p.textContent = '（試験用ひとこと未登録）';
        memberEl.appendChild(p);
      }
      groupEl.appendChild(memberEl);
    });

    compareView.appendChild(groupEl);
  });
  compareBuilt = true;
}

compareEntryBtn.addEventListener('click', () => {
  compareOn = !compareOn;
  if(compareOn && !compareBuilt) buildCompareView();
  document.body.classList.toggle('compare-active', compareOn);
  compareEntryBtn.classList.toggle('active', compareOn);
  compareEntryBtn.textContent = compareOn ? '一覧へ戻る' : '比較モード';
});

// ---------- Collapse all ----------
const collapseAllBtn = document.getElementById('collapseAllBtn');
let allCollapsed = false;
collapseAllBtn.addEventListener('click', () => {
  allCollapsed = !allCollapsed;
  document.querySelectorAll('.chapter').forEach(c => c.classList.toggle('collapsed', allCollapsed));
  collapseAllBtn.textContent = allCollapsed ? 'すべて開く' : 'すべて閉じる';
});

// ---------- Back to top ----------
const topBtn = document.getElementById('topBtn');
window.addEventListener('scroll', () => {
  topBtn.classList.toggle('show', window.scrollY > 500);
});
topBtn.addEventListener('click', () => window.scrollTo({top:0, behavior:'smooth'}));
</script>
