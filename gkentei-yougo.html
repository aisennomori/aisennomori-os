<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>ここだけは押さえておこう｜G検定 重要用語（第1〜5章）</title>
<style>
  :root{
    --navy-deep:#101b30;
    --navy:#1f3864;
    --navy-soft:#2c4a82;
    --paper:#f6f3ec;
    --card:#ffffff;
    --ink:#20242c;
    --muted:#68707c;
    --line:#e2ddd0;
    --amber:#c1893a;
    --amber-soft:#f4e3c8;
    --amber-deep:#8a5f24;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","YuGothic","Noto Sans JP",system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
    line-height:1.6;
    padding-bottom:64px;
  }
  a{color:inherit;}

  /* ---------- Header ---------- */
  header{
    position:sticky;
    top:0;
    z-index:40;
    background:linear-gradient(180deg,var(--navy-deep),var(--navy));
    color:#fff;
    padding:14px 16px 12px;
    box-shadow:0 4px 16px rgba(16,27,48,.28);
  }
  .eyebrow{
    font-size:11px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:#9db3d8;
    font-weight:700;
    margin:0 0 4px;
  }
  h1{
    font-size:20px;
    margin:0 0 12px;
    font-weight:800;
    letter-spacing:.01em;
  }
  .search-row{
    display:flex;
    gap:8px;
    align-items:center;
  }
  .search-box{
    position:relative;
    flex:1;
  }
  .search-box svg{
    position:absolute;
    left:12px;
    top:50%;
    transform:translateY(-50%);
    opacity:.55;
    pointer-events:none;
  }
  #searchInput{
    width:100%;
    padding:10px 12px 10px 36px;
    border-radius:10px;
    border:1px solid rgba(255,255,255,.18);
    background:rgba(255,255,255,.10);
    color:#fff;
    font-size:15px;
    outline:none;
  }
  #searchInput::placeholder{color:#b7c3da;}
  #searchInput:focus{
    background:rgba(255,255,255,.16);
    border-color:#9db3d8;
  }
  .clear-btn{
    display:none;
    background:none;
    border:none;
    color:#cdd8ec;
    font-size:20px;
    line-height:1;
    padding:6px;
    cursor:pointer;
  }
  .clear-btn.show{display:block;}

  .memo-toggle{
    display:flex;
    align-items:center;
    gap:8px;
    margin-top:10px;
    font-size:12.5px;
    color:#cdd8ec;
  }
  .switch{
    position:relative;
    width:38px;
    height:22px;
    background:rgba(255,255,255,.22);
    border-radius:999px;
    cursor:pointer;
    flex-shrink:0;
    transition:background .2s;
    border:none;
    padding:0;
  }
  .switch.on{background:var(--amber);}
  .switch::after{
    content:"";
    position:absolute;
    top:2px;
    left:2px;
    width:18px;
    height:18px;
    border-radius:50%;
    background:#fff;
    transition:transform .2s;
  }
  .switch.on::after{transform:translateX(16px);}
  .memo-toggle button.label{
    background:none;border:none;color:inherit;font:inherit;padding:0;cursor:pointer;
  }

  .chip-row{
    display:flex;
    gap:6px;
    overflow-x:auto;
    margin-top:10px;
    padding-bottom:2px;
    scrollbar-width:none;
  }
  .chip-row::-webkit-scrollbar{display:none;}
  .chip{
    flex-shrink:0;
    font-size:12.5px;
    font-weight:600;
    padding:6px 12px;
    border-radius:999px;
    background:rgba(255,255,255,.10);
    border:1px solid rgba(255,255,255,.16);
    color:#dbe4f2;
    white-space:nowrap;
    cursor:pointer;
  }
  .chip.active{
    background:var(--amber);
    border-color:var(--amber);
    color:#241605;
  }

  .status-bar{
    max-width:720px;
    margin:0 auto;
    padding:12px 16px 0;
    font-size:12.5px;
    color:var(--muted);
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .status-bar .count b{color:var(--navy);font-size:13.5px;}

  main{
    max-width:720px;
    margin:0 auto;
    padding:8px 16px 0;
  }

  /* ---------- Chapter blocks ---------- */
  .chapter{
    margin-top:26px;
  }
  .chapter-head{
    display:flex;
    align-items:baseline;
    gap:10px;
    cursor:pointer;
    padding-bottom:8px;
    border-bottom:2px solid var(--navy);
    -webkit-tap-highlight-color:transparent;
  }
  .chapter-num{
    font-size:26px;
    font-weight:800;
    color:var(--amber);
    font-variant-numeric:tabular-nums;
    line-height:1;
  }
  .chapter-title{
    font-size:17px;
    font-weight:800;
    color:var(--navy);
    flex:1;
  }
  .chapter-toggle-icon{
    color:var(--navy);
    font-size:13px;
    transition:transform .2s;
    flex-shrink:0;
  }
  .chapter.collapsed .chapter-toggle-icon{transform:rotate(-90deg);}
  .chapter-body{
    overflow:hidden;
  }
  .chapter.collapsed .chapter-body{display:none;}

  .section-label{
    font-size:13px;
    font-weight:700;
    color:#fff;
    background:var(--navy-soft);
    display:inline-block;
    padding:4px 10px;
    border-radius:6px;
    margin:18px 0 10px;
  }
  .section-label:first-of-type{margin-top:16px;}

  /* ---------- Term cards ---------- */
  .term-card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:12px 14px;
    margin-bottom:8px;
  }
  .term-name{
    font-weight:800;
    color:var(--navy);
    font-size:14.5px;
    margin:0 0 4px;
  }
  .term-name mark, .term-desc mark{
    background:var(--amber-soft);
    color:var(--amber-deep);
    border-radius:3px;
    padding:0 2px;
  }
  .term-desc{
    font-size:14px;
    color:var(--ink);
    margin:0;
  }

  /* memorize mode */
  .term-card.quiz .term-desc{
    display:none;
  }
  .term-card.quiz .reveal-btn{
    display:flex;
  }
  .reveal-btn{
    display:none;
    width:100%;
    align-items:center;
    justify-content:center;
    gap:6px;
    background:var(--paper);
    border:1px dashed #c8b98f;
    border-radius:10px;
    color:var(--amber-deep);
    font-size:12.5px;
    font-weight:600;
    padding:8px;
    cursor:pointer;
  }
  .term-card.quiz.revealed .term-desc{display:block;}
  .term-card.quiz.revealed .reveal-btn{display:none;}

  .no-result{
    text-align:center;
    color:var(--muted);
    font-size:14px;
    padding:60px 20px;
    display:none;
  }
  .no-result.show{display:block;}

  footer{
    max-width:720px;
    margin:36px auto 0;
    padding:16px;
    font-size:11.5px;
    color:var(--muted);
    border-top:1px solid var(--line);
    line-height:1.7;
  }

  /* back to top */
  #topBtn{
    position:fixed;
    right:16px;
    bottom:16px;
    width:42px;
    height:42px;
    border-radius:50%;
    background:var(--navy);
    color:#fff;
    border:none;
    font-size:18px;
    box-shadow:0 4px 14px rgba(16,27,48,.35);
    display:none;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    z-index:30;
  }
  #topBtn.show{display:flex;}

  @media (min-width:600px){
    h1{font-size:22px;}
    .term-desc{font-size:14.5px;}
  }
</style>
</head>
<body>

<header>
  <p class="eyebrow">G検定 対策 &middot; Super Summary</p>
  <h1>ここだけは押さえておこう！</h1>
  <div class="search-row">
    <div class="search-box">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input id="searchInput" type="text" placeholder="用語・説明で検索（例: 過学習）" autocomplete="off">
    </div>
    <button class="clear-btn" id="clearBtn" aria-label="検索をクリア">&times;</button>
  </div>
  <div class="memo-toggle">
    <button class="switch" id="memoSwitch" role="switch" aria-checked="false"></button>
    <button class="label" id="memoLabel">暗記モード（説明をタップして表示）</button>
  </div>
  <div class="chip-row" id="chipRow"></div>
</header>

<div class="status-bar">
  <span class="count"><b id="visibleCount">0</b> / <span id="totalCount">0</span> 語</span>
  <span id="collapseAllBtn" style="cursor:pointer;text-decoration:underline;">すべて閉じる</span>
</div>

<main id="main"></main>

<p class="no-result" id="noResult">該当する用語が見つかりません。検索語を変えてお試しください。</p>

<footer>
  出典：スッキリわかるG検定テキスト各章「ここだけは押さえておこう！」より作成。第1章〜第5章の最重要用語一覧です。転記の際に誤りが生じる可能性があるため、実際の学習では原典テキストと読み合わせのうえご確認ください。
</footer>

<button id="topBtn" aria-label="トップへ戻る">↑</button>

// ---------- Build DOM ----------
const main = document.getElementById('main');
const chipRow = document.getElementById('chipRow');
let totalTerms = 0;

CHAPTERS.forEach((ch, ci) => {
  const chNum = ci + 1;
  ch.terms_flat = [];
  ch.sections.forEach(s => s.terms.forEach(t => ch.terms_flat.push(t)));
  totalTerms += ch.terms_flat.length;

  // chip nav
  const chip = document.createElement('div');
  chip.className = 'chip';
  chip.textContent = `第${chNum}章`;
  chip.addEventListener('click', () => {
    document.getElementById('chapter-' + chNum).scrollIntoView({behavior:'smooth', block:'start'});
  });
  chipRow.appendChild(chip);

  // chapter block
  const chapterEl = document.createElement('section');
  chapterEl.className = 'chapter';
  chapterEl.id = 'chapter-' + chNum;

  const head = document.createElement('div');
  head.className = 'chapter-head';
  head.innerHTML = `<span class="chapter-num">${String(chNum).padStart(2,'0')}</span><span class="chapter-title">${ch.title}</span><span class="chapter-toggle-icon">▼</span>`;
  head.addEventListener('click', () => {
    chapterEl.classList.toggle('collapsed');
  });
  chapterEl.appendChild(head);

  const body = document.createElement('div');
  body.className = 'chapter-body';

  ch.sections.forEach(section => {
    const label = document.createElement('div');
    label.className = 'section-label';
    label.textContent = section.label;
    body.appendChild(label);

    section.terms.forEach(([term, desc]) => {
      const card = document.createElement('div');
      card.className = 'term-card';
      card.dataset.term = term;
      card.dataset.desc = desc;

      const nameEl = document.createElement('p');
      nameEl.className = 'term-name';
      nameEl.textContent = term;

      const descEl = document.createElement('p');
      descEl.className = 'term-desc';
      descEl.textContent = desc;

      const revealBtn = document.createElement('button');
      revealBtn.className = 'reveal-btn';
      revealBtn.textContent = 'タップして説明を表示';
      revealBtn.addEventListener('click', () => card.classList.add('revealed'));

      card.appendChild(nameEl);
      card.appendChild(descEl);
      card.appendChild(revealBtn);
      card.addEventListener('click', (e) => {
        if(card.classList.contains('quiz') && !card.classList.contains('revealed')){
          card.classList.add('revealed');
        }
      });
      body.appendChild(card);
    });
  });

  chapterEl.appendChild(body);
  main.appendChild(chapterEl);
});

document.getElementById('totalCount').textContent = totalTerms;
document.getElementById('visibleCount').textContent = totalTerms;

// ---------- Search ----------
const searchInput = document.getElementById('searchInput');
const clearBtn = document.getElementById('clearBtn');
const noResult = document.getElementById('noResult');

function escapeHtml(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function highlight(text, query){
  if(!query) return escapeHtml(text);
  const idx = text.toLowerCase().indexOf(query.toLowerCase());
  if(idx === -1) return escapeHtml(text);
  return escapeHtml(text.slice(0,idx)) + '<mark>' + escapeHtml(text.slice(idx, idx+query.length)) + '</mark>' + escapeHtml(text.slice(idx+query.length));
}

function runSearch(){
  const q = searchInput.value.trim();
  clearBtn.classList.toggle('show', q.length > 0);
  let visible = 0;

  document.querySelectorAll('.chapter').forEach(chapterEl => {
    let chapterHasMatch = false;
    chapterEl.querySelectorAll('.section-label').forEach(l => l.style.display = q ? 'none' : 'inline-block');
    chapterEl.querySelectorAll('.term-card').forEach(card => {
      const term = card.dataset.term;
      const desc = card.dataset.desc;
      const match = !q || term.toLowerCase().includes(q.toLowerCase()) || desc.toLowerCase().includes(q.toLowerCase());
      card.style.display = match ? '' : 'none';
      if(match){
        visible++;
        chapterHasMatch = true;
        card.querySelector('.term-name').innerHTML = highlight(term, q);
        card.querySelector('.term-desc').innerHTML = highlight(desc, q);
        if(q){
          // reveal all matches while searching, even in quiz mode, so results are actually visible
          card.classList.add('revealed');
        } else if(card.classList.contains('quiz')){
          card.classList.remove('revealed');
        }
        // show the section label this card belongs to
        let labelEl = card.previousElementSibling;
        while(labelEl && !labelEl.classList.contains('section-label')) labelEl = labelEl.previousElementSibling;
        if(labelEl && q) labelEl.style.display = 'inline-block';
      }
    });
    chapterEl.style.display = (!q || chapterHasMatch) ? '' : 'none';
    if(q && chapterHasMatch) chapterEl.classList.remove('collapsed');
  });

  document.getElementById('visibleCount').textContent = visible;
  noResult.classList.toggle('show', visible === 0);
}

searchInput.addEventListener('input', runSearch);
clearBtn.addEventListener('click', () => {
  searchInput.value = '';
  runSearch();
  searchInput.focus();
});

// ---------- Memorize mode ----------
const memoSwitch = document.getElementById('memoSwitch');
const memoLabel = document.getElementById('memoLabel');
let memoOn = false;
function setMemo(on){
  memoOn = on;
  memoSwitch.classList.toggle('on', on);
  memoSwitch.setAttribute('aria-checked', on);
  document.querySelectorAll('.term-card').forEach(card => {
    card.classList.toggle('quiz', on);
    card.classList.remove('revealed');
  });
}
memoSwitch.addEventListener('click', () => setMemo(!memoOn));
memoLabel.addEventListener('click', () => setMemo(!memoOn));

// ---------- Collapse all ----------
const collapseAllBtn = document.getElementById('collapseAllBtn');
let allCollapsed = false;
collapseAllBtn.addEventListener('click', () => {
  allCollapsed = !allCollapsed;
  document.querySelectorAll('.chapter').forEach(c => c.classList.toggle('collapsed', allCollapsed));
  collapseAllBtn.textContent = allCollapsed ? 'すべて開く' : 'すべて閉じる';
});

// ---------- Back to top ----------
const topBtn = document.getElementById('topBtn');
window.addEventListener('scroll', () => {
  topBtn.classList.toggle('show', window.scrollY > 500);
});
topBtn.addEventListener('click', () => window.scrollTo({top:0, behavior:'smooth'}));
</script>
