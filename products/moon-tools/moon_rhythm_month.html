<!doctype html>
<html lang="ja">
<!--- 月のリズムと、私の1か月 Version 1.0.1（2026-11-06 PO承認・公開候補）：月の絵を既存素材（画像/moon_01〜30.png）に差し替え・画面下の注記を整理。暦データ・24パターンの文章は Version 1.0 と同一--->
<!-- Version 1.0.2 候補（2026-11-08）：周期の表示を1行に簡素化（スマホ＝月日、PC＝西暦年つき）・新月満月カードの月アイコンを透過の円形に（A案）。暦データ・計算・カレンダーの月の絵・文章は変更なし -->
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>月のリズムと、私の1か月 | 愛泉の杜</title>
<style>
:root{--navy:#16223a;--navy2:#1d3557;--cream:#f7f2e7;--ink:#2b2b2b;--soft:#5b6270;--line:#e6dfcf;--gold:#f0d27a;
  --r1:#2a8f8a;--r2:#d9653b;--r3:#4f9a3f;--sun:#c0392b;--sat:#2f6db5;
  --blue:#d6e8fb;--red:#fbdde3;--green:#d9f0d6;--cyan:#d6e8fb}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--cream);color:var(--ink);font-family:"Noto Sans CJK JP","Hiragino Sans","Yu Gothic",sans-serif;-webkit-text-size-adjust:100%}
header{background:linear-gradient(180deg,#0f1c33,#1d3557 75%,#2c4a6e);color:#fff;padding:18px 16px 16px;border-radius:0 0 28px 28px;position:relative;overflow:hidden}
header .moon{position:absolute;right:28px;top:14px;width:58px;height:58px;border-radius:50%;background:radial-gradient(circle at 40% 38%,#fff7d0,#f0d27a 60%,#c9a24a);box-shadow:0 0 30px 8px rgba(246,214,120,.3)}
header h1{font-size:26px;font-weight:900;color:#f5d98a;letter-spacing:.03em}
header .sub{font-size:13px;color:#e8edf5;margin-top:4px;letter-spacing:.08em}
.nav{display:flex;align-items:center;gap:10px;max-width:1180px;margin:14px auto 0;padding:0 16px}
.nav button{flex:0 0 auto;min-width:44px;min-height:44px;border:1px solid var(--line);background:#fff;border-radius:22px;font-size:15px;cursor:pointer;padding:0 14px;color:var(--navy2)}
.nav button:disabled{opacity:.35;cursor:default}
.nav .range{flex:1;min-width:0;min-height:44px;box-sizing:border-box;display:flex;align-items:center;justify-content:center;text-align:center;white-space:nowrap;background:#fff;border:1px solid var(--line);border-radius:22px;padding:4px 10px;font-weight:700;font-size:16px}
.nav .range .r-sp{display:none}
@media (max-width:899px){.nav .range .r-pc{display:none}.nav .range .r-sp{display:inline}}
.calcnote{max-width:1148px;margin:8px auto 0;background:#eef2f8;border:1px solid #c9d4e6;color:#2c3e5c;border-radius:10px;padding:6px 12px;font-size:13px;line-height:1.6}
@media (max-width:899px){.calcnote{margin:8px 16px 0}}
main{max-width:1180px;margin:0 auto;padding:12px 16px 28px}
/* PC：10日×3段 */
.row{margin-top:10px}
.bar{color:#fff;font-weight:700;font-size:15px;padding:4px 14px;border-radius:10px 10px 0 0}
.grid{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;position:relative}
.cell{background:#fff;border:1px solid var(--line);min-height:168px;padding:6px 2px 4px;display:flex;flex-direction:column;align-items:center;cursor:pointer;position:relative}
.cell:hover{background:#fffdf6}
.cell.sel{outline:3px solid #e2b54a;outline-offset:-3px}
.cell.today{background:#fff8e6}
.cell.today::after{content:"今日";position:absolute;top:4px;right:4px;font-size:10.5px;background:var(--sun);color:#fff;border-radius:6px;padding:0 5px}
.cell .dt{font-size:16px;font-weight:700;margin-top:3px}
.cell .dw{font-size:12px;color:var(--soft)}
.sun{color:var(--sun)!important}.sat{color:var(--sat)!important}
.cell .nm{font-size:13px;color:var(--navy2);margin-top:3px;text-align:center;line-height:1.3;word-break:keep-all;overflow-wrap:anywhere;padding:0 2px}
.cell .nm small{display:block;font-size:11px;color:var(--soft);margin-top:1px}
.cell .nn{font-size:11.5px;color:var(--soft)}
.bands{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;margin-top:3px;min-height:34px}
.band{border-radius:17px;display:flex;align-items:center;justify-content:center;gap:6px;font-size:13px;font-weight:700;color:var(--navy2);padding:4px 8px;text-align:center;line-height:1.2}
.band small{font-weight:400;font-size:11px;color:#3b4252}
.tag{border-radius:10px;font-size:12px;font-weight:700;text-align:center;padding:3px 2px;line-height:1.25}
.tag small{display:block;font-weight:400;font-size:10.5px;color:#3b4252}
.tag.new{background:#e5e1f5}.tag.full{background:#fde7c8}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;margin-top:10px;color:#333}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:-1px;margin-right:4px}
/* 選んだ日の詳細 */
.detail{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 16px;margin-top:12px;font-size:14px;line-height:1.7}
.detail b{color:var(--navy2)}
/* 新月・満月カード */
.cards{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
.card{background:var(--navy);color:#e9edf4;border:1px solid #c9a24a;border-radius:16px;padding:16px 18px}
.card .hd{display:flex;align-items:center;gap:12px}
.card .hd .cmoon{display:block;flex:none;width:46px;height:46px}
.card .when{color:var(--gold);font-size:14px}
.card .ttl{font-size:21px;font-weight:700;color:#fff}
.card .ttl span{font-size:13px;color:#cfd6e2;font-weight:400;margin-left:6px}
.card .kw{color:#f2c96a;font-weight:700;margin:10px 0 6px;font-size:15px}
.card p{font-size:14px;line-height:1.75}
.card ul{margin:8px 0 0 1.1em;font-size:14px;line-height:1.8}
.card .q{margin-top:10px;border:1px dashed #c9a24a;border-radius:10px;padding:8px 10px;color:#f2c96a;font-style:italic;text-align:center;font-size:14.5px}
.card .none{color:#cfd6e2;font-size:14px;margin-top:8px}
.card summary{list-style:none;cursor:pointer}
.card summary::-webkit-details-marker{display:none}
.card .more{font-size:12px;color:#cfd6e2;margin-top:6px}
.sp-only{display:none}
@media (max-width:899px){.sp-only{display:block}}
.notes{font-size:11.5px;color:var(--soft);margin-top:14px;line-height:1.7}
.notes .lead{margin:0 0 6px;font-size:13px;color:var(--ink)}
.srcinfo{border:1px solid var(--line);border-radius:8px;background:#fff;max-width:100%}
.srcinfo summary{cursor:pointer;padding:10px 12px;min-height:44px;box-sizing:border-box;display:flex;align-items:center;font-size:13px;color:var(--navy2)}
.srcinfo ul{margin:0;padding:0 14px 10px 28px;overflow-wrap:anywhere}
img.mi{display:block;flex:none;object-fit:contain;border-radius:50%}
img.mi.glow{box-shadow:0 0 0 2px rgba(246,211,107,.6)}
/* スマホ */
.ov,.tabs,.list,.guide{display:none}
.guide{font-size:13px;color:var(--soft);margin-top:8px;text-align:center}
@media (max-width:899px){
  header h1{font-size:21px}header .moon{width:42px;height:42px;right:18px}
  .nav .range{font-size:14.5px}
  .rows-pc,.legend-pc{display:none}
  .ov{display:flex;gap:2px;justify-content:space-between;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 6px;margin-top:10px}
  .ov .grp{display:flex;gap:2px;flex:1;justify-content:space-around;border-bottom:3px solid}
  .ov .grp{background:none;border-top:0;border-left:0;border-right:0;padding:0 0 2px;cursor:pointer;font:inherit;min-width:0;flex:1 1 0}
  .ov span.dy img.mi{width:100%;max-width:9px;height:auto;aspect-ratio:1/1}
  .ov span.dy{padding:2px 0;display:flex;flex-direction:column;align-items:center;flex:1;min-width:0}
  .ov span.dy i{display:block;width:5px;height:5px;border-radius:50%;margin-top:2px}
  .ov span.dy.today{outline:2px solid var(--sun);border-radius:4px}
  .guide{display:block!important}
  .tabs{display:flex;gap:6px;margin-top:10px}
  .tabs button{flex:1;min-height:48px;border:1px solid var(--line);background:#fff;border-radius:12px 12px 0 0;font-size:13px;line-height:1.3;cursor:pointer;color:var(--ink)}
  .tabs button b{display:block;font-size:14px}
  .tabs button.on{color:#fff;border-color:transparent}
  .list{display:block;background:#fff;border:1px solid var(--line);border-radius:0 0 12px 12px}
  .item{border-bottom:1px solid var(--line)}
  .item:last-child{border-bottom:0}
  .item>button{width:100%;display:grid;grid-template-columns:40px 64px 1fr;align-items:center;gap:8px;padding:9px 10px;background:none;border:0;text-align:left;cursor:pointer;font:inherit;color:inherit;min-height:56px}
  .item.today>button{background:#fff8e6}
  .item .d{font-weight:700;font-size:16px;line-height:1.2}.item .d small{display:block;font-weight:400;font-size:12px;color:var(--soft)}
  .item .n{font-size:14px;line-height:1.35;word-break:keep-all;overflow-wrap:anywhere}.item .n small{font-size:11.5px;color:var(--soft);margin-left:4px}
  .item .chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px}
  .chip{font-size:11.5px;border-radius:9px;padding:1px 8px;font-weight:700;color:var(--navy2)}
  .item .tod{font-size:10.5px;background:var(--sun);color:#fff;border-radius:6px;padding:0 5px;margin-left:4px}
  .item .ex{display:none;padding:0 12px 10px 58px;font-size:13.5px;line-height:1.7;color:#333}
  .item.open .ex{display:block}
  .detail{display:none}
  .cards{grid-template-columns:1fr}
}
</style>
</head>

<div class="nav"><button id="prev" aria-label="前の周期">◀</button><div class="range" id="range"></div><button id="next" aria-label="次の周期">▶</button></div>

<main>

  <div class="legend legend-pc" id="legendPc"></div>

  <div class="ov" id="ov" aria-label="この周期30日の全体像"></div>
  <div class="tabs" id="tabs"></div>
  <div class="list" id="list"></div>
  <div class="detail" id="detail"></div>
  <div class="cards" id="cards"></div>
  <div class="notes" id="notes"></div>
</main>

<!-- ⑤ 表示ロジック -->
<script>
'use strict';
const HC = HawaiianCalendar, DAY = 86400000;
const NIGHTS = JSON.parse(document.getElementById('night-data').textContent);
const EV = JSON.parse(document.getElementById('moon-events').textContent);
const TH = JSON.parse(document.getElementById('sign-themes').textContent);
const THEME = Object.fromEntries(TH.signs.map(s => [s.sign, s]));
const DOW = ['日','月','火','水','木','金','土'];
// 活動期間（既存アプリの夜番号の対応と同じ。変更しない）
const PERIODS = [
  { key:'blue',  from:1,  to:3,  name:'新しい事を始める', sub:'', color:'#3b8ff0', bg:'var(--blue)' },
  { key:'red',   from:7,  to:10, name:'休息期', sub:'小さなことでも良いので休息をとる', color:'#e8345a', bg:'var(--red)' },
  { key:'green', from:18, to:20, name:'食物パワー・自然とつながる', sub:'', color:'#1f9a3c', bg:'var(--green)' },
  { key:'cyan',  from:23, to:26, name:'浄化期', sub:'手放し・整える', color:'#3c8fe6', bg:'var(--cyan)' },
];
const periodOf = n => PERIODS.find(p => n >= p.from && n <= p.to) || null;
const ymd = ms => HC.ymd(ms), md = ms => { const d = new Date(ms); return (d.getUTCMonth()+1) + '/' + d.getUTCDate(); };
const dow = ms => new Date(ms).getUTCDay();
// 長い夜名・かなは区切り（- ・）の後ろで折り返せるようにする
const brk = (s, sep) => esc(s).split(sep).join(sep + '<wbr>');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// 月の絵：古来ハワイ太陰暦の夜番号（第1〜30夜）ごとの既存素材（画像/moon_01〜30.png。ムーン手帖・月読みカードと同じ対応）
// 29夜の周期では第29夜の日がないため moon_29 は使わない（Mukuは moon_30）。読み込めない場合は枠だけ残して非表示
const pad2 = n => String(n).padStart(2, '0');
function moonImg(n, size, glow){
  return `<img class="mi${glow ? ' glow' : ''}" src="画像/moon_${pad2(n)}.png" width="${size}" height="${size}" alt="" aria-hidden="true" decoding="async" onerror="this.style.visibility='hidden'">`;
}

// 状態：表示する周期（?cycle=YYYY-MM-DD でその日を含む周期を開ける：共有用）・今日（日本時間）
const qs = new URLSearchParams(location.search);
const now = new Date(Date.now() + 9*3600000);
const TODAY = Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate());
let cyc = HC.cycleAt(qs.get('cycle') ? HC.parse(qs.get('cycle')) : TODAY);
let tab = 0, sel = null;

function daysOf(c){
  const out = [];
  for (let ms = c.hiloMs; ms <= c.mukuMs; ms += DAY){ const n = HC.nightNumber(c, ms); out.push({ ms, n, night: NIGHTS[n-1] }); }
  return out;
}
// この周期に付く新月・満月：はじまりの新月＝Hilo以前で最も近い新月、満月＝周期内、終わりの新月＝周期内（Muku側）
function eventsOf(c){
  const list = EV.events.map(e => ({ ...e, ms: HC.parse(e.date) }));
  const startNew = list.filter(e => e.type === 'new' && e.ms <= c.hiloMs && e.ms >= c.hiloMs - 3*DAY).pop() || null;
  const full = list.find(e => e.type === 'full' && e.ms >= c.hiloMs && e.ms <= c.mukuMs) || null;
  const endNew = list.find(e => e.type === 'new' && e.ms > c.hiloMs && e.ms <= c.mukuMs) || null;
  const covered = c.hiloMs >= HC.parse(EV.range[0]) && c.mukuMs <= HC.parse(EV.range[1]);
  return { startNew, full, endNew, covered };
}
const evOnDay = (E, ms) => [E.full, E.endNew].filter(e => e && e.ms === ms);
const groups = days => [days.slice(0,10), days.slice(10,20), days.slice(20)];
const fmtDate = ms => `${new Date(ms).getUTCFullYear()}年${new Date(ms).getUTCMonth()+1}月${new Date(ms).getUTCDate()}日`;
const dowCls = ms => dow(ms) === 0 ? 'sun' : dow(ms) === 6 ? 'sat' : '';

function render(){
  const days = daysOf(cyc), E = eventsOf(cyc), G = groups(days);
  const hasToday = TODAY >= cyc.hiloMs && TODAY <= cyc.mukuMs;
  // 2028年以降の日付を含む周期：計算値であることを表示（共通周期データは変更しない）
  const cn = document.getElementById('calcnote'), CALC_FROM = Date.UTC(2028, 0, 1);
  cn.hidden = cyc.mukuMs < CALC_FROM;
  cn.textContent = 'この周期には2028年以降の日付が含まれます。2028年以降のハワイ暦の日付（Hilo・Muku）は、愛泉の杜OSの共通周期データによる計算値で、正式な暦資料とはまだ照合していません。';
  // 周期の表示：スマホ（幅899px以下）は月日だけ、PCは開始日・終了日とも西暦年つき。年は周期の日付から取得（年をまたぐ周期にも対応）
  const ymdS = ms => `${new Date(ms).getUTCFullYear()}/${md(ms)}`;
  document.getElementById('range').innerHTML = `<span class="r-sp">${md(cyc.hiloMs)}〜${md(cyc.mukuMs)}</span><span class="r-pc">${ymdS(cyc.hiloMs)}〜${ymdS(cyc.mukuMs)}</span>`;
  document.getElementById('prev').disabled = !HC.inRange(cyc.hiloMs - DAY);
  document.getElementById('next').disabled = !HC.inRange(cyc.mukuMs + DAY);
  // PC
  const colors = ['var(--r1)','var(--r2)','var(--r3)'];
  document.getElementById('rowsPc').innerHTML = G.map((g, gi) => {
    let cells = '', bands = '';
    g.forEach((d, i) => {
      const e = evOnDay(E, d.ms)[0];
      cells += `<div class="cell ${d.ms===TODAY?'today':''} ${sel===d.ms?'sel':''}" data-ms="${d.ms}" style="grid-column:${i+1}">
        ${moonImg(d.n, 40, e && e.type==='full')}<div class="dt ${dowCls(d.ms)}">${md(d.ms)}</div><div class="dw ${dowCls(d.ms)}">（${DOW[dow(d.ms)]}）</div>
        <div class="nn">第${d.n}夜</div><div class="nm">${brk(d.night.name, '-')}<small>${brk(d.night.kana, '・')}</small></div></div>`;
    });
    // 帯・札
    let i = 0;
    while (i < g.length){ const p = periodOf(g[i].n); let j = i; while (p && j+1 < g.length && periodOf(g[j+1].n) === p) j++;
      if (p) bands += `<div class="band" style="grid-column:${i+1}/${j+2};background:${p.bg}"><span class="dot" style="background:${p.color}"></span>${p.name}${p.sub && j>i+1 ? `<small>（${p.sub}）</small>` : ''}</div>`;
      else { const e = evOnDay(E, g[i].ms)[0]; if (e) bands += `<div class="tag ${e.type}" style="grid-column:${i+1}">${e.type==='full'?'満月':'新月'}<small>${e.time_jst}・${e.sign}</small></div>`; }
      i = j + 1; }
    return `<div class="row"><div class="bar" style="background:${colors[gi]}">${md(g[0].ms)} 〜 ${md(g[g.length-1].ms)}　第${g[0].n}〜${g[g.length-1].n}夜</div><div class="grid">${cells}</div><div class="bands">${bands}</div></div>`;
  }).join('');
  document.getElementById('legendPc').innerHTML = PERIODS.map(p => `<span><span class="dot" style="background:${p.color}"></span>${p.name}</span>`).join('') + '<span>日付をクリックすると、その日の詳細を表示します</span>';
  // スマホ：30日の全体ナビ
  document.getElementById('ov').innerHTML = G.map((g, gi) => `<button class="grp" data-tab="${gi}" style="border-color:${colors[gi]}" aria-label="${md(g[0].ms)}〜${md(g[g.length-1].ms)}を表示">${g.map(d => { const p = periodOf(d.n);
    return `<span class="dy ${d.ms===TODAY?'today':''}">${moonImg(d.n, 9)}<i style="background:${p ? p.color : 'transparent'}"></i></span>`; }).join('')}</button>`).join('');
  if (!tabInit){ tab = hasToday ? G.findIndex(g => g.some(d => d.ms === TODAY)) : 0; tabInit = true; }
  document.getElementById('tabs').innerHTML = G.map((g, gi) => `<button class="${gi===tab?'on':''}" style="${gi===tab?`background:${colors[gi]}`:''}" data-tab="${gi}"><b>${md(g[0].ms)}〜${md(g[g.length-1].ms)}</b>第${g[0].n}〜${g[g.length-1].n}夜</button>`).join('');
  document.getElementById('list').innerHTML = G[tab].map(d => { const p = periodOf(d.n), e = evOnDay(E, d.ms)[0];
    return `<div class="item ${d.ms===TODAY?'today':''} ${sel===d.ms?'open':''}" data-ms="${d.ms}"><button aria-expanded="${sel===d.ms}">
      ${moonImg(d.n, 34, e && e.type==='full')}<div class="d ${dowCls(d.ms)}">${md(d.ms)}<small>（${DOW[dow(d.ms)]}）</small></div>
      <div><div class="n">第${d.n}夜 ${brk(d.night.name, '-')}<small>${brk(d.night.kana, '・')}</small>${d.ms===TODAY?'<span class="tod">今日</span>':''}</div>
      <div class="chips">${p ? `<span class="chip" style="background:${p.bg}">${p.name}</span>` : ''}${e ? `<span class="chip" style="background:${e.type==='full'?'#fde7c8':'#e5e1f5'}">${e.type==='full'?'満月':'新月'} ${e.time_jst} ${e.sign}</span>` : ''}</div></div></button>
      <div class="ex">${dayNote(d, E)}</div></div>`; }).join('');
  // PC：選んだ日
  const sd = days.find(d => d.ms === sel) || days.find(d => d.ms === TODAY) || days[0];
  document.getElementById('detail').innerHTML = `<b>${fmtDate(sd.ms)}（${DOW[dow(sd.ms)]}）</b>　${dayText(sd, E)}`;
  // カード
  document.getElementById('cards').innerHTML = card('new', E.startNew, 'この周期のはじまりの新月', E.covered) + card('full', E.full, 'この周期の満月', E.covered);
  document.getElementById('notes').innerHTML = `<p class="lead">※ 月や星座のテーマは、自分らしい過ごし方を考えるヒントとしてご利用ください。</p>
    <details class="srcinfo"${srcOpen ? ' open' : ''}><summary>暦データ・出典について</summary><ul>
    <li>新月・満月の時刻：国立天文台「暦要項」（日本標準時）</li>
    <li>星座：月と暦のカレンダー Data Version 2027.1.3（トロピカル方式）</li>
    <li>新月・満月のデータ収録期間：2026年9月1日〜2027年12月31日</li>
    <li>ハワイ暦：愛泉の杜OS共通周期データ Version ${esc(HC.VERSION)}</li>
    <li>2028年以降のハワイ暦の周期は、正式な暦資料との照合が終わっていない計算値です。</li>
    <li>月の絵：古来ハワイ太陰暦の夜番号（第1〜30夜）ごとの絵で、ムーン手帖などと同じ素材です。その日に実際に見える月の形（天文学的な月相）を計算したものではありません。29夜の周期では第29夜の絵は使いません。</li>
    <li>星座のテーマは、自己理解のヒントとして愛泉の杜がまとめたものです。行動や結果を決めるものではありません。</li>
    </ul></details>`;
  bind();
}
let tabInit = false;
const IS_SP = matchMedia('(max-width:899px)').matches;
const cardOpen = { new: !IS_SP, full: !IS_SP };
let srcOpen = false; // 「暦データ・出典について」は初期状態で閉じる（周期を移動しても開閉状態を保つ）
function dayText(d, E){
  const p = periodOf(d.n), e = evOnDay(E, d.ms)[0];
  return `第${d.n}夜 ${esc(d.night.name)}（${esc(d.night.kana)}）` + (p ? `／${p.name}${p.sub ? `（${p.sub}）` : ''}` : '') + (e ? `／${e.type==='full'?'満月':'新月'} ${e.time_jst}〈${e.sign}〉` : '');
}
// スマホの行を開いたときの補足（行に出ている内容は繰り返さない）
function dayNote(d, E){
  const p = periodOf(d.n), e = evOnDay(E, d.ms)[0], t = e && THEME[e.sign] ? THEME[e.sign][e.type] : null, out = [];
  if (p) out.push(`${p.name}（第${p.from}〜${p.to}夜）${p.sub ? '：' + p.sub : ''}`);
  if (e) out.push(`${e.type==='full'?'満月':'新月'}〈${e.sign}〉${t ? '：' + t.keywords.join('・') : ''}${e.type==='full' ? '（下のカードで詳しく）' : ''}`);
  if (!out.length) out.push('特別な期間ではない日です。月の形を眺めて、ひと息つくきっかけに。');
  return out.map(esc).join('<br>');
}
// 新月・満月カードの月アイコン（A案）：透過の円形SVG。新月＝黒に近い円、満月＝月光色の円。どちらも細い金の縁取り・46px
function cardMoon(type){
  const fill = type === 'full' ? 'url(#cardFullGrad)' : '#11151f';
  const defs = type === 'full' ? '<defs><radialGradient id="cardFullGrad" cx="42%" cy="40%" r="62%"><stop offset="0" stop-color="#fff6d8"/><stop offset="0.6" stop-color="#f8dc8c"/><stop offset="1" stop-color="#eec865"/></radialGradient></defs>' : '';
  return `<svg class="cmoon" width="46" height="46" viewBox="0 0 46 46" aria-hidden="true" focusable="false">${defs}<circle cx="23" cy="23" r="21.75" fill="${fill}" stroke="#c9a24a" stroke-width="1.5"/></svg>`;
}
function card(type, e, label, covered){
  const t = e && THEME[e.sign] ? THEME[e.sign][type] : null;
  const icon = e ? cardMoon(type) : '';
  if (!e) return `<div class="card"><div class="ttl">${type==='new'?'新月':'満月'}</div><div class="none">${covered ? 'この周期の' + (type==='new'?'新月':'満月') + 'はありません。' : 'この周期の新月・満月データは、まだ収録されていません。'}</div></div>`;
  const head = `<div class="hd">${icon}<div><div class="when">${label}・${md(e.ms)}（${DOW[dow(e.ms)]}）${e.time_jst}</div><div class="ttl">${type==='new'?'新月':'満月'}<span>〈${e.sign}〉</span></div></div></div>`;
  if (!t) return `<div class="card">${head}<div class="none">この星座の文章は未収録です。</div></div>`;
  const body = `<p>${esc(t.text)}</p><ul>${t.actions.map(a => `<li>${esc(a)}</li>`).join('')}</ul><div class="q">${esc(t.question)}</div>`;
  return `<details class="card" data-type="${type}" ${cardOpen[type] ? 'open' : ''}><summary>${head}<div class="kw">${t.keywords.map(esc).join('・')}</div><div class="more sp-only">タップで説明を開く／閉じる</div></summary>${body}</details>`;
}
function bind(){
  document.querySelectorAll('.cell').forEach(el => el.onclick = () => { sel = +el.dataset.ms; render(); });
  document.querySelectorAll('.item>button').forEach(el => el.onclick = () => { const ms = +el.parentNode.dataset.ms; sel = sel === ms ? null : ms; render(); });
  document.querySelectorAll('details.card').forEach(el => el.ontoggle = () => { cardOpen[el.dataset.type] = el.open; });
  document.querySelectorAll('details.srcinfo').forEach(el => el.ontoggle = () => { srcOpen = el.open; });
  document.querySelectorAll('#tabs button').forEach(el => el.onclick = () => { tab = +el.dataset.tab; render(); });
  document.querySelectorAll('#ov .grp').forEach(el => el.onclick = () => { tab = +el.dataset.tab; render(); });
}
document.getElementById('prev').onclick = () => { cyc = HC.cycleAt(cyc.hiloMs - DAY); tab = 0; sel = null; render(); };
document.getElementById('next').onclick = () => { cyc = HC.cycleAt(cyc.mukuMs + DAY); tab = 0; sel = null; render(); };
render();
</script>
</body>
