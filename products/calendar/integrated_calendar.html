<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>月と暦のカレンダー | 愛泉の杜</title>
<!--
  月と暦のカレンダー（愛泉の杜 Integrated Calendar／開発名：統合暦） V1 — 収録期間：2026-09-01〜2027-12-31
  データ：公開データ版 2027.1.3 ＝ 2026年9〜12月（暦要項2026・2027と同じ方式）＋ 2027 FACT Gold Master 2027.1.1（照合済みの固定データ。ブラウザでは暦を計算しない）
  古来ハワイ太陰暦：共通周期データ v1.1.0 を参照するだけ（HAWAIIAN_CALENDAR_DATA ブロック。暦の算出処理は含まない）
  表示方針：吉凶の総合判定・ランキングはしない。重なる暦注はすべて並べる。月相の時刻は表示しない。
-->
<style>
  @import url('https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap');
  :root{
    --bg:#F7F3EA; --card:#FFFFFF; --ink:#2F2A24; --soft:#857A6C; --faint:#B9AE9E;
    --line:#E6DDCD; --line2:#D8CCB6; --navy:#24304A; --gold:#B08A3E; --gold-soft:#E9DCC0;
    --sun:#B4513A; --taian:#B0584C; --sel:#F1E7D2; --today:#24304A; --hawaii:#3E7F78; --hawaii-soft:#E3EFED;
    --serif:'Shippori Mincho','Hiragino Mincho ProN','Yu Mincho',serif;
    --sans:'Zen Kaku Gothic New','Hiragino Sans','Yu Gothic',sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.6;-webkit-text-size-adjust:100%}
  button{font-family:inherit;color:inherit}
  .wrap{max-width:1240px;margin:0 auto;padding:16px}
  header.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;margin-bottom:12px}
  .brand{font-family:var(--serif);font-size:22px;font-weight:700;color:var(--navy);letter-spacing:.08em}
  .brand small{font-family:var(--sans);font-size:12px;color:var(--soft);font-weight:500;margin-left:8px;letter-spacing:.04em;white-space:nowrap}
  .nav{display:flex;align-items:center;gap:6px;margin-left:auto}
  .nav .ym{font-family:var(--serif);font-size:19px;font-weight:700;min-width:116px;text-align:center}
  .btn{border:1px solid var(--line2);background:var(--card);border-radius:8px;padding:5px 11px;font-size:13px;cursor:pointer}
  .btn:disabled{opacity:.35;cursor:default}
  .btn:hover:not(:disabled){background:var(--sel)}
  .toggles{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--soft);align-items:center}
  .toggles label{display:inline-flex;align-items:center;gap:5px;cursor:pointer}
  .notice{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:12.5px;color:var(--soft);margin-bottom:12px}
  .tagline{font-size:12.5px;color:var(--soft);margin:1px 0 2px;letter-spacing:.03em}
  .taian{color:var(--taian)}   /* 大安：文字色のみの穏やかな強調（吉凶判定ではない） */
  a.back{font-size:12.5px;color:var(--soft);text-decoration:none}

  /* ── 共通部品 ── */
  .nb{display:inline-flex;align-items:center;justify-content:center;min-width:1.75em;height:1.75em;padding:0 .2em;border:1.3px solid var(--hawaii);border-radius:999px;
      color:var(--hawaii);font-size:.78em;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;background:var(--card)}
  .nightchip{display:inline-flex;align-items:center;gap:3px;white-space:nowrap;cursor:pointer}
  .nightchip .ic{font-size:.95em;line-height:1}
  .sen{display:inline-block;font-size:.82em;border:1px solid var(--line2);border-radius:4px;padding:0 4px;margin:0 2px 2px 0;background:#FBF8F1;white-space:nowrap}
  .phase{white-space:nowrap}
  .hol{color:var(--sun)}
  .sun{color:var(--sun)}

  /* ── PC：月間カレンダー＋日付詳細 ── */
  .pc{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start}
  .grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));background:var(--line);gap:1px;border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .dow{background:#EFE8DA;text-align:center;font-size:12.5px;padding:5px 0;color:var(--soft);font-weight:700}
  .dow.sun{color:var(--sun)}
  .cell{background:var(--card);min-height:132px;padding:5px 6px 4px;display:flex;flex-direction:column;cursor:pointer;font-size:12px;line-height:1.35;position:relative}
  .cell.empty{background:#FAF7F0;cursor:default}
  .cell:hover:not(.empty){background:#FDFAF3}
  .cell.sel{background:var(--sel);box-shadow:inset 0 0 0 2px var(--gold)}
  .cell .d{font-family:var(--serif);font-size:17px;font-weight:700;line-height:1.1}
  .cell.today .d{display:inline-block;background:var(--today);color:#fff;border-radius:6px;padding:0 5px}
  .cell .holn{font-size:11px;color:var(--sun);margin-left:4px}
  .slot{min-height:1.35em}
  .slot.rk{color:var(--soft);font-size:11.5px}
  .slot.senl{min-height:2.7em}
  .slot.sea{font-size:11.5px}
  .slot.hw{margin-top:auto;padding-top:3px;border-top:1px dashed var(--line);font-size:12.5px}
  .detail{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;position:sticky;top:12px}

  /* ── 日付詳細（PC・スマホ共通） ── */
  .dt-date{font-family:var(--serif);font-size:20px;font-weight:700;margin:0 0 8px}
  .band{margin:12px 0 0}
  .band h3{font-size:12.5px;color:var(--soft);font-weight:700;margin:0 0 5px;letter-spacing:.06em;padding-bottom:3px;border-bottom:1px solid var(--line)}
  .band.hawaii h3{color:var(--hawaii)}
  .kv{display:grid;grid-template-columns:6.2em 1fr;gap:3px 8px;font-size:14px}
  .kv .k{color:var(--soft);font-size:12.5px;padding-top:1px}
  .kv .v.none{color:var(--faint)}
  .hwbox{display:flex;align-items:center;gap:10px;background:var(--hawaii-soft);border-radius:10px;padding:8px 10px}
  .hwbox .nb{font-size:15px}
  .hwbox .ic{font-size:24px}
  .hwname{font-family:var(--serif);font-size:18px;font-weight:700;line-height:1.2}
  .hwkana{font-size:12px;color:var(--soft)}
  .hwmeta{font-size:12px;color:var(--soft);margin-top:4px}
  .mark{display:inline-block;font-size:11px;border:1px solid var(--hawaii);color:var(--hawaii);border-radius:4px;padding:0 5px;margin-left:6px}

  /* ── スマホ：今日／一覧／月 ── */
  .sp{display:none}
  .tabs{display:flex;gap:6px;margin:0 0 10px;position:sticky;top:0;background:var(--bg);padding:6px 0;z-index:5}
  .tabs button{flex:1;border:1px solid var(--line2);background:var(--card);border-radius:999px;padding:7px 0;font-size:14px;cursor:pointer}
  .tabs button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
  .sp .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
  .daynav{display:flex;justify-content:space-between;margin-top:10px}
  .list{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .row{display:grid;grid-template-columns:3.4em 2.6em minmax(0,1fr) 3.6em;align-items:center;gap:0 6px;padding:7px 10px;border-bottom:1px solid var(--line);font-size:13.5px;cursor:pointer}
  .row:last-child{border-bottom:none}
  .row .dd{font-family:var(--serif);font-weight:700}
  .row .rk{color:var(--soft);font-size:12.5px}
  .row .ev{min-width:0;line-height:1.35}
  .row .hwc{text-align:right}
  .row.today{box-shadow:inset 3px 0 0 var(--today)}
  .row.open{background:var(--sel)}
  .rowdetail{padding:6px 12px 12px;border-bottom:1px solid var(--line);background:#FDFAF3}
  .mgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .mgrid .dow{font-size:11px;padding:3px 0}
  .mcell{background:var(--card);min-height:80px;padding:3px 2px;text-align:center;font-size:11px;line-height:1.25;cursor:pointer;display:flex;flex-direction:column;align-items:center}
  .mcell.empty{background:#FAF7F0;cursor:default}
  .mcell .d{font-family:var(--serif);font-weight:700;font-size:14px}
  .mcell.today .d{background:var(--today);color:#fff;border-radius:5px;padding:0 4px}
  .mcell .top{display:flex;justify-content:space-between;align-items:baseline;align-self:stretch;padding:0 1px 0 2px}
  .mcell .r{font-size:9.5px;color:var(--soft);white-space:nowrap}
  .mcell .sl{font-size:10.5px;letter-spacing:-.03em;line-height:1.2;word-break:keep-all}
  .mcell .p1:empty{display:none}
  .mcell .nightchip{font-size:10.5px;margin-top:auto;padding-top:2px}
  .legend{font-size:11.5px;color:var(--soft);margin-top:8px;line-height:1.7}

  /* レイヤー表示切替 */
  body.hide-jp .L-jp, body.hide-sea .L-sea, body.hide-hw .L-hw{visibility:hidden}

  /* ── 印刷 ── */
  #print{display:none}
  @media (max-width: 899px){
    .pc{display:none} .sp{display:block} .toggles{display:none}
    .nav{margin-left:0;width:100%;justify-content:space-between}
    .wrap{padding:8px 12px 12px}
    html,body{overflow-x:hidden}
    /* スマホ：見出しを詰め、暦本体を上へ */
    header.top{gap:2px 10px;margin-bottom:8px}
    .brand{font-size:20px;line-height:1.35}
    .brand small,.tagline{display:none}
    a.back{font-size:12px;line-height:1.4}
    .nav .ym{min-width:0;flex:1;white-space:nowrap;font-size:18px}
  }
  @page{size:A4 portrait;margin:9mm 10mm}
  @media print{
    body{background:#fff}
    .wrap{display:none}
    #print{display:block}
    .pg{page-break-after:always;break-after:page;font-size:8.2pt;color:#000}
    .pg:last-child{page-break-after:auto;break-after:auto}
    .pg h2{font-family:var(--serif);font-size:15pt;margin:0 0 1.5mm;display:flex;justify-content:space-between;align-items:baseline}
    .pg h2 small{font-family:var(--sans);font-size:8pt;font-weight:500;color:#555}
    .pmonth{width:100%;border-collapse:collapse;table-layout:fixed;margin-bottom:2.5mm}
    .pmonth th{font-size:7.6pt;border:.3pt solid #999;background:#f2eee6;padding:.4mm}
    .pmonth td{position:relative;border:.3pt solid #999;vertical-align:top;height:15.5mm;padding:.6mm .9mm 4.6mm;font-size:6.7pt;line-height:1.22}
    .pmonth td .d{font-weight:700;font-size:9pt}
    .pmonth td .hwp{position:absolute;left:.9mm;bottom:.6mm}  /* 月夜はセル下端に固定 */
    .plist{width:100%;border-collapse:collapse;table-layout:fixed}
    .plist th{font-size:7pt;background:#f2eee6;border-bottom:.4pt solid #888;text-align:left;padding:.3mm .8mm}
    .plist td{font-size:7.3pt;padding:.15mm .8mm;border-bottom:.2pt solid #ccc;line-height:1.28;white-space:nowrap;overflow:hidden}
    .plist td.ev{white-space:normal}
    .nb{border-width:.6pt;font-size:6.2pt;min-width:1.7em;height:1.7em}
    .pfoot{margin-top:1.5mm;font-size:6.6pt;color:#333;line-height:1.45}
    .sun,.hol{color:#a33}
    .taian{color:#a8483d}
  }
</style>
</head>

  <!-- スマートフォン -->

    <div id="spToday"></div>
    <div id="spList" hidden></div>
    <div id="spMonth" hidden></div>
  </div>
</div>

<script>
'use strict';
/* ── データ（FACT）：Gold Master の固定データ。ここでは暦を計算しない ── */
const FACT = JSON.parse(document.getElementById('fact-data').textContent);
const NIGHTS = JSON.parse(document.getElementById('night-data').textContent); // 夜番号→正式名・かな・月夜アイコン（既存アプリと同じ対応）
const DAYS = FACT.days, BYDATE = {};
DAYS.forEach(x => BYDATE[x.d] = x);
const DAY = 86400000;
const MONTHS = [...new Set(DAYS.map(x => x.d.slice(0,7)))];   // 収録する月（YYYY-MM）
const ymOf = i => MONTHS[i].split('-').map(Number);
const idxOf = ds => MONTHS.indexOf(ds.slice(0,7));

/* ── 表示辞書（Presentation。並び順・短縮名・注記はここだけで管理） ── */
const DICT = {
  sen: { ichiryu:{ full:'一粒万倍日', short:'万倍', tiny:'万' }, tensha:{ full:'天赦日', short:'天赦', tiny:'天' }, fujoju:{ full:'不成就日', short:'不成就', tiny:'不' } },
  senOrder: ['ichiryu','tensha','fujoju'],
  eto: { tora:{ full:'寅の日', tiny:'寅' }, mi:{ full:'巳の日' }, tsuchinotomi:{ full:'己巳の日' }, kinoene:{ full:'甲子の日' } },  // 干支の日（日の干支で決まる）
  etoOrder: ['tora','mi','tsuchinotomi','kinoene'],
  phase: { new:'新月', first:'上弦', full:'満月', last:'下弦' },
  phase1: { new:'新', first:'上', full:'満', last:'下' },
  holidayKind: { furikae:'休日（振替休日）', kokumin:'国民の休日' },  // CSVの「休日」は種別に応じて表示（正本名称は保持）
  dow: ['日','月','火','水','木','金','土'],
  weekHead: ['月','火','水','木','金','土','日'],  // 月曜始まり（V1正式仕様）
  notes: [
    '暦注が重なる日の解釈には諸説あります。',
    '不成就日は旧暦月方式によります。',
    '月のサインは、月相が起きる時点の月の位置を西洋占星術のトロピカル方式で示しています。',
    '古来ハワイ太陰暦の夜番号・月夜アイコンは、天文の月相とは別の情報です。'
  ],
  source: '出典：内閣府「国民の祝日」／国立天文台「暦要項」（令和8年・令和9年）／古来ハワイ太陰暦は愛泉の杜の共通周期データ'
};

/* ── 古来ハワイ太陰暦：既存の共通周期データを参照するだけ ── */
function hawaiian(ds){
  const [y,m,d] = ds.split('-').map(Number), ms = Date.UTC(y,m-1,d);
  const n = HawaiianCalendar.nightAt(ms);
  if (!n) return null;
  const c = HawaiianCalendar.cycleAt(ms), info = NIGHTS[n-1];
  let mark = null;
  // 周期の印は夜番号ではなく正式な夜名（既存アプリと同じ夜名データ）で判定する
  const CYCLE_MARK = { Hilo:'周期のはじまり', Mauli:'Mauliの夜', Muku:'周期のおわり' };
  mark = CYCLE_MARK[info.name] || null;
  return { n, name: info.name, kana: info.kana, icon: info.icon, mark, nights: c ? c.nights : null };
}

/* ── 小さな部品 ── */
const pad = v => String(v).padStart(2,'0');
const dsOf = (y,m,d) => `${y}-${pad(m)}-${pad(d)}`;
const dowOf = ds => new Date(ds+'T00:00:00Z').getUTCDay();
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shiftDs = (ds,n) => new Date(Date.parse(ds+'T00:00:00Z') + n*DAY).toISOString().slice(0,10);
const isShukujitsu = ds => !!(BYDATE[ds] && BYDATE[ds].hol && BYDATE[ds].hol !== '休日');
function holName(x){                    // 内閣府CSVの「休日」を、実際の種別で表示する
  if (!x.hol) return null;
  if (x.hol !== '休日') return x.hol;
  // 振替休日：日曜の祝日から休日が連続した先の日
  for (let k = 1; k <= 7; k++){ const p = BYDATE[shiftDs(x.d,-k)]; if (!p || !p.hol) break; if (p.hol !== '休日' && dowOf(p.d) === 0) return DICT.holidayKind.furikae; }
  // 国民の休日：前日と翌日がともに祝日
  if (isShukujitsu(shiftDs(x.d,-1)) && isShukujitsu(shiftDs(x.d,1))) return DICT.holidayKind.kokumin;
  return x.hol;
}
const phaseText = x => x.phase ? DICT.phase[x.phase] + (x.sign ? '・' + x.sign : '') : null;
const rkHtml = x => x.rk === '大安' ? `<span class="taian">${x.rk}</span>` : x.rk; // 六曜の表示（大安のみ文字色）
const senList = x => DICT.senOrder.filter(k => x.sen.includes(k));
// 干支の日の表示：己巳の日は巳の日でもあるが、表示は「己巳の日」だけにする（データは両方を保持）
const etoList = x => DICT.etoOrder.filter(k => (x.eto||[]).includes(k) && !(k === 'mi' && x.eto.includes('tsuchinotomi')));
const isTora = x => (x.eto||[]).includes('tora');
const nightChip = h => h ? `<span class="nightchip" title="古来ハワイ太陰暦 第${h.n}夜"><span class="nb">${h.n}</span><span class="ic">${h.icon}</span></span>` : '';
function eventsText(x, sep){ // 祝日 → 暦注 → 節気 → 月相 の固定順
  const a = [];
  if (x.hol) a.push(`<span class="hol L-jp">${esc(holName(x))}</span>`);
  senList(x).forEach(k => a.push(`<span class="L-jp">${DICT.sen[k].short}</span>`));
  if (isTora(x)) a.push(`<span class="L-jp">${DICT.eto.tora.full}</span>`);   // 一覧に出す干支の日は寅の日だけ
  if (x.sekki) a.push(`<span class="L-sea">${x.sekki}</span>`);
  if (x.phase) a.push(`<span class="phase L-sea">${phaseText(x)}</span>`);
  return a.join(sep);
}

/* ── 状態 ── */
const now = new Date();
const todayDs = dsOf(now.getFullYear(), now.getMonth()+1, now.getDate());
const inRange = ds => !!BYDATE[ds];
let selDs = inRange(todayDs) ? todayDs : DAYS[0].d;

(function fromHash(){
  const h = (location.hash || '').slice(1);
  if (/^\d{4}-\d\d-\d\d$/.test(h) && inRange(h)) { selDs = h; cur = idxOf(h); }
})();
if (!inRange(todayDs)) {
  const n = document.getElementById('rangeNotice');
  n.hidden = false;
  n.textContent = `月と暦のカレンダー V1 の収録期間は2026年9月〜2027年12月です。今日（${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日）は収録範囲外のため、収録期間の最初の日を表示しています。`;
}

/* ── 日付詳細（FACT／ハワイ／将来の Interpretation 枠を分離） ── */
function detailHtml(ds){
  const x = BYDATE[ds], h = hawaiian(ds), [y,m,d] = ds.split('-').map(Number);
  const v = (val) => val ? `<span class="v">${val}</span>` : `<span class="v none">—</span>`;
  const sen = senList(x).map(k => DICT.sen[k].full).join('<br>');
  return `
  <div class="dt-date ${dowOf(ds)===0||x.hol?'sun':''}">${y}年${m}月${d}日（${DICT.dow[dowOf(ds)]}）</div>
  <section class="band" data-layer="fact-jp"><h3>日本の暦</h3><div class="kv">
    <span class="k">祝日</span>${v(x.hol ? esc(holName(x)) : null)}
    <span class="k">六曜</span>${v(rkHtml(x))}
    <span class="k">暦注</span>${v(sen || null)}
    <span class="k">干支の日</span>${v(etoList(x).map(k => DICT.eto[k].full).join('<br>') || null)}
  </div></section>
  <section class="band" data-layer="fact-season"><h3>季節と月（天文）</h3><div class="kv">
    <span class="k">二十四節気</span>${v(x.sekki)}
    <span class="k">月の状態</span>${v(x.phase ? DICT.phase[x.phase] : null)}
    <span class="k">月のサイン</span>${v(x.sign ? x.sign + '（トロピカル）' : null)}
  </div></section>
  <section class="band hawaii" data-layer="hawaiian"><h3>ハワイの月夜（古来ハワイ太陰暦）</h3>
    ${h ? `<div class="hwbox"><span class="nb">${h.n}</span><span class="ic">${h.icon}</span>
      <div><div class="hwname">${esc(h.name)}</div><div class="hwkana">${esc(h.kana)}</div></div></div>
      <div class="hwmeta">第${h.n}夜${h.mark ? `<span class="mark">${h.mark}</span>` : ''}</div>` : '<span class="v none">—</span>'}
  </section>
  <div data-layer="interpretation" hidden></div>
`;
}

/* ── PC：月間カレンダー ── */
function renderPc(){
  const [YEAR,curM] = ymOf(cur);
  const g = document.getElementById('grid'); let html = DICT.weekHead.map((w,i) => `<div class="dow ${i===6?'sun':''}">${w}</div>`).join('');
  const first = dsOf(YEAR,curM,1), off = (dowOf(first)+6)%7, dim = new Date(Date.UTC(YEAR,curM,0)).getUTCDate();
  for (let i=0;i<off;i++) html += '<div class="cell empty"></div>';
  for (let d=1; d<=dim; d++){
    const ds = dsOf(YEAR,curM,d), x = BYDATE[ds], h = hawaiian(ds), red = dowOf(ds)===0 || x.hol;
    const sea = [x.sekki, phaseText(x)].filter(Boolean).join(' ');
    html += `<div class="cell ${ds===selDs?'sel':''} ${ds===todayDs?'today':''}" data-ds="${ds}" tabindex="0">
      <div class="slot"><span class="d ${red?'sun':''}">${d}</span>${x.hol?`<span class="holn L-jp">${esc(holName(x))}</span>`:''}</div>
      <div class="slot rk L-jp">${rkHtml(x)}</div>
      <div class="slot senl L-jp">${senList(x).map(k=>`<span class="sen">${DICT.sen[k].short}</span>`).join('')}${isTora(x)?`<span class="sen">${DICT.eto.tora.full}</span>`:''}</div>
      <div class="slot sea L-sea">${sea}</div>
      <div class="slot hw L-hw">${nightChip(h)}</div></div>`;
  }
  const rem = (off+dim)%7; if (rem) for (let i=rem;i<7;i++) html += '<div class="cell empty"></div>';
  g.innerHTML = html;
  document.getElementById('detailPc').innerHTML = detailHtml(selDs);
  document.getElementById('legendPc').innerHTML = '凡例：万倍＝一粒万倍日　天赦＝天赦日　不成就＝不成就日　／　新月・上弦・満月・下弦＝天文の月相（国立天文台「暦要項」）　／　<span class="nb">14</span>🌕＝古来ハワイ太陰暦の夜番号と月夜アイコン（天文の月相とは別の情報）';
}

/* ── スマホ ── */
function renderSpToday(){
  const i = DAYS.findIndex(x => x.d === selDs);
  document.getElementById('spToday').innerHTML = `<div class="card">${detailHtml(selDs)}</div>
    <div class="daynav"><button class="btn" id="dPrev" ${i<=0?'disabled':''}>◀ 前の日</button><button class="btn" id="dNext" ${i>=DAYS.length-1?'disabled':''}>次の日 ▶</button></div>`;
  document.getElementById('dPrev').onclick = () => { selDs = DAYS[i-1].d; cur = idxOf(selDs); renderAll(); };
  document.getElementById('dNext').onclick = () => { selDs = DAYS[i+1].d; cur = idxOf(selDs); renderAll(); };
}
function renderSpList(){
  let html = '<div class="list">';
  DAYS.filter(x => x.d.slice(0,7) === MONTHS[cur]).forEach(x => {
    const ds = x.d, h = hawaiian(ds), d = Number(ds.slice(8)), red = dowOf(ds)===0 || x.hol;
    html += `<div class="row ${ds===todayDs?'today':''} ${ds===openRow?'open':''}" data-ds="${ds}" id="r-${ds}">
      <span class="dd ${red?'sun':''}">${d} ${DICT.dow[dowOf(ds)]}</span><span class="rk">${rkHtml(x)}</span>
      <span class="ev">${eventsText(x,'・')}</span><span class="hwc">${nightChip(h)}</span></div>`;
    if (ds === openRow) html += `<div class="rowdetail">${detailHtml(ds)}</div>`;
  });
  document.getElementById('spList').innerHTML = html + '</div>';
}
function renderSpMonth(){
  const [YEAR,curM] = ymOf(cur);
  let html = '<div class="mgrid">' + DICT.weekHead.map((w,i) => `<div class="dow ${i===6?'sun':''}">${w}</div>`).join('');
  const first = dsOf(YEAR,curM,1), off = (dowOf(first)+6)%7, dim = new Date(Date.UTC(YEAR,curM,0)).getUTCDate();
  for (let i=0;i<off;i++) html += '<div class="mcell empty"></div>';
  for (let d=1; d<=dim; d++){
    const ds = dsOf(YEAR,curM,d), x = BYDATE[ds], h = hawaiian(ds), red = dowOf(ds)===0 || x.hol;
    const tiny = [...senList(x).map(k => DICT.sen[k].tiny), ...(isTora(x) ? [DICT.eto.tora.tiny] : [])].join('・');   // 万・天・不・寅
    // 上段：日付（左）＋六曜（右）／中央：暦注・寅・月相／下段：ハワイの月夜。祝休日は日付の赤で示す
    html += `<div class="mcell ${ds===todayDs?'today':''}" data-ds="${ds}"><div class="top"><span class="d ${red?'sun':''}">${d}</span><span class="r">${rkHtml(x)}</span></div>
      ${tiny?`<div class="sl">${tiny}</div>`:''}<div class="p1">${x.phase?DICT.phase1[x.phase]:''}</div>${nightChip(h)}</div>`;
  }
  const rem = (off+dim)%7; if (rem) for (let i=rem;i<7;i++) html += '<div class="mcell empty"></div>';
  html += '</div><div class="legend">万＝一粒万倍日　天＝天赦日　不＝不成就日　寅＝寅の日<br>新・上・満・下＝月相</div>';
  document.getElementById('spMonth').innerHTML = html;
}
function setTab(t){
  spTab = t;
  document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === t));
  ['today','list','month'].forEach(k => document.getElementById('sp'+k[0].toUpperCase()+k.slice(1)).hidden = (k !== t));
}

/* ── 印刷（A4縦：月間表＋一覧） ── */
function printPage(i){
  const [YEAR,m] = ymOf(i);
  const first = dsOf(YEAR,m,1), off = (dowOf(first)+6)%7, dim = new Date(Date.UTC(YEAR,m,0)).getUTCDate();
  let t = '<table class="pmonth"><tr>' + DICT.weekHead.map((w,i)=>`<th class="${i===6?'sun':''}">${w}</th>`).join('') + '</tr><tr>';
  let col = 0;
  for (let i=0;i<off;i++){ t += '<td></td>'; col++; }
  for (let d=1; d<=dim; d++){
    const ds = dsOf(YEAR,m,d), x = BYDATE[ds], h = hawaiian(ds), red = dowOf(ds)===0 || x.hol;
    const lines = [];
    if (x.hol) lines.push(`<span class="hol">${esc(holName(x))}</span>`);
    const s = senList(x).map(k=>DICT.sen[k].short).join(' '); if (s) lines.push(s);
    const sea = [x.sekki, phaseText(x)].filter(Boolean).join(' '); if (sea) lines.push(sea);
    t += `<td><span class="d ${red?'sun':''}">${d}</span> <span style="color:#555">${rkHtml(x)}</span><br>${lines.join('<br>')}<span class="hwp">${nightChip(h)}</span></td>`;
    if (++col === 7 && d < dim){ t += '</tr><tr>'; col = 0; }
  }
  if (col) for (let i=col;i<7;i++) t += '<td></td>';
  t += '</tr></table>';
  let l = '<table class="plist"><colgroup><col style="width:9%"><col style="width:7%"><col><col style="width:9%"></colgroup><tr><th>日 曜</th><th>六曜</th><th>祝日・暦注・季節・月</th><th>月夜</th></tr>';
  DAYS.filter(x => x.d.slice(0,7) === MONTHS[i]).forEach(x => {
    const ds = x.d, h = hawaiian(ds), red = dowOf(ds)===0 || x.hol, d = Number(ds.slice(8));
    const ev = [];
    if (x.hol) ev.push(`<span class="hol">${esc(holName(x))}</span>`);
    senList(x).forEach(k => ev.push(DICT.sen[k].full));
    if (x.sekki) ev.push(x.sekki);
    if (x.phase) ev.push(phaseText(x));
    l += `<tr><td class="${red?'sun':''}">${d} ${DICT.dow[dowOf(ds)]}</td><td>${rkHtml(x)}</td><td class="ev">${ev.join('・')}</td><td>${nightChip(h)}</td></tr>`;
  });
  l += '</table>';
  const foot = `<div class="pfoot">凡例：万倍＝一粒万倍日 天赦＝天赦日 不成就＝不成就日／新月・上弦・満月・下弦＝国立天文台「暦要項」による天文の月相／<span class="nb">14</span>🌕＝古来ハワイ太陰暦の夜番号と月夜アイコン（天文の月相とは別の情報です）<br>
    注記：${DICT.notes.join(' ')}<br>${DICT.source}　データ版：${FACT.version}</div>`;
  return `<section class="pg"><h2>${YEAR}年 ${m}月<small>愛泉の杜 月と暦のカレンダー</small></h2>${t}${l}${foot}</section>`;
}
function buildPrint(){
  const all = document.getElementById('printAll').checked;
  const months = all ? MONTHS.map((_,k) => k) : [cur];
  document.getElementById('print').innerHTML = months.map(printPage).join('');
}

/* ── 描画・操作 ── */
function renderAll(){
  const [y0,m0] = ymOf(cur);
  document.getElementById('ym').textContent = `${y0}年 ${m0}月`;
  document.getElementById('prevM').disabled = cur <= 0;
  document.getElementById('nextM').disabled = cur >= MONTHS.length-1;
  renderPc(); renderSpToday(); renderSpList(); renderSpMonth(); buildPrint();
}
document.getElementById('prevM').onclick = () => { if (cur>0){ cur--; renderAll(); } };
document.getElementById('nextM').onclick = () => { if (cur<MONTHS.length-1){ cur++; renderAll(); } };
document.getElementById('goToday').onclick = () => {
  selDs = inRange(todayDs) ? todayDs : DAYS[0].d; cur = idxOf(selDs); setTab('today'); renderAll();
};
document.getElementById('printBtn').onclick = () => { buildPrint(); window.print(); };
document.getElementById('printAll').onchange = buildPrint;
window.addEventListener('beforeprint', buildPrint);
document.getElementById('grid').addEventListener('click', e => {
  const c = e.target.closest('.cell[data-ds]'); if (!c) return; selDs = c.dataset.ds; renderAll();
});
document.getElementById('grid').addEventListener('keydown', e => {
  if (e.key !== 'Enter') return; const c = e.target.closest('.cell[data-ds]'); if (c){ selDs = c.dataset.ds; renderAll(); }
});
document.getElementById('spList').addEventListener('click', e => {
  const r = e.target.closest('.row[data-ds]'); if (!r) return;
  if (e.target.closest('.nightchip')) { selDs = r.dataset.ds; setTab('today'); renderAll(); window.scrollTo(0,0); return; }
  openRow = (openRow === r.dataset.ds) ? null : r.dataset.ds; selDs = r.dataset.ds; renderAll();
});
document.getElementById('spMonth').addEventListener('click', e => {
  const c = e.target.closest('.mcell[data-ds]'); if (!c) return;
  selDs = openRow = c.dataset.ds; setTab('list'); renderAll();
  const el = document.getElementById('r-'+selDs); if (el) el.scrollIntoView({block:'center'});
});
document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => { setTab(b.dataset.tab); });
document.querySelectorAll('#toggles input[data-layer]').forEach(cb => cb.onchange = () => {
  document.body.classList.toggle('hide-' + cb.dataset.layer, !cb.checked);
});
window.addEventListener('hashchange', () => {
  const h = (location.hash || '').slice(1);
  if (/^\d{4}-\d\d-\d\d$/.test(h) && inRange(h)) { selDs = h; cur = idxOf(h); renderAll(); }
});
renderAll();
</script>
</body>
</html>
