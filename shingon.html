<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>御真言集</title>
<style>
  :root{
    --paper:#F6F1E4;
    --paper-deep:#EEE6D2;
    --ink:#241F1B;
    --ink-soft:#6B6152;
    --ai:#1D2A3D;
    --ai-deep:#121B28;
    --ai-mist:#3C5170;
    --vermilion:#AA3B2B;
    --vermilion-soft:#C97A67;
    --line:#DCD2B8;
    --line-strong:#C9BB94;
    --card:#FFFDF6;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;
    line-height:1.7;
    min-height:100vh;
  }
  .mincho{
    font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
  }

  /* ---------- header ---------- */
  header{
    background:
      repeating-linear-gradient(90deg, rgba(255,255,255,0.035) 0 1px, transparent 1px 46px),
      linear-gradient(180deg, var(--ai-deep) 0%, var(--ai) 100%);
    color:#EFE9D8;
    padding:34px 22px 26px;
    position:relative;
  }
  .header-inner{
    max-width:900px;
    margin:0 auto;
    position:relative;
  }
  .seal{
    position:absolute;
    right:0;
    top:-4px;
    width:52px;
    height:52px;
    border-radius:50%;
    border:2.5px solid var(--vermilion);
    color:var(--vermilion);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:11px;
    letter-spacing:.12em;
    writing-mode:vertical-rl;
    font-weight:700;
    opacity:0.92;
    background:rgba(170,59,43,0.05);
  }
  .eyebrow{
    font-size:11.5px;
    letter-spacing:.28em;
    text-transform:uppercase;
    color:#9FB0C4;
    margin:0 0 10px;
  }
  h1{
    margin:0 0 6px;
    font-size:clamp(26px,5vw,34px);
    font-weight:700;
    letter-spacing:.06em;
  }
  .header-sub{
    display:flex;
    flex-wrap:wrap;
    gap:6px 16px;
    align-items:baseline;
    color:#C9D2DE;
    font-size:13px;
    margin-top:12px;
  }
  .count-badge{
    display:inline-flex;
    align-items:baseline;
    gap:4px;
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.18);
    border-radius:999px;
    padding:3px 12px;
  }
  .count-badge b{ font-size:14px; color:#F4EEDD; }

  /* ---------- main ---------- */
  main{
    max-width:900px;
    margin:0 auto;
    padding:20px 18px 70px;
  }

  .search-wrap{
    position:sticky;
    top:0;
    z-index:5;
    background:var(--paper);
    padding:16px 0 12px;
    margin-bottom:4px;
  }
  .search-box{
    display:flex;
    align-items:center;
    gap:10px;
    background:var(--card);
    border:1px solid var(--line-strong);
    border-radius:12px;
    padding:11px 14px;
    box-shadow:0 1px 2px rgba(36,31,27,0.05);
  }
  .search-box svg{ flex:0 0 auto; color:var(--ink-soft); }
  .search-box input{
    flex:1;
    border:none;
    outline:none;
    background:transparent;
    font-size:16px;
    color:var(--ink);
    font-family:inherit;
  }
  .search-box input::placeholder{ color:#B3A88E; }
  .search-meta{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:8px;
    font-size:12.5px;
    color:var(--ink-soft);
    padding:0 2px;
  }
  .search-meta button{
    border:none;
    background:none;
    color:var(--ai-mist);
    font-size:12.5px;
    cursor:pointer;
    font-family:inherit;
    text-decoration:underline;
    padding:0;
  }

  .section-divider{
    display:flex;
    align-items:center;
    gap:10px;
    margin:22px 2px 8px;
    color:var(--ai-mist);
  }
  .section-divider .label{
    font-size:12px;
    letter-spacing:.14em;
    font-weight:700;
    white-space:nowrap;
  }
  .section-divider .rule{
    flex:1;
    height:1px;
    background:var(--line-strong);
  }

  .entry-list{
    display:flex;
    flex-direction:column;
    gap:8px;
  }

  .entry{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:10px;
    overflow:hidden;
    transition:border-color .15s ease;
  }
  .entry.open{
    border-color:var(--line-strong);
  }
  .entry-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    padding:13px 16px;
    cursor:pointer;
    user-select:none;
  }
  .entry-head:hover{ background:var(--paper-deep); }
  .entry-titles{
    display:flex;
    align-items:baseline;
    gap:10px;
    flex-wrap:wrap;
    min-width:0;
  }
  .entry-name{
    font-size:16.5px;
    font-weight:700;
    white-space:nowrap;
  }
  .entry-furigana{
    font-size:12px;
    color:var(--ink-soft);
    white-space:nowrap;
  }
  .entry-tag{
    font-size:10.5px;
    color:var(--ai-mist);
    border:1px solid var(--line-strong);
    border-radius:999px;
    padding:1px 8px;
    white-space:nowrap;
    flex:0 0 auto;
  }
  .chevron{
    flex:0 0 auto;
    width:18px;
    height:18px;
    color:var(--ink-soft);
    transition:transform .18s ease;
  }
  .entry.open .chevron{ transform:rotate(180deg); }

  .entry-body{
    display:none;
    padding:2px 16px 16px;
    border-top:1px dashed var(--line);
  }
  .entry.open .entry-body{ display:block; }

  .entry-note{
    font-size:13px;
    color:var(--ink-soft);
    margin:12px 0 10px;
    line-height:1.8;
  }
  .mantra-block{
    background:var(--paper-deep);
    border:1px solid var(--line);
    border-left:3px solid var(--vermilion-soft);
    border-radius:6px;
    padding:14px 16px;
    font-size:15.5px;
    line-height:2;
    white-space:pre-wrap;
    word-break:break-word;
  }

  .empty-state{
    text-align:center;
    padding:56px 20px;
    color:var(--ink-soft);
  }
  .empty-state .big{ font-size:26px; margin-bottom:8px; }

  footer{
    max-width:900px;
    margin:0 auto;
    padding:10px 18px 40px;
    color:var(--ink-soft);
    font-size:11.5px;
    line-height:1.9;
  }

  @media (max-width:520px){
    .entry-name{ font-size:15.5px; }
    .entry-furigana{ display:block; }
  }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="seal">真言集</div>
    <p class="eyebrow">Personal Mantra Reference</p>
    <h1 class="mincho">御真言集</h1>
    <div class="header-sub">
      <span class="count-badge">全<b id="totalCount">—</b>項目</span>
      <span>名前・フリガナで検索　／　タップで真言を表示</span>
    </div>
  </div>
</header>

<main>
  <div class="search-wrap">
    <div class="search-box">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input type="text" id="searchInput" placeholder="名前・フリガナで検索　例：ふどう／不動明王">
    </div>
    <div class="search-meta">
      <span><b id="hitCount">0</b> 件</span>
      <button type="button" id="clearBtn">検索をクリア</button>
    </div>
  </div>

  <div id="listArea"></div>

  <div class="empty-state" id="emptyState" style="display:none;">
    <div class="big">🔍</div>
    該当する項目が見つかりませんでした。
  </div>
</main>

<footer>
  出典：真言Rev_12（PDF資料）より作成。原典の縦書きレイアウトを一覧・検索用にAIが書き起こしています。転記の際に誤りが生じる可能性があるため、実際の勤行でお使いの際は原典（PDF）と読み合わせのうえご確認ください。<br>
  同じ尊格に複数の真言が記載されている場合は、判別せずそのまま並記しています。
</footer>

"id":17,"name":"般若心経","furigana":"はんにゃしんぎょう","section":"前行","note":"仏説摩訶般若波羅蜜多心経","mantra":"観自在菩薩　行深般若波羅蜜多時（かんじざいぼさつ　ぎょうじんはんにゃはらみったじ）\n照見五蘊皆空（しょうけんごうんかいくう）　度一切苦厄（どいっさいくやく）　舎利子（しゃりし）\n色不異空（しきふいくう）　空不異色（くうふいしき）　色即是空（しきそくぜくう）　空即是色（くうそくぜしき）\n受想行識亦復如是（じゅそうぎょうしきやくぶにょぜ）　舎利子（しゃりし）\n是諸法空相（ぜしょほうくうそう）　不生不滅（ふしょうふめつ）　不垢不浄（ふくふじょう）　不増不減（ふぞうふげん）\n是故空中（ぜこくうちゅう）　無色（むしき）　無受想行識（むじゅそうぎょうしき）\n無眼耳鼻舌身意（むげんにびぜつしんい）　無色声香味触法（むしきしょうこうみそくほう）\n無眼界（むげんかい）　乃至無意識界（ないしむいしきかい）\n無無明亦（むむみょうやく）　無無明尽（むむみょうじん）　乃至無老死（ないしむろうし）　亦無老死尽（やくむろうしじん）\n無苦集滅道（むくしゅうめつどう）　無智亦無得（むちやくむとく）　以無所得故（いむしょとくこ）\n菩提薩埵（ぼだいさつた）　依般若波羅蜜多故（えはんにゃはらみったこ）　心無罣礙（しんむけいげ）\n無罣礙故（むけいげこ）　無有恐怖（むうくふ）　遠離一切顛倒夢想（おんりいっさいてんどうむそう）　究竟涅槃（くうぎょうねはん）\n三世諸仏（さんぜしょぶつ）　依般若波羅蜜多故（えはんにゃはらみったこ）　得阿耨多羅三藐三菩提（とくあのくたらさんみゃくさんぼだい）\n故知般若波羅蜜多（こちはんにゃはらみった）　是大神呪（ぜだいじんしゅ）　是大明呪（ぜだいみょうしゅ）\n是無上呪（ぜむじょうしゅ）　是無等等呪（ぜむとうどうしゅ）　能除一切苦（のうじょいっさいく）　真実不虚（しんじつふこ）\n故説般若波羅蜜多呪（こせつはんにゃはらみったしゅ）　即説呪日（そくせつしゅわつ）\n羯諦羯諦（ぎゃていぎゃてい）　波羅羯諦（はらぎゃてい）　波羅僧羯諦（はらそうぎゃてい）　菩提薩婆訶（ぼじそわか）\n般若心経（はんにゃしんぎょう）"},{"id":18,"name":"大日如来","furigana":"だいにちにょらい","section":"諸尊","note":"","mantra":"おん　あびらうんけん\nおん　あびらうんけん　ばさら　だとばん"},{"id":19,"name":"軍荼利明王","furigana":"ぐんだりみょうおう","section":"五大明王","note":"（五大明王）煩悩除去・息災延命","mantra":"おん　きりきり　ばざら　うん　はった\nおん　あみりてぃ　うん　はった"},{"id":20,"name":"善女龍王","furigana":"ぜんにょりゅうおう","section":"諸尊","note":"五穀豊穣・浄化・厄払い","mantra":"おん　めい　けしゃにえい　そわか"},{"id":21,"name":"孔雀明王","furigana":"くじゃくみょうおう","section":"諸尊","note":"健康維持・病気治癒・邪気払い・煩悩・魔除け・雨乞い","mantra":"おん　まゆら　ぎらんでい　そわか"},{"id":22,"name":"迦楼羅天","furigana":"かるらてん","section":"諸尊","note":"不動明王背後の炎（迦楼羅炎）。奇病退散・延命・雨乞い・雨止め","mantra":"おん　がるだや　そわか"},{"id":23,"name":"倶利伽羅龍王","furigana":"くりからりゅうおう","section":"諸尊","note":"（不動明王の剣・倶利伽羅剣）憎しみ・怒り・恥・貧しい心の消滅","mantra":"のうまく　しっちしっち　そ　しっちしっち　きゃららやくえんさんまんま　しっり　あじゃま　しっちそわか"},{"id":24,"name":"不動明王","furigana":"ふどうみょうおう","section":"五大明王","note":"（五大明王）厄除開運・健康長寿・商売繁盛・学業成就・立身出世","mantra":"のうまく　さんまんだ　ばさらだん　せんだ　まかろしゃだ　そわたや　うんたらた　かんまん\nなまさまんだ　ばさらなん　せんだ　まかろしゃだ　そわたや　うんたらた　かんまん"},{"id":165,"name":"不動明王","furigana":"ふどうみょうおう","section":"五大明 うかがい）　念彼観音力（ねんびかんのんりき）　咸即起慈心（げんそくきじしん）\n或遭王難苦（わくそうおうなんぐ）　臨刑欲寿終（りんぎょうよくじゅしゅう）　念彼観音力（ねんびかんのんりき）　刀尋段段壊（とうじんだんだんね）\n或囚禁枷鎖（わくしゅうきんかさ）　手足被柱械（しゅそくひちゅうかい）　念彼観音力（ねんびかんのんりき）　釈然得解脱（しゃくねんとくげだつ）\n呪詛諸毒薬（しゅうそしょどくやく）　所欲害身者（しょよくがいしんしゃ）　念彼観音力（ねんびかんのんりき）　還著於本人（げんじゃくおほんにん）\n或遇悪羅刹（わくぐうあくらせつ）　毒龍諸鬼等（どくりゅうしょきとう）　念彼観音力（ねんびかんのんりき）　時悉不敢害（じしっぷかんがい）\n若悪獣圍繞（にゃくあくじゅういにょう）　利牙爪可怖（りげそうかふ）　念彼観音力（ねんびかんのんりき）　疾走無邊方（しっそうむへんぽう）\n玩蛇及蝮蠍（がんじゃぎゅうぶっかつ）　気毒煙火燃（けどくえんかねん）　念彼観音力（ねんびかんのんりき）　尋聲自回去（じんしょうじえこ）\n雲雷鼓掣電（うんらいくせいでん）　降雹澍大雨（ごうばくじゅだいう）　念彼観音力（ねんびかんのんりき）　応時得消散（おうじとくしょうさん）\n衆生被困厄（しゅじょうひこんやく）　無量苦逼身（むりょうくひっしん）　観音妙智力（かんのんみょうちりき）　能救世間苦（のうぐせけんく）\n具足神通力（ぐそくじんずうりき）　廣修智方便（こうしゅちほうべん）　十方諸国土（じっぽうしょこくど）　無刹不現身（むせつふげんしん）\n種種諸悪趣（しゅじゅしょあくしゅ）　地獄鬼畜生（じごくきちくしょう）　生老病死苦（しょうろうびょうしく）　以漸悉令滅（いぜんしつりょうめつ）\n真観清浄観（しんかんしょうじょうかん）　廣大智慧観（こうだいちえかん）　悲観及慈観（ひかんぎゅうじかん）　常願常瞻仰（じょうがんじょうせんごう）\n無垢清浄光（むくしょうじょうこう）　慧日破諸闇（えにちはしょあん）　能伏災風火（のうぶくさいふうか）　普明照世間（ふみょうしょうせけん）\n悲體戒雷震（ひたいかいらいしん）　慈意妙大雲（じいみょうだいうん）　澍甘露法雨（じゅかんろほうう）　滅除煩悩焔（めつじょぼんのうえん）\n諍訟経官処（じょうしょうきょうかんしょ）　怖畏軍陣中（ふいぐんじんちゅう）　念彼観音力（ねんびかんのんりき）　衆怨悉退散（しゅうおんしつたいさん）\n妙音観世音（みょうおんかんぜおん）　梵音海潮音（ぼんのんかいちょうおん）　勝彼世間音（しょうひせけんのん）　是故須常念（ぜこしゅじょうねん）\n念念勿生疑（ねんねんもつしょうぎ）　観世音浄聖（かんぜおんじょうしょう）　於苦悩死厄（おくのうしやく）　能為作依怙（のういさえこ）\n具一切功徳（ぐいつさいくどく）　慈眼視衆生（じげんじしゅじょう）　福聚海無量（ふくじゅかいむりょう）　是故応頂礼（ぜこおうちょうらい）\n【結び】\n爾時持地菩薩（にじじじぼさつ）　即従座起（そくじゅうざき）　前白佛言（ぜんびゃくぶつごん）　世尊（せそん）\n若有衆生（にゃくうしゅじょう）　聞是観世音菩薩品（もんぜかんぜおんぼさつほん）　自在之業（じざいしごう）　普門示現（ふもんじげん）　神通力者（じんずうりきしゃ）\n当知是人（とうちぜにん）　功徳不少（くどくふしょう）　佛説是普門品時（ぶつせつぜふもんぼんじ）\n衆中八萬四千衆生（しゅうじゅうはちまんしせんしゅじょう）　皆発無等等阿耨多羅三藐三菩提心（かいほつむとうどうあのくたらさんみゃくさんぼだいしん）"}];

const SECTION_LABELS = {
  "前行": "前行（護身法〜般若心経）",
  "諸尊": "諸尊の真言",
  "五大明王": "五大明王",
  "四天王": "四天王",
  "七福神": "七福神",
  "七福神・四天王": "七福神・四天王",
  "五神": "五神",
  "後行": "後行（回向〜観音経）",
};

function normalize(str){
  if(!str) return "";
  let s = str.normalize("NFKC");
  s = s.replace(/[\u30a1-\u30f6]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 0x60));
  s = s.toLowerCase().replace(/[\s　]/g, "");
  return s;
}

function escapeHtml(str){
  return (str ?? "").replace(/[&<>"']/g, m => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[m]));
}

const listArea = document.getElementById("listArea");
const emptyState = document.getElementById("emptyState");
const searchInput = document.getElementById("searchInput");
const hitCount = document.getElementById("hitCount");
const totalCount = document.getElementById("totalCount");
const clearBtn = document.getElementById("clearBtn");

totalCount.textContent = ENTRIES.length;

const openIds = new Set();

function render(){
  const raw = searchInput.value;
  const q = normalize(raw);

  let filtered = ENTRIES;
  if(q){
    filtered = ENTRIES.filter(e => {
      const furiHit = normalize(e.furigana).includes(q);
      const nameHit = e.name.includes(raw) || normalize(e.name).includes(q);
      return furiHit || nameHit;
    });
    // furigana matches first (reading-priority search)
    filtered = [...filtered].sort((a, b) => {
      const aF = normalize(a.furigana).includes(q) ? 0 : 1;
      const bF = normalize(b.furigana).includes(q) ? 0 : 1;
      return aF - bF;
    });
  }

  hitCount.textContent = filtered.length;

  if(filtered.length === 0){
    listArea.innerHTML = "";
    emptyState.style.display = "block";
    return;
  }
  emptyState.style.display = "none";

  let html = "";
  let lastSection = null;
  const groupBySection = !q; // only show section dividers in default (unfiltered) order

  filtered.forEach(e => {
    if(groupBySection && e.section !== lastSection){
      const label = SECTION_LABELS[e.section] || e.section;
      html += `<div class="section-divider"><span class="label">${escapeHtml(label)}</span><span class="rule"></span></div>`;
      lastSection = e.section;
      html += `<div class="entry-list" data-sec="${escapeHtml(e.section)}">`;
    } else if(!groupBySection && lastSection === null){
      html += `<div class="entry-list">`;
      lastSection = "flat";
    }

    const isOpen = openIds.has(e.id);
    html += `
      <div class="entry${isOpen ? " open" : ""}" data-id="${e.id}">
        <div class="entry-head" data-toggle="${e.id}">
          <div class="entry-titles">
            <span class="entry-name">${escapeHtml(e.name)}</span>
            <span class="entry-furigana">${escapeHtml(e.furigana)}</span>
          </div>
          <svg class="chevron" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
        </div>
        <div class="entry-body">
          ${e.note ? `<div class="entry-note">${escapeHtml(e.note)}</div>` : ""}
          <div class="mantra-block">${escapeHtml(e.mantra)}</div>
        </div>
      </div>
    `;
  });
  html += `</div>`;

  listArea.innerHTML = html;

  listArea.querySelectorAll("[data-toggle]").forEach(el => {
    el.addEventListener("click", () => {
      const id = parseInt(el.getAttribute("data-toggle"));
      const card = el.closest(".entry");
      if(openIds.has(id)){
        openIds.delete(id);
        card.classList.remove("open");
      } else {
        openIds.add(id);
        card.classList.add("open");
      }
    });
  });
}

searchInput.addEventListener("input", render);
clearBtn.addEventListener("click", () => {
  searchInput.value = "";
  render();
  searchInput.focus();
});

render();
</script>
