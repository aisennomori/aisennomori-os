<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1f3864">
<title>G検定 瞬殺トレーニング</title>
<style>
  :root{
    --navy-deep:#101b30; --navy:#1f3864; --navy-soft:#2c4a82;
    --paper:#f6f3ec; --card:#ffffff; --ink:#20242c; --muted:#68707c; --line:#e2ddd0;
    --amber:#c1893a; --amber-soft:#f4e3c8; --amber-deep:#8a5f24;
    --ok:#1a7f4b; --ok-bg:#e8f6ee; --ng:#c0392b; --ng-bg:#fdecea;
    --radius:14px; --maxw:900px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Yu Gothic","Hiragino Sans","Meiryo",sans-serif;
    background:var(--paper); color:var(--ink); line-height:1.7; font-size:16px; overflow-x:hidden;
  }
  .wrap{max-width:var(--maxw); margin:0 auto; padding:0 14px 60px;}

  header{
    background:var(--navy); color:#fff; position:sticky; top:0; z-index:50;
    padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;
  }
  .hd{max-width:var(--maxw); margin:0 auto; display:flex; align-items:center; gap:10px;}
  .hd h1{margin:0; font-size:15px; font-weight:800; letter-spacing:.02em; flex:1;}
  .hd .sub{font-size:11px; opacity:.8; font-weight:400;}
  .hd-btn{background:rgba(255,255,255,.15); color:#fff; border:0; border-radius:9px;
    padding:9px 13px; font-size:13px; font-weight:800; cursor:pointer; font-family:inherit;
    min-height:40px; white-space:nowrap;}
  .hd-btn:active{background:rgba(255,255,255,.3);}

  h2.sec{font-size:16px; margin:24px 0 10px; padding-left:9px; border-left:4px solid var(--navy);}
  .card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    padding:15px; margin:11px 0;}
  .muted{color:var(--muted); font-size:13px;}
  .btn{display:inline-flex; align-items:center; justify-content:center; gap:6px;
    background:var(--navy); color:#fff; border:0; border-radius:10px; padding:13px 18px;
    font-size:15px; font-weight:800; cursor:pointer; min-height:48px; font-family:inherit;}
  .btn:active{background:var(--navy-deep);}
  .btn[disabled]{opacity:.4; cursor:default;}
  .btn.sub{background:#fff; color:var(--navy); border:1.5px solid var(--navy);}
  .btn.ghost{background:#eceadf; color:#3b4250; border:1px solid var(--line);}
  .btn.wide{width:100%;}
  .btn.amber{background:var(--amber);} .btn.amber:active{background:var(--amber-deep);}
  .row{display:flex; gap:9px; flex-wrap:wrap;}

  .hero{background:linear-gradient(135deg,var(--navy),var(--navy-soft)); color:#fff;
    border-radius:var(--radius); padding:17px; margin:13px 0 4px;}
  .hero h3{margin:0 0 4px; font-size:18px;}
  .hero p{margin:0; font-size:12.5px; opacity:.9;}
  .stat{display:flex; gap:9px; flex-wrap:wrap; margin-top:12px;}
  .stat div{background:rgba(255,255,255,.17); border-radius:9px; padding:7px 12px;
    font-size:13px; font-weight:800;}

  .seg{display:inline-flex; border:1.5px solid var(--navy); border-radius:9px; overflow:hidden;}
  .seg button{background:#fff; color:var(--navy); border:0; padding:9px 15px;
    font-size:13.5px; font-weight:800; cursor:pointer; font-family:inherit; min-height:42px;}
  .seg button.on{background:var(--navy); color:#fff;}

  /* ---------- 出題 ---------- */
  .qbar{display:flex; align-items:center; gap:10px; margin:14px 0 10px; flex-wrap:wrap;}
  .qbar .idx{font-weight:800; font-size:14px; color:var(--navy);}
  .timer{font-variant-numeric:tabular-nums; font-weight:800; font-size:15px; color:var(--amber-deep);}
  .tag{background:var(--amber-soft); color:var(--amber-deep); border-radius:6px;
    padding:2px 9px; font-size:11.5px; font-weight:800;}
  .tag.weak{background:var(--ng-bg); color:var(--ng);}
  .tag.slow{background:#f0ece2; color:#5c5342;}
  .tag.mid{background:var(--amber-soft); color:var(--amber-deep);}
  .tag.cand{background:#e7f0e9; color:#3d6b4d;}
  .tag.fix{background:var(--ok-bg); color:var(--ok);}
  .bar{height:8px; background:#e6e1d4; border-radius:5px; overflow:hidden; flex:1; min-width:100px;}
  .bar>span{display:block; height:100%; background:var(--navy); border-radius:5px; transition:width .25s;}

  .prompt{font-size:19px; font-weight:800; margin:4px 0 16px; line-height:1.55;}
  .prompt .em{color:var(--amber-deep);}
  .opts{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .opt{
    background:#fff; border:1.5px solid var(--line); border-radius:12px;
    padding:18px 12px; min-height:74px; font-size:16px; font-weight:700;
    cursor:pointer; font-family:inherit; color:var(--ink); line-height:1.45;
    display:flex; align-items:center; justify-content:center; text-align:center;
  }
  .opt:active{background:var(--paper);}
  .opt.correct{border-color:var(--ok); background:var(--ok-bg); color:var(--ok);}
  .opt.wrong{border-color:var(--ng); background:var(--ng-bg); color:var(--ng);}
  .opt[disabled]{cursor:default;}
  @media(max-width:380px){ .opts{grid-template-columns:1fr;} .opt{min-height:58px; padding:14px 12px;} }

  .verdict{border-radius:12px; padding:14px 16px; margin:14px 0 10px;}
  .verdict.ok{background:var(--ok-bg); border:1.5px solid var(--ok);}
  .verdict.ng{background:var(--ng-bg); border:1.5px solid var(--ng);}
  .verdict .top{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap;}
  .verdict .mark{font-size:17px; font-weight:800;}
  .verdict.ok .mark{color:var(--ok);} .verdict.ng .mark{color:var(--ng);}
  .verdict .sec{font-size:13px; color:var(--muted); font-weight:700;}
  .verdict .key{margin-top:9px; font-size:15.5px; font-weight:800; line-height:1.6;}
  .verdict .link{margin-top:10px;}
  .link-a{display:inline-flex; align-items:center; gap:5px; min-height:44px; padding:10px 14px;
    background:#fff; color:var(--navy); border:1.5px solid var(--navy); border-radius:9px;
    font-size:13.5px; font-weight:800; text-decoration:none;}

  .navbtns{display:flex; gap:9px; margin:14px 0 8px;}
  .navbtns .btn{flex:1;}

  /* ---------- 結果 ---------- */
  .score{text-align:center; padding:20px 14px;}
  .score .big{font-size:40px; font-weight:800; color:var(--navy); line-height:1.15;}
  .score .rate{font-size:18px; font-weight:800; margin-top:4px;}
  .tally{display:flex; gap:9px; justify-content:center; margin-top:13px; flex-wrap:wrap;}
  .tally div{border-radius:10px; padding:9px 16px; font-weight:800; font-size:13.5px;}
  .tally .c{background:var(--ok-bg); color:var(--ok);}
  .tally .w{background:var(--ng-bg); color:var(--ng);}
  .tally .s{background:var(--amber-soft); color:var(--amber-deep);}

  .lrow{display:flex; gap:10px; align-items:flex-start; padding:10px 3px;
    border-bottom:1px solid var(--line); font-size:14px;}
  .lrow .m{flex:0 0 20px; text-align:center; font-weight:800;}
  .lrow .m.o{color:var(--ok);} .lrow .m.x{color:var(--ng);}
  .lrow .t{flex:1; min-width:0;}
  .lrow .t small{display:block; color:var(--muted); font-size:11.5px;}
  .lrow .sec2{flex:0 0 60px; text-align:right; font-weight:800;
    font-variant-numeric:tabular-nums; font-size:13px;}
  .lrow .sec2.slow{color:var(--amber-deep);}

  .empty{text-align:center; color:var(--muted); padding:32px 14px; font-size:14.5px;}

  /* ---------- 履歴 ---------- */
  .hs .hd2{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap;}
  .hs .sc{font-size:19px; font-weight:800; color:var(--navy);}
  .hs .dt{font-size:12.5px; color:var(--muted); font-weight:700;}
  .hs .kv{display:flex; gap:7px; flex-wrap:wrap; margin-top:9px;}
  .hs .kv span{background:var(--paper); border:1px solid var(--line); border-radius:8px;
    padding:4px 10px; font-size:12.5px; font-weight:800;}
  .hs details{margin-top:10px;}
  .hs summary{cursor:pointer; font-size:13.5px; font-weight:800; color:var(--navy);
    min-height:38px; display:flex; align-items:center;}
  .hs h4{margin:12px 0 0; font-size:12.5px; color:var(--amber-deep);}
  .ta{width:100%; min-height:220px; padding:10px; font-size:12px; line-height:1.6;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    border:1.5px solid var(--line); border-radius:10px; background:#fff; color:var(--ink);}

  /* ---------- 印刷シート ---------- */
  .sheet{display:none;}
  .sheet.show{display:block;}
  .sheet-page{background:#fff; border:1px solid var(--line); border-radius:var(--radius);
    padding:18px 20px; margin:12px 0;}
  .sheet-page h3{margin:0 0 4px; font-size:15px; color:var(--navy);
    border-bottom:2px solid var(--navy); padding-bottom:5px;}
  .sheet-page .pg{font-size:11px; color:var(--muted); margin:0 0 12px;}
  .grp{margin:0 0 13px; break-inside:avoid;}
  .grp .gt{font-size:13px; font-weight:800; color:var(--amber-deep); margin-bottom:3px;}
  .grp .ln{display:flex; gap:8px; font-size:12.5px; line-height:1.75; align-items:baseline;}
  .grp .ln .l{flex:0 0 42%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .grp .ln .dot{flex:1; border-bottom:1px dotted #c9c3b4; transform:translateY(-4px);}
  .grp .ln .r{flex:0 0 50%; text-align:left;}
  .grp .ln .r b{font-weight:800;}
  .grp .ln .star{color:#000; font-weight:800;}

  @media print{
    @page{ size:A4 portrait; margin:9mm 10mm; }
    body{background:#fff; font-size:9pt; line-height:1.35;}
    header,.no-print{display:none !important;}
    .wrap{max-width:none; padding:0;}
    .sheet{display:block !important;}
    .sheet-page{border:0; border-radius:0; padding:0; margin:0;
      page-break-after:always; break-after:page;}
    .sheet-page:last-child{page-break-after:auto; break-after:auto;}
    .sheet-page h3{font-size:11pt; margin:0 0 1mm; padding-bottom:1mm;}
    .sheet-page .pg{margin:0 0 2mm; font-size:7.5pt;}
    .grp{margin-bottom:2.4mm;}
    .grp .gt{font-size:9pt; margin-bottom:0.4mm;}
    .grp .ln{font-size:8.2pt; line-height:1.38;}
    .grp .ln .l{flex:0 0 38%;}
    .grp .ln .r{flex:0 0 56%;}
    .grp .ln .dot{transform:translateY(-3px);}
  }
</style>
</head>
<body>

<header class="no-print">
  <div class="hd">
    <h1>G検定 瞬殺トレーニング</h1>
    <button class="hd-btn" id="homeBtn" type="button">ホーム</button>
  </div>
</header>

<div class="wrap" id="app"></div>

<script>
/* ============================================================
   CARDS ── Set A 26論点 ＋ Set B 9論点
   ・items[].home に所属を持たせ、odd / pair / trio / quad の4用途へ展開する
   ・誤答肢は同じセット内の同カテゴリから自動生成し、必要なら decoys で上書きする
   ・odd 以外のカードは items の home をすべて異なる値にすること
     （重複すると正解が誤答肢にも現れる）
   ============================================================ */
const CARDS = [
/* ---------- 技術 20 ---------- */
{ id:"T01", type:"odd", cat:"最適化", weight:3,
  items:[{term:"AdaGrad",home:"最適化"},{term:"RMSprop",home:"最適化"},
         {term:"AdaBoost",home:"アンサンブル"},{term:"Momentum",home:"最適化"}],
  answer:3, key:"Boost が付くのはアンサンブル。他は最適化", look:"バギング ブースティング" },

{ id:"T02", type:"pair", cat:"勾配", weight:3,
  items:[{term:"勾配消失",home:"ReLU・スキップ結合・ゲート機構"},
         {term:"勾配爆発",home:"勾配クリッピング"}],
  key:"停滞なら消失、発散なら爆発。学習率を下げるのは消失の対策にならない",
  decoys:["ドロップアウト","データ拡張"], look:"勾配消失 勾配爆発" },

{ id:"T03", type:"pair", cat:"出力層", weight:3,
  items:[{term:"多クラス分類（1つだけ選ぶ）",home:"ソフトマックス"},
         {term:"多ラベル分類（複数同時）",home:"各出力にシグモイド"}],
  key:"排他的ならソフトマックス、同時に成立しうるなら各出力にシグモイド",
  decoys:["ReLU","tanh"], look:"多クラス 多ラベル" },

{ id:"T04", type:"pair", cat:"正則化", weight:3,
  items:[{term:"L1正則化",home:"重みが0になる（特徴量選択）"},
         {term:"L2正則化",home:"0にはならず全体を抑える"}],
  key:"ちょうど0になるのがL1。絞り込みたいならL1、ラッソがL1・リッジがL2",
  decoys:["学習が速くなる","勾配爆発を防ぐ"], look:"L1 L2" },

{ id:"T05", type:"trio", cat:"生成モデル", weight:3,
  items:[{term:"GAN",home:"生成器と識別器を競わせる"},
         {term:"VAE",home:"潜在変数の確率分布へ写像する"},
         {term:"拡散モデル",home:"ノイズを加える過程の逆をたどる"}],
  key:"競わせる＝GAN、確率分布＝VAE、ノイズの逆＝拡散モデル",
  decoys:["系列を変換する"], look:"GAN VAE 拡散モデル" },

{ id:"T06", type:"pair", cat:"評価指標", weight:3,
  items:[{term:"適合率",home:"分母は予測した陽性"},
         {term:"再現率",home:"分母は実際の陽性"}],
  key:"見逃しを減らしたいなら再現率、誤検知を減らしたいなら適合率",
  decoys:["分母は全件","分母は真陰性"], look:"適合率 再現率" },

{ id:"T07", type:"odd", cat:"画像", weight:2,
  items:[{term:"YOLO",home:"物体検出"},{term:"SSD",home:"物体検出"},
         {term:"U-Net",home:"セグメンテーション"},{term:"Faster R-CNN",home:"物体検出"}],
  answer:3, key:"U-Netだけ画素単位。他は矩形で位置を出す", look:"U-Net YOLO" },

{ id:"T08", type:"pair", cat:"画像", weight:2,
  items:[{term:"セマンティックセグメンテーション",home:"個体を区別しない"},
         {term:"インスタンスセグメンテーション",home:"個体を1つずつ区別する"}],
  key:"同種の物体を1つずつ数えるならインスタンス",
  decoys:["矩形で囲む","画像全体に1ラベル"], look:"セマンティック インスタンス" },

{ id:"T09", type:"pair", cat:"RNN", weight:2,
  items:[{term:"LSTM",home:"入力・出力・忘却の3ゲート＋CEC"},
         {term:"GRU",home:"リセット・更新の2ゲート"}],
  key:"忘却ゲートはLSTM、更新ゲートはGRU",
  decoys:["ゲートを持たない","Attentionのみ"], look:"LSTM GRU" },

{ id:"T10", type:"trio", cat:"転移学習", weight:3,
  items:[{term:"事前学習",home:"汎用的な表現を先に獲得する"},
         {term:"転移学習",home:"別のタスクへ流用する"},
         {term:"破滅的忘却",home:"以前の能力が失われる"}],
  key:"活かすのが転移学習、失うのが破滅的忘却",
  decoys:["訓練データに適合しすぎる"], look:"転移学習 破滅的忘却" },

{ id:"T11", type:"trio", cat:"軽量化", weight:3,
  items:[{term:"量子化",home:"ビット数を下げる（構造は変えない）"},
         {term:"プルーニング",home:"重要度の低い結合を削除する"},
         {term:"蒸留",home:"教師モデルから生徒モデルを学習する"}],
  key:"量子化＝ビット数を下げる。PTQなら再学習なしで適用できる場合がある。別の小型モデルを育てるのが蒸留",
  decoys:["学習データを水増しする"], look:"量子化 蒸留" },

{ id:"T12", type:"trio", cat:"解釈性", weight:2,
  items:[{term:"Grad-CAM",home:"画像の注目領域を示す"},
         {term:"SHAP",home:"個々の予測への寄与を示す"},
         {term:"Permutation Importance",home:"モデル全体の重要度を示す"}],
  key:"画像ならGrad-CAM、1件ごとならSHAP、全体ならPermutation Importance",
  decoys:["過学習を抑える"], look:"Grad-CAM SHAP" },

{ id:"T13", type:"pair", cat:"アンサンブル", weight:2,
  items:[{term:"バギング",home:"並列に学習する（ランダムフォレスト）"},
         {term:"ブースティング",home:"順番に誤りを補正する（AdaBoost）"}],
  key:"並列がバギング、直列がブースティング",
  decoys:["次元を削減する","報酬で学習する"], look:"バギング ブースティング" },

{ id:"T14", type:"odd", cat:"学習の種類", weight:2,
  items:[{term:"ロジスティック回帰",home:"教師あり"},{term:"サポートベクトルマシン",home:"教師あり"},
         {term:"k-means",home:"教師なし"},{term:"決定木",home:"教師あり"}],
  answer:3, key:"ラベルなしで分けるのがk-means。他は正解ラベルが要る", look:"教師あり 教師なし" },

{ id:"T15", type:"pair", cat:"強化学習", weight:2,
  items:[{term:"価値ベース",home:"Q学習・SARSA・DQN"},
         {term:"方策ベース",home:"REINFORCE・方策勾配法"}],
  key:"Q値を学ぶのが価値ベース、方策を直接学ぶのが方策ベース。Actor-Criticは両方",
  decoys:["k-means・PCA","BERT・GPT"], look:"Q学習 REINFORCE" },

{ id:"T16", type:"odd", cat:"正則化", weight:2,
  items:[{term:"L1正則化",home:"正則化"},{term:"L2正則化",home:"正則化"},
         {term:"ドロップアウト",home:"正則化"},{term:"バッチ正規化",home:"正規化層"}],
  answer:4, key:"BatchNorm＝主目的は学習の安定化・高速化。L1/L2/Dropoutとは分類が異なる",
  look:"正則化 バッチ正規化" },

{ id:"T17", type:"pair", cat:"自然言語処理", weight:2,
  items:[{term:"word2vec",home:"1語につき1ベクトルで固定"},
         {term:"BERT",home:"文脈に応じて表現が変わる"}],
  key:"多義語を文脈で区別できるのがBERT",
  decoys:["出現回数だけを数える","語順を保持しない"], look:"word2vec BERT" },

{ id:"T18", type:"pair", cat:"音声", weight:3,
  items:[{term:"音声認識",home:"何を言ったか"},
         {term:"話者識別",home:"誰が言ったか"}],
  key:"WhatとWho。同じMFCCから別々に処理される",
  decoys:["どんな感情か","どこで話したか"], look:"話者 音声認識" },

{ id:"T19", type:"trio", cat:"活性化関数", weight:2,
  items:[{term:"シグモイド関数",home:"(0, 1)"},
         {term:"tanh関数",home:"(-1, 1)"},
         {term:"ReLU関数",home:"[0, ∞)"}],
  key:"微分値が1未満の関数を重ねると勾配消失。中間層はReLU",
  decoys:["(-∞, ∞)"], look:"シグモイド ReLU" },

{ id:"T20", type:"odd", cat:"教師なし学習", weight:2,
  items:[{term:"主成分分析",home:"次元削減"},{term:"t-SNE",home:"次元削減"},
         {term:"ウォード法",home:"クラスタリング"},{term:"特異値分解",home:"次元削減"}],
  answer:3, key:"特徴量を減らすのが次元削減、データを分けるのがクラスタリング",
  look:"主成分分析 ウォード法" },

/* ---------- 法務・倫理 6 ---------- */
{ id:"L01", type:"trio", cat:"個人情報", weight:3,
  items:[{term:"個人情報",home:"特定の個人を識別できる"},
         {term:"個人データ",home:"データベース等を構成する"},
         {term:"保有個人データ",home:"開示・訂正等の権限を持つ"}],
  key:"DB等を構成していなければ個人情報、構成していれば個人データ、開示・訂正等に応じる権限まで持てば保有個人データ",
  decoys:["復元できないよう加工した"], look:"個人情報 個人データ" },

{ id:"L02", type:"pair", cat:"個人情報", weight:3,

/* ============================================================
   定数・localStorage
   ============================================================ */
const LS_KEY = 'gkentei_flash_v1';
const FAST_MS = 5000;          // 5秒以内の正解＝定着候補
const SLOW_MS = 10000;         // 5〜10秒＝理解済み／反射化途中、10秒超＝要反射
const STREAK_FIX = 2;          // 5秒以内を2回連続で正解すると定着確認済み
const SESSION_N = 26;
const YOUGO_URL = 'gkentei-yougo.html';

/* セッション単位の履歴。カード単位の履歴（LS_KEY）とは完全に分離する */
const LS_HIST_KEY = 'gkentei_flash_history_v1';
const HIST_MAX = 20;           // 保存するセッション数の上限。超えたら古いものから削除

let STORE = {version:1, history:{}, mhistory:{fill:{}, ident:{}}, settings:{mode:'all'}};

function load(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(raw){
      const o = JSON.parse(raw);
      if(o && typeof o === 'object'){
        STORE.history  = o.history  || {};
        STORE.settings = Object.assign(STORE.settings, o.settings || {});
        /* 穴埋め・識別の履歴は瞬殺（history）とは別枠に持つ。既存データは触らない */
        const mh = o.mhistory || {};
        STORE.mhistory = {fill: mh.fill || {}, ident: mh.ident || {}};
      }
    }
  }catch(e){ console.warn('load failed', e); }
}

/* 出題を最後まで終えたセッションだけを1回だけ保存する。
   中断（S=null）は vResult を通らないため、ここには到達しない。
   問題数は固定値を使わず、実際の results から求める。 */
function pushSession(){
  if(!S || S.saved) return;                       // 結果画面の再描画による二重保存を防ぐ
  if(!S.results.length) return;
  if(S.results.length !== S.ids.length) return;   // 途中終了は記録しない
  S.saved = true;

  const n    = S.results.length;
  const ok   = S.results.filter(r => r.ok).length;
  const fast = S.results.filter(r => r.fast).length;
  HIST.unshift({
    at: new Date().toISOString(),
    mode: S.mode,
    set: S.set || 'A',
    learnMode: S.learnMode || 'flash',
    src: S.src || 'all',
    questionCount: n,
    correctCount: ok,
    incorrectCount: n - ok,
    rate: Math.round(ok / n * 100),
    averageMs: Math.round(S.results.reduce((a,r) => a + r.ms, 0) / n),
    fastCount: fast,
    results: S.results.map(r =>
      ({id:r.id, ok:r.ok, ms:r.ms, fast:r.fast, slow:r.slow, state:r.state})),
  });
  if(HIST.length > HIST_MAX) HIST.length = HIST_MAX;
  saveHist();
}

}

増大することを（　　　）という。","answer":"知識獲得のボトルネック","key":"知識獲得のボトルネックとは、人間が日常的に持つ膨大な知識や専門知識をすべて明文化してコンピュータに入力・記述することが困難であるという問題です。","look":"第2次AIブームの課題","weight":1},{"id":"F-1-015","mode":"fill","src":1,"cat":"フレーム問題","chapter":"CHAPTER 1","diff":2,"question":"AIが現実世界の課題を実行する際、自分に関係のある情報だけを選択し、無限に存在する関係のない情報を無視することができない（処理時間が無限に必要になる）という問題を（　　　）という。","answer":"フレーム問題","key":"フレーム問題（枠組み問題）とは、有限の処理能力しか持たないAIにとって、解決したい問題に関係する枠（フレーム）を適切に定義して計算することが困難であるという問題です。","look":"フレーム問題","weight":1},{"id":"F-1-016","mode":"fill","src":1,"cat":"シンボルグラウンディング問題","chapter":"CHAPTER 1","diff":2,"question":"コンピュータが記号（シンボル）を単なる文字パターンとして処理しているだけであり、その記号が現実世界の物理的な質感や具体的な意味と結びついていない問題を（　　　）という。","answer":"シンボル・グラウンディング問題","key":"シンボル・グラウンディング問題（記号接地問題）は、コンピュータ内の表現（例：『馬』という言葉）が、現実世界の馬の視覚情報や概念と自律的に結びつかない問題です。","look":"シンボルグラウンディング問題","weight":1},{"id":"F-1-017","mode":"fill","src":1,"cat":"モラベックのパラドックス","chapter":"CHAPTER 1","diff":3,"question":"「チェスなどの知的な計算問題はAIにとって極めて簡単だが、人間が日常的に行う『歩くこと』や『物体を見る』などの身体・感覚的処理はAIにとって極めて困難である」という矛盾を（　　　）という。","answer":"モラベックのパラドックス","key":"ハンス・モラベックが提唱した「モラベックのパラドックス」は、人間の知的思考と感覚運動スキルの難易度がAIにおいては反転（逆転）していることを表したものです。","look":"モラベックのパラドックス","weight":1},{"id":"F-1-018","mode":"fill","src":1,"cat":"身体性","chapter":"CHAPTER 1","diff":2,"question":"知能が現実世界を真に理解するためには、コンピュータ画面内だけでなく、物理的な体（感覚器官と行動手段）を持ち、周囲の環境と相互作用することが必要であるという概念を（　　　）という。","answer":"身体性","key":"身体性（しんたいせい）とは、物理的な身体があってこそ、現実の物理世界を真に把握し、意味のある学習（知識の構築）が可能になるというアプローチです。","look":"身体性","weight":1},{"id":"F-1-019","mode":"fill","src":1,"cat":"情報処理","chapter":"CHAPTER 1","diff":2,"question":"探索木において、出発点から近いノード（階層）から順番に左から右へ水平方向に全ノードを探索し、ゴールが見つからなければさらに1つ下の階層へ進む探索手法を（　　　）という。","answer":"幅優先探索","key":"幅優先探索は、目標に至る最短ルート（手数最小）で必ずゴールに到達する保証がありますが、全てのルートをメモリに展開するためメモリ消費量が非常に大きくなります。","look":"情報処理","weight":1},{"id":"F-1-020","mode":"fill","src":1,"cat":"情報処理","chapter":"CHAPTER 1","diff":2,"question":"探索木において、まず最深部（行き止まり）に到達するまで一つの道を深く突き進み、そこで見つからなければ一歩戻って別の枝を探索するアルゴリズムを（　　　）という。","answer":"深さ優先探索","key":"深さ優先探索は、特定のルートを深く探索するため、メモリの消費量は抑えられますが、最初に見つかったルートが「最短ルート」であるとは限らない特徴があります。","look":"情報処理","weight":1},{"id":"F-1-021","mode":"fill","src":1,"cat":"機械学習","chapter":"CHAPTER 2","diff":1,"question":"機械学習のうち、入力データと「教師が与える正解」をペアにしたデータセットを用いて、未知の入力に対する予測やクラス分類を行わせる手法を（　　　）という。","answer":"教師あり学習","key":"教師あり学習は、入力データと正解ラベルのセットを用いて学習を行い、新しい入力に対して正しい出力を行えるような関数（モデル）を構築します。","look":"機械学習","weight":1},{"id":"F-1-022","mode":"fill","src":1,"cat":"機械学習","chapter":"CHAPTER 2","diff":1,"question":"教師あり学習のタスクのうち、入力から『明日の気温』や『株価』といった「連続する具体的な数値（実数値）」を予測するタスクを（　　　）という。","answer":"回帰","key":"予測する出力がカテゴリ（離散値）である「分類」に対し、連続する数値（実数値）を予測するものを「回帰」と呼びます。","look":"機械学習","weight":1},{"id":"F-1-023","mode":"fill","src":1,"cat":"過学習","chapter":"CHAPTER 2","diff":2,"question":"モデルの表現力が過剰であったり、手元の訓練データが少なすぎたりすることが原因で、訓練データには完璧に適合するが、未知のテストデータには適合できなくなる現象を（　　　）という。","answer":"過学習","key":"過学習（オーバーフィッティング）は、モデルが訓練データのノイズまで学習しすぎて、未知のデータへの一般化能力（汎化性能）を失ってしまった状態です。","look":"過学習","weight":1},{"id":"F-1-024","mode":"fill","src":1,"cat":"過学習","chapter":"CHAPTER 2","diff":2,"question":"モデルの推定値のばらつきやすさをバリアンスというのに対し、実測値と推定値の平均的な「ズレ（偏り）」のことを（　　　）という。","answer":"バイアス","key":"バイアスとバリアンスはトレードオフの関係にあります。表現力が低すぎるモデルはバイアスが高く（未学習）、表現力が過剰なモデルはバリアンスが高くなります（過学習）。","look":"過学習","weight":1},{"id":"F-1-025","mode":"fill","src":1,"cat":"正則化","chapter":"CHAPTER 2","diff":2,"question":"モデルの過学習を防ぐため、モデルが学習するパラメータが極端に大きくなるのを防ぐペナルティ項（罰則項）を損失関数に付加する手続きを（　　　）という。","answer":"正則化","key":"正則化は、過度な複雑さに対してペナルティを課すことで、モデルの重みが大きくなりすぎないように制御し、過学習を抑制する手法です。","look":"正則化","weight":1},{"id":"F-1-026","mode":"fill","src":1,"cat":"正則化","chapter":"CHAPTER 2","diff":3,"question":"パラメータの「絶対値の和」をペナルティとする正則化であり、不要な特徴量の重みが完全に「0」になりやすく、特徴量選択（スパース化）の効果を持つのは（　　　）正則化である。","answer":"L1","key":"L1正則化（Lasso）は絶対値ペナルティを課すため、不要な変数の係数が0になりやすく、必要な変数だけを絞り込む効果（特徴量選択・スパース性）を持ちます。","look":"正則化","weight":1},{"id":"F-1-027","mode":"fill","src":1,"cat":"正則化","chapter":"CHAPTER 2","diff":3,"question":"パラメータの「二乗和」をペナルティとする正則化であり、パラメータを完全に0にはせず全体的に滑らかに小さく縮小させることで過学習を抑制するのは（　　　）正則化である。","answer":"L2","key":"L2正則化（Ridge）は二乗ペナルティを課すため、パラメータ全体を小さく制限しますが、特定のパラメータが完全に0になることは稀で、全ての変数を用いて滑らかな境界線を作ります。","look":"正則化","weight":1},{"id":"F-1-028","mode":"fill","src":1,"cat":"アンサンブル学習","chapter":"CHAPTER 2","diff":2,"question":"「ブートストラップ法」を用いて訓練データから部分データをランダムに複数抽出し、個別に並列学習した複数の決定木の予測の多数決（または平均）を取る強力な手法を（　　　）という。","answer":"ランダムフォレスト","key":"ランダムフォレストは、並列に構築した個別の弱学習器（決定木）の多数決をとる「バギング」の代表的な応用例であり、過学習に強いというメリットがあります。","look":"アンサンブル学習","weight":1},{"id":"F-1-029","mode":"fill","src":1,"cat":"アンサンブル学習","chapter":"CHAPTER 2","diff":2,"question":"弱学習器を直列（逐次的）に学習させ、前の学習器が間違えたデータに対して大きな重み（学習重要度）を設定して次の学習器に補修させるアルゴリズムを（　　　）という。","answer":"ブースティング","key":"ブースティングは、1つずつモデルを直列に学習させ、前のモデルが誤ったサンプルを優先して補強するように学習を進めることで、表現力の高い強力なモデルを構築するアンサンブル学習です。","look":"アンサンブル学習","weight":1},{"id":"F-1-030","mode":"fill","src":1,"cat":"SVM","chapter":"CHAPTER 2","diff":2,"question":"サポートベクトルマシンにおいて、決定境界線と、それから最も近い位置にあるデータ点（サポートベクトル）との間の『距離』のことを（　　　）という。","answer":"マージン","key":"SVM（サポートベクトルマシン）は、この「マージン」を最大化するように決定境界線を引く「マージン最大化」を基本アルゴリズムとしています。","look":"SVM","weight":1},{"id":"F-1-031","mode":"fill","src":1,"cat":"クラスタリング","chapter":"CHAPTER 2","diff":2,"question":"クラスタリングにおいて、すべてのデータ点を個別のクラスタからスタートさせ、最も距離の近い（または分散の増加が少ない）もの同士を樹状図（デンドログラム）を形成しながら結合していくアプローチを（　　　）クラスタリングという。","answer":"階層型","key":"樹状図を順次ボトムアップで形成し、似た者同士を結合していく手法を「階層型クラスタリング」と呼びます。代表例としてWard（ウォード）法があります。","look":"クラスタリング","weight":1},{"id":"F-1-032","mode":"fill","src":1,"cat":"評価指標","chapter":"CHAPTER 2","diff":2,"question":"混同行列における指標で、モデルが「陽性（異常など）」と予測したもののうち、実際に本物の陽性であった割合を示す指標を英語で（　　　）という。","answer":"Precision","key":"Precision（適合率）は、$TP / (TP + FP)$ で算出され、陽性だと予測したものの正しさを表します。無駄な陽性判定を減らしたい状況（例：スパムフィルター）で極めて重視されます。","look":"評価指標","weight":1},{"id":"F-1-033","mode":"fill","src":1,"cat":"評価指標","chapter":"CHAPTER 2","diff":2,"question":"混同行列における指標で、実際に陽性であるデータ全体のうち、モデルが漏らさず正しく「陽性」と検出できた割合を示す指標を英語で（　　　）という。","answer":"Recall","key":"Recall（再現率）は、$TP / (TP + FN)$ で算出され、実際の陽性データからどれだけ漏らさずに検出できたか（見落としの少なさ）を表します。がん診断などの医療用途や故障検知で最重視されます。","look":"評価指標","weight":1},{"id":"F-1-034","mode":"fill","src":1,"cat":"評価方法","chapter":"CHAPTER 2","diff":2,"question":"データを「訓練（学習）データ」と「テストデータ」の2つに事前に一定割合（例：7対3）で一度だけ分割し、その一方を学習用、もう一方を最終評価用に固定する評価アプローチを（　　　）という。","answer":"ホールドアウト法","key":"ホールドアウト法は、最も単純で計算負荷が低い評価データの分割方法ですが、データの分け方自体に偏りが生じるリスクがあります。","look":"評価方法","weight":1},{"id":"F-1-035","mode":"fill","src":1,"cat":"データ前処理","chapter":"CHAPTER 2","diff":3,"question":"特徴量データの前処理において、変数ごとの平均を0、分散を1にするスケーリング操作に加え、各特徴量間の共分散（相関）をなくして無相関にする処理をデータの（　　　）という。","answer":"白色化","key":"白色化（Whitening）は、データの標準化に加えて「多変数間の相関の除去（無相関化）」も同時に行う高度なデータ前処理手法です。","look":"データ前処理","weight":1},{"id":"F-2-001","mode":"fill","src":2,"cat":"活性化関数","chapter":"CHAPTER 3","diff":1,"question":"ニューラルネットワークにおいて、出力値が滑らかに0から1の範囲に収まり、古典的な2分類の出力層や中間の非線形変換に長年多用されたS字型の関数を（　　　）関数という。","answer":"シグモイド","key":"シグモイド関数は入力を0〜1の連続値に変換する関数です。層が深くなると勾配がゼロに収束しやすくなる（勾配消失問題）という欠点があります。","look":"活性化関数","weight":1},{"id":"F-2-002","mode":"fill","src":2,"cat":"活性化関数","chapter":"CHAPTER 3","diff":1,"question":"入力値が0以下のときは一律0を出力し、0を超える場合は入力をそのまま出力する、現在のディープラーニングにおける最も標準的な活性化関数を（　　　）関数という。","answer":"ReLU","key":"ReLU（ランプ関数・Rectified Linear Unit）は、入力が正のときに勾配が常に1となるため、何層重ねても勾配消失問題が発生しにくく、ディープラーニングの発展に貢献しました。","look":"活性化関数","weight":1},{"id":"F-2-003","mode":"fill","src":2,"cat":"活性化関数","chapter":"CHAPTER 3","diff":1,"question":"ニューラルネットワークを多クラス分類問題に適用する際、出力層の全ニューロンの出力値を「総和が1になるような確率分布（各クラスの予測確率）」へと変換する関数を（　　　）関数という。","answer":"ソフトマックス","key":"ソフトマックス関数は多クラス分類モデルの最終出力層に配置され、各カテゴリへの予測確率（合計が100%になる）を出力します。","look":"活性化関数","weight":1},{"id":"F-2-004","mode":"fill","src":2,"cat":"勾配消失問題","chapter":"CHAPTER 3","diff":2,"question":"ニューラルネットワークの層数が極端に多くなる（深くなる）につれて、勾配情報が入力側へと戻る過程で急激に減退して0に近づき、入力層に近い重みが全く更新されなくなる現象を（　　　）という。","answer":"勾配消失問題","key":"勾配消失問題は、活性化関数の偏微分（シグモイド関数など最大でも0.25）を何層も掛け合わせることによって勾配が急激に失われる現象です。","look":"勾配消失問題","weight":1},{"id":"F-2-005","mode":"fill","src":2,"cat":"誤差逆伝播法","chapter":"CHAPTER 3","diff":2,"question":"ニューラルネットワークの出力値と正解との誤差を、出力側から中間層、入力層へと逆順に伝播させ、各パラメータの勾配を効率よく算出する更新アルゴリズムを（　　　）という。","answer":"誤差逆伝播法","key":"誤差逆伝播法（バックプロパゲーション）は、微分の連鎖律（チェーンルール）を利用して各ニューロンの重みとバイアスの偏微分（勾配）を高速に算出する手法です。","look":"誤差逆伝播法","weight":1},{"id":"F-2-006","mode":"fill","src":2,"cat":"最適化手法","chapter":"CHAPTER 3","diff":2,"question":"勾配降下法において、全ての学習データを使用するのではなく、無作為に（ランダムに）1データまたは小さな部分グループを選んで勾配を計算し、確率的に重みを更新する手法を（　　　）という。","answer":"確率的勾配降下法","key":"確率的勾配降下法（SGD）は、各ステップでランダムなサンプルのみを用いて勾配を計算するため、局所解（ローカルミニマ）やプラトーを抜け出しやすく、計算効率も高い最適化手法です。","look":"最適化手法","weight":1},{"id":"F-2-007","mode":"fill","src":2,"cat":"学習の停滞","chapter":"CHAPTER 3","diff":2,"question":"ニューラルネットワークの学習（勾配降下法）において、鞍点や損失関数の勾配がほぼゼロに近い極めて平坦な領域にパラメータがはまり込み、学習の進行が著しく遅くなる（停滞する）現象を（　　　）という。","answer":"プラトー","key":"プラトー（平坦な面）とは、多次元損失関数のなかで傾きが非常に緩やかなエリアを指し、ここを突破するためにモーメンタムやAdamといった適応的学習率・最適化アルゴリズムが考案されました。","look":"学習の停滞","weight":1},{"id":"F-2-008","mode":"fill","src":2,"cat":"早期終了","chapter":"CHAPTER 3","diff":2,"question":"ニューラルネットワークの過学習を抑えるため、あらかじめ取り分けておいた「検証データ（バリデーション）」での損失値が下がらずに上昇に転じた段階で、エポック完了を待たずに学習を終了する手法を（　　　）という。","answer":"早期終了","key":"早期終了（アーリーストッピング）は、過学習が始まり検証データに対するエラーが大きくなり始めるタイミングを検知し、自動的に学習を打ち切る非常に実用的な正則化テクニックです。","look":"早期終了","weight":1},{"id":"F-2-009","mode":"fill","src":2,"cat":"ドロップアウト","chapter":"CHAPTER 3","diff":2,"question":"ニューラルネットワークの各学習ステップにおいて、一部のノード（ニューロン）を事前に決めた一定確率でランダムに一時的に「不活性化」し、残りのノードだけでフォワード・バックワード計算を行う過学習抑制手法を（　　　）という。","answer":"ドロップアウト","key":"ドロップアウトは、学習のたびに入力と中間層のつながりを部分的に破壊することで、特定のパラメータに頼る依存をなくし、擬似的に大量の異なるモデルをアンサンブル学習するのと同等の効果（過学習抑制）を発揮します。","look":"ドロップアウト","weight":1},{"id":"F-2-010","mode":"fill","src":2,"cat":"バッチ正規化","chapter":"CHAPTER 3","diff":2,"question":"ディープラーニングにおいて、中間レイヤーの出力をミニバッチごとに平均0・分散1に変換・スケーリングし、内部のレイヤー間でデータ分布が大きくシフトする「内部共変量シフト」を緩和する操作を（　　　）という。","answer":"バッチ正規化","key":"バッチ正規化（Batch Normalization）は、各層へ入力されるデータのスケールをバッチ単位で安定させるため、初期値への依存を下げ、学習率を高く設定できるなど、極めて高い学習安定化効果があります。","look":"バッチ正規化","weight":1},{"id":"F-2-011","mode":"fill","src":2,"cat":"モデル軽量化","chapter":"CHAPTER 3","diff":2,"question":"表現能力が高い超大規模な学習済みモデル（教師モデル）が出力する「ソフトラベル（予測確率分布）」を、よりパラメータ数の少ない軽量なモデル（生徒モデル）に学習させることで、生徒モデルの精度を向上させる手法を（　　　）という。","answer":"蒸留","key":"蒸留（Distillation）は、大規模モデルの持つ豊かな推論知識（単なる正解ラベルだけでなく、類似クラスに対する確率予測などの「あいまいさ」の情報）をコンパクトなモデルに効率よく引き継がせる軽量化技術です。","look":"モデル軽量化","weight":1},{"id":"F-2-012","mode":"fill","src":2,"cat":"RNN","chapter":"CHAPTER 3","diff":2,"question":"文章や音声、株価データなどの「時間の流れや連続的な順序情報（時系列データ）」を扱うため、中間層の出力が、自身の次の時間の入力とともに同じ中間層へとフィードバックされる自己ループを持ったアーキテクチャを（　　　）という。","answer":"RNN","key":"RNN（リカレントニューラルネットワーク・再帰型ニューラルネットワーク）は、隠れ層の内部状態を次の時刻へと引き継いで巡回させることで、可変長の時系列データを扱えるように設計された構造です。","look":"RNN","weight":1},{"id":"F-2-013","mode":"fill","src":2,"cat":"LSTM","chapter":"CHAPTER 3","diff":2,"question":"時系列RNNモデルにおける長期の依存関係の学習（勾配消失問題等）を解決するために開発された、情報を記憶するセルと3つの制御用「ゲート」を導入したモデルを（　　　）という。","answer":"LSTM","key":"LSTM（Long Short-Term Memory）は、長期的な時系列の依存関係を効率よく学習するための特殊な隠れユニット（ブロック）を搭載したモデルです。","look":"LSTM","weight":1},{"id":"F-2-014","mode":"fill","src":2,"cat":"LSTMの内部構造","chapter":"CHAPTER 3","diff":3,"question":"LSTMセルブロックの核心であり、活性化関数を通さずに足し算だけで過去の誤差情報を無劣化で長期記憶させ、勾配消失を防ぐ定数誤差コンテナーをアルファベットで（　　　）という。","answer":"CEC","key":"CEC（Constant Error Carousel、恒常誤差カルーセル）は、過去の情報をそのまま流し続ける核心構造であり、これを取り囲むように情報の出入りを調節する3つのゲートが配置されています。","look":"LSTMの内部構造","weight":1},{"id":"F-2-015","mode":"fill","src":2,"cat":"LSTMのゲート","chapter":"CHAPTER 3","diff":2,"question":"LSTMブロックにおいて、新しく入力されたデータをどれくらいCEC（恒常誤差カルーセル）に書き込む（足し合わせる）かを制御するゲートを（　　　）という。","answer":"入力ゲート","key":"LSTMには、過去の情報を忘れるか決める「忘却ゲート」、新しい情報を書き込むか決める「入力ゲート」、外部に出力するか決める「出力ゲート」の3つがあります。","look":"LSTMのゲート","weight":1},{"id":"F-2-016","mode":"fill","src":2,"cat":"CNN","chapter":"CHAPTER 3","diff":1,"question":"画像認識に高い性能を発揮するCNNにおいて、入力画像に対して特定サイズのフィルタ（カーネル）をスライドさせ、局所的なパターンの有無を検出した「特徴マップ」を出力する処理層を（　　　）という。","answer":"畳み込み層","key":"畳み込み層（Convolutional Layer）は、画像中の位置に依存せず、物体の局所的な輪郭や模様（エッジ、テクスチャ）を検出する層です。","look":"CNN","weight":1},{"id":"F-2-017","mode":"fill","src":2,"cat":"CNN","chapter":"CHAPTER 3","diff":1,"question":"CNNにおいて、特徴マップを一定間隔で区切った領域から、最大値や平均値を抽出することで、画像を圧縮（スケーリング）し、平行移動やわずかな位置ズレに対する頑健性を高める処理層を（　　　）という。","answer":"プーリング層","key":"プーリング層（Pooling Layer）は、特徴マップのサイズをダウンサンプリングして、物体のズレや微小な回転への「位置不変性（ロバスト性）」を持たせる効果があります。","look":"CNN","weight":1},{"id":"F-2-018","mode":"fill","src":2,"cat":"CNNのパラメータ","chapter":"CHAPTER 3","diff":2,"question":"CNNの畳み込み層において、フィルタを入力画像の上で何ピクセルずつ移動（スライド）させるか、その移動のステップ幅の設定値を（　　　）という。","answer":"ストライド","key":"ストライド（Stride）とはフィルタの歩幅です。ストライドを2以上に設定すると、出力される特徴マップの空間サイズを強制的に縮小させることができます。","look":"CNNのパラメータ","weight":1},{"id":"F-2-019","mode":"fill","src":2,"cat":"ResNet","chapter":"CHAPTER 3","diff":2,"question":"150層を超える極めて深いディープニューラルネットワークの学習を可能にするため、層の入力を、畳み込み結果を飛び越えて先の出力に直接足し合わせる「スキップ結合」を導入した画期的な画像モデルを（　　　）という。","answer":"ResNet","key":"ResNet（Residual Network）は、勾配をスキップ結合（ショートカット）を通じてバックプロパゲーション時に無劣化でダイレクトに入力側に逆伝播できるため、極めて多層なCNNの学習を成功させました。","look":"ResNet","weight":1},{"id":"F-2-020","mode":"fill","src":2,"cat":"オートエンコーダ","chapter":"CHAPTER 3","diff":2,"question":"入力データと同じデータを全く同じように出力するように、隠れ層（ボトルネック構造）を介して訓練する、データの次元削減や特徴量の自動抽出を行う教師なし学習ベースのNNモデルを（　　　）という。","answer":"オートエンコーダ","key":"オートエンコーダ（自己符号化器）は、入力を次元の低い潜在特徴に圧縮する「エンコーダ」と、それを元のデータサイズに復元する「デコーダ」の2つから成る教師なし構造です。","look":"オートエンコーダ","weight":1},{"id":"F-2-021","mode":"fill","src":2,"cat":"GAN","chapter":"CHAPTER 3","diff":2,"question":"データを本物そっくりに作り出す「生成器（ジェネレータ）」と、入力されたデータが本物か生成された偽物かを判定する「識別器（ディスクリミネータ）」の2つを競わせる形で精度を上げる強力な生成モデルを（　　　）という。","answer":"GAN","key":"GAN（Generative Adversarial Network、敵対的生成ネットワーク）は、2つのモデルが互いに相手を出し抜く（ゲーム理論のナッシュ均衡を目指す）形で自律的に学習を進め、極めてリアルな画像やデータを生成します。","look":"GAN","weight":1},{"id":"F-2-022","mode":"fill","src":2,"cat":"物体検出","chapter":"CHAPTER 4","diff":2,"question":"画像内の「どこに」「何が」存在するかを検出する物体検出タスクにおいて、検出された物体の外周を取り囲む長方形の検出枠（境界座標）のことを英語で（　　　）という。","answer":"バウンディングボックス","key":"物体検出では、物体が映っている位置座標をバウンディングボックス（Bounding Box）として予測すると同時に、その枠内の物体がどのカテゴリ（犬、車など）に属するかのクラス分類を行います。","look":"物体検出","weight":1},{"id":"F-2-023","mode":"fill","src":2,"cat":"物体検出","chapter":"CHAPTER 4","diff":2,"question":"物体検出アルゴリズムのうち、画像の領域提案（候補窓探し）とCNNによる分類を一工程（1ショット）で同時に高速に行い、自動運転や防犯カメラなどのリアルタイム検知システムで広く採用されている代表的モデルを（　　　）という。","answer":"YOLO","key":"YOLO（You Only Look Once）やSSD（Single Shot MultiBox Detector）は、処理速度が非常に高速な「1ステージ型（1ショット型）」の物体検出モデルです。","look":"物体検出","weight":1},{"id":"F-2-024","mode":"fill","src":2,"cat":"自然言語処理","chapter":"CHAPTER 4","diff":1,"question":"自然言語処理において、文章を単語などの意味を持つ最小の文法構成単位である「形態素」へと切り分け、それぞれの品詞や原形などを同定する前処理操作を（　　　）という。","answer":"形態素解析","key":"形態素解析は、日本語のような単語間にスペース（空白）がない「分かち書き」を必要とする言語における極めて重要な最初の言語処理ステップです。","look":"自然言語処理","weight":1},{"id":"F-2-025","mode":"fill","src":2,"cat":"自然言語処理","chapter":"CHAPTER 4","diff":2,"question":"文章のベクトル化手法において、単語の出現順序や並び（文脈）を一切考慮せず、文章全体に含まれる単語を袋に詰め込んだように扱い、各単語の出現回数（頻度）のみを並べた表現形式を（　　　）という。","answer":"Bag-of-Words","key":"Bag-of-Words（BoW、バッグオブワーズ）は、テキストデータを単語ごとの「出現頻度カウントベクトル」に変換する、非常にシンプルで実用性の高い古典的なテキスト表現アプローチです。","look":"自然言語処理","weight":1},{"id":"F-2-026","mode":"fill","src":2,"cat":"Word2Vec","chapter":"CHAPTER 4","diff":2,"question":"Word2Vec（単語のベクトル表現化技術）のうち、「ある注目単語」を入力して、その単語の周囲に配置される確率が高い「周辺単語（コンテキスト）」を予測するようにニューラルネットワークを学習するアプローチを（　　　）という。","answer":"Skip-gram","key":"Word2Vecには、周辺の単語から中央の単語を予測する「CBOW（シーボウ）」と、中央の単語から周辺の複数の単語を予測する「Skip-gram（スキップグラム）」の2種類の学習アルゴリズムがあります。","look":"Word2Vec","weight":1},{"id":"F-2-027","mode":"fill","src":2,"cat":"Transformer","chapter":"CHAPTER 4","diff":2,"question":"RNNやCNNのような順序に基づく再帰・畳み込み処理を一切持たず、入力系列内のすべての単語間の関係性を並列計算する「自己注目機構（Self-Attention）」を完全にメインに据えて構築された現代のLLMの基盤となるモデルを（　　　）という。","answer":"Transformer","key":"Transformerは、並列学習が極めて困難だった時系列RNNの問題を、単語同士の関係度合いを一挙に並列で計算可能なSelf-Attentionだけで構成することで克服した、極めて強力なニューラルアーキテクチャです。","look":"Transformer","weight":1},{"id":"F-2-028","mode":"fill","src":2,"cat":"BERT","chapter":"CHAPTER 4","diff":2,"question":"Transformerのエンコーダ層を利用し、文章の中のランダムな一部を隠す「マスク言語モデル（Masked Language Model）」等のタスクを用いて、文脈を左右双方向から学習する画期的な事前学習モデルを（　　　）という。","answer":"BERT","key":"BERT（バート）は、Googleが開発した事前学習済みモデルで、穴埋め問題のように前後の双方向の文脈から特徴を把握できるため、文章分類や要約などの各種下流タスクで非常に高い汎用精度を誇りました。","look":"BERT","weight":1},{"id":"F-2-029","mode":"fill","src":2,"cat":"GPT","chapter":"CHAPTER 4","diff":2,"question":"Transformerのデコーダ層をベースにし、膨大なテキストデータから「手前の文章を入力にして、その次に続く単語を最も自然に予測する（自己回帰的な事前学習）」を極限まで大規模化した生成AIモデルを（　　　）という。","answer":"GPT","key":"GPT（Generative Pre-trained Transformer）は、単一方向の言語モデリング（次の単語予測）を繰り返すことで、極めて自然で論理的な文章生成を可能にしたモデルです。","look":"GPT","weight":1},{"id":"F-2-030","mode":"fill","src":2,"cat":"説明可能性","chapter":"CHAPTER 4","diff":3,"question":"深層学習のブラックボックス問題を解決するため、分析したい特定の入力サンプルの「局所的（ローカル）な周辺」における挙動を、解釈しやすい単純な決定木や線形モデルで近似的に説明する手法を（　　　）という。","answer":"LIME","key":"LIME（Local Interpretable Model-agnostic Explanations）は、モデルの種類を問わない「Model-agnostic」な局所的解釈（Local Explanation）の代表的手法です。","look":"説明可能性","weight":1},{"id":"F-2-031","mode":"fill","src":2,"cat":"説明可能性","chapter":"CHAPTER 4","diff":3,"question":"CNN画像モデルにおいて、モデルが画像のどこを見て予測を判断したのかを、最後の「畳み込み層の勾配」を重みとして特徴マップを加重平均することで、注目領域を色付けしたヒートマップとして出力する手法を（　　　）という。","answer":"Grad-CAM","key":"Grad-CAM（Grad-Based Class Activation Mapping）は、予測確率の勾配（Grad）を逆伝播させてCNNの最後の畳み込み層で得られた空間特徴量を重み付けすることで、判断根拠を可視化する技術です。","look":"説明可能性","weight":1},{"id":"F-2-032","mode":"fill","src":2,"cat":"深層強化学習","chapter":"CHAPTER 4","diff":2,"question":"強化学習の「Q学習」において、取りうる状態空間が広大でQテーブルによる全パターンの保持が困難な場合、ニューラルネットワークを入力とし、出力層を各行動に対する「行動価値（Q値）の近似関数」とするモデルを（　　　）という。","answer":"DQN","key":"DQN（Deep Q-Network）は、DeepMind社によって開発され、画面のピクセル（状態）を入力してゲーム（Atariなど）の行動を自律学習させ、人間以上の腕前を達成した、深層強化学習の先駆けです。","look":"深層強化学習","weight":1},{"id":"F-2-033","mode":"fill","src":2,"cat":"DQNの拡張","chapter":"CHAPTER 4","diff":3,"question":"DQNにおいて、直近のエピソード履歴（遷移情報）を繰り返しリプレイバッファと呼ばれるメモリに保存し、そこからランダムに状態・行動等のサンプルを取り出して学習（時系列データ間の相関を断ち切る）に用いる手法を（　　　）という。","answer":"Experience Replay","key":"Experience Replay（経験再生）は、エージェントの連続した経験（時系列データ）が時間的に高い相関を持つことを防ぎ、独立同一分布（i.i.d.）に近づけることで、ディープニューラルネットの学習の崩壊を防ぐ極めて重要で基本的な工夫です。","look":"DQNの拡張","weight":1},{"id":"F-2-034","mode":"fill","src":2,"cat":"強化学習アルゴリズム","chapter":"CHAPTER 4","diff":2,"question":"強化学習において、価値関数に基づいてどのような行動をとるかの方策パラメータを確率的に決定・更新する「行動選択器（Actor）」と、その行動による将来期待報酬（価値関数）を推定して評価する「価値評価器（Critic）」を並行学習させる枠組みを（　　　）という。","answer":"Actor-Critic","key":"Actor-Criticは、確率的に方策を更新する「方策ベース（Actor）」と、時間差（TD）誤差等を利用してその状況を評価する「価値ベース（Critic）」の、価値＋方策のハイブリッド構成モデルです。","look":"強化学習アルゴリズム","weight":1},{"id":"F-2-035","mode":"fill","src":2,"cat":"強化学習応用","chapter":"CHAPTER 4","diff":2,"question":"生成モデル（ChatGPTなど）の出力を、単なる損失最小化ではなく人間の望ましい評価に近づけるため、人間の嗜好を学習した報酬モデルを頼りに、方策勾配法によって追加のチューニングを施すプロセスを（　　　）という。","answer":"RLHF","key":"RLHF（人間からのフィードバックによる強化学習、Reinforcement Learning from Human Feedback）は、AI出力が不適切だったり有害だったりするのを防ぎ、人間に親和的な振る舞い（アライメント）に調整する強力な最新技術です。","look":"強化学習応用","weight":1},{"id":"F-3-001","mode":"fill","src":3,"cat":"契約種別","chapter":"CHAPTER 5","diff":2,"question":"AIプロジェクトの企画立案やPoC（概念実証）フェーズで用いられ、特定の事務（開発会社の高度なスキルや調査）を誠実に遂行することを目的とし、開発会社側には「完成されたシステムの保証義務（瑕疵担保等）」が発生しない契約を（　　　）契約という。","answer":"準委任","key":"準委任契約では、受託者は「善良なる管理者の注意義務（善管注意義務）」をもって誠実に業務を実施する責任はありますが、特定のシステムの「完成」や「絶対的な性能（精度〇〇％）」を保証する法的義務は負いません。","look":"契約種別","weight":1},{"id":"F-3-002","mode":"fill","src":3,"cat":"契約種別","chapter":"CHAPTER 5","diff":2,"question":"システム開発において、発注者が求める特定の機能を満たした成果物を期限内に「完成・納品すること」を約束し、その対価として報酬を支払う、主に実稼働（開発・テスト）フェーズに適した契約を（　　　）契約という。","answer":"請負","key":"請負契約は、仕事の「完成（納品）」に対して対価が発生する契約です。瑕疵担保責任（契約不適合責任）が発生するため、仕様が曖昧なAI開発の初期段階で請負契約を結ぶとトラブルになりやすいです。","look":"契約種別","weight":1},{"id":"F-3-003","mode":"fill","src":3,"cat":"NDA","chapter":"CHAPTER 5","diff":1,"question":"AIプロジェクトを開始し、自社の持つ秘匿データ（学習用の画像や売上リストなど）を外部の開発パートナーに提供する際、事前の情報漏洩や無断転用を防止するために取り交わす秘密保持契約をアルファベットで（　　　）という。","answer":"NDA","key":"NDA（Non-Disclosure Agreement）は「秘密保持契約」であり、AIプロジェクトにおいて他社に極秘の学習データや技術情報を開示する前に必須となる契約です。","look":"NDA","weight":1},{"id":"F-3-004","mode":"fill","src":3,"cat":"PoC","chapter":"CHAPTER 5","diff":2,"question":"AIシステム構築において、膨大な予算をかけた本格開発に入る前に、実際のデータを少量試用して「このAIモデルで実用に耐えうる予測精度や課題解決が理論的に可能か」を事前検証する概念実証を、アルファベットで（　　　）という。","answer":"PoC","key":"PoC（Proof of Concept）は「概念実証」です。不確実性の高い機械学習プロジェクトにおいて、本番導入前に仮説やアルゴリズムの実現可能性（技術的フィージビリティ）を見極めるための重要な開発フェーズです。","look":"PoC","weight":1},{"id":"F-3-005","mode":"fill","src":3,"cat":"開発モデル","chapter":"CHAPTER 5","diff":1,"question":"要件定義、基本設計、詳細設計、プログラミング、テストという各開発工程を、完全に後戻りしない前提で上流から下流へと厳密に一方通行で進めていく古典的な開発モデルを（　　　）モデルという。","answer":"ウォーターフォール","key":"ウォーターフォールモデルは、仕様がガチガチに決まって変化しにくい従来型システム開発には適していますが、モデルの試行錯誤やデータの変動によって開発中に仕様調整を繰り返すAI・機械学習開発には不向きな側面があります。","look":"開発モデル","weight":1},{"id":"F-3-006","mode":"fill","src":3,"cat":"開発モデル","chapter":"CHAPTER 5","diff":1,"question":"数週間程度の短い「スプリント（反復）」という開発期間を設定し、その短いサイクル内で小さく設計・実装・検証を回しながら、徐々に仕様を追加・変更していくアプローチを（　　　）という。","answer":"アジャイル開発","key":"アジャイル開発は、変化に対応しやすいプロセスであり、試行錯誤やフィードバックを繰り返すAI開発、特にPoCやモデルチューニングフェーズに高い適性を持ちます。","look":"開発モデル","weight":1},{"id":"F-3-007","mode":"fill","src":3,"cat":"ビッグデータ","chapter":"CHAPTER 5","diff":2,"question":"ビッグデータの特徴を示す3つの「V」とは、Volume（データ量）、Velocity（リアルタイム性・更新速度）、および多様なデータ形式を内包することを表す（　　　）である。","answer":"Variety","key":"Variety（多種多様性）とは、テキスト、画像、音声、センサーログなどの、リレーショナルデータベース（RDB）に単純に格納できない「非構造化データ」を多く含む特徴を指します。","look":"ビッグデータ","weight":1},{"id":"F-3-008","mode":"fill","src":3,"cat":"RPA","chapter":"CHAPTER 5","diff":1,"question":"PC画面上のキーボード入力やクリック、ファイルの転記といった「単純な定型業務」のソフトウェア・インターフェース操作を自動化し、ホワイトカラー事務を効率化する仕組みを（　　　）という。","answer":"RPA","key":"RPA（Robotic Process Automation）は、ルールが決まりきった定型作業を高速化するロボット自動化技術です。最近ではこれにAIを組み合わせた高度化（インテリジェントRPA）が進んでいます。","look":"RPA","weight":1},{"id":"F-3-009","mode":"fill","src":3,"cat":"クラウドモデル","chapter":"CHAPTER 5","diff":2,"question":"クラウドサービスにおいて、OS、データベース、ミドルウェアなど「アプリケーションが稼働するためのプラットフォーム（動作・実行環境）」を、ユーザーが直接管理せずにネットワーク経由で利用する提供形態を（　　　）という。","answer":"PaaS","key":"PaaS（Platform as a Service）は、アプリ開発者に対してOSやランタイム（例：Google App EngineやHerokuなど）を提供し、インフラ構築の手間を省く形態です。","look":"クラウドモデル","weight":1},{"id":"F-3-010","mode":"fill","src":3,"cat":"クラウドモデル","chapter":"CHAPTER 5","diff":2,"question":"クラウドサービスにおいて、仮想化された物理的なインフラ（CPUコア、ストレージ、ネットワーク仮想化）そのものを直接レンタルして利用できる形態（例：AWS EC2など）を（　　　）という。","answer":"IaaS","key":"IaaS（Infrastructure as a Service）は、最もローレベルな（自由度の高い）クラウド形態で、インフラのサーバーリソースそのもの（仮想マシンなど）を直接レンタルしてユーザー自身がOSから設定できるサービスです。","look":"クラウドモデル","weight":1},{"id":"F-3-011","mode":"fill","src":3,"cat":"MLOps","chapter":"CHAPTER 5","diff":2,"question":"機械学習システムの開発（Development）と本番運用（Operations）を効率よく統合し、データの不一致（コンセプトドリフト）などの性能低下を監視しながら、自動的にモデルの再学習やデプロイを実行する枠組みを（　　　）という。","answer":"MLOps","key":"MLOps（Machine Learning Operations）は、ソフトウェア工学のDevOpsを機械学習システム向けに拡張したもので、リリース後の精度劣化を素早くキャッチし、自動再学習などでシステム価値を維持する体制を指します。","look":"MLOps","weight":1},{"id":"F-3-012","mode":"fill","src":3,"cat":"エッジAI","chapter":"CHAPTER 5","diff":2,"question":"AIモデルをクラウド上のサーバーに配置するのではなく、ユーザーの手元にあるスマートフォンやカメラデバイス、ロボットの末端チップ（端末そのもの）にデプロイして、超低遅延で推論処理を行う仕組みを（　　　）という。","answer":"エッジAI","key":"エッジAIは、ネットワークを介さずにデバイス自身で処理を即時完結（ローカル推論）させるため、遅延（レイテンシ）を徹底的に削減でき、機密情報が通信中に漏えいするリスクも減らせる利点があります。","look":"エッジAI","weight":1},{"id":"F-3-013","mode":"fill","src":3,"cat":"CRISP-DM","chapter":"CHAPTER 5","diff":2,"question":"データマイニングやAI適用プロジェクトにおいて、ビジネスの理解からスタートし、データの理解、データの準備、モデリング、評価、展開という6つのステップでプロジェクトを進める業界標準モデルを（　　　）という。","answer":"CRISP-DM","key":"CRISP-DM（クリスプディーエム）は、データ分析をどのようにビジネス上の目標（KPI）に組み込み、継続評価するかを定義した業界共通のプロセスライフサイクルモデルです。","look":"CRISP-DM","weight":1},{"id":"F-3-014","mode":"fill","src":3,"cat":"API","chapter":"CHAPTER 5","diff":2,"question":"自社で構築したAIモデルやシステム機能を、他社のシステムや外部ウェブサイト等から簡単な接続コードで直接呼び出して呼び出せるように公開する「インターフェース」の仕様を（　　　）という。","answer":"API","key":"API（Application Programming Interface）は、ソフトウェア同士を相互につないで機能の一部を外部利用可能にする窓口であり、これを利用して各種AI機能のサービス連携が行われます。","look":"API","weight":1},{"id":"F-3-015","mode":"fill","src":3,"cat":"Docker","chapter":"CHAPTER 5","diff":2,"question":"ホストOS上でプロセスを完全に隔離することで、極めて軽量かつ、本番環境と同一パッケージのライブラリやモデル環境を容易に持ち運べるようにした「コンテナ型仮想化ソフトウェア」の代表的プラットフォームを（　　　）という。","answer":"Docker","key":"Docker（ドッカー）は、環境依存を排除する「コンテナ」技術の代名詞で、機械学習モデルの複雑なフレームワーク環境を容易に複製・配信するために不可欠な開発技術です。","look":"Docker","weight":1},{"id":"F-3-016","mode":"fill","src":3,"cat":"個人情報保護法","chapter":"CHAPTER 6","diff":2,"question":"個人情報保護法において、他のデータと照合しない限り特定の個人を識別できないように加工したデータ（社内分析目的で、特定の個人特定を困難にしたデータ）を（　　　）という。","answer":"仮名加工情報","key":"仮名加工情報は、「氏名をID番号に置き換える」などして他の対照表がないと個人を特定できなくした情報です。社内でのAI開発やデータ分析を活発化させる目的で作成・利用が認められました。","look":"個人情報保護法","weight":1},{"id":"F-3-017","mode":"fill","src":3,"cat":"個人情報保護法","chapter":"CHAPTER 6","diff":2,"question":"個人情報保護法において、如何なる手法を用いても特定の個人を一切識別・復元できないように厳格に加工されたデータであり、一定ルールの下で本人の許諾なく第三者提供まで可能になるものを（　　　）という。","answer":"匿名加工情報","key":"匿名加工情報は、住所の「町名以下の削除」や、年齢の「〇〇代への粗粒化」を施し、別のデータベースと突き合わせても一切個人に戻せない（完全に匿名化された）情報であり、ビッグデータ利活用で広く流通させることができます。","look":"個人情報保護法","weight":1},{"id":"F-3-018","mode":"fill","src":3,"cat":"個人情報保護法","chapter":"CHAPTER 6","diff":2,"question":"個人情報のうち、本人の人種、信条、社会的身分、病歴、犯罪履歴、あるいは身体障害等、不当な差別や偏見を招く可能性が極めて高く、その取得や取扱いに事前の明確な本人の合意や配慮を要する性質の情報を（　　　）という。","answer":"要配慮個人情報","key":"要配慮個人情報は、本人の同意なしに無断取得してはならないなど、通常の個人情報以上に厳重な保護措置が義務付けられています。","look":"個人情報保護法","weight":1},{"id":"F-3-019","mode":"fill","src":3,"cat":"カメラ画像利活用ガイドブック","chapter":"CHAPTER 6","diff":2,"question":"街頭や商業施設等の防犯カメラから得られる画像を、動線分析や防犯目的で利活用する際の倫理・プライバシー指針を整理した、総務省・経産省らによるガイドラインを（　　　）という。","answer":"カメラ画像利活用ガイドブック","key":"カメラ画像利活用ガイドブックは、防犯カメラ等から得られる画像データ（個人情報を含む場合がある）を、商業目的や分析等で倫理的・適法に扱う際の手続きをまとめた実務指針です。","look":"カメラ画像利活用ガイドブック","weight":1},{"id":"F-3-020","mode":"fill","src":3,"cat":"著作権法第30条の4","chapter":"CHAPTER 6","diff":2,"question":"日本の著作権法において、他人の著作物であっても、「著作物に表現された思想・感情の享受を目的としない情報解析（AIモデルの追加学習など）」を目的とする限り、許諾なくデータとして利用できるとしたのは、第（　　　）条の4である。","answer":"30","key":"日本の著作権法第30条の4は、AI先進国と言われる所以の極めて重要な権利制限規定であり、AIモデルに機械的に読み取らせるだけの学習フェーズであれば、著作権者の経済的・道徳的利益を不当に害さない範囲内で、無断利用を認めています。","look":"著作権法第30条の4","weight":1},{"id":"F-3-021","mode":"fill","src":3,"cat":"著作権の存続期間","chapter":"CHAPTER 6","diff":2,"question":"日本において、個人の著作権が存続する期間は、一部の例外を除き、原則としてその著作者の死後（　　　）年が経過するまでである。","answer":"70","key":"著作権の保護期間（個人の場合）は、以前は「死後50年」でしたが、著作権法の改正等により現在は「死後70年」へと延長されています（法人著作の場合は公表後70年）。","look":"著作権の存続期間","weight":1},{"id":"F-3-022","mode":"fill","src":3,"cat":"職務著作","chapter":"CHAPTER 6","diff":2,"question":"会社の従業員が、会社の指示（職務）の範囲内で開発したプログラムなどの著作物は、一定の要件を満たし別段の定めがない限り、（　　　）が著作者（権利保有者）となる。","answer":"法人","key":"これを「職務著作（法人著作）」と呼び、従業員が会社の業務時間内に会社のパソコン等で開発したソフトウェア等の著作権は、個人のプログラマではなく最初から法人（会社）に原始的に帰属します。","look":"職務著作","weight":1},{"id":"F-3-023","mode":"fill","src":3,"cat":"特許権の有効期間","chapter":"CHAPTER 6","diff":2,"question":"特許出願を行い、審査を通過して登録された特許権の存続期間は、原則として「特許出願の日」から起算して最大（　　　）年間である。","answer":"20","key":"特許権は「特許出願の日」から20年間存続します（一部特例あり）。出願後、公開を伴い独占権を得られます。","look":"特許権の有効期間","weight":1},{"id":"F-3-024","mode":"fill","src":3,"cat":"特許制度","chapter":"CHAPTER 6","diff":2,"question":"日本の特許制度において、同一の発明について複数の異なる人物・企業が出願した場合、最も早くその発明を「完成」させた人物ではなく、最も早く「国（特許庁）に出願を完了した人」に特許を認める原則を（　　　）という。","answer":"先願主義","key":"日本は「先願主義」を採用しており、どれほど前に密かに発明を成功させていても、先に他社に特許出願手続きをされてしまえば、先に公開・手続きした側に特許権が付与されます。","look":"特許制度","weight":1},{"id":"F-3-025","mode":"fill","src":3,"cat":"営業秘密","chapter":"CHAPTER 6","diff":2,"question":"不正競争防止法において保護される企業情報であり、秘密として厳重に管理（アクセス権制限等）され、有用な技術・営業情報であり、かつ一般に知られていないもののことを（　　　）という。","answer":"営業秘密","key":"営業秘密と認められるためには、不正競争防止法に定める3つの要件（秘密管理性、有用性、非公知性）を全てクリアしている必要があります。","look":"営業秘密","weight":1},{"id":"F-3-026","mode":"fill","src":3,"cat":"営業秘密要件","chapter":"CHAPTER 6","diff":2,"question":"不正競争防止法に定める営業秘密の3つの定義要件とは、「有用性」「非公知性」、およびパスワード保護や鍵付きキャビネット等で厳重に扱われていることを示す「（　　　）性」である。","answer":"秘密管理","key":"秘密管理性（ひみつかんりせい）は、パスワード制限、アクセス制限、あるいは秘密である旨の表示（部外秘）などが施され、客観的に「秘密データとして区別されて管理されている」実態を要求します。","look":"営業秘密要件","weight":1},{"id":"F-3-027","mode":"fill","src":3,"cat":"限定提供データ","chapter":"CHAPTER 6","diff":3,"question":"平成30年の不正競争防止法改正で新設された、「営業秘密」とは言えないものの、特定の顧客等に有償・無償等で提供され、パスワード等で管理されている有用な情報（自動運転用の地図データなど）の区分を（　　　）という。","answer":"限定提供データ","key":"限定提供データは、営業秘密の「非公知性（一般に一切出回っていない）」を満たさず、特定多数のユーザー間でシェア・取引される有用なデジタルデータセット（気象ログ、車の走行履歴等）を不正な割り込み取得等から保護するために作られた新区分です。","look":"限定提供データ","weight":1},{"id":"F-3-028","mode":"fill","src":3,"cat":"データ汚染","chapter":"CHAPTER 6","diff":2,"question":"AIセキュリティにおいて、攻撃者が学習前のモデルの訓練データに「意図的にラベルを誤判定させるような不正なノイズデータ」を混入させることで、完成されるモデルの予測挙動を狂わせる攻撃を（　　　）という。","answer":"データ汚染","key":"データ汚染（ポイズニング攻撃）は、学習フェーズを狙った攻撃で、モデルが特定のトリガーを誤認識して誤検知を起こすように仕組む、極めて防ぐことが難しいサイバー攻撃です。","look":"データ汚染","weight":1},{"id":"F-3-029","mode":"fill","src":3,"cat":"GDPR","chapter":"CHAPTER 6","diff":1,"question":"欧州（EU）において2018年より適用が始まり、EU内に住む個人のデータ保護に関して世界で最も厳格な規制を課し、違反者に対して全世界年間売上の数％におよぶ超巨額の制裁金を課す規則を、アルファベットで（　　　）という。","answer":"GDPR","key":"GDPR（General Data Protection Regulation：一般データ保護規則）は、日本企業であってもEU内に事業所を置いたり、EU居住者のWeb行動データを収集したりする場合に適用されるため、国際企業にとって死活問題となりました。","look":"GDPR","weight":1},{"id":"F-3-030","mode":"fill","src":3,"cat":"GDPRの権利","chapter":"CHAPTER 6","diff":2,"question":"GDPRにおいて認められている、顧客が「あるサービスに預けていた自分の全ての個人履歴データ」を、機械可読な構造化形式（CSV等）で取り出し、別の競合サービスへと無償かつ容易に移転させる権利を（　　　）という。","answer":"データポータビリティ権","key":"データポータビリティ権は、GAFAなどのプラットフォーマーに個人データが囲い込まれて独占されるのを防ぎ、ユーザー主導でデータの所有権（持ち運び）を認めて競争を促進する目的で設計された権利です。","look":"GDPRの権利","weight":1},{"id":"F-3-031","mode":"fill","src":3,"cat":"十分性認定","chapter":"CHAPTER 6","diff":2,"question":"欧州委員会が、第三国（日本など）について「GDPRと同等以上の適切な個人データ保護水準を満たしている」と公式に承認する仕組みを（　　　）という。","answer":"十分性認定","key":"十分性認定（じゅうぶんせいにんてい）を得ることで、日本企業はEU域内から個人のデータを日本国内へ、複雑な個別承認なしで比較的容易に移転・持ち帰ることができるようになります。","look":"十分性認定","weight":1},{"id":"F-3-032","mode":"fill","src":3,"cat":"EU AI規制法","chapter":"CHAPTER 6","diff":2,"question":"欧州連合（EU）で採択された世界初の網羅的なAI規制法（AI Act）において、AIを危険度に応じて「禁止」「高リスク」「低リスク」などに区分し、それぞれの区分に義務やペナルティを設定する考え方を（　　　）アプローチという。","answer":"リスクベース","key":"リスクベースアプローチにより、EU AI規制法では例えば「就職採用スクリーニングや医療診断用のAI」は高リスクに分類されて事前適合性評価が厳しく義務付けられますが、危険の極めて低い一般的なお勧めアルゴリズム等は簡単な透明性要件だけで済みます。","look":"EU AI規制法","weight":1},{"id":"F-3-033","mode":"fill","src":3,"cat":"ELSI","chapter":"CHAPTER 6","diff":2,"question":"新しいAI技術やバイオテクノロジーなどの最先端の科学技術が、社会一般に実装・浸透する際に直面する「倫理的、法的、および社会的課題」の総称をアルファベット4文字で（　　　）という。","answer":"ELSI","key":"ELSI（エルシー：Ethical, Legal and Social Issues）は、新技術の開発が暴走したり社会倫理に反したりしないよう、開発初期から法律家や社会科学者らを巻き込んで総合的に検討する学問・技術設計思想です。","look":"ELSI","weight":1},{"id":"F-3-034","mode":"fill","src":3,"cat":"LAWS","chapter":"CHAPTER 6","diff":2,"question":"人間の意志や自律的確認を一切介することなく、AIセンサーが対象の探索から追跡、そして「殺傷・攻撃の実行」までを完全自動で自律的かつ意思的に決定する兵器システムの略称を、アルファベット4文字で（　　　）という。","answer":"LAWS","key":"LAWS（Lethal Autonomous Weapons Systems：自律型致死兵器システム）は、ジュネーブ軍縮会議等において人道・倫理的観点から完全な開発禁止や国際ルールでの規制が非常に活発に検討されている対象です。","look":"LAWS","weight":1},{"id":"F-3-035","mode":"fill","src":3,"cat":"Society 5.0","chapter":"CHAPTER 6","diff":1,"question":"日本政府が目指すべき未来社会として提唱したもので、狩猟、農耕、工業、情報社会に続く「サイバー空間（仮想空間）とフィジカル空間（現実空間）を高度に融合した」超スマート社会の構想コンセプトを（　　　）という。","answer":"Society 5.0","key":"Society 5.0（ソサエティ5.0）は、IoTセンサーを通じてフィジカル空間のビッグデータをサイバー空間のAIに送り、その解析・最適結果を自動運転やロボット等でフィジカル社会にフィードバックする未来の社会像です。","look":"Society 5.0","weight":1},{"id":"C-1-001","mode":"ident","src":1,"cat":"強いAI vs 弱いAI","chapter":"CHAPTER 1","diff":1,"question":"ジョン・サールが提唱した、人間の心と同じような『自律性』や『自意識』、人間と同等の多様な活動能力を有する人工知能の定義はどれか。","answer":"強いAI（汎用型AI）","choices":["強いAI（汎用型AI）","弱いAI（特異型AI）","スーパーインテリジェンス"],"key":"人間の心や自意識を持つ自律した知能を「強いAI」と呼び、特定の限定された専門的処理を行うAIを「弱いAI」と呼びます。","look":"強いAI vs 弱いAI","weight":1},{"id":"C-1-002","mode":"ident","src":1,"cat":"is-a vs part-of","chapter":"CHAPTER 1","diff":2,"question":"意味ネットワークにおいて、『バナナ ──> 果物』のように、下位の具体的な概念が、上位の抽象的なカテゴリに属し、その属性を引き継ぐことを表す関係性はどれか。","answer":"is-a関係","choices":["is-a関係","part-of関係","has-a関係"],"key":"「バナナは果物の一種である（is a fruit）」のような包摂・所属関係をis-a関係と呼びます。一方で、「タイヤは車の一部である」のような部分・全体関係はpart-of関係で表現されます。","look":"is-a vs part-of","weight":1},{"id":"C-1-003","mode":"ident","src":1,"cat":"ヘビーウェイト vs ライトウェイト","chapter":"CHAPTER 1","diff":3,"question":"オントロジーのうち、哲学的な整合性や意味解釈を追求し、人間自身が概念間の関係性を厳密かつ完璧に設計・定義しようとするアプローチはどれか。","answer":"ヘビーウェイトオントロジー","choices":["ヘビーウェイトオントロジー","ライトウェイトオントロジー","オントロジー・エンジニアリング"],"key":"哲学的厳密性を極めて精緻に記述・設計する構築方法を「ヘビーウェイトオントロジー」と呼びます。一方、実用性重視で、統計的手法や検索エンジンの関係を緩くつなげるものは「ライトウェイトオントロジー」です。","look":"ヘビーウェイト vs ライトウェイト","weight":1},{"id":"C-1-004","mode":"ident","src":1,"cat":"幅優先探索 vs 深さ優先探索","chapter":"CHAPTER 1","diff":2,"question":"探索木において、目標までの『最短手数のルート（最短パス）』で必ずゴールに到達することを保証できるものの、分岐数が多い場合にすべての状態をメモリに格納するため、メモリ消費量が極めて大きくなる探索手法はどちらか。","answer":"幅優先探索","choices":["幅優先探索","深さ優先探索"],"key":"幅優先探索は、スタートノードに近いところから全ての選択肢を網羅するため、最短の手数（最短ルート）でのゴールが必ず見つかるものの、一時的な状態（ノード情報）を全て保持するため、メモリ消費が急増してパンクしやすいデメリットがあります。","look":"幅優先探索 vs 深さ優先探索","weight":1},{"id":"C-1-005","mode":"ident","src":1,"cat":"トイ・プロブレム vs フレーム問題","chapter":"CHAPTER 1","diff":2,"question":"チェスや迷路のような『明確にルールが定義されたトイ・プロブレム』は解けるが、不確実で例外だらけの実社会の複雑な問題になると、AIは計算不能に陥る、という第1次AIブームの限界を特徴づける言葉はどれか。","answer":"トイ・プロブレムの限界","choices":["トイ・プロブレムの限界","フレーム問題","シンボルグラウンディング問題"],"key":"チェスや迷路のようにルールが完全に定義された問題は「トイ・プロブレム」と呼ばれ、AI初期の探索推論で解決できましたが、実社会の「トイ・プロブレムではない」問題には一切太刀打ちできなかったことを、第1次AIブームの限界（トイプロブレムの壁）と呼びます。","look":"トイ・プロブレム vs フレーム問題","weight":1},{"id":"C-1-006","mode":"ident","src":1,"cat":"フレーム問題 vs シンボルグラウンディング問題","chapter":"CHAPTER 1","diff":2,"question":"AIが現実世界の爆弾撤去などの課題を実行する際、自分にとって『無関係な無限の事象』を切り捨てることができず、思考を処理するための時間が無限に浪費されるという思考停止問題を何と呼ぶか。","answer":"フレーム問題","choices":["フレーム問題","シンボル・グラウンディング問題","モラベックのパラドックス"],"key":"ある行動をするにあたって「周囲にどのような影響が生じるか」を関係のある領域（フレーム）に収められず、関係のない事象まで無限に計算してしまう人工知能の致命的な壁が「フレーム問題」です。","look":"フレーム問題 vs シンボルグラウンディング問題","weight":1},{"id":"C-1-007","mode":"ident","src":1,"cat":"機械学習の分類","chapter":"CHAPTER 2","diff":1,"question":"『あらかじめ準備された膨大な教師データ（正解ラベル）から関係性・予測関数を構築し、新しい未知のデータが入力された際に自動判定を行う』学習形態はどれか。","answer":"教師あり学習","choices":["教師あり学習","教師なし学習","強化学習"],"key":"正解（ラベル）が存在し、モデルの予測と教師の正解との間の「誤差」を埋めるように学習する形態を「教師あり学習」と呼びます。","look":"機械学習の分類","weight":1},{"id":"C-1-008","mode":"ident","src":1,"cat":"分類 vs 回帰","chapter":"CHAPTER 2","diff":1,"question":"教師あり学習のうち、入力データから『来客数の実数値予測』や『物件の賃料の価格（連続値）』を算出・予測するタスクはどちらか。","answer":"回帰","choices":["回帰","分類"],"key":"出力する予測が、カテゴリー（例：スパムか否か、手書き文字「A」か「B」か）を離散的に選ぶものを「分類（Classification）」、連続する数値を予測するものを「回帰（Regression）」と言います。","look":"分類 vs 回帰","weight":1},{"id":"C-1-009","mode":"ident","src":1,"cat":"Lasso vs Ridge","chapter":"CHAPTER 2","diff":2,"question":"重みペナルティ（正則化項）として絶対値の和（L1ペナルティ）を用い、モデルに不要な特徴量のパラメータを完全に『0』にすることで、特徴量選択（スパース化）を自律的に実現する正則化手法はどちらか。","answer":"Lasso（L1正則化）","choices":["Lasso（L1正則化）","Ridge（L2正則化）"],"key":"Lasso（ラッソ）は絶対値の和をペナルティ項とするため、重要性の低い変数の重みを完全にゼロにするスパース性を持ち、不要な変数を除去できます。一方、Ridge（リッジ）は二乗和ペナルティであり、パラメータを小さくしますが完全に0にはしません。","look":"Lasso vs Ridge","weight":1},{"id":"C-1-010","mode":"ident","src":1,"cat":"Bagging vs Boosting","chapter":"CHAPTER 2","diff":2,"question":"アンサンブル学習において、元のデータから重複を許したランダムな「ブートストラップサンプリング」を並行して複数作成し、複数の異なるモデル（決定木など）を『並列』に同時に学習させて最終意思決定を多数決（または平均）で決める学習方式はどれか。","answer":"バギング（Bagging）","choices":["バギング（Bagging）","ブースティング（Boosting）"],"key":"並列にサンプリングして個別に学習させるのが「バギング（Bagging）」で、代表例はランダムフォレストです。一方、1つずつモデルを直列に繋ぎ、前モデルの「間違い」を重み付けして順番に学習を進めるのが「ブースティング（Boosting）」です。","look":"Bagging vs Boosting","weight":1},{"id":"C-1-011","mode":"ident","src":1,"cat":"SVM vs カーネル法","chapter":"CHAPTER 2","diff":2,"question":"サポートベクトルマシン（SVM）において、元の二次元や三次元データ平面上では直線（または平面）で境界を引いて二分類できない複雑なデータ（線形分離不可能なデータ）を、高次元空間へ非線形写像することで線形分類可能にする数学的テクニックを何と呼ぶか。","answer":"カーネルトリック（カーネル法）","choices":["カーネルトリック（カーネル法）","マージン最大化","サポートベクトル最適化"],"key":"線形分離不可能な複雑なデータを、高次元に数式で写像することで決定超平面による二分割を可能にする手法を「カーネルトリック（カーネル法）」と呼びます。","look":"SVM vs カーネル法","weight":1},{"id":"C-1-012","mode":"ident","src":1,"cat":"k-means vs Ward法","chapter":"CHAPTER 2","diff":2,"question":"クラスタリングにおいて、あらかじめ指定した「K個の代表位置（重心）」を各データの平均位置へと更新を繰り返すことで、階層関係を作らずに平面状にグループを切り分ける非階層的手法はどちらか。","answer":"k-means（K平均法）","choices":["k-means（K平均法）","Ward法（ウォード法）"],"key":"重心（平均）の更新を反復して事前に設定したK個のグループに分ける非階層型クラスタリングが「k-means」です。一方、データの分散（平方和）の増加を最小化するように結合して「樹状図」を描く階層型の手法は「Ward法」です。","look":"k-means vs Ward法","weight":1},{"id":"C-1-013","mode":"ident","src":1,"cat":"標準化 vs 正規化 vs 白色化","chapter":"CHAPTER 2","diff":2,"question":"データの前処理における変換操作のうち、すべてのデータを一様に「最小値が0、最大値が1になるよう（一定範囲内）」にスケーリングし、外れ値に弱いが値のスケール範囲を統一する手法はどれか。","answer":"正規化","choices":["正規化","標準化","白色化"],"key":"正規化（Min-Maxスケーリング）はデータを0〜1等の一定の範囲に収めます。標準化は「平均0、標準偏差（分散）1」に揃える変換です。白色化はさらに変数同士の相関（共分散）を0に排除します。","look":"標準化 vs 正規化 vs 白色化","weight":1},{"id":"C-1-014","mode":"ident","src":1,"cat":"Precision vs Recall","chapter":"CHAPTER 2","diff":3,"question":"スパムメールの判定システムや不正クレジットカード取引の検知において、『本物の健全なメールを、誤ってスパムと誤認する（無駄な陽性判定・偽陽性）』という間違いを徹底的に減らしたい場合に、最優先で追求すべき指標はどちらか。","answer":"適合率（Precision）","choices":["適合率（Precision）","再現率（Recall）"],"key":"適合率（Precision）は「陽性と予測した中で、本当に本物だった割合」です。偽陽性（誤検出）の代償が大きい場合（健全な重要メールをスパム判定して消去してしまうなど）は、Precisionを高く保つことが最重視されます。","look":"Precision vs Recall","weight":1},{"id":"C-1-015","mode":"ident","src":1,"cat":"ホールドアウト vs 交差検証","chapter":"CHAPTER 2","diff":2,"question":"手元のデータ全体をK個の均等なグループに分割し、そのうちの1グループを精度評価用、残りを学習用に充てるという学習と検証を、評価グループをローテーションさせながらK回繰り返し、その全試行の平均精度をモデルの汎化性能として採用する評価方式はどれか。","answer":"交差検証法（K-分割交差検証）","choices":["交差検証法（K-分割交差検証）","ホールドアウト法","ブートストラップ検証"],"key":"データをK個に分割して役割を入れ替えながらK回評価を回し平均を取るアプローチを「交差検証法（クロスバリデーション）」と呼びます。1度だけ単純分割するホールドアウト法に比べて、計算負荷は高いですがデータ量が少ない場合に評価の偏りを防げます。","look":"ホールドアウト vs 交差検証","weight":1},{"id":"C-2-001","mode":"ident","src":2,"cat":"シグモイド vs ReLU","chapter":"CHAPTER 3","diff":1,"question":"ディープラーニングにおいて、入力値が0以下の領域では勾配（微分値）が一律「0」、0を超える領域では勾配が常に「1」になる非線形特性を持ち、何層も重ねても勾配消失（パラメータが更新できなくなる問題）が発生しにくい標準的な活性化関数はどれか。","answer":"ReLU関数","choices":["ReLU関数","シグモイド関数","Tanh（双曲線正接）関数"],"key":"シグモイドやTanhは出力値が飽和すると勾配が0に近づいてしまいます。ReLUは入力が正のときに傾きが常に一定（1）であるため、ネットワークを極端に深くしても逆伝播される勾配が弱まらず、ディープラーニングの主役となりました。","look":"シグモイド vs ReLU","weight":1},{"id":"C-2-002","mode":"ident","src":2,"cat":"早期終了 vs ドロップアウト","chapter":"CHAPTER 3","diff":2,"question":"ニューラルネットワークの過学習を抑えるため、モデル自体のすべてのウェイトを学習させつつ、エポック（学習回数）ごとに『検証データ（バリデーションデータ）』上の誤差が減少しなくなったタイミングで自律的に学習ループを終了するテクニックはどちらか。","answer":"早期終了（アーリーストッピング）","choices":["早期終了（アーリーストッピング）","ドロップアウト"],"key":"検証データの損失（ロス）を監視し、過学習が始まって検証ロスの減少がストップしたタイミングで学習を打ち切るのが「早期終了」です。ドロップアウトは学習中にノードをランダムに確率選択で間引く正則化技術です。","look":"早期終了 vs ドロップアウト","weight":1},{"id":"C-2-003","mode":"ident","src":2,"cat":"モデル軽量化","chapter":"CHAPTER 3","diff":2,"question":"ディープラーニングモデルをスマホやエッジデバイス上で高速処理・軽量化するため、学習済みパラメータの浮動小数点（通常FP32、32ビット）のデータ精度を、精度損失が少ない範囲でINT8（8ビット整数型）などの低い表現ビット幅に変換する軽量化技術はどれか。","answer":"量子化","choices":["量子化","プルーニング","蒸留"],"key":"モデルのウェイトが保持する数値のビット精度（ビット長）を削って容量や計算負荷を下げる処理を「量子化（Quantization）」と呼びます。不要なウェイト（接続）の線そのものをカットするのは「プルーニング（Pruning）」です。","look":"モデル軽量化","weight":1},{"id":"C-2-004","mode":"ident","src":2,"cat":"LSTM vs GRU","chapter":"CHAPTER 3","diff":2,"question":"時系列RNNモデルにおいて、LSTMに存在するCEC（恒常誤差カルーセル）や3つの個別ゲート（入力、忘却、出力）という複雑な構造を整理し、代わりに『リセットゲート』と『更新ゲート』の2つのシンプルなゲート構造に集約することで、計算処理の軽量化・高速化を達成したモデルはどれか。","answer":"GRU（ゲート付き回帰ユニット）","choices":["GRU（ゲート付き回帰ユニット）","Simple RNN","LSTM"],"key":"GRU（Gated Recurrent Unit）は、LSTMに極めてよく似た高い性能を保ちつつ、ゲートを2つに集約して計算負荷・パラメータ数を約3割削減した非常に使い勝手の良い時系列ニューラルネットです。","look":"LSTM vs GRU","weight":1},{"id":"C-2-005","mode":"ident","src":2,"cat":"パディング vs ストライド","chapter":"CHAPTER 3","diff":2,"question":"畳み込みニューラルネットワーク（CNN）において、フィルタを適用して畳み込みを重ねるたびに画像特徴マップの縦横サイズが少しずつ小さくなっていくのを防止（維持）するため、画像の周囲をダミー値（通常は「0」）で埋める処理を何と呼ぶか。","answer":"パディング","choices":["パディング","ストライド","プーリング"],"key":"画像の端を0等で縁取ることで、元の入力画像サイズと出力される特徴マップのサイズを同じに維持し、画像の端の情報が消失するのを防ぐのが「パディング」です。ストライドはフィルタをスライドさせる歩幅です。","look":"パディング vs ストライド","weight":1},{"id":"C-2-006","mode":"ident","src":2,"cat":"AlexNet vs GoogLeNet vs ResNet","chapter":"CHAPTER 3","diff":2,"question":"CNNの発展モデルのうち、150層を超えるような超極深層での勾配消失を完全に克服するため、2層〜3層前の入力特徴データを、途中の畳み込み処理層を飛び越えて直接先の加算器へバイパス・ショートカット接続する『スキップ結合』をコアにしたモデルはどれか。","answer":"ResNet","choices":["ResNet","GoogLeNet","AlexNet"],"key":"2015年のILSVRCで圧勝したResNet（Residual Network）は、「スキップ結合」によって誤差逆伝播の勾配情報がダイレクトに深い層まで突き抜けることができるようにした、近代CNNの金字塔的モデルです。","look":"AlexNet vs GoogLeNet vs ResNet","weight":1},{"id":"C-2-007","mode":"ident","src":2,"cat":"GAN vs VAE","chapter":"CHAPTER 3","diff":2,"question":"ディープラーニングによる生成モデルのうち、2つのサブモデル（ジェネレータとディスクリミネータ）を競合ゲーム（敵対的構造）に配置するのではなく、入力されたデータを「平均」と「分散」の潜在パラメータに一旦確率的に圧縮（エンコード）し、そこから画像を再構成するように数式を定義するモデルはどれか。","answer":"VAE（変分オートエンコーダ）","choices":["VAE（変分オートエンコーダ）","GAN（敵対的生成ネットワーク）","DCGAN"],"key":"オートエンコーダの潜在変数を確率分布（平均・分散ベクトル）として扱い、その分布からデータを再構成（生成）できるように学習する確率論的アプローチが「VAE」です。一方、2つのモデルを偽札作りと警察の騙し合いのように競わせるのは「GAN」です。","look":"GAN vs VAE","weight":1},{"id":"C-2-008","mode":"ident","src":2,"cat":"セグメンテーション","chapter":"CHAPTER 4","diff":2,"question":"画像認識の応用タスクにおいて、画像内の物体がある四角い枠（バウンディングボックス）を見つける「物体検出」を超え、画像内のすべての『画素（ピクセル）単位』でどのクラス（道路、人、ビル、背景）に属するかを完全に色分けして分類・特定するタスクはどれか。","answer":"セマンティック・セグメンテーション","choices":["セマンティック・セグメンテーション","インスタンス・セグメンテーション","物体検出"],"key":"セマンティック・セグメンテーション（Semantic Segmentation）は、すべてのピクセルをクラス名で塗り分けるタスクです。さらに進んで、同一クラス内の個々の個体（例：『人A』と『人B』）を識別してピクセル単位で塗り分けるものは「インスタンス・セグメンテーション（Mask R-CNNなど）」です。","look":"セグメンテーション","weight":1},{"id":"C-2-009","mode":"ident","src":2,"cat":"形態素解析ツール","chapter":"CHAPTER 4","diff":1,"question":"日本語の形態素解析を行うにあたり、最も広く利用されている日本発のオープンソースライブラリであり、辞書の変更やカスタマイズが容易で、「MeCab」のほか、近年利用が増えている「Kuromoji」や「Sudachi」などは何のツールに分類されるか。","answer":"形態素解析エンジン","choices":["形態素解析エンジン","構文解析ツール","単語埋め込みモデル（Word2Vec）"],"key":"MeCab、JUMAN、Kuromoji、Sudachiなどは日本語のテキストを単語（形態素）単位に分割し、品詞等を判定する「形態素解析エンジン」の代表例です。","look":"形態素解析ツール","weight":1},{"id":"C-2-010","mode":"ident","src":2,"cat":"CBOW vs Skip-Gram","chapter":"CHAPTER 4","diff":3,"question":"Word2Vec（単語埋め込み技術）の2つの学習設計のうち、『ターゲットとなる中心の1単語（例：りんご）』を入力して、その単語の前後数ワードにある『周辺の単語（例：赤い、食べる、木）』を同時にニューラルネットワークに予測（出力）させることで高性能なベクトル表現を抽出するアプローチはどちらか。","answer":"Skip-gram","choices":["Skip-gram","CBOW"],"key":"Skip-gram（スキップグラム）は「1つの中心単語から周辺の複数の単語を予測する」モデルです。CBOW（シーボウ）は「周辺の複数のコンテキスト単語から中心の単語を予測する」モデルです。Skip-gramのほうが計算負荷が高いですが、出現頻度の低い稀少単語の学習性能が高いとされています。","look":"CBOW vs Skip-Gram","weight":1},{"id":"C-2-011","mode":"ident","src":2,"cat":"Attention vs Self-Attention","chapter":"CHAPTER 4","diff":2,"question":"Transformerの核心機構であり、入力文のシーケンス自体をコピーして、同じ文章の中にある全ての『単語同士の位置・意味的関係（主語と述語の対応など）』を総当たりで並列計算して注目度を重み付けする機構はどれか。","answer":"Self-Attention（自己注目機構）","choices":["Self-Attention（自己注目機構）","Source-Target Attention（ソース・ターゲット注目機構）"],"key":"Self-Attentionは、同じシーケンス内（入力テキスト内）の単語間すべての関連性をモデルに自律的にマッピングさせ、並列処理を可能にする画期的な注目機構です。翻訳機のエンコーダとデコーダ間で適用されるような注目は「Source-Target Attention」です。","look":"Attention vs Self-Attention","weight":1},{"id":"C-2-012","mode":"ident","src":2,"cat":"LIME vs Grad-CAM","chapter":"CHAPTER 4","diff":3,"question":"モデルの予測判断の説明手法において、対象のモデル（CNN）の『内部構造や重みパラメータの勾配情報を利用できる』ことが前提であり、最後の畳み込み層で得られた出力特徴マップの勾配から注目箇所のピクセルヒートマップを生成するホワイトボックス寄りな可視化手法はどれか。","answer":"Grad-CAM","choices":["Grad-CAM","LIME","SHAP"],"key":"Grad-CAMは、CNNの内部勾配情報をダイレクトに用いるため、CNNの画像判断可視化に極めて特化しています。対照的にLIME（ライム）やSHAPは、モデルの内部アルゴリズムが不明（ブラックボックス）であっても、入力と出力を外側からランダムにいじる（摂動する）ことで汎用的に周辺の重要特徴を特定・説明できる「Model-agnostic（モデル非依存）」な手法です。","look":"LIME vs Grad-CAM","weight":1},{"id":"C-2-013","mode":"ident","src":2,"cat":"Q学習 vs SARSA","chapter":"CHAPTER 4","diff":2,"question":"強化学習の時間差（TD）学習において、現在の状態 $s$ から行動 $a$ を取った後、移行先の次の状態 $s'$ で『実際にエージェントが方策に従ってサンプリングした（実際に選択した）行動 $a'$』におけるQ値を用いて学習・Q更新を行う、オンポリシー型の手法はどちらか。","answer":"SARSA","choices":["SARSA","Q学習（Q-Learning）"],"key":"SARSA（サーサ）は、実際に選択して実行した次の行動 $a'$ の価値 $Q(s', a')$ を使って更新を進める「オンポリシー（現在の方策を実行する）」手法です。一方、Q学習は実際に選択した行動に関わらず、次の状態 $s'$ で取りうる行動群の中で「最大Q値を持つ理論上の最適行動」を選択したと仮定して更新を行う「オフポリシー」手法です。","look":"Q学習 vs SARSA","weight":1},{"id":"C-2-014","mode":"ident","src":2,"cat":"Experience Replay vs ターゲットネットワーク","chapter":"CHAPTER 4","diff":3,"question":"DQN（Deep Q-Network）において、ニューラルネットワークのQ更新（損失最小化）を行う際、ターゲット値（正解とする期待値）の算出に使う『親のQネットワーク』を一定期間更新せず固定することで、目標値（ゴールポスト）が学習のたびに動いて学習が発散・崩壊するのを強力に防ぐシステムはどれか。","answer":"ターゲットネットワーク","choices":["ターゲットネットワーク","Experience Replay（経験再生）"],"key":"ターゲットとなるQ値を算出するための重みを、メインのネットワークとは別に設け、更新速度を何百ステップも遅らせて同期させる構造を「ターゲットネットワーク」と呼び、学習の急激な発散を防ぎます。一方、過去の行動軌跡をメモリに溜めてランダム抽出するのは「Experience Replay」です。","look":"Experience Replay vs ターゲットネットワーク","weight":1},{"id":"C-2-015","mode":"ident","src":2,"cat":"強化学習手法の分類","chapter":"CHAPTER 4","diff":3,"question":"【資料外補足】を含む強化学習のActor-Criticアルゴリズムのうち、複数の並列環境におけるエージェント達のパラメータ勾配を各学習ステップで一堂に待ち合わせて集計し、『同期』して一括して方策更新を行うことで、非同期手法（A3C）に比べてGPUでの学習効率を高めた手法はどれか。","answer":"A2C（Advantage Actor-Critic）","choices":["A2C（Advantage Actor-Critic）","A3C（Asynchronous Advantage Actor-Critic）","PPO"],"key":"A3Cの非同期（Asynchronous）部分を同期（Synchronous）に変更したのがA2C（エーツーシー）です。非同期に各エージェントが勝手にパラメータサーバーを書き換えるA3CはCPU並列に向いていましたが、同期をとるA2CのほうがバッチサイズをまとめてGPUで高速に処理できるという大きな実用上のメリットがあります。","look":"強化学習手法の分類","weight":1},{"id":"C-3-001","mode":"ident","src":3,"cat":"準委任契約 vs 請負契約","chapter":"CHAPTER 5","diff":2,"question":"AIプロジェクトの企画やPoC、データ分析などの、最終的に『高精度な予測を行うシステムが完成できるかどうかが極めて不確実な段階』に結ぶべきであり、受託会社には誠実に仕事を実行する義務（善管注意義務）はあるが成果物の絶対的な完成・納品義務は課されない最適な契約種別はどちらか。","answer":"準委任契約","choices":["準委任契約","請負契約"],"key":"AI開発では、データ特性によって当初想定した精度が出ない技術的リスク（不確実性）を伴います。そのため、初期検証段階では、成果物の納品を法的にコミットする「請負契約」ではなく、調査や研究開発を誠実に遂行することをコミットする「準委任契約」を採用するのが定石です。","look":"準委任契約 vs 請負契約","weight":1},{"id":"C-3-002","mode":"ident","src":3,"cat":"ウォーターフォール vs アジャイル","chapter":"CHAPTER 5","diff":1,"question":"『システム全体の要件定義、画面やデータベースの設計を最初に全て完了・固定し、それに従って各モジュールを下流へ一方通行で組み立てて、最後に全結合テストを行う』システム構築プロセスモデルはどれか。","answer":"ウォーターフォールモデル","choices":["ウォーターフォールモデル","アジャイル開発"],"key":"上流から下流へ滝（ウォーターフォール）のように流れて後戻りしない設計・構築スタイルです。仕様が完全に決まっている従来型基幹システムには向きますが、データやモデルを反復試行するAIプロジェクトには不向きとされます。","look":"ウォーターフォール vs アジャイル","weight":1},{"id":"C-3-003","mode":"ident","src":3,"cat":"SaaS vs PaaS vs IaaS","chapter":"CHAPTER 5","diff":2,"question":"クラウドサービスにおいて、ユーザー自身がサーバーのOS設定やデータベースのアップデートなどを一切行うことなく、インターネットブラウザやAPI経由で『Gmail』『Salesforce』『ChatGPT（のWeb画面）』のような「完成されたアプリケーションソフトウェアそのもの」をすぐにそのまま利用するサービス形態はどれか。","answer":"SaaS","choices":["SaaS","PaaS","IaaS"],"key":"SaaS（Software as a Service：サース）は、最上位のクラウドレイヤーで、ソフトウェアそのものをサービスとしてそのまま提供する形態です。PaaSはプラットフォーム（環境）、IaaSはサーバーインフラを提供します。","look":"SaaS vs PaaS vs IaaS","weight":1},{"id":"C-3-004","mode":"ident","src":3,"cat":"エッジAI vs クラウドAI","chapter":"CHAPTER 5","diff":2,"question":"AIの導入技術構成において、インターネット通信でデータをクラウドへ送ることなく、ロボットやスマートフォン、車載センサー端末の末端（ローカル環境）に格納された軽量化AIモデルを使ってその場で『推論』をミリ秒（超低遅延）で行うインフラ構成はどれか。","answer":"エッジAI","choices":["エッジAI","クラウドAI","オンプレミスAI"],"key":"ネットワークを介さず末端の電子基板や端末機側（エッジ）でAIを動かす構成を「エッジAI」と呼び、自動運転や即時安全停止などの超リアルタイム処理や機密データのローカル保持に威力を発揮します。","look":"エッジAI vs クラウドAI","weight":1},{"id":"C-3-005","mode":"ident","src":3,"cat":"仮名加工情報 vs 匿名加工情報","chapter":"CHAPTER 6","diff":2,"question":"日本の個人情報保護法において、『他の情報と照合しない限り、特定の個人を一切識別できないように加工した情報（対照表は社内に厳重保管）』を指し、社内でのAI開発やビッグデータ分析に限定した内部利用目的で、個人特定通知などの様々な報告・削除対応義務が緩和されるものはどちらか。","answer":"仮名加工情報","choices":["仮名加工情報","匿名加工情報"],"key":"社内でのデータマイニング等の「内部利用」を促進する目的で2020年改正法で新設されたのが「仮名加工情報（かめいかこうじょうほう）」です。復元不可能な「匿名加工情報」に比べて加工要件が緩く、既存データを有効活用しやすい特性があります（ただし社外への無断提供は厳禁）。","look":"仮名加工情報 vs 匿名加工情報","weight":1},{"id":"C-3-006","mode":"ident","src":3,"cat":"匿名加工情報 vs 仮名加工情報","chapter":"CHAPTER 6","diff":2,"question":"日本の個人情報保護法において、『他のデータベースと突き合わせる等、如何なる手段を講じても、特定の個人を絶対に復元・特定できないように厳格に加工した情報』を指し、本人の追加同意なしで一定ルールの下「社外の第三者へのデータ売買・提供」まで可能にするデータ保管形態はどちらか。","answer":"匿名加工情報","choices":["匿名加工情報","仮名加工情報"],"key":"「匿名加工情報（とくめいかこうじょうほう）」は、絶対に本人の実像に戻せないレベルまで完全に特定情報を消失させたものであり、個人データとしての括りから外れるため、第三者提供が認められ、異業種間でのビッグデータ共有・売買などに利用されます。","look":"匿名加工情報 vs 仮名加工情報","weight":1},{"id":"C-3-007","mode":"ident","src":3,"cat":"著作権法第30条の4","chapter":"CHAPTER 6","diff":2,"question":"他人が保有する著作物であっても、『自らの思想や感情を作品から享受する（鑑賞、読書など）』目的ではなく、AIのモデル構築（パターン抽出・機械学習データセットとしての読み込み）のように、人間が楽しむ目的以外でデータ解析に付す場合、著作権者の許可なく無断利用して良いと定めている日本の法律規定はどれか。","answer":"著作権法第30条の4","choices":["著作権法第30条の4","特許法における試験研究例外","不正競争防止法第6条"],"key":"日本の著作権法第30条の4は、世界で最もAI学習に有利（寛容）とされる制限規定であり、AIモデルがデータを機械的に解析するだけのフェーズであれば、著作権者の利益を不当に害さない限りにおいて、許諾なくスクレイピングや学習が可能であると認めています。","look":"著作権法第30条の4","weight":1},{"id":"C-3-008","mode":"ident","src":3,"cat":"著作権 vs 特許権","chapter":"CHAPTER 6","diff":2,"question":"アイデアや技術的な発明ではなく、プログラマが記述したソースコードの表現そのもの、文書、音楽、またはイラスト・画像といった『人間が創作的に表現したもの（表現）』そのものを、創作と同時に自動的に発生させて保護する法的知的財産権はどれか。","answer":"著作権","choices":["著作権","特許権","商標権"],"key":"著作権（Copyright）は「創作的表現」を保護する権利であり、出願等の手続きを要せず創作した瞬間に発生する「無方式主義」を採ります。対照的に、技術的な機能や斬新なアイデア（発明）を保護するのは、特許庁への出願と審査を要する「特許権」です。","look":"著作権 vs 特許権","weight":1},{"id":"C-3-009","mode":"ident","src":3,"cat":"特許権 vs 不正競争防止法","chapter":"CHAPTER 6","diff":2,"question":"AIシステムや斬新なアルゴリズム技術を、社会に公式に公開・公表（特許公報）する代わりに、出願日から最大20年間にわたって、他社が同じ仕組みを利用することを禁止し独占営業権を得られる非常に強力な知的財産権はどれか。","answer":"特許権","choices":["特許権","不正競争防止法による営業秘密保護","著作権"],"key":"特許権は、技術を公表する代わりに強力な独占権（20年間）を得る仕組みです。これに対し、技術を一切世間に明かさずブラックボックスの秘伝のタレとして自社内に隠匿し続けるのは「不正競争防止法（営業秘密保護）」を活用するオープン＆クローズ戦略です。","look":"特許権 vs 不正競争防止法","weight":1},{"id":"C-3-010","mode":"ident","src":3,"cat":"限定提供データ vs 営業秘密","chapter":"CHAPTER 6","diff":3,"question":"不正競争防止法において保護される対象のうち、『一般には非公開（非公知性）』で厳密に管理されている秘伝の顧客リスト等とは異なり、気象情報ログや車の走行データ、工場の機械センサー情報などのように、特定の取引相手との間（有償・無償など）で共有・取引され、パスワード等によるアクセス管理がされている有用なデータ群を指す区分はどれか。","answer":"限定提供データ","choices":["限定提供データ","営業秘密","不当利得"],"key":"限定提供データ（げんていていきょうデータ）は、営業秘密の前提要件である「非公知性」を満たさない、B2B間でオープンかつ限定的に共同利用されるデータセットをハッキングや不正流出から守るために制定された不正競争防止法の保護対象です。","look":"限定提供データ vs 営業秘密","weight":1},{"id":"C-3-011","mode":"ident","src":3,"cat":"営業秘密の要件","chapter":"CHAPTER 6","diff":2,"question":"不正競争防止法における「営業秘密」として認定され、万一ライバル社等に不正流出された際に法的措置をとるための必須3要件に該当しない（不要な）項目はどれか。","answer":"技術の独創性（これまでにない全く新しい技術であること）","choices":["技術の独創性（これまでにない全く新しい技術であること）","秘密管理性（パスワードや部外秘表示で区別管理されていること）","有用性（ビジネス上や技術上に役立つ情報であること）","非公知性（一般に広く知られておらず、世に出ていないこと）"],"key":"営業秘密の3要件は「秘密管理性」「有用性」「非公知性」です。技術の「独創性」は特許要件など（新規性・進歩性）には必要ですが、営業秘密の保護においては、どれほど単純なデータであっても、この3つの実態要件を満たしていれば営業秘密として保護されます。","look":"営業秘密の要件","weight":1},{"id":"C-3-012","mode":"ident","src":3,"cat":"データ汚染 vs 敵対的サンプル","chapter":"CHAPTER 6","diff":3,"question":"【資料外補足】を含むAIセキュリティ課題において、学習用の訓練データに異常データを仕込む『データ汚染（ポイズニング）』ではなく、学習が完了した『推論（テスト）フェーズ』を狙い、画像データに人間には到底判別できないような極小の「ノイズ」を付加することで、完成済みAIモデルの予測クラスを「犬から飛行機」などへ意図的に誤認・暴走させる不正なデータを何と呼ぶか。","answer":"敵対的サンプル（Adversarial Examples）","choices":["敵対的サンプル（Adversarial Examples）","データ汚染（ポイズニング）","ねつ造データ"],"key":"学習済みの画像分類モデルにわずかな計算されたノイズ（摂動）を加えることで、意図的に誤検出を引き起こす攻撃データを「敵対的サンプル」と呼びます。自動運転の標識認識や顔認識の突破などでリスクが検証されています。","look":"データ汚染 vs 敵対的サンプル","weight":1},{"id":"C-3-013","mode":"ident","src":3,"cat":"GDPR vs EU AI規制法","chapter":"CHAPTER 6","diff":2,"question":"欧州連合（EU）が定めたデータ規制のうち、EU内の人々のCookie情報やアクセスIPアドレス、位置データ等の個人データの域外（日本など）への無断持ち出しや利用を非常に厳格に規制し、2018年より施行された基本ルールはどれか。","answer":"GDPR（一般データ保護規則）","choices":["GDPR（一般データ保護規則）","EU AI Act（EU AI規制法）","個人情報保護ガイドライン"],"key":"GDPRは個人データの保護規則（2018年施行）です。一方、EU AI規制法（AI Act、近年採択）は、AI技術の使用リスクそのものに焦点を当て、危険度分類に基づいてAI開発者に義務を課す法規制です。","look":"GDPR vs EU AI規制法","weight":1},{"id":"C-3-014","mode":"ident","src":3,"cat":"ハードロー vs ソフトロー","chapter":"CHAPTER 6","diff":2,"question":"国会が可決した法律や地方自治体の条例などのように、法的な強制力を持ち、違反した場合に刑事罰や営業停止、金銭的制裁（罰金・制裁金）などのペナルティが直接科される公式な社会規範を何というか。","answer":"ハードロー","choices":["ハードロー","ソフトロー"],"key":"直接的な法的拘束力・ペナルティを持つ法律や国際条約は「ハードロー」と呼ばれます。一方、業界団体によるガイドライン、倫理綱領、政府による推奨自主指針などのように、法的な強制力は持たないが社会的合意として順守が期待される緩やかな規範は「ソフトロー」と呼ばれます。","look":"ハードロー vs ソフトロー","weight":1},{"id":"C-3-015","mode":"ident","src":3,"cat":"LAWS vs Society 5.0","chapter":"CHAPTER 6","diff":1,"question":"人工知能（AI）倫理や安全保障上の議論において、人間が引き金を引く（殺傷する）最終的な決断を下すプロセスを介さずに、AIシステム自身が標的を独自判断で捜索・ロックオンして攻撃を実行する『自律型致死兵器システム』はどれか。","answer":"LAWS","choices":["LAWS","Society 5.0","自律ドローン配送"],"key":"LAWS（Lethal Autonomous Weapons Systems）は、自律的に判断して人間を殺傷する兵器を指し、非人道的であるとして開発禁止や制限の議論が国連等の国際交渉で進められています。","look":"LAWS vs Society 5.0","weight":1}];

/* 瞬殺は80枚のカード、穴埋め・識別はQBANKを母集団にする */
const poolAll = () => (CUR_MODE === 'flash') ? cardsOf(CUR_SET) : QBANK.filter(q => q.mode === CUR_MODE);
const cardsFor = () => poolAll().filter(c => CUR_SRC === 'all' || (c.src || srcOf(c.id)) === CUR_SRC);

function poolHomes(card){
  const mine = new Set(card.items.map(i => i.home));
  /* 誤答肢は同じセット内からのみ集める。
     Set B を足しても Set A の出題内容が変わらないようにするため。 */
  const scope = cardsOf(setOf(card.id));
  const same = scope.filter(c => c.cat === card.cat && c.id !== card.id);
  const other = scope.filter(c => c.cat !== card.cat);
  const pick = list => list.reduce((a,c) => a.concat(c.items.map(i => i.home)), []);
  return (card.decoys || [])
    .concat(pick(same), pick(other))
    .filter(h => !mine.has(h))
    .filter((h,i,arr) => arr.indexOf(h) === i);
}
/* 同じ80枚から3方向の問題を作る。
   fill  : 説明文 → 用語（誤答肢は他カードの用語も混ぜる＝思い出す練習）
   ident : 説明文 → 用語（誤答肢は同じカードの兄弟用語だけ＝見分ける練習）
   flash : 用語 → 所属（既存の瞬殺。変更しない） */
/* 穴埋めは choices を持たないため、同じ出典の他問の answer から誤答肢を作る。
   問題文・正解・解説はYAMLのまま使い、選択肢の並びだけ毎回シャッフルする。 */
function fillDistractors(q){
  const same = QBANK.filter(x => x.mode === 'fill' && x.src === q.src && x.answer !== q.answer);
  const near = same.filter(x => x.chapter === q.chapter);
  const pool = shuffled(near).concat(shuffled(same));
  const seen = new Set([q.answer]);
  const out = [];
  for(const x of pool){
    if(seen.has(x.answer)) continue;
    seen.add(x.answer); out.push(x.answer);
    if(out.length === 3) break;
  }
  return out;
}
function buildFill(q){
  const wrong = fillDistractors(q);
  const opts = shuffled([{label:q.answer, ok:true}].concat(wrong.map(w => ({label:w, ok:false}))));
  return {prompt:q.question, opts, sub:q.cat, kind:'fill'};
}
function buildIdent(q){
  const opts = shuffled((q.choices || []).map(c => ({label:c, ok:c === q.answer})));
  return {prompt:q.question, opts, sub:q.cat, kind:'ident'};
}
function buildQuestion(card){
  if(card.question) return (card.mode === 'ident') ? buildIdent(card) : buildFill(card);
  if(card.type === 'odd'){
    /* answer で指定された1件だけを正解にする */
    const ansTerm = card.items[card.answer-1].term;
    const opts = shuffled(card.items.map(i => ({label:i.term, ok:i.term === ansTerm})));
    return {prompt:'仲間外れは？', opts, sub:card.cat};
  }
  const target = card.items[Math.floor(Math.random()*card.items.length)];
  const decoys = poolHomes(card).slice(0, 3);
  const wrong  = shuffled(card.items.filter(i => i !== target).map(i => i.home).concat(decoys)).slice(0, 3);
  const opts = shuffled([{label:target.home, ok:true}].concat(wrong.map(w => ({label:w, ok:false}))));
  return {prompt:target.term, opts, sub:card.cat, isHome:true};
}

/* ============================================================
   セッション
   ============================================================ */
let S = null;      // {ids, cur, q, results[], startedAt, shownAt, answered}
let timerId = null;

function startSession(mode){
  const set = CUR_SET;
  let pool = cardsFor();
  if(mode === 'weak') pool = pool.filter(c => stateOf(c.id) !== 'fixed');   // 定着確認済み以外
  if(!pool.length){ alert('該当するカードがありません。'); return; }
  /* 1セットの問題数。範囲を絞っていないときだけ全枚数を通しで出す */
  const cap = (set === 'all' && CUR_SRC === 'all') ? pool.length : SESSION_N;
  /* weight の大きいカードを優先しつつ、順序はランダム */
  const w = shuffled(pool).sort((a,b) => (b.weight||1) - (a.weight||1));
  const ids = shuffled(w.slice(0, Math.min(cap, w.length))).map(c => c.id);
  S = {ids, cur:0, q:null, results:[], startedAt:Date.now(), shownAt:0, answered:false,
       mode, set, learnMode:CUR_MODE, src:CUR_SRC, saved:false};
  render('quiz');
}
function stopTimer(){ if(timerId){ clearInterval(timerId); timerId = null; } }
function tick(){
  const el = document.getElementById('tm');
  if(!el || !S || S.answered){ return; }
  el.textContent = fmtSec(Date.now() - S.shownAt);
}

function vQuiz(){
  if(!S){ render('home'); return; }
  const card = byId(S.ids[S.cur]);
  if(!S.q) S.q = buildQuestion(card);
  const q = S.q;
  const st = stateOf(card.id);
  const pct = Math.round((S.cur+1)/S.ids.length*100);

  app.innerHTML = `
    <div class="qbar">
      <span class="idx">${S.cur+1} / ${S.ids.length}</span>
      <span class="timer" id="tm">0.0秒</span>
      <div class="bar"><span style="width:${pct}%"></span></div>
      <span class="tag ${STATE_CLS[st]}">${esc(card.cat)}｜${STATE_LABEL[st]}</span>
    </div>

    <div class="card">
      <div class="prompt">${
        (q.kind === 'fill' || q.kind === 'ident') ? esc(q.prompt) :
        q.isHome ? `<span class="em">${esc(q.prompt)}</span> の所属は？`
                 : esc(q.prompt)}</div>
      <div class="opts" id="opts">
        ${q.opts.map((o,i) => `<button class="opt" data-i="${i}" type="button">${esc(o.label)}</button>`).join('')}
      </div>
    </div>

    <div id="after"></div>

    <div class="navbtns">
      <button class="btn ghost" id="quit" type="button">中断</button>
    </div>`;

  $('#opts').onclick = e => {
    const b = e.target.closest('.opt');
    if(!b || S.answered) return;
    answer(+b.dataset.i);
  };
  $('#quit').onclick = () => {
    if(confirm('中断してホームへ戻りますか？\n（採点済みの結果は保存されています）')){
      stopTimer(); S = null; render('home');
    }
  };

  S.answered = false;
  S.shownAt = Date.now();
  stopTimer();
  timerId = setInterval(tick, 100);
}

function answer(i){
  const card = byId(S.ids[S.cur]);
  const q = S.q;
  const ms = Date.now() - S.shownAt;
  const ok = !!q.opts[i].ok;
  S.answered = true;
  stopTimer();

  const r = rec(card.id);
  if(ok) r.ok++; else r.ng++;
  const fast = ok && ms <= FAST_MS;            // 5秒以内の正解＝定着候補
  const slow = ok && ms > SLOW_MS;             // 10秒超の正解＝要反射
  r.streak = fast ? r.streak + 1 : 0;          // 5秒以内で正解したときだけ連続を伸ばす
  if(ok && (r.bestMs === null || ms < r.bestMs)) r.bestMs = ms;
  r.lastMs = ms;
  r.lastResult = ok ? 'o' : 'x';
  r.last = new Date().toISOString();
  save();

  S.results.push({id:card.id, ok, ms, fast, slow, state:stateOf(card.id)});

  document.querySelectorAll('.opt').forEach((b, idx) => {
    b.disabled = true;
    if(q.opts[idx].ok) b.classList.add('correct');
    else if(idx === i) b.classList.add('wrong');
  });

  const last = S.cur === S.ids.length - 1;
  $('#after').innerHTML = `
    <div class="verdict ${ok?'ok':'ng'}">
      <div class="top">
        <span class="mark">${ok ? (fast ? '瞬殺' : (slow ? '正解（要反射）' : '正解')) : '不正解'}</span>
        <span class="sec">${fmtSec(ms)}${
          ok && slow ? `　（${SLOW_MS/1000}秒超）` : (ok && !fast ? `　（${FAST_MS/1000}秒超）` : '')}</span>
        <span class="sec">${STATE_LABEL[stateOf(card.id)]}</span>
      </div>
      <div class="key">${esc(card.key)}</div>
      <div class="link">
        <a class="link-a" href="${YOUGO_URL}?q=${encodeURIComponent(card.look)}"
           target="_blank" rel="noopener noreferrer">用語集で「${esc(card.look)}」を見る</a>
      </div>
    </div>
    <button class="btn wide" id="next" type="button">${last ? '結果を見る' : '次へ'}</button>`;

  $('#next').onclick = () => {
    if(last){ render('result'); }
    else { S.cur++; S.q = null; vQuiz(); }
  };
  $('#next').focus();
}

  const mid  = S.results.filter(r => r.ok && !r.fast && !r.slow);   // 5〜10秒

        <div class="s">${FAST_MS/1000}秒以内 ${fast}</div>

      </div>` : ''}

    ${slow.length ? `<h2 class="sec">要反射（${SLOW_MS/1000}秒超で正解）</h2>
      <p class="muted">最優先で反射化すべき論点です。</p>

          <span class="sec2 slow">${fmtSec(r.ms)}</span></div>`; }).join('')}
      </div>` : ''}

    ${mid.length ? `<h2 class="sec">理解済み（${FAST_MS/1000}〜${SLOW_MS/1000}秒で正解）</h2>
      <p class="muted">意味は分かっているが、反射化の途中です。</p>
      <div class="card" style="padding:4px 13px">

    ${!ng.length && !slow.length && !mid.length

    <div class="navbtns">

  $('#again').onclick = () => startSession(S.mode);

/* 結果画面と同じ区分でセッションを分類する */
function splitResults(results){
  return {
    ng:   results.filter(r => !r.ok),
    slow: results.filter(r => r.ok && r.slow),
    mid:  results.filter(r => r.ok && !r.fast && !r.slow),
  };
}
function histRows(list, cls){
  return list.map(r => `<div class="lrow">
    <span class="m ${cls==='x'?'x':'o'}">${cls==='x'?'×':'✓'}</span>
    <span class="t">${esc(cardLabel(r.id))}
      <small>${esc((byId(r.id)||{key:''}).key)}</small></span>
    <span class="sec2 ${cls==='slow'?'slow':''}">${fmtSec(r.ms)}</span>
  </div>`).join('');
}

/* 外部AIへ貼り付けるためのプレーンテキスト。
   カードは必ず「【瞬殺:ID】cat」の形で出す */
function buildAnalysisText(){
  if(!HIST.length) return '【G検定 瞬殺トレーニング履歴】\n\n保存されている履歴はありません。';
  const L = [];
  L.push('【G検定 瞬殺トレーニング履歴】');
  L.push(`出力日時：${fmtDT(new Date().toISOString())}`);
  L.push(`保存セッション：${HIST.length}件`);

  const h = HIST[0];
  const s = splitResults(h.results);
  L.push('', '■ 最新セッション');
  L.push(`日時：${fmtDT(h.at)}`);
  L.push(`モード：${lmLabel(h.learnMode)}　範囲：${srcLabel(h.src)}`);
  L.push(`セット：${setLabel(h.set)}　出題：${modeLabel(h.mode)}`);
  L.push(`${h.correctCount} / ${h.questionCount}`);
  L.push(`正答率 ${h.rate}%`);
  L.push(`平均 ${fmtSec(h.averageMs)}`);
  L.push(`${FAST_MS/1000}秒以内 ${h.fastCount}`);

  L.push('', '■ 誤答');
  L.push(s.ng.length ? s.ng.map(r => `${cardLabel(r.id)} ${fmtSec(r.ms)}`).join('\n') : 'なし');
  L.push('', `■ ${SLOW_MS/1000}秒超正解`);
  L.push(s.slow.length ? s.slow.map(r => `${cardLabel(r.id)} ${fmtSec(r.ms)}`).join('\n') : 'なし');
  L.push('', `■ ${FAST_MS/1000}〜${SLOW_MS/1000}秒正解`);
  L.push(s.mid.length ? s.mid.map(r => `${cardLabel(r.id)} ${fmtSec(r.ms)}`).join('\n') : 'なし');

  L.push('', '■ 過去セッション推移（新しい順）');
  L.push(`日時 / モード / 範囲 / セット / 正解数 / 正答率 / 平均秒 / ${FAST_MS/1000}秒以内`);
  HIST.forEach(x => {
    L.push(`${fmtDT(x.at)} / ${lmLabel(x.learnMode)} / ${srcLabel(x.src)} / ${setLabel(x.set)} / ${x.correctCount}/${x.questionCount}`
      + ` / ${x.rate}% / ${fmtSec(x.averageMs)} / ${x.fastCount}`);
  });

  L.push('', '■ 各セッションの誤答と要反射（新しい順）');
  HIST.forEach(x => {
    const q = splitResults(x.results);
    L.push(`${fmtDT(x.at)}　${x.correctCount}/${x.questionCount}`);
    L.push(`誤答：${q.ng.length ? q.ng.map(r => `${cardLabel(r.id)} ${fmtSec(r.ms)}`).join('、') : 'なし'}`);
    L.push(`${SLOW_MS/1000}秒超：${q.slow.length ? q.slow.map(r => `${cardLabel(r.id)} ${fmtSec(r.ms)}`).join('、') : 'なし'}`);
  });
  return L.join('\n');
}

    <textarea class="ta" id="copyTa" readonly></textarea>`;
  const ta = document.getElementById('copyTa');
  ta.value = txt;
  ta.focus(); ta.select();
}
function copyAnalysis(btn){
  const txt = buildAnalysisText();
  const label = btn.textContent;
  const done = () => { btn.textContent = 'コピーしました'; setTimeout(() => { btn.textContent = label; }, 1600); };
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(txt).then(done).catch(() =>
      showCopyFallback(txt, 'クリップボードへ書き込めませんでした。下のテキストを選択してコピーしてください。'));
  }else{
    showCopyFallback(txt, 'この環境ではクリップボードを使えません。下のテキストを選択してコピーしてください。');
  }
}

/* シートに全カードが載っているかを起動時に自己検査する */
(function checkSheet(){
  const listed = SHEET_PAGES.reduce((a,p) => a.concat(p.ids), []);
  const miss = CARDS.filter(c => !listed.includes(c.id)).map(c => c.id);
  const dup  = listed.filter((x,i) => listed.indexOf(x) !== i);
  if(miss.length) console.warn('シート未掲載:', miss);
  if(dup.length)  console.warn('シート重複:', dup);
})();

function sheetGroup(c){
  const lines = c.items.map(i => {
    const odd = c.type === 'odd' && i.term === c.items[c.answer-1].term;
    return `<div class="ln"><span class="l">${odd?'<span class="star">★</span>':''}${esc(i.term)}</span>
      <span class="dot"></span><span class="r">${esc(i.home)}</span></div>`;
  }).join('');
  return `<div class="grp"><div class="gt">${esc(c.cat)}　${esc(c.id)}</div>${lines}
    <div class="ln"><span class="l"></span><span class="r"><b>→ ${esc(c.key)}</b></span></div></div>`;
}
