      else if(k === 'weak')  startSession(weakIds, '苦手問題');
      else if(k === 'tech')  startSession(techIds, '技術分野');
      else if(k === 'law')   startSession(lawIds, '法律・倫理分野');
      else if(k === 'syl')   render('syllabus');
    }
  };
}

/* ---------- シラバス別 ---------- */
let sylPick = null;
function vSyllabus(){
  const chip = sid => {
    const n = countFor(sid);
    return `<button class="chip ${n?'':'zero'} ${sylPick===sid?'on':''}" data-sid="${sid}">${sid}<span class="n">${n}</span></button>`;
  };
  const T = ALL_IDS.filter(s => s[0]==='T').map(chip).join('');
  const L = ALL_IDS.filter(s => s[0]==='L').map(chip).join('');
  let detail = '';
  if(sylPick){
    const list = QUESTIONS.filter(q => q.syllabusIds.includes(sylPick));
    const nm = SYL_NAMES[sylPick] || '';
    detail = list.length
      ? `<div class="card"><b>${sylPick} ${esc(nm)}</b>
           <div class="muted" style="margin:4px 0 12px">該当 ${list.length}問</div>
           <button class="btn wide" id="startSyl">この項目を出題する</button></div>`
      : `<div class="card"><b>${sylPick} ${esc(nm)}</b>
           <div class="empty" style="padding:20px 6px">この項目に対応する問題は現在ありません</div></div>`;
  }
  app.innerHTML = `
    <h2 class="sec">シラバス別出題</h2>
    <p class="muted">項目を選ぶと、そのIDを持つ問題だけを出題します。複数IDの問題はどのIDからでも表示されます。</p>
    <div class="card"><b style="font-size:14px">技術分野（T01〜T37）</b><div class="chips">${T}</div></div>
    <div class="card"><b style="font-size:14px">法律・倫理分野（L01〜L18）</b><div class="chips">${L}</div></div>
    ${detail}
    <div class="navbtns"><button class="btn ghost" id="backHome">ホームへ戻る</button></div>`;

  app.querySelectorAll('[data-sid]').forEach(b => b.onclick = () => { sylPick = b.dataset.sid; render('syllabus'); });
  const s = $('#startSyl');
  if(s) s.onclick = () => startSession(
    QUESTIONS.filter(q => q.syllabusIds.includes(sylPick)).map(q => q.id), sylPick);
  $('#backHome').onclick = () => render('home');
}

/* ---------- 出題 ---------- */
function vQuiz(){
  if(!session){ render('home'); return; }
  const id = session.ids[session.cur];
  const q = byId(id);
  const pick = session.picks[id] || null;          // 仮選択（未採点）
  const done = session.graded[id] !== undefined;   // 採点済みか
  const ok = done && session.graded[id];
  const shown = !!session.revealed[id];
  const pct = Math.round((session.cur+1)/session.ids.length*100);

  const choices = q.choices.map((c,i) => {
    const n = i+1;
    let cls = '';
    if(done){
      if(n === q.answer) cls = 'correct';
      else if(n === pick) cls = 'wrong';
    } else if(pick === n) cls = 'sel';
    return `<button class="choice ${cls}" data-c="${n}" ${done?'disabled':''} type="button">
      <span class="num">${n}</span><span>${c}</span></button>`;
  }).join('');

  app.innerHTML = `
    <div class="qbar">
      <span class="idx">${session.cur+1} / ${session.ids.length}</span>
      <div class="qprog"><div class="bar"><span style="width:${pct}%"></span></div></div>
      <button class="btn ghost sm" id="quitBtn" type="button">中断</button>
    </div>

    <div class="card">
      <div><span class="qno">問${q.id}</span>
        ${q.syllabusIds.map(s => `<span class="badge">${s}</span>`).join('')}</div>
      ${done ? `<div class="qtitle">${esc(q.title)}</div>` : ''}
      <div class="qtext">${q.questionHtml}</div>
      <div id="choices">${choices}</div>
    </div>

    <div id="afterArea"></div>

    <div class="row" style="margin-top:10px">
      <button class="star-btn ${isWeak(id)?'on':''}" id="starBtn" type="button">
        ${isWeak(id)?'★ 苦手登録中':'☆ 苦手に登録'}</button>
    </div>

    <div class="navbtns">
      <button class="btn ghost" id="prevBtn" ${session.cur===0?'disabled':''} type="button">← 前へ</button>
      <button class="btn ${done?'':'sub'}" id="nextBtn" type="button">
        ${session.cur === session.ids.length-1 ? '結果を見る' : '次の問題へ →'}</button>
    </div>`;

  const after = $('#afterArea');
  if(done){
    after.innerHTML = `
      <div class="verdict ${ok?'ok':'ng'}">${ok?'正解！':'不正解'}
        <span class="sm">${esc(q.title)}${q.syllabusIds.map(s=>`【${s}】`).join('')}</span>
        ${ok?'':`<span class="sm">正解は ${q.answer}：${q.choices[q.answer-1]}</span>`}</div>
      ${shown ? `<div class="exp">${q.explanationHtml}</div>`
              : `<button class="btn sub wide" id="expBtn" type="button">解説を見る</button>`}`;
    const eb = $('#expBtn');
    if(eb) eb.onclick = () => { session.revealed[id] = true; vQuiz(); };
  } else {
    after.innerHTML = `<button class="btn wide" id="ansBtn" type="button" ${pick?'':'disabled'}>回答する</button>`;
    $('#ansBtn').onclick = () => grade(id, pick);
  }

  $('#choices').onclick = e => {
    const b = e.target.closest('.choice'); if(!b || b.disabled) return;
    if(done) return;                 // 採点後は変更不可
    session.picks[id] = +b.dataset.c;  // 仮選択のみ。採点は「回答する」で行う
    vQuiz();
  };
  $('#starBtn').onclick = () => {
    const r = rec(id); r.weak = !r.weak; saveStore(); vQuiz();
  };
  $('#prevBtn').onclick = () => { if(session.cur>0){ session.cur--; vQuiz(); } };
  $('#nextBtn').onclick = () => {
    if(session.cur === session.ids.length-1) render('result');
    else { session.cur++; vQuiz(); }
  };
  $('#quitBtn').onclick = () => { if(confirm('セッションを中断してホームへ戻りますか？')){ session=null; render('home'); } };
}

function grade(id, pick){
  const q = byId(id);
  if(!pick) return;
  const r = rec(id);
  const ok = pick === q.answer;
  if(ok) r.correct++; else r.incorrect++;
  r.lastResult = ok ? 'o' : 'x';
  r.last = new Date().toISOString();
  session.graded[id] = ok;
  saveStore();
  vQuiz();
}

/* ---------- 結果 ---------- */
function vResult(){
  if(!session){ render('home'); return; }
  const g = session.graded || {};
  const answeredIds = session.ids.filter(i => g[i] !== undefined);
  const okIds = answeredIds.filter(i => g[i]);
  const ngIds = answeredIds.filter(i => !g[i]);
  const rate = answeredIds.length ? Math.round(okIds.length/answeredIds.length*100) : 0;

  app.innerHTML = `
    <h2 class="sec">学習結果${session.label ? '（'+esc(session.label)+'）' : ''}</h2>
    <div class="card score">
      <div class="big">${answeredIds.length}問中 ${okIds.length}問正解</div>
      <div class="rate">正答率 ${rate}%</div>
      <div class="tally"><div class="c">正解 ${okIds.length}</div><div class="w">不正解 ${ngIds.length}</div></div>
      ${session.ids.length !== answeredIds.length
        ? `<div class="muted" style="margin-top:10px">未回答 ${session.ids.length-answeredIds.length}問</div>` : ''}
    </div>

    ${ngIds.length ? `<h2 class="sec">間違えた問題</h2>
      <div class="card" style="padding:4px 12px">
        ${ngIds.map(i => { const q = byId(i); return `
          <div class="qrow" data-goto="${i}"><span class="mark x">×</span>
            <span class="nm">問${q.id}　${esc(q.title)}<small>${q.syllabusIds.join('・')}</small></span></div>`;}).join('')}
      </div>
      <button class="btn wide" id="reviewBtn" type="button">間違えた問題だけ復習</button>` : ''}

    <div class="navbtns">
      <button class="btn ghost" id="homeBtn2" type="button">ホームへ戻る</button>
    </div>`;

  const rb = $('#reviewBtn');
  if(rb) rb.onclick = () => startSession(ngIds, '間違えた問題の復習');
  $('#homeBtn2').onclick = () => { session = null; render('home'); };
  app.querySelectorAll('[data-goto]').forEach(el => el.onclick = () => {
    const i = session.ids.indexOf(+el.dataset.goto);
    if(i >= 0){ session.cur = i; render('quiz'); }
  });
}

/* ---------- 問題一覧 ---------- */
function qrow(q){
  const lr = lastResult(q.id);
  const m = lr === 'o' ? ['o','✓'] : lr === 'x' ? ['x','×'] : ['n','－'];
  return `<div class="qrow" data-open="${q.id}">
    <span class="mark ${m[0]}">${m[1]}</span>
    <span class="nm">問${q.id}　${esc(q.title)}<small>${q.syllabusIds.join('・')}</small></span>
    <span class="st">${isWeak(q.id)?'☆':''}</span></div>`;
}
function vList(){
  const f = {
    all:  QUESTIONS,
    right:QUESTIONS.filter(q => lastResult(q.id)==='o'),
    wrong:QUESTIONS.filter(q => lastResult(q.id)==='x'),
    unans:QUESTIONS.filter(q => !answered(q.id)),
    weak: QUESTIONS.filter(q => isWeak(q.id)),
  }[listFilter] || QUESTIONS;
  const tab = (k,l) => `<button class="chip ${listFilter===k?'on':''}" data-f="${k}">${l}</button>`;
  app.innerHTML = `
    <h2 class="sec">問題一覧</h2>
    <div class="chips">${tab('all','すべて')}${tab('right','✓ 正解')}${tab('wrong','× 不正解')}${tab('unans','－ 未回答')}${tab('weak','☆ 苦手')}</div>
    <div class="card" style="padding:4px 12px">
      ${f.length ? f.map(qrow).join('') : '<div class="empty">該当する問題はありません</div>'}
    </div>
    ${f.length ? `<button class="btn wide" id="startList" type="button">この一覧を出題する（${f.length}問）</button>` : ''}`;
  app.querySelectorAll('[data-f]').forEach(b => b.onclick = () => { listFilter = b.dataset.f; render('list'); });
  const sl = $('#startList');
  if(sl) sl.onclick = () => startSession(f.map(q => q.id), '問題一覧');
  bindOpen();
}
function bindOpen(){
  app.querySelectorAll('[data-open]').forEach(el => el.onclick = () => {
    startSession([+el.dataset.open], '単問');
  });
}

/* ---------- 検索 ---------- */
function vSearch(){
  const q = searchQ.trim();
  let hits = [];
  if(q){
    const kw = q.toLowerCase();
    hits = QUESTIONS.filter(x =>
      String(x.id) === q ||
      ('問'+x.id) === q ||
      x.title.toLowerCase().includes(kw) ||
      plain(x.questionHtml).toLowerCase().includes(kw) ||
      x.choices.some(c => plain(c).toLowerCase().includes(kw)) ||
      x.syllabusIds.some(s => s.toLowerCase() === kw || s.toLowerCase().includes(kw))
    );
  }
  app.innerHTML = `
    <h2 class="sec">問題検索</h2>
    <input type="search" id="sIn" placeholder="問題番号／タイトル／問題文／選択肢／シラバスID" value="${esc(q)}">
    <p class="muted">例：42　再現率　著作権　T31　L02</p>
    ${q ? `<div class="muted" style="margin:6px 0">${hits.length}件</div>
      <div class="card" style="padding:4px 12px">
        ${hits.length ? hits.map(qrow).join('') : '<div class="empty">見つかりませんでした</div>'}</div>
      ${hits.length ? `<button class="btn wide" id="startSearch" type="button">この結果を出題する（${hits.length}問）</button>` : ''}` : ''}`;
  const inp = $('#sIn');
  inp.oninput = () => { searchQ = inp.value; const p = inp.selectionStart; vSearch();
    const n = $('#sIn'); n.focus(); try{ n.setSelectionRange(p,p); }catch(e){} };
  const ss = $('#startSearch');
  if(ss) ss.onclick = () => startSession(hits.map(x => x.id), '検索結果');
  bindOpen();
}

/* ---------- 解説一覧 ---------- */
function vExps(){
  const q = QUESTIONS[expIndex];
  app.innerHTML = `
    <h2 class="sec">解説一覧</h2>
    <p class="muted">全100問の解説を、問題を解かずに読むモードです。</p>
    <div class="qbar">
      <span class="idx">${expIndex+1} / 100</span>
      <div class="qprog"><div class="bar"><span style="width:${Math.round((expIndex+1))}%"></span></div></div>
    </div>
    <div class="card">
      <div><span class="qno">問${q.id}</span>
        ${q.syllabusIds.map(s => `<span class="badge">${s}</span>`).join('')}</div>
      <div class="qtitle">${esc(q.title)}</div>
      <div class="qtext">${q.questionHtml}</div>
      <div>${q.choices.map((c,i) => `<div class="choice ${i+1===q.answer?'correct':''}">
        <span class="num">${i+1}</span><span>${c}</span></div>`).join('')}</div>
    </div>
    <div class="exp">${q.explanationHtml}</div>
    <div class="navbtns">
      <button class="btn ghost" id="ePrev" ${expIndex===0?'disabled':''} type="button">← 前の解説</button>
      <button class="btn ghost" id="eNext" ${expIndex===99?'disabled':''} type="button">次の解説 →</button>
    </div>
    <div class="row"><input type="text" id="eJump" placeholder="問番号へ移動（1〜100）" inputmode="numeric"></div>`;
  $('#ePrev').onclick = () => { if(expIndex>0){ expIndex--; vExps(); } };
  $('#eNext').onclick = () => { if(expIndex<99){ expIndex++; vExps(); } };
  $('#eJump').onchange = e => {
    const n = parseInt(e.target.value,10);
    if(n>=1 && n<=100){ expIndex = n-1; vExps(); }
  };
}

/* ---------- 設定 ---------- */
function vSettings(){
  const done = QUESTIONS.filter(q => answered(q.id)).length;
  const weak = QUESTIONS.filter(q => isWeak(q.id)).length;
  app.innerHTML = `
    <h2 class="sec">設定</h2>
    <div class="card">
      <b>学習履歴</b>
      <div class="muted" style="margin:6px 0 0">回答済み ${done}問 ／ 苦手登録 ${weak}問</div>
      <div class="muted">保存先：この端末のブラウザ（localStorage：${LS_KEY}）</div>
    </div>
    <div class="card">
      <b>選択肢のシャッフル</b>
      <div class="muted" style="margin:6px 0 0">初期版ではOFF固定です。正本HTMLの正解番号との整合性を優先しています。</div>
    </div>
    <div class="card">
      <b>学習履歴をリセット</b>
      <div class="muted" style="margin:6px 0 10px">回答履歴・正誤回数・苦手フラグをすべて消去します。取り消せません。</div>
      <button class="btn" id="resetBtn" style="background:var(--ng)" type="button">学習履歴をリセット</button>
    </div>
    <div class="card">
      <b>データについて</b>
      <div class="muted" style="margin:6px 0 0">
        問題・選択肢・正解・解説は「G検定_v1.4_厳選良問100問_統合完成版.html」から機械抽出したもので、原文を一切改変していません。
        シラバスIDはJDLA公式シラバス2024 第1.4版の55項目に対応します（T11は該当問題なし）。</div>
    </div>`;
  $('#resetBtn').onclick = () => {
    if(confirm('本当にリセットしますか？\n回答履歴・苦手登録がすべて消去され、元に戻せません。')){
      STORE.history = {}; saveStore(); alert('学習履歴をリセットしました。'); render('home');
    }
  };
}

/* ============================================================
   起動
   ============================================================ */
document.getElementById('fnav').onclick = e => {
  const b = e.target.closest('[data-nav]'); if(!b) return;
  session = null; render(b.dataset.nav);
};
document.getElementById('homeBtn').onclick = () => { session = null; render('home'); };

loadStore();
render('home');
</script>
</body>
