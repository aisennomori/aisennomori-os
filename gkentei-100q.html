const PRACTICE_QUESTIONS = [{"id":"P001","topic":"適合率の計算","type":"calculation","syllabus":["T10"],"relatedQuestions":[5,6,7],"question":"ある疾患のスクリーニングAIを検証した。検証データに含まれる実際の陽性は150件である。このAIが陽性と判定したのは120件で、そのうち実際に陽性だったのは90件だった。このモデルの適合率として最も適切なものはどれか。","choices":["80%","60%","75%","45%"],"answer":3,"explanation":"適合率は「陽性と予測したもののうち、実際に陽性だった割合」なので、90 ÷ 120 = 0.75、すなわち75%です。／誤答を切るポイント：60%は 90 ÷ 150 で、これは再現率です。実際の陽性150件という数値は再現率を計算させるための情報で、適合率には使いません。80%と45%はいずれの定義にも対応しません。／混同ポイント：適合率の分母は「予測した陽性の数」、再現率の分母は「実際の陽性の数」。問題文に両方の数値が出てきたときは、どちらを分母にするかで答えが変わります。／試験ポイント：分母が「予測」なら適合率、「実際」なら再現率。"},{"id":"P002","topic":"見逃しコストと指標選択","type":"scenario","syllabus":["T10"],"relatedQuestions":[5,6,7],"question":"がんの一次スクリーニングを行うAIを改善したい。このシステムでは、陽性と判定された人は後日必ず精密検査を受けるため、誤って陽性と判定しても精密検査で覆すことができる。一方、陰性と判定された人はそのまま経過観察となる。この状況で優先的に改善すべき指標として最も適切なものはどれか。","choices":["再現率を上げる","適合率を上げる","正解率を上げる","偽陽性率を下げる"],"answer":1,"explanation":"このシステムでは、誤って陽性としても精密検査で救済されますが、誤って陰性とすると見逃しがそのまま放置されます。見逃し（偽陰性）を減らすことが最優先なので、実際の陽性をどれだけ拾えたかを表す再現率を上げるべきです。／誤答を切るポイント：適合率を上げる、偽陽性率を下げるは、いずれも誤った陽性を減らす方向で、このケースでは救済可能なコストを減らそうとしていることになります。正解率は陰性が大多数を占める場面では見逃しがあっても高い値になりやすく、指標として適切ではありません。／混同ポイント：どちらを優先するかは指標の性能ではなく、誤りのコストの非対称性で決まります。／試験ポイント：見逃しが致命的なら再現率、誤検知のコストが高いなら適合率。"},{"id":"P003","topic":"シンボルグラウンディング問題とフレーム問題の区別","type":"comparison","syllabus":["T02"],"relatedQuestions":[1,2],"question":"家庭用ロボットの開発中に、次の2つの現象が観察された。\n\n（ア）「コップを取って」と指示すると、目の前の物体のどれがコップに該当するのかを結びつけられない。\n（イ）「部屋を掃除して」と指示すると、考慮すべき事柄が際限なく広がり、どこまで考えれば行動してよいのか決められない。\n\n（ア）と（イ）に対応する問題の組み合わせとして最も適切なものはどれか。","choices":["（ア）フレーム問題　（イ）シンボルグラウンディング問題","（ア）トイ・プロブレム　（イ）知識獲得のボトルネック","（ア）シンボルグラウンディング問題　（イ）中国語の部屋","（ア）シンボルグラウンディング問題　（イ）フレーム問題"],"answer":4,"explanation":"（ア）は「コップ」という記号を現実世界の対象に結びつけられない現象なので、シンボルグラウンディング問題です。（イ）は考慮すべき事柄の範囲を限定できない現象なので、フレーム問題です。／誤答を切るポイント：トイ・プロブレムは現実より単純化された問題設定を指し、この場面には当てはまりません。知識獲得のボトルネックは専門知識をシステムへ取り込む困難さのことです。中国語の部屋は、記号操作ができることと意味を理解していることは別だという思考実験で、（イ）の説明にはなりません。／混同ポイント：記号と意味の結びつきがシンボルグラウンディング、考慮範囲の限定がフレーム問題。／試験ポイント：「意味が分からない」ならシンボルグラウンディング、「どこまで考えるか決まらない」ならフレーム問題。"},{"id":"P004","topic":"学習の種類の判別","type":"scenario","syllabus":["T07","T08","T09"],"relatedQuestions":[65,66,76],"question":"ある小売企業が次の3つの案件をAIで扱おうとしている。\n\n（ア）過去の来店客データから、事前にラベル付けをせずに顧客をいくつかのグループに分けたい。\n（イ）倉庫内を走行するロボットが、試行錯誤しながら衝突を避けて最短で荷物を運ぶ動きを身につけるようにしたい。\n（ウ）過去の販売実績と気温から、翌日の売上金額を予測したい。\n\n（ア）（イ）（ウ）に対応する学習の種類の組み合わせとして最も適切なものはどれか。","choices":["（ア）教師あり学習　（イ）強化学習　（ウ）教師なし学習","（ア）教師なし学習　（イ）強化学習　（ウ）教師あり学習","（ア）教師なし学習　（イ）教師あり学習　（ウ）強化学習","（ア）強化学習　（イ）教師なし学習　（ウ）教師あり学習"],"answer":2,"explanation":"（ア）は正解ラベルを与えずに構造を見つける作業なのでクラスタリング、すなわち教師なし学習です。（イ）は行動の結果として得られる報酬をもとに試行錯誤で方策を獲得するので強化学習です。（ウ）は過去の実績という正解付きデータから連続値を予測するので教師あり学習の回帰問題です。／誤答を切るポイント：他の選択肢はいずれか1つ以上の対応が入れ替わっています。（ウ）の売上金額のように正解の数値が過去データとして存在する場合は教師あり学習であり、教師なし学習ではありません。／混同ポイント：判別の鍵は「正解ラベルがあるか」「報酬による試行錯誤があるか」の2点です。／試験ポイント：ラベルあり→教師あり、ラベルなし→教師なし、報酬と試行錯誤→強化学習。"},{"id":"P005","topic":"活性化関数の使い分け","type":"application","syllabus":["T12"],"relatedQuestions":[67,77],"question":"画像を10種類のカテゴリのいずれか1つに分類するディープラーニングモデルを設計している。中間層と出力層に用いる活性化関数の組み合わせとして最も適切なものはどれか。","choices":["中間層：ReLU関数　出力層：ソフトマックス関数","中間層：ソフトマックス関数　出力層：シグモイド関数","中間層：シグモイド関数　出力層：ReLU関数","中間層：ReLU関数　出力層：ReLU関数"],"answer":1,"explanation":"中間層には勾配消失が起きにくいReLU関数が広く用いられます。出力層は10クラスから1つを選ぶ多クラス分類なので、各クラスの確率の総和が1になるソフトマックス関数が適切です。／誤答を切るポイント：出力層にReLUを使うと出力が確率になりません。シグモイドを中間層に多用すると勾配消失が起きやすくなります。出力層にシグモイドを使うのは2値分類や、複数ラベルを同時に取りうる多ラベル分類の場合です。／混同ポイント：多クラス分類（1つだけ選ぶ）はソフトマックス、多ラベル分類（複数該当しうる）は各出力にシグモイド。／試験ポイント：中間層はReLU、排他的な多クラス出力はソフトマックス。"},{"id":"P006","topic":"画像認識タスクの選択","type":"scenario","syllabus":["T26"],"relatedQuestions":[69,78],"question":"工場のベルトコンベア上を流れる複数の部品について、1枚の画像から「同じ種類の部品が何個あるか」を数え、さらに個々の部品の輪郭を画素単位で切り出して寸法を測定したい。この目的に最も適した画像認識タスクはどれか。","choices":["画像分類","セマンティックセグメンテーション","インスタンスセグメンテーション","物体検出"],"answer":3,"explanation":"個体を1つずつ区別して数えたうえで、輪郭を画素単位で取得する必要があるため、インスタンスセグメンテーションが適切です。／誤答を切るポイント：画像分類は画像全体に1つのラベルを付けるだけで、個数も位置も分かりません。物体検出は矩形で位置と個数は分かりますが、画素単位の輪郭は得られません。セマンティックセグメンテーションは画素単位で領域を塗り分けますが、同じ種類の部品どうしを個体として区別しないため、個数を数えられません。／混同ポイント：「個体を区別するか」がセマンティックとインスタンスの分かれ目、「画素単位か矩形か」が物体検出との分かれ目です。／試験ポイント：個体の区別＋画素単位＝インスタンスセグメンテーション。"},{"id":"P007","topic":"音声の特徴表現とタスクの対応","type":"cross_topic","syllabus":["T28","T27"],"relatedQuestions":[71,13,70],"question":"会議の録音データから、（1）発言内容を文字に起こす機能と、（2）その発言が参加者A・B・Cのうち誰のものかを判別する機能の2つを実装する。両方の機能に共通して用いられる音声の特徴表現と、（2）に対応するタスク名の組み合わせとして最も適切なものはどれか。","choices":["特徴表現：ワンホットベクトル　　タスク：話者識別","特徴表現：メル周波数ケプストラム係数（MFCC）　　タスク：話者識別","特徴表現：メル周波数ケプストラム係数（MFCC）　　タスク：音声認識","特徴表現：TF-IDF　　タスク：感情分析"],"answer":2,"explanation":"MFCCは人間の聴覚特性に基づいて音声の周波数特性を表す特徴量で、音声認識にも話者識別にも共通して用いられます。（2）の「誰が話しているか」を判別するタスクは話者識別です。／誤答を切るポイント：ワンホットベクトルとTF-IDFはいずれも自然言語処理で単語や文書を表す手法であり、音声波形の特徴表現ではありません。タスク名について、音声認識は「何を言ったか」を扱うので（2）には対応せず、感情分析は話者の同定をしません。／混同ポイント：特徴表現とタスクは別の階層の概念です。同じ特徴量から、音声認識・話者識別・感情分析という異なるタスクが構築されます。／試験ポイント：MFCCは音声処理の共通特徴量。Whatが音声認識、Whoが話者識別。"},{"id":"P008","topic":"過学習の兆候と対策","type":"error_detection","syllabus":["T10","T14"],"relatedQuestions":[4,40],"question":"画像分類モデルの学習中、訓練データに対する正解率は99%まで上昇し続けたが、検証データに対する正解率は途中から低下し始めた。この状況への対応として最も適切でないものはどれか。","choices":["ドロップアウトを導入する","データ拡張によって学習データを水増しする","早期終了によって学習を打ち切る","モデルの層をさらに深くして表現力を高める"],"answer":4,"explanation":"訓練データの性能だけが上がり検証データの性能が下がるのは過学習の典型的な兆候です。この状況でモデルの表現力をさらに高めると過学習は悪化します。したがって最も適切でない対応です。／誤答を切るポイント：ドロップアウトは一部のユニットを確率的に無効化する正則化、データ拡張は学習データの多様性を増やす手法、早期終了は検証誤差が悪化した時点で学習を止める手法で、いずれも過学習を抑える方向に働きます。／混同ポイント：この設問は「適切でないもの」を選ばせています。過学習と未学習では取るべき対策が正反対になる点に注意が必要です。／試験ポイント：訓練だけ良く検証が悪い＝過学習。表現力を上げるのは未学習への対策。"},{"id":"P009","topic":"混同行列からの指標算出","type":"calculation","syllabus":["T10"],"relatedQuestions":[5,6,7],"question":"ある2値分類モデルを検証したところ、真陽性が40件、偽陽性が10件、偽陰性が20件、真陰性が130件であった。このモデルの再現率として最も適切なものはどれか。","choices":["85%","80%","約67%","約31%"],"answer":3,"explanation":"再現率は「実際に陽性のもののうち、陽性と予測できた割合」なので、真陽性 ÷（真陽性＋偽陰性）＝ 40 ÷（40＋20）＝ 約66.7%、すなわち約67%です。／誤答を切るポイント：80%は 40 ÷（40＋10）で適合率です。85%は（40＋130）÷ 200 で正解率です。約31%はいずれの定義にも対応しません。／混同ポイント：偽陰性は「実際は陽性なのに陰性と予測したもの」で、再現率の分母に含まれます。適合率の分母に入るのは偽陽性です。／試験ポイント：再現率の分母は TP＋FN、適合率の分母は TP＋FP。"},{"id":"P010","topic":"データリーケージの発見","type":"error_detection","syllabus":["T36","T10"],"relatedQuestions":[49],"question":"顧客の解約を予測するモデルを構築したところ、検証データでも99%という極めて高い正解率が得られた。しかし実運用に投入すると精度が大きく低下した。原因として最も疑わしいものはどれか。","choices":["予測時点では取得できないはずの情報が特徴量に含まれていた","学習に用いたデータの件数が不足しており、汎化していなかった","検証データの件数が多すぎて、評価が楽観的になっていた","中間層の活性化関数の選択が不適切で、表現力が不足していた"],"answer":1,"explanation":"検証時には高性能なのに運用で崩れる典型的な原因はデータリーケージです。たとえば「解約手続きの受付日」のように、予測したい時点ではまだ得られない情報が特徴量に混入していると、検証段階では不自然に高い精度が出ます。／誤答を切るポイント：学習データ不足であれば検証データでも精度は上がりません。検証データが多いことは精度低下の原因になりません。活性化関数の不適切さは検証段階から精度に表れます。／混同ポイント：過学習は「訓練は良いが検証が悪い」、リーケージは「検証まで良いのに運用で悪い」という現れ方の違いがあります。／試験ポイント：検証まで異常に高精度なら、まずリーケージを疑う。"},{"id":"P011","topic":"事前学習・転移学習・破滅的忘却の関係","type":"cross_topic","syllabus":["T31"],"relatedQuestions":[41,42,64],"question":"大規模モデルの開発と活用の過程で、次の3つの事象があった。\n\n（ア）ラベルの付いていない大量のテキストについて、文中の一部を隠して当てさせる方式で汎用的な表現を獲得させた。\n（イ）こうして得られたモデルを、自社の製品分類という別のタスクへ流用したところ、少量のデータで高い精度が得られた。\n（ウ）その後さらに別のタスクを追加で学習させたところ、（イ）で獲得していた製品分類の精度が大きく低下した。\n\n（ア）（イ）（ウ）に対応する用語の組み合わせとして最も適切なものはどれか。","choices":["（ア）半教師あり学習　（イ）転移学習　（ウ）過学習","（ア）自己教師あり学習　（イ）転移学習　（ウ）破滅的忘却","（ア）自己教師あり学習　（イ）事前学習　（ウ）勾配消失問題","（ア）半教師あり学習　（イ）ファインチューニング　（ウ）破滅的忘却"],"answer":2,"explanation":"（ア）はラベルなしデータから疑似的な正解を作り出して学習する自己教師あり学習です。（イ）は事前学習で得た知識を別タスクへ活かしているので転移学習です。（ウ）は新しいタスクの学習によって以前の能力が失われる破滅的忘却です。／誤答を切るポイント：半教師あり学習はラベル付きとラベルなしのデータを併用する手法で、（ア）のようにラベルを一切使わない方式とは異なります。（イ）を事前学習とすると、事前学習はむしろ（ア）の段階を指すため対応がずれます。（ウ）は訓練データへの適合しすぎではないので過学習ではなく、勾配が伝わらない現象でもありません。／混同ポイント：自己教師あり学習と半教師あり学習、事前学習と転移学習は、いずれも似た文脈で登場するため取り違えやすい組み合わせです。／試験ポイント：ラベルなしから疑似ラベルを作るのが自己教師あり、別タスクへ活かすのが転移学習、旧タスクを忘れるのが破滅的忘却。"},{"id":"P012","topic":"勾配消失の原因と対策","type":"cross_topic","syllabus":["T12","T15","T21"],"relatedQuestions":[33,39,67],"question":"層を深く積んだニューラルネットワークで、出力層から遠い層のパラメータがほとんど更新されなくなった。この問題への対策として適切でないものはどれか。","choices":["中間層の活性化関数をシグモイド関数からReLU関数へ変更する","スキップ結合を導入する","学習率を極端に小さくする","バッチ正規化を導入する"],"answer":3,"explanation":"出力層から遠い層が更新されないのは勾配消失問題です。学習率をさらに小さくすると更新量はいっそう小さくなり、問題は改善しません。したがって適切でない対策です。／誤答を切るポイント：シグモイド関数は微分値の最大が0.25程度で、層を重ねると勾配が急速に小さくなります。ReLUへの変更は有効です。スキップ結合は勾配が浅い層まで直接伝わる経路を作るため有効です。バッチ正規化も各層の入力分布を安定させ、勾配消失の緩和に寄与します。／混同ポイント：勾配消失と勾配爆発は原因も対策も異なります。勾配爆発には勾配クリッピングが用いられます。／試験ポイント：勾配消失の主な対策はReLU、スキップ結合、正規化層。"},{"id":"P013","topic":"検証方法の選択","type":"application","syllabus":["T10"],"relatedQuestions":[5,73],"question":"収集できたデータが200件しかない状況で、モデルの汎化性能をできるだけ安定して見積もりたい。検証方法として最も適切なものはどれか。","choices":["検証を行わず訓練誤差のみで判断する","データを1回だけ8対2に分けるホールドアウト検証","学習データ全件でそのまま評価する","k-分割交差検証"],"answer":4,"explanation":"データが少ない場合、1回だけの分割では分け方の偶然によって評価結果が大きく振れます。k-分割交差検証は分割を変えながら複数回評価して平均をとるため、限られたデータでも安定した推定が得られます。／誤答を切るポイント：ホールドアウト検証は手軽ですが、少量データでは推定のばらつきが大きくなります。学習データで評価すると過学習を検出できません。訓練誤差だけでは汎化性能を測れません。／混同ポイント：交差検証は計算コストが増える代わりに推定が安定します。データが十分に多い場合はホールドアウトでも問題ありません。／試験ポイント：データが少ないときは k-分割交差検証。"},{"id":"P014","topic":"制約条件に応じた軽量化手法の選択","type":"scenario","syllabus":["T34"],"relatedQuestions":[47,34],"question":"高精度だが大規模なモデルを、計算資源の限られたエッジ端末で動かしたい。次の2つの状況について、それぞれ適した軽量化手法を検討している。\n\n（ア）再学習を行うだけの計算資源が確保できず、モデルの構造も変更したくない。\n（イ）再学習の計算資源は確保できており、より小さな別構造のモデルを新たに用意してもよい。\n\n（ア）（イ）に適した手法の組み合わせとして最も適切なものはどれか。","choices":["（ア）量子化　（イ）蒸留","（ア）量子化　（イ）プルーニング","（ア）プルーニング　（イ）データ拡張","（ア）蒸留　（イ）量子化"],"answer":1,"explanation":"（ア）はモデルの構造を変えず、パラメータを低いビット数で表現するだけでサイズと計算量を減らせる量子化が適します。（イ）は教師となる大きなモデルの出力を用いて、別に用意した小さなモデルを学習させる蒸留が適します。／誤答を切るポイント：蒸留は生徒モデルの学習が必要なので、再学習の資源がない（ア）には使えません。プルーニングは重要度の低い結合やユニットを削除するため構造が変わり、通常は再学習を伴うので（ア）に適しません。データ拡張は学習データを水増しする手法であり、軽量化の手法ではありません。／混同ポイント：量子化とプルーニングは既存モデルを小さくする方向、蒸留は小さなモデルを別途学習させる方向です。再学習の要否と構造変更の要否が選択の分かれ目になります。／試験ポイント：構造を変えず再学習も不要なら量子化、別の小型モデルを育てるなら蒸留。"},{"id":"P015","topic":"データ形式に応じた解釈性手法の選択","type":"scenario","syllabus":["T33"],"relatedQuestions":[45,46],"question":"社内の2つのAIについて、判断根拠を示すよう求められた。\n\n（ア）畳み込みニューラルネットワークによる医用画像の判定について、画像のどの領域を見て判断したのかを示したい。\n（イ）表形式データを用いた与信審査モデルについて、個々の申込みごとに、どの特徴量がどの向きにどれだけ寄与したのかを示したい。\n\n（ア）（イ）に適した手法の組み合わせとして最も適切なものはどれか。","choices":["（ア）SHAP　（イ）Grad-CAM","（ア）Grad-CAM　（イ）Permutation Importance","（ア）Grad-CAM　（イ）SHAP","（ア）Permutation Importance　（イ）SHAP"],"answer":3,"explanation":"（ア）は畳み込みニューラルネットワークが注目した画像領域をヒートマップで可視化するGrad-CAMが適します。（イ）は個々の予測に対する各特徴量の寄与を符号つきで算出できるSHAPが適します。／誤答を切るポイント：Permutation Importanceは特徴量を並べ替えたときの性能低下からモデル全体としての重要度を測る手法で、1件ごとの予測理由を説明するものではありません。SHAPは表形式データの寄与度説明に向き、画像の注目領域を直接示す用途ではGrad-CAMが一般的です。／混同ポイント：説明の対象が「モデル全体」か「個々の予測」か、扱うデータが画像か表形式かで、適した手法が変わります。／試験ポイント：画像の注目領域はGrad-CAM、個別予測への特徴量の寄与はSHAP、全体の重要度はPermutation Importance。"},{"id":"P016","topic":"個人情報・個人データ・保有個人データの区別","type":"legal_case","syllabus":["L01"],"relatedQuestions":[81],"question":"ある企業が、取引先の担当者からもらった名刺を1枚受け取り、まだどこにも登録せず机上に置いている。翌日、その名刺の情報を検索可能な顧客管理システムへ登録した。登録前と登録後の位置づけとして最も適切なものはどれか。","choices":["登録前は個人情報にあたらず、登録後に初めて個人情報となる","登録前後を通じて個人情報であり、登録後は個人データにもあたる","登録前から個人データであり、登録後に保有個人データとなる","登録の有無にかかわらず、いずれも匿名加工情報として扱われる"],"answer":2,"explanation":"名刺は特定の個人を識別できる情報なので、登録前から個人情報にあたります。検索可能な形で体系的に整理されたデータベース等を構成すると、それは個人データにもあたります。／誤答を切るポイント：個人情報かどうかは識別可能性で決まり、データベース化の有無では決まりません。個人データは体系的に整理されて初めて成立するため、登録前から個人データとするのは誤りです。匿名加工情報は特定の個人を識別できないよう加工したもので、名刺は該当しません。／混同ポイント：個人情報は「識別できるか」、個人データは「データベース等を構成するか」、保有個人データは「開示・訂正等の権限を持つか」で区別します。／試験ポイント：個人情報 ⊃ 個人データ ⊃ 保有個人データ の入れ子関係。"},{"id":"P017","topic":"匿名加工情報と仮名加工情報の使い分け","type":"legal_case","syllabus":["L01"],"relatedQuestions":[17],"question":"小売企業が保有する購買履歴を、社内の分析部門だけで利用目的の範囲内で分析したいと考えている。外部へ提供する予定はなく、必要に応じて元の情報と照合できる状態を保っておきたい。この目的に最も適した制度はどれか。","choices":["個人関連情報として第三者へ提供する","匿名加工情報として加工する","要配慮個人情報として管理する","仮名加工情報として加工する"],"answer":4,"explanation":"仮名加工情報は、他の情報と照合しない限り特定の個人を識別できないように加工したもので、事業者内部での分析に用いることが想定されています。外部提供の予定がなく、必要に応じて照合できる状態を残したいという条件に合致します。／誤答を切るポイント：匿名加工情報は復元できないように加工するため、元情報との照合はできません。外部提供やデータ流通にも利用しやすい制度です。要配慮個人情報は病歴や信条など取得に原則同意が必要な情報の類型であり、加工の制度ではありません。個人関連情報は今回の目的と関係しません。／混同ポイント：復元可能性と第三者提供の可否が2つの制度の分かれ目です。／試験ポイント：照合を残して内部分析するなら仮名加工情報、復元できない形にして流通させやすくするなら匿名加工情報。用途によって使い分けるものであり、どちらか一方に決まる絶対のルールではありません。"},{"id":"P018","topic":"第三者提供と委託の区別","type":"legal_case","syllabus":["L01"],"relatedQuestions":[83],"question":"A社が保有する顧客の個人データを、AIモデルの開発を依頼したベンダーB社へ渡す。B社はA社の指示の範囲内でのみそのデータを取り扱い、自社の目的には利用しない。この取扱いについて最も適切なものはどれか。","choices":["委託にあたるため本人の同意は不要だが、A社にはB社を監督する義務がある","第三者提供にあたるため、本人の同意が必要である","委託にあたるため、A社はB社の取扱いについて一切責任を負わない","オプトアウトの手続きをとれば、同意も監督も不要となる"],"answer":1,"explanation":"利用目的の達成に必要な範囲内で取扱いを委託する場合、委託先は「第三者」に該当しないため、本人の同意は不要です。ただし委託元には委託先を監督する義務が課されます。／誤答を切るポイント：委託・事業承継・共同利用は第三者に該当しない3類型なので、同意が必要とするのは誤りです。監督義務は残るため、責任を一切負わないとするのも誤りです。オプトアウトは要配慮個人情報には使えず、また監督義務を免れる制度でもありません。／混同ポイント：同意が不要になることと、責任がなくなることは別問題です。／試験ポイント：第三者に該当しない3類型＝委託・事業承継・共同利用。同意不要でも監督義務は残る。"},{"id":"P019","topic":"著作権法30条の4の適用範囲","type":"legal_case","syllabus":["L02"],"relatedQuestions":[20,85],"question":"ある事業者が、インターネット上で公開されている大量のイラストを収集して画像生成AIを学習させ、そのAIを用いて生成した画像を商品として販売した。著作権法上の整理として最も適切なものはどれか。","choices":["学習も生成物の販売も、30条の4によって一律に適法となる","学習段階から常に著作権者の許諾を得る必要があり、例外は認められない","学習段階は30条の4の対象となりうるが、生成物の販売は類似性と依拠性で判断される","AIの生成物であるため、既存の著作物との類似性は問題にならない"],"answer":3,"explanation":"30条の4は、思想または感情の享受を目的としない利用について権利制限を認める規定で、学習段階を支える根拠になります。一方、生成された画像を利用する段階は、人間が作成した場合と同じく既存著作物との類似性と依拠性によって侵害が判断されます。／誤答を切るポイント：30条の4は生成・利用段階にまで及びません。また学習段階が常に許諾を要するわけでもありません。生成物であることを理由に類似性の判断を免れることはありません。／混同ポイント：学習段階と生成・利用段階を分けて考えるのが基本の枠組みです。30条の4にも、著作権者の利益を不当に害する場合という例外があります。／試験ポイント：学習＝30条の4、生成・利用＝類似性＋依拠性。"},{"id":"P020","topic":"著作物性と著作権侵害の区別","type":"legal_case","syllabus":["L02"],"relatedQuestions":[19],"question":"利用者が生成AIに「かわいい猫のイラスト」とだけ入力して画像を得た。この画像は、既存のいかなる著作物にも似ていなかった。この画像に関する説明として最も適切なものはどれか。","choices":["著作物として保護され、かつ著作権侵害にもあたる","著作物として保護される可能性は低いが、著作権侵害にもあたらない","著作物として保護されるが、著作権侵害の有無は判断できない","著作物として保護されず、そのため誰も利用できない"],"answer":2,"explanation":"簡単なプロンプトを入力しただけでは人間の創作的寄与が認められにくく、著作物として保護される可能性は低いと考えられます。一方で既存著作物に類似していない以上、類似性の要件を満たさないため著作権侵害にもあたりません。／誤答を切るポイント：著作物性と侵害の有無は別々に判断される論点です。著作物として保護されないことと、誰も利用できないことは結びつきません。／混同ポイント：AI生成物には「それ自体が著作物か」と「他人の権利を侵害していないか」という2つの独立した論点があります。／試験ポイント：著作物性は創作的寄与、侵害は類似性＋依拠性で判断する。"},{"id":"P021","topic":"新規性と進歩性の区別","type":"legal_case","syllabus":["L03"],"relatedQuestions":[22],"question":"ある研究者が新しい学習アルゴリズムを考案し、特許出願の前に学会で口頭発表を行った。その後、特許を出願した。この場合に最も問題となりうる特許要件はどれか。","choices":["新規性","進歩性","職務発明の要件","営業秘密の秘密管理性"],"answer":1,"explanation":"出願前に公然と知られた発明は新規性を失います。学会発表はその典型例です。ただし一定の要件のもとで新規性喪失の例外規定が適用される場合があります。／誤答を切るポイント：進歩性は「当業者が容易に発明できたものでないか」を問う要件であり、公表の有無とは別の論点です。職務発明は権利の帰属に関する制度です。営業秘密の秘密管理性は不正競争防止法の要件で、特許要件ではありません。／混同ポイント：新規性は「知られていないか」、進歩性は「容易に思いつくか」。公表によって直ちに失われるのは新規性です。／試験ポイント：出願前の公表で問題になるのは新規性。"},{"id":"P022","topic":"知的財産制度の選択","type":"scenario","syllabus":["L02","L03","L04"],"relatedQuestions":[80],"question":"自社で開発した独自の前処理アルゴリズムについて、内容を公開せずに社内で秘匿したまま長期にわたって保護したいと考えている。最も適した保護のあり方はどれか。","choices":["特許出願を行い、特許権として保護する","限定提供データとして外部へ反復提供する","著作権として登録し、表現を保護する","営業秘密として管理し、不正競争防止法による保護を受ける"],"answer":4,"explanation":"内容を公開したくない場合は、秘密として管理したまま保護を受けられる営業秘密が適しています。秘密管理性・有用性・非公知性の三要件を満たす必要があります。／誤答を切るポイント：特許は出願内容が公開されることが前提で、公開の代償として一定期間の独占権を得る制度です。存続期間も出願から20年に限られます。著作権は表現を保護するもので、アルゴリズムという技術的思想そのものは保護対象になりません。また日本の著作権は登録なしに発生します。限定提供データは特定の相手へ反復継続して提供するデータを保護する制度で、秘匿し続ける今回の方針とは合いません。／混同ポイント：公開するか秘匿するかが特許と営業秘密の分岐点です。／試験ポイント：公開の代償に独占権なら特許、秘匿したまま守るなら営業秘密。"},{"id":"P023","topic":"営業秘密と限定提供データの区別","type":"legal_case","syllabus":["L04"],"relatedQuestions":[87],"question":"あるデータ事業者が、会員企業に対して有償で継続的に提供している大規模な走行データがある。このデータは会員企業の間では共有されており、業界内では内容が知られている。このデータの保護について最も適切なものはどれか。","choices":["営業秘密の三要件を満たすため、営業秘密として保護される","非公知性を欠くため、いかなる保護も受けられない","非公知性を欠くため営業秘密としての保護は難しいが、限定提供データとして保護されうる","著作権法上の著作物として当然に保護される"],"answer":3,"explanation":"会員企業の間で共有され業界内で知られている以上、営業秘密の要件のうち非公知性を満たしません。一方、限定提供データは非公知性を要件としないため、限定提供性・相当蓄積性・電磁的管理性を満たせば保護されうります。／誤答を切るポイント：非公知性を欠くからといって保護が一切ないわけではなく、そのために設けられたのが限定提供データの制度です。営業秘密の三要件を満たすとする選択肢は前提が誤っています。データが当然に著作物になるわけでもありません。／混同ポイント：非公知性を要するかどうかが、営業秘密と限定提供データの決定的な違いです。／試験ポイント：限定提供データは非公知性を要しない。"},{"id":"P024","topic":"AI開発契約の類型と精度保証","type":"legal_case","syllabus":["L06"],"relatedQuestions":[26,27,90],"question":"ユーザー企業がベンダーへAI開発を委託するにあたり、検証段階（PoC）の契約について「正解率95%以上を達成できなければ報酬を支払わない」という条項を求めた。この要求に対する評価として最も適切なものはどれか。","choices":["PoC段階でも成果を明確にすべきであり、請負契約として完成義務を課すのが望ましい","AIの性能は学習データに依存し事前に確約できないため、PoC段階での精度保証の要求は適切でない","精度保証は法律で義務づけられているため、条項の有無にかかわらず当然に成立する","PoC段階では契約を締結せず、口頭合意で進めるのが一般的である"],"answer":2,"explanation":"AIの性能は学習データの質と量に依存し、開発前に到達精度を確約することは困難です。そのためPoC段階では準委任型の契約が適する場合が多く、精度保証や完成義務を課さない形が検討されます。／誤答を切るポイント：請負契約は仕事の完成義務を伴うため、成果が事前に確定できないAI開発の検証段階には馴染みません。精度保証を法律が義務づけている事実はありません。契約を締結せずに進めるのは、知的財産の帰属や秘密保持の面で危険です。／混同ポイント：請負は完成義務、準委任は善管注意義務。義務の性質が異なります。／試験ポイント：成果や精度が事前に確定しにくいPoCでは準委任型が選択されることがある。安易な精度保証の要求は適切でない。"},{"id":"P025","topic":"SLAの可用性とAI精度保証の区別","type":"legal_case","syllabus":["L07"],"relatedQuestions":[91,52],"question":"SaaS型のAIサービスの契約書に「稼働率99.9%を保証する」と記載されていた。利用開始後、サービスは常時稼働していたが、判定結果の精度が期待を下回った。この状況の評価として最も適切なものはどれか。","choices":["稼働率が保証されている以上、利用者は精度について一切主張できない","稼働率の保証には判定精度の保証も含まれるため、契約違反である","SaaS型では精度保証が法律上義務づけられているため、当然に契約違反となる","稼働率はサービスが利用できる状態にあることの保証であり、判定精度の保証とは別のものである"],"answer":4,"explanation":"SLAにおける稼働率はサービスが利用可能な状態にあることを示す指標であり、出力の正しさを保証するものではありません。両者は別個の論点です。／誤答を切るポイント：稼働率に精度保証が含まれるとする理解は誤りです。SaaS型で精度保証が法律上義務づけられている事実もありません。一方で、精度について契約上どのような合意があるかは別途問題になりうるため、一切主張できないとするのも言い過ぎです。／混同ポイント：可用性（使えるか）と精度（正しいか）を分けて考えることが重要です。／試験ポイント：SLAの稼働率と AI の精度保証は別物。"},{"id":"P026","topic":"規範の種類とリスクベースアプローチ","type":"scenario","syllabus":["L08"],"relatedQuestions":[79,92],"question":"ある国が、AIの用途を危険度に応じて段階分けし、生命や基本的人権に関わる用途には厳格な義務を課す一方、影響の小さい用途には規制を課さない法制度を導入した。この制度の性格として最も適切なものはどれか。","choices":["ハードローであり、リスクベースアプローチを採用している","ソフトローであり、リスクベースアプローチを採用している","ハードローであり、すべての用途へ一律の規制を課している","ソフトローであり、すべての用途へ一律の規制を課している"],"answer":1,"explanation":"法律として制定され義務を課す以上、強制力を伴うハードローです。また危険度に応じて規制の強度を変えているので、リスクベースアプローチにあたります。／誤答を切るポイント：ソフトローはガイドラインや行動規範のように法的拘束力を持たない規範を指すため、この制度には当てはまりません。危険度に応じて分けている以上、一律規制でもありません。／混同ポイント：ハードローかソフトローかは「強制力の有無」、リスクベースかどうかは「規制の強度を変えるか」で、独立した2つの軸です。／試験ポイント：規制資源を高リスク領域へ集中させ、低リスク用途の萎縮を避けるのがリスクベースアプローチの狙い。"},{"id":"P027","topic":"バイ・デザインの2類型の区別","type":"comparison","syllabus":["L09","L11"],"relatedQuestions":[74,94],"question":"AIサービスの設計段階で、次の2つの方針を採用した。\n\n（ア）取得する個人データを必要最小限にとどめ、初期設定を最もプライバシー保護的な状態にする。\n（イ）学習データや推論APIへの不正アクセスを防ぐ仕組みを、開発の初期から組み込む。\n\n（ア）（イ）に対応する概念の組み合わせとして最も適切なものはどれか。","choices":["（ア）セキュリティ・バイ・デザイン　（イ）プライバシー・バイ・デザイン","（ア）プライバシー・バイ・デザイン　（イ）プライバシー・バイ・デザイン","（ア）プライバシー・バイ・デザイン　（イ）セキュリティ・バイ・デザイン","（ア）人間中心の原則　（イ）トレーサビリティ"],"answer":3,"explanation":"（ア）は個人データの取得と初期設定に関する方針なのでプライバシー・バイ・デザイン、（イ）は不正アクセス対策に関する方針なのでセキュリティ・バイ・デザインです。／誤答を切るポイント：2つの概念は対になっていますが、守る対象が異なります。人間中心の原則は AI が人間の尊厳を損なわないという価値原則、トレーサビリティは履歴を追跡できることで、いずれもこの場面の説明にはなりません。／混同ポイント：どちらも「設計段階から組み込む」点は共通で、対象がプライバシーかセキュリティかで区別します。／試験ポイント：事後対応ではなく事前の設計に組み込むという発想が両者に共通する。"},{"id":"P028","topic":"AIへの攻撃類型の区別","type":"scenario","syllabus":["L11"],"relatedQuestions":[29,30,95],"question":"公開している画像判定APIについて、次の2つの被害が確認された。\n\n（ア）人間には判別できないごく小さなノイズを加えた画像を送られ、判定を誤らせられた。\n（イ）大量の問い合わせと出力の観察を繰り返され、ほぼ同等の性能を持つモデルを外部で再現された。\n\n（ア）（イ）に対応する攻撃の組み合わせとして最も適切なものはどれか。","choices":["（ア）データ汚染　（イ）モデル窃取","（ア）Adversarial Attack　（イ）データ汚染","（ア）モデル窃取　（イ）Adversarial Attack","（ア）Adversarial Attack　（イ）モデル窃取"],"answer":4,"explanation":"（ア）は入力に微小な摂動を加えて誤分類させるAdversarial Attackです。（イ）はAPIへの問い合わせと出力からモデルを複製するモデル窃取です。／誤答を切るポイント：データ汚染は学習データへ悪意あるデータを混入させ、モデルの挙動そのものを歪める攻撃で、いずれの被害の説明にもなりません。／混同ポイント：攻撃される段階が異なります。データ汚染は学習段階、Adversarial Attack は推論段階の入力、モデル窃取は推論段階の出力を狙います。／試験ポイント：学習データを汚すのがデータ汚染、入力を細工するのがAdversarial Attack、出力から複製するのがモデル窃取。"},{"id":"P029","topic":"フィルターバブルとエコーチェンバーの区別","type":"comparison","syllabus":["L14"],"relatedQuestions":[57,97],"question":"SNSで次の2つの現象が観察された。\n\n（ア）推薦アルゴリズムが利用者の関心に合う情報ばかりを表示し、それ以外の情報に触れにくくなった。\n（イ）似た意見を持つ利用者どうしが集まって発言を繰り返し、その意見がいっそう強固になった。\n\n（ア）（イ）に対応する概念の組み合わせとして最も適切なものはどれか。","choices":["（ア）フィルターバブル　（イ）エコーチェンバー","（ア）エコーチェンバー　（イ）フィルターバブル","（ア）ディープフェイク　（イ）エコーチェンバー","（ア）フィルターバブル　（イ）フェイクニュース"],"answer":1,"explanation":"（ア）はアルゴリズムによる情報の選別で利用者が泡の中に閉じ込められる現象なのでフィルターバブル、（イ）は同質な意見が反響し合って増幅される現象なのでエコーチェンバーです。／誤答を切るポイント：ディープフェイクは生成技術による偽の映像や音声を指し、情報環境の偏りとは別の論点です。／混同ポイント：フィルターバブルはアルゴリズムが主因、エコーチェンバーは似た者どうしが集まる人間側の力学が主因という違いがあります。／試験ポイント：アルゴリズムが囲い込むのがフィルターバブル、同質な意見が反響するのがエコーチェンバー。"},{"id":"P030","topic":"AIガバナンスの手法の区別","type":"cross_topic","syllabus":["L18"],"relatedQuestions":[98,99,100],"question":"金融機関が与信審査AIを導入するにあたり、次の対応をとった。\n\n（ア）導入前に、差別的な結果が生じないかを組織として評価する手続きを実施した。\n（イ）運用開始後も、入力データの分布の変化による性能劣化を継続的に監視した。\n（ウ）どのデータで学習し、どの版のモデルがどの判断を行ったかを後から追跡できるよう記録を残した。\n\n（ア）（イ）（ウ）に対応する概念の組み合わせとして最も適切なものはどれか。","choices":["（ア）モニタリング　（イ）倫理アセスメント　（ウ）再現性","（ア）倫理アセスメント　（イ）モニタリング　（ウ）トレーサビリティ","（ア）倫理アセスメント　（イ）トレーサビリティ　（ウ）モニタリング","（ア）人間の関与　（イ）モニタリング　（ウ）再現性"],"answer":2,"explanation":"（ア）は導入前の事前評価なので倫理アセスメント、（イ）は運用後の継続監視なのでモニタリング、（ウ）は履歴を追跡できるようにする取り組みなのでトレーサビリティです。／誤答を切るポイント：再現性は同じ入力と条件で同じ結果が得られることを指し、履歴の追跡そのものではありません。人間の関与は重要な判断に人間が介在する設計を指し、（ア）の事前評価の説明としては不正確です。／混同ポイント：倫理アセスメントは事前、モニタリングは事後という時間軸の違いがあります。再現性とトレーサビリティは、前者が結果の一致、後者が経緯の追跡です。／試験ポイント：事前＝倫理アセスメント、運用後＝モニタリング、経緯の追跡＝トレーサビリティ。"}];

const PRACTICE_SET2 = [{"id":"P031","topic":"不均衡データにおける指標の判断","type":"calculation","syllabus":["T10"],"relatedQuestions":[5,6,7],"question":"1,000件の取引のうち、不正は50件含まれている。あるモデルはこのうち20件を不正と判定し、その判定は18件が当たっていた。このモデルの評価として最も適切なものはどれか。","choices":["適合率は90%だが再現率は36%であり、不正の多くを見逃している","正解率が96%を超えているため、実運用上の問題はないと判断できる","再現率が90%に達しており、見逃しはほとんど発生していない","適合率と再現率がいずれも90%を超えており、バランスがとれている"],"answer":1,"explanation":"不正と判定した20件のうち18件が正しいので適合率は90%です。一方、実際の不正50件のうち拾えたのは18件なので再現率は36%にとどまり、32件を見逃しています。／誤答を切るポイント：正解率は（18＋948）÷1000で96.6%と高く出ますが、これは正常取引が大多数を占めるためで、不均衡データでは性能を過大評価します。再現率90%、両指標とも90%超という記述はいずれも計算結果と一致しません。／混同ポイント：与えられた数値のどれを分母にするかで答えが変わります。「判定した件数」なら適合率、「実際の件数」なら再現率です。／試験ポイント：陰性が大多数のデータでは正解率を信用せず、適合率と再現率を見る。"},{"id":"P032","topic":"判定閾値の上げ下げと指標の変化","type":"comparison","syllabus":["T10"],"relatedQuestions":[5,6,7],"question":"二値分類モデルが出力する確率について、陽性と判定する閾値を次の2通りに変更することを検討している。\n\n（ア）0.5から0.3へ引き下げる。\n（イ）0.5から0.7へ引き上げる。\n\n（ア）（イ）それぞれで一般に起こる変化の組み合わせとして最も適切なものはどれか。","choices":["（ア）（イ）のいずれでも、再現率と適合率がともに上がる","（ア）再現率は下がりやすく適合率は上がりやすい　（イ）再現率は上がりやすく適合率は下がりやすい","（ア）再現率は上がりやすく適合率は下がりやすい　（イ）再現率は下がりやすく適合率は上がりやすい","（ア）（イ）のいずれでも、閾値は学習時にのみ用いるため指標は変化しない"],"answer":3,"explanation":"閾値を下げると陽性と判定する件数が増えるため、実際の陽性を拾える割合すなわち再現率は上がりやすく、誤って陽性とする件数も増えるので適合率は下がりやすくなります。閾値を上げるとこの関係は逆になります。／誤答を切るポイント：両方が同時に上がることは一般には起きず、この関係はトレードオフとして知られています。閾値は学習後の判定の分かれ目を決めるものなので、変更すれば指標は当然変化します。／混同ポイント：モデル自体を変えなくても閾値の設定だけで両指標のバランスは動きます。ROC曲線はこの閾値を動かしたときの挙動を可視化したものです。／試験ポイント：閾値↓＝陽性を増やす＝再現率↑・適合率↓。閾値↑はその逆。"},{"id":"P033","topic":"教師なし学習の手法選択","type":"application","syllabus":["T08"],"relatedQuestions":[66,8],"question":"顧客データの分析で次の2つを行いたい。\n\n（ア）100個ある特徴量を、情報の損失をできるだけ抑えながら2次元へ圧縮して散布図で可視化したい。\n（イ）事前にグループ数を決めたうえで、顧客を似た者どうしのグループへ分けたい。\n\n（ア）（イ）に適した手法の組み合わせとして最も適切なものはどれか。","choices":["（ア）k-means法　（イ）主成分分析（PCA）","（ア）主成分分析（PCA）　（イ）k-means法","（ア）主成分分析（PCA）　（イ）ロジスティック回帰","（ア）協調フィルタリング　（イ）ウォード法"],"answer":2,"explanation":"（ア）は高次元の情報をできるだけ保ちながら低次元へ落とす作業なので、次元削減の代表手法である主成分分析が適します。（イ）はグループ数をあらかじめ指定してクラスタリングするので、k-means法が適します。／誤答を切るポイント：k-means法は次元削減の手法ではありません。ロジスティック回帰は正解ラベルを必要とする教師あり学習の分類手法です。協調フィルタリングは推薦のための手法で可視化には用いません。ウォード法は階層的クラスタリングで、グループ数を事前に決めて分割する用途とは前提が異なります。／混同ポイント：次元削減とクラスタリングはどちらも教師なし学習ですが、目的が「特徴量を減らす」か「データを分ける」かで異なります。／試験ポイント：可視化のための圧縮は主成分分析、グループ数指定の分割はk-means法。"},{"id":"P034","topic":"多ラベル分類における出力層の設計","type":"application","syllabus":["T12"],"relatedQuestions":[67,77],"question":"1枚の写真に対して「屋外」「人物あり」「夜間」など、複数のタグが同時に成立しうる分類モデルを作りたい。出力層の活性化関数として最も適切なものはどれか。","choices":["ソフトマックス関数を用い、出力の総和が1になるようにする","ReLU関数を用い、負の出力を0に丸める","tanh関数を用い、出力を−1から1の範囲に収める","各出力にシグモイド関数を用い、タグごとに独立して確率を出す"],"answer":4,"explanation":"複数のタグが同時に成立しうる多ラベル分類では、タグごとに独立して「該当するか否か」を判断する必要があります。各出力へシグモイド関数を適用すれば、それぞれ独立した確率として扱えます。／誤答を切るポイント：ソフトマックス関数は出力の総和が1になるため、どれか1つだけを選ぶ排他的な多クラス分類に用いるものです。複数タグが同時に立つ場合には適しません。ReLU関数やtanh関数の出力は確率として解釈できません。／混同ポイント：多クラス分類と多ラベル分類は名前が似ていますが、排他的かどうかが決定的に異なります。／試験ポイント：1つだけ選ぶならソフトマックス、複数同時に成立しうるなら各出力にシグモイド。"},{"id":"P035","topic":"勾配消失と勾配爆発の対策の区別","type":"comparison","syllabus":["T15","T22"],"relatedQuestions":[33,39],"question":"リカレントニューラルネットワークの学習中に、次の2つの現象が別々の実験で観察された。\n\n（ア）誤差が数値として発散し、パラメータが極端に大きな値へ振れて学習が破綻した。\n（イ）入力に近い層のパラメータがほとんど更新されないまま学習が停滞した。\n\n（ア）（イ）への対策として最も適切な組み合わせはどれか。","choices":["（ア）ドロップアウトの導入　（イ）学習率のさらなる縮小","（ア）ゲート機構をもつLSTMの利用　（イ）勾配クリッピング","（ア）勾配クリッピング　（イ）ゲート機構をもつLSTMの利用","（ア）データ拡張の適用　（イ）バッチサイズの拡大"],"answer":3,"explanation":"（ア）は勾配爆発で、勾配の大きさに上限を設ける勾配クリッピングが有効です。（イ）は勾配消失で、ゲート機構によって長期の情報と勾配を保持しやすいLSTMなどの利用が有効です。／誤答を切るポイント：両者を入れ替えた組み合わせは対策の方向が逆になります。ドロップアウトは過学習を抑える正則化、データ拡張は学習データを増やす手法、バッチサイズの拡大は学習の安定性に関わるもので、いずれもこの2つの現象への直接の対策ではありません。学習率をさらに小さくすると、更新されない状態はむしろ悪化します。／混同ポイント：勾配消失と勾配爆発は名前が似ていますが、原因も対策も逆方向です。／試験ポイント：発散なら勾配クリッピング、停滞ならReLU・スキップ結合・ゲート機構。"},{"id":"P036","topic":"L1正則化とL2正則化の使い分け","type":"comparison","syllabus":["T14"],"relatedQuestions":[4],"question":"多数の特徴量を持つ回帰モデルについて、次の2つの狙いがある。\n\n（ア）寄与の小さい特徴量の重みをちょうど0にして、実質的に使用する特徴量を絞り込みたい。\n（イ）特定の特徴量へ重みが偏らないよう、全体的に重みの大きさを抑えたい。\n\n（ア）（イ）に適した正則化の組み合わせとして最も適切なものはどれか。","choices":["（ア）L2正則化　（イ）L1正則化","（ア）L1正則化　（イ）L2正則化","（ア）L1正則化　（イ）ドロップアウト","（ア）バッチ正規化　（イ）L2正則化"],"answer":2,"explanation":"L1正則化は重みの絶対値の和にペナルティを課すため一部の重みがちょうど0になりやすく、特徴量の選択と同じ効果が得られます。L2正則化は重みの二乗和にペナルティを課すため、重みは全体的に小さく抑えられます。／誤答を切るポイント：両者を入れ替えた組み合わせは効果が逆になります。ドロップアウトはニューラルネットワークの学習時にユニットを確率的に無効化する手法で、回帰モデルの重みを恒久的に0にするものではありません。バッチ正規化は各層の入力分布を安定させる手法で、正則化の主目的とは異なります。／混同ポイント：どちらも過学習を抑えますが、重みがちょうど0になるかどうかが決定的な違いです。／試験ポイント：スパースにして絞るならL1、全体を抑えるならL2。ラッソ回帰はL1、リッジ回帰はL2。"},{"id":"P037","topic":"畳み込み層とプーリング層の出力サイズ","type":"calculation","syllabus":["T18","T20"],"relatedQuestions":[36,37,68],"question":"32×32の画像を、5×5のフィルタ、パディングなし、ストライド1の畳み込み層へ入力し、その出力を2×2、ストライド2の最大値プーリング層へ通す。プーリング層から出力される特徴マップのサイズとして最も適切なものはどれか。","choices":["14×14","7×7","28×28","16×16"],"answer":1,"explanation":"畳み込み層の出力は（32 − 5）÷ 1 ＋ 1 ＝ 28 なので28×28です。これを2×2・ストライド2のプーリングへ通すと縦横がそれぞれ半分になり、14×14となります。／誤答を切るポイント：28×28は畳み込み層までで止めた結果で、プーリングを適用していません。16×16は入力32×32を単純に半分にした値で、畳み込みによる縮小を考慮していません。7×7はプーリングを2回適用した場合の値です。／混同ポイント：パディングなしの畳み込みではフィルタサイズの分だけ出力が小さくなります。パディングを入れればサイズを保てます。／試験ポイント：出力サイズ＝（入力 − フィルタ ＋ 2×パディング）÷ ストライド ＋ 1。プーリングはさらに縮小する。"},{"id":"P038","topic":"AttentionがRNNの何を解決したか","type":"scenario","syllabus":["T23","T22"],"relatedQuestions":[11,12],"question":"長い文章の機械翻訳において、リカレントニューラルネットワークによるEncoder-Decoderモデルでは、入力文が長くなるほど精度が落ちる傾向があった。Attentionの導入がこの問題を改善した理由として最も適切なものはどれか。","choices":["学習データを増やさずに済むようになり、過学習が起きにくくなったため","入力の単語数を制限することで、扱う情報量そのものを減らせるようになったため","入力系列を固定長のベクトル1つへ圧縮する必要がなくなり、出力ごとに入力の関連部分を参照できるようになったため","再帰構造を強化して、より長い系列を順番に記憶できるようになったため"],"answer":3,"explanation":"従来のEncoder-Decoderでは入力文全体を固定長のベクトルへ押し込む必要があり、長文ほど情報が失われました。Attentionは出力の各時点で入力のどの部分に注目するかを重み付けして参照できるため、この制約を解消します。／誤答を切るポイント：入力の単語数を制限すれば情報は減るだけで精度改善にはなりません。Attentionは過学習対策の手法ではありません。Transformerは再帰構造を強化したのではなく、むしろ再帰を使わずAttentionのみで系列を扱う構成です。／混同ポイント：Self-Attentionは同じ系列内の関係を捉えるもの、Source-Target Attentionは入力側と出力側の対応を捉えるもので、役割が異なります。／試験ポイント：固定長ベクトルのボトルネックを解消したのがAttentionの本質。"},{"id":"P039","topic":"目的に応じた画像モデルの選択","type":"application","syllabus":["T26"],"relatedQuestions":[69,78],"question":"道路の点検業務で、走行映像から「ひび割れがどの位置にどのくらいの面積で存在するか」を画素単位で把握したい。個々のひび割れを1本ずつ区別する必要はない。この目的に最も適した組み合わせはどれか。","choices":["タスク：物体検出　　代表モデル：YOLO","タスク：セマンティックセグメンテーション　　代表モデル：U-Net","タスク：画像分類　　代表モデル：VGG","タスク：インスタンスセグメンテーション　　代表モデル：Mask R-CNN"],"answer":2,"explanation":"画素単位で領域を把握したいが個体の区別は不要なので、セマンティックセグメンテーションが適します。代表的なモデルにU-NetやSegNet、FCNがあります。／誤答を切るポイント：物体検出は矩形で位置を示すため面積を画素単位で測れません。画像分類は画像全体に1つのラベルを付けるだけです。インスタンスセグメンテーションは個体を区別しますが、今回は区別が不要なため過剰な選択となります。／混同ポイント：セマンティックとインスタンスの違いは「同種の物体どうしを個体として分けるか」です。要件に個体の区別が含まれるかを確認します。／試験ポイント：画素単位かつ個体の区別不要ならセマンティックセグメンテーション。"},{"id":"P040","topic":"文脈に応じた単語表現の選択","type":"application","syllabus":["T27"],"relatedQuestions":[70,12],"question":"社内文書を検索するシステムを作っている。文書には「バンク」という語が、金融機関を指す場合と、データの保管場所を指す場合の両方で現れる。同じ表記でも文脈に応じて異なる表現を与えられる手法として最も適切なものはどれか。","choices":["word2vecを用いて、単語ごとに固定された1つのベクトルを割り当てる","BoW（Bag-of-Words）を用いて、文書中の単語の出現回数を数える","ワンホットベクトルを用いて、語彙中の位置を1と0で表す","BERTを用いて、周囲の語を踏まえた文脈依存の表現を得る"],"answer":4,"explanation":"BERTは前後の文脈を踏まえて各語の表現を計算するため、同じ表記でも文脈に応じて異なるベクトルが得られます。ELMoも文脈を考慮する手法として知られています。／誤答を切るポイント：word2vecは学習後、1つの単語に対して固定された1つのベクトルを割り当てるため、多義語を文脈で区別できません。BoWは語順も文脈も捨てて出現回数のみを扱います。ワンホットベクトルは語彙中の位置を示すだけで、意味的な情報も文脈も持ちません。／混同ポイント：word2vecは分散表現の代表ですが「文脈依存かどうか」という軸ではBERTと大きく異なります。／試験ポイント：多義語を文脈で区別したいなら文脈依存の表現（BERT・ELMo）。"},{"id":"P041","topic":"強化学習における報酬設計の誤り","type":"error_detection","syllabus":["T09"],"relatedQuestions":[9,10,72],"question":"倉庫内を走行する搬送ロボットを強化学習で訓練している。「棚に到達したら報酬を与える」とだけ設計したところ、ロボットは壁や他の設備へ繰り返し接触しながら最短距離を突き進むようになった。この事象の説明として最も適切なものはどれか。","choices":["探索が不足しているため、常に同じ行動しか選ばなくなっている","割引率が小さすぎるため、将来の報酬が評価されていない","報酬が与えられていない望ましくない挙動が抑制されておらず、報酬設計に問題がある","教師データのラベルに誤りが含まれているため、誤った行動を学習している"],"answer":3,"explanation":"強化学習は与えられた報酬を最大化するように方策を獲得します。接触に対する負の報酬が設定されていなければ、接触を避ける理由がないため、報酬設計そのものに問題があります。／誤答を切るポイント：割引率は将来の報酬をどれだけ重視するかを決める値で、接触を避けない理由の説明にはなりません。探索不足であれば行動が固定化されますが、今回は目標へ到達できている点と整合しません。強化学習は正解ラベルを用いないため、ラベルの誤りという説明は前提から誤りです。／混同ポイント：望ましい結果に報酬を与えるだけでなく、避けたい挙動をどう扱うかまで含めて設計する必要があります。報酬成形はこうした調整の考え方です。／試験ポイント：意図しない挙動が出たら、まず報酬設計を疑う。"},{"id":"P042","topic":"生成モデル3種の仕組みの区別","type":"comparison","syllabus":["T30","T24"],"relatedQuestions":[14,15],"question":"生成モデルについて、次の3つの説明がある。\n\n（ア）生成する側と、本物か生成物かを見分ける側を互いに競わせるように学習させ、生成品質を高める。\n（イ）入力データを潜在変数の確率分布へ写像し、そこからの再構成を学習する。\n（ウ）データへ段階的にノイズを加える過程を学習し、その逆をたどってノイズから生成する。\n\n（ア）（イ）（ウ）に対応するモデルの組み合わせとして最も適切なものはどれか。","choices":["（ア）変分オートエンコーダ　（イ）敵対的生成ネットワーク　（ウ）拡散モデル","（ア）敵対的生成ネットワーク　（イ）拡散モデル　（ウ）変分オートエンコーダ","（ア）拡散モデル　（イ）変分オートエンコーダ　（ウ）敵対的生成ネットワーク","（ア）敵対的生成ネットワーク　（イ）変分オートエンコーダ　（ウ）拡散モデル"],"answer":4,"explanation":"（ア）は生成器と識別器を競わせる敵対的生成ネットワーク、（イ）は潜在変数の確率分布を経由して再構成を学習する変分オートエンコーダ、（ウ）はノイズ付加の逆過程をたどる拡散モデルです。／誤答を切るポイント：他の選択肢はいずれか以上の対応が入れ替わっています。3手法は説明を差し替えて提示されやすい典型例です。／混同ポイント：GAN＝競わせる、VAE＝確率分布へ写像、拡散モデル＝ノイズの逆過程、と対応づけて覚えます。拡散モデルは反復的にノイズを除去するため、一般に生成の計算量は大きくなります。／試験ポイント：仕組みの一文からモデル名を復元できるようにする。"},{"id":"P043","topic":"マルチモーダルモデルとZero-shot","type":"cross_topic","syllabus":["T32","T31"],"relatedQuestions":[43,44,41],"question":"画像とテキストの対応関係を大量に学習したモデルを使い、学習時に一度も与えていない新しいカテゴリ名を文章で指定するだけで、その画像を分類できた。この能力を表す用語と、この学習の枠組みの組み合わせとして最も適切なものはどれか。","choices":["能力：Zero-shot　　枠組み：マルチモーダル学習","能力：Few-shot　　枠組み：強化学習","能力：Zero-shot　　枠組み：敵対的生成","能力：One-shot　　枠組み：マルチモーダル学習"],"answer":1,"explanation":"新しいカテゴリの学習データを一切与えずに対応できることをZero-shotといいます。また画像とテキストという複数のモダリティを同時に扱う枠組みはマルチモーダル学習で、CLIPが代表例です。／誤答を切るポイント：Few-shotは少数の例を与える場合、One-shotは1つだけ例を与える場合で、いずれも例を与える前提があります。強化学習は報酬による試行錯誤の枠組み、敵対的生成はGANの仕組みであり、いずれも今回の説明とは異なります。／混同ポイント：Zero-shot・One-shot・Few-shotは、与える例の数で区別します。0個か1個か少数か、を確認します。／試験ポイント：例を1つも与えずに対応できるのがZero-shot。"},{"id":"P044","topic":"AIプロジェクトにおける進め方の誤り","type":"error_detection","syllabus":["T35","T36"],"relatedQuestions":[48,49,90],"question":"画像判定モデルの開発で、外注先へアノテーションを依頼した。判断基準を文書化せず口頭のみで伝え、複数の作業者へ同時に割り当てた。その後、学習させたモデルの精度が想定より大きく下回った。この進め方の問題点として最も指摘すべきものはどれか。","choices":["外注を用いたこと自体が、AI開発では避けるべき進め方である","アノテーションの基準が共有されず、ラベルの品質と一貫性が確保されていない","作業者を複数にしたため、必然的に学習データ量が不足している","モデルの層が浅く、表現力が不足していた可能性が高い"],"answer":2,"explanation":"判断基準が文書化されないまま複数の作業者が作業すると、同じ対象へ異なるラベルが付くなど品質と一貫性が損なわれ、学習結果に直接影響します。／誤答を切るポイント：外注そのものが問題なのではなく、基準の共有が欠けていたことが問題です。作業者が複数であることはデータ量の不足とは関係しません。層の深さは今回の記述からは判断できず、まず疑うべきはデータ側の品質です。／混同ポイント：精度不足の原因をモデル構造にだけ求めがちですが、データの収集と加工の段階に原因があることは少なくありません。／試験ポイント：アノテーションは基準の明文化と品質管理が前提。"},{"id":"P045","topic":"相関と因果の区別","type":"scenario","syllabus":["T37"],"relatedQuestions":[73],"question":"ある地域のデータを分析したところ、アイスクリームの売上と水難事故の件数との間に強い正の相関が見られた。この結果の解釈として最も適切なものはどれか。","choices":["気温のような第三の要因が双方に影響している疑似相関の可能性がある","相関係数が高いため、一方から他方を因果的に説明できる","アイスクリームの売上が水難事故を引き起こしていると考えられる","相関が見られた以上、両者に因果関係がないとは断定できないため、因果があると扱うべきである"],"answer":1,"explanation":"どちらも気温の上昇によって増える傾向があるため、直接の因果関係がなくても相関が現れます。これを疑似相関といいます。／誤答を切るポイント：相関があることは因果があることを意味しません。相関係数の大きさは関係の強さを表しますが、原因と結果の向きを示すものではありません。因果を否定できないことを理由に因果があると扱うのは、立証責任を取り違えた推論です。／混同ポイント：第三の要因の影響を取り除いて関係を見たい場合は、偏相関係数を用いる考え方があります。／試験ポイント：相関は因果を意味しない。共通要因の存在を疑う。"},{"id":"P046","topic":"個人情報の該当性の判断","type":"legal_case","syllabus":["L01"],"relatedQuestions":[16,81],"question":"ある事業者が、購買履歴を「顧客ID」だけに紐づけて保管している。この顧客IDと氏名を対応させる管理簿は、同じ社内の別部門が保有しており、必要なときに照会できる。この購買履歴の位置づけとして最も適切なものはどれか。","choices":["氏名を含まないため、個人情報にはあたらない","匿名加工情報にあたるため、本人の同意なく自由に第三者提供できる","顧客IDは個人識別符号であるため、それ単体で常に個人情報となる","同一事業者内で容易に照合でき特定の個人を識別できるため、個人情報にあたる"],"answer":4,"explanation":"個人情報の定義には「他の情報と容易に照合することができ、それにより特定の個人を識別することができるもの」が含まれます。社内で対応表を照会できる状態であれば、購買履歴も個人情報として扱われます。／誤答を切るポイント：氏名の有無だけで判断するのは誤りです。個人識別符号は指紋データや旅券番号など法令で定められたもので、事業者が独自に付番した顧客IDが当然にこれにあたるわけではありません。匿名加工情報は定められた基準に従って加工し復元できないようにしたものであり、対応表が存在する状態は該当しません。／混同ポイント：判断の軸は「照合が容易か」です。対応表を誰がどこまで参照できるかを確認します。／試験ポイント：容易照合性があれば個人情報。氏名の有無は決め手にならない。"},{"id":"P047","topic":"加工した情報の提供可否","type":"legal_case","syllabus":["L01"],"relatedQuestions":[17],"question":"社内で分析用に仮名加工情報を作成した。その後、業務提携先の企業からデータの提供を求められた。この求めへの対応として最も適切なものはどれか。","choices":["仮名加工情報は識別性が下がっているため、本人の同意なくそのまま提供してよい","仮名加工情報のままでは原則として第三者提供できないため、目的に応じて他の方法を検討する必要がある","仮名加工情報は要配慮個人情報にあたるため、提供は一切認められない","仮名加工情報は個人情報ではなくなるため、提供に関する規律は適用されない"],"answer":2,"explanation":"仮名加工情報は事業者内部での分析等を想定した制度で、原則として第三者提供が認められていません。外部へ提供したい場合は、匿名加工情報として加工し直す、本人の同意を得る、共同利用の枠組みを用いるなど、別の方法を検討することになります。／誤答を切るポイント：識別性が下がっていることは、提供を自由に認める根拠になりません。仮名加工情報は要配慮個人情報という類型とは別の概念です。また加工したからといって関連する規律が一切適用されなくなるわけではありません。／混同ポイント：匿名加工情報は復元できないよう加工したうえで一定の手続を踏めば外部提供が可能ですが、仮名加工情報は前提が異なります。／試験ポイント：内部分析なら仮名加工情報、外部への提供を想定するなら別の枠組みを検討する。"},{"id":"P048","topic":"共同利用と第三者提供の区別","type":"legal_case","syllabus":["L01"],"relatedQuestions":[83],"question":"グループ企業3社が顧客データを相互に利用したいと考えている。共同利用の枠組みを用いる場合の説明として最も適切なものはどれか。","choices":["共同利用は第三者提供の一類型であるため、常に本人の個別同意が必要である","グループ企業であれば、特段の手続なく相互に利用できる","共同して利用する旨や項目、責任者などをあらかじめ本人へ通知等したうえで行う必要がある","共同利用を行えば、利用目的の範囲にかかわらず自由に利用できる"],"answer":3,"explanation":"共同利用は第三者提供に該当しない類型ですが、無条件に認められるわけではなく、共同利用する旨、対象となる項目、共同利用者の範囲、利用目的、管理責任者などをあらかじめ本人が知りうる状態に置く必要があります。／誤答を切るポイント：グループ企業であるという理由だけで手続が不要になることはありません。共同利用は第三者提供に該当しない類型なので、個別同意が常に必要とするのは誤りです。また利用目的の範囲を超えて自由に利用できるわけでもありません。／混同ポイント：第三者に該当しない3類型は委託・事業承継・共同利用ですが、それぞれ求められる手続や責任のあり方が異なります。／試験ポイント：共同利用は同意不要だが、事前の通知等という手続が要る。"},{"id":"P049","topic":"30条の4の例外にあたる場合","type":"legal_case","syllabus":["L02"],"relatedQuestions":[20,85],"question":"ある事業者が、有償で販売されている画像データベースについて、正規の購入をせずに複製物を入手し、これを学習用データとして利用した。この行為の評価として最も適切なものはどれか。","choices":["学習目的の利用であるため、30条の4により常に適法となる","生成物が既存の著作物に類似しなければ、入手方法は問題にならない","学習用データは著作物にあたらないため、著作権法上の問題は生じない","非享受目的であっても、著作権者の利益を不当に害する場合には権利制限の対象外となりうる"],"answer":4,"explanation":"30条の4には、著作権者の利益を不当に害することとなる場合を適用対象から除くという例外が置かれています。販売されているデータベースの正規購入を回避するような利用は、この例外にあたりうると議論されています。／誤答を切るポイント：学習目的であれば常に適法とするのは30条の4の理解として不正確です。生成物の類似性は生成・利用段階の論点で、学習用データの入手方法とは別の問題です。画像データベースに収録された画像は著作物になりえます。／混同ポイント：30条の4は原則として権利制限を認めますが、無制限ではありません。原則と例外を分けて理解する必要があります。／試験ポイント：非享受目的でも「利益を不当に害する場合」は適用外になりうる。"},{"id":"P050","topic":"AI生成物への人間の関与と著作物性","type":"legal_case","syllabus":["L02"],"relatedQuestions":[19,85],"question":"デザイナーが生成AIで得た下絵をもとに、構図を大きく組み替え、配色や描き込みを自ら加えて1枚の作品に仕上げた。この作品の著作物性の判断として最も適切なものはどれか。","choices":["人間の創作的寄与がどの程度あったかによって判断される","AIの出力をもとにしている以上、常に元の学習データの著作権者に権利が帰属する","AIを利用した時点で著作物とは認められない","プロンプトを入力した事実があれば、その内容にかかわらず著作物と認められる"],"answer":1,"explanation":"AI生成物の著作物性は、人間の創作的意図と創作的寄与がどの程度認められるかによって判断されます。出力後に人間が大きく手を加えている場合、その加えた部分について創作性が認められる余地があります。／誤答を切るポイント：AIを利用したこと自体が著作物性を一律に否定する理由にはなりません。学習データの著作権者へ当然に権利が移るという規律は存在しません。プロンプトを入力しただけでは創作的寄与が認められにくいとされています。／混同ポイント：著作物性の判断と、既存著作物を侵害していないかの判断は別の論点です。／試験ポイント：判断軸は人間の創作的寄与の程度。AIの利用の有無ではない。"},{"id":"P051","topic":"AIが関与した発明と発明者","type":"legal_case","syllabus":["L03"],"relatedQuestions":[23,86],"question":"研究員が業務として、AIによる探索結果を手がかりに新しい材料の製造方法を完成させ、勤務先が特許出願を検討している。発明者と権利の帰属に関する説明として最も適切なものはどれか。","choices":["AIが探索の中心を担った以上、AIを発明者として出願する必要がある","業務として行った発明であるため、出願をしなくても当然に特許権が発生する","職務発明であるため、研究員は相当の利益を受ける権利を一切持たない","発明者は研究員であり、職務発明として契約や勤務規則の定めにより使用者へ権利を帰属させることができる"],"answer":4,"explanation":"発明者は自然人に限られるため、研究員が発明者となります。職務発明については、契約や勤務規則等にあらかじめ定めておくことで、特許を受ける権利を使用者へ原始的に帰属させることができます。／誤答を切るポイント：AIを発明者として出願することは現行制度では想定されていません。権利が使用者へ帰属する場合でも、従業者は相当の利益を受ける権利を持ちます。特許権は出願と審査を経て登録されることで発生し、著作権のように自動的には発生しません。／混同ポイント：発明者が誰かという問題と、権利が誰に帰属するかという問題は別です。／試験ポイント：発明者は自然人。職務発明でも相当の利益を受ける権利は残る。"},{"id":"P052","topic":"営業秘密の要件を欠く事例","type":"legal_case","syllabus":["L04"],"relatedQuestions":[24,87],"question":"社内で開発した独自の前処理手順を記した文書が、アクセス制限のない共有フォルダへ置かれ、全社員が自由に閲覧・複製できる状態にあった。退職者がこの文書を持ち出したため、営業秘密としての保護を主張したい。最も問題となる要件はどれか。","choices":["秘密管理性","非公知性","有用性","限定提供性"],"answer":1,"explanation":"営業秘密として保護されるには、秘密管理性・有用性・非公知性の三要件をすべて満たす必要があります。アクセス制限がなく全社員が自由に閲覧できる状態では、秘密として管理されているとはいえず、秘密管理性が問題になります。／誤答を切るポイント：事業に役立つ情報であれば有用性は認められやすく、社外へ公開されていない以上、非公知性も直ちに失われるわけではありません。限定提供性は限定提供データの要件であり、営業秘密の三要件には含まれません。／混同ポイント：実務上もっとも争われるのは秘密管理性です。重要な情報であっても、管理の実態がなければ保護されません。／試験ポイント：三要件は秘密管理性・有用性・非公知性。管理の実態が要。"},{"id":"P053","topic":"AI開発契約における成果物の帰属","type":"legal_case","syllabus":["L06"],"relatedQuestions":[89,90,27],"question":"ユーザー企業がベンダーへAI開発を委託する契約を結ぶにあたり、成果物の取扱いを定めたい。契約上の考え方として最も適切なものはどれか。","choices":["学習済みモデルは著作物ではないため、契約で取り決める必要はない","開発費を負担するのはユーザー企業であるため、すべての成果物はユーザー企業に帰属すると法律上定められている","学習用データセット、学習済みモデル、学習済みパラメータ、派生モデルのそれぞれについて、帰属と利用条件を定めておくことが望ましい","秘密保持契約を締結していれば、成果物の帰属について別途定める必要はない"],"answer":3,"explanation":"AI開発では、学習用データセット、学習済みモデル、パラメータ、そこから派生したモデルなど複数の成果物が生じます。それぞれ性質が異なるため、帰属と利用条件を個別に定めておくことが望ましいとされています。／誤答を切るポイント：費用の負担者へ当然にすべてが帰属するという法律上の定めはありません。学習済みモデルの法的性質には議論があり、だからこそ契約で取り決める意義があります。秘密保持契約は情報の開示と管理を扱うもので、成果物の帰属を定めるものではありません。／混同ポイント：一律にどちらへ帰属させるかを決めるより、利用条件をどう設計するかが実務上の焦点になります。／試験ポイント：成果物ごとに帰属と利用条件を切り分けて定める。"},{"id":"P054","topic":"SaaS型サービスにおける入力データの扱い","type":"legal_case","syllabus":["L07"],"relatedQuestions":[51,91],"question":"業務で外部の生成AIサービスを利用するにあたり、社内で確認すべき事項として最も優先度が高いものはどれか。","choices":["利用規約上、入力したデータが提供者側のモデルの学習に利用されるかどうか","サービスの応答速度が業務に耐えうる水準にあるか","提供者が国内企業であるかどうか","サービスの画面が日本語に対応しているかどうか"],"answer":1,"explanation":"入力データが提供者側の学習に利用される場合、機密情報や個人データが社外へ流出したり、他の利用者への出力に影響したりする懸念が生じます。データ利用権の定めを利用規約で確認することが最優先となります。／誤答を切るポイント：応答速度や日本語対応は利便性の問題であり、法務やセキュリティ上の優先度は下がります。提供者の所在地は考慮要素の一つになりえますが、それ自体よりデータの取扱条件のほうが本質的です。／混同ポイント：SaaS型では契約条件が利用規約として提示されることが多く、個別交渉の余地が小さい点にも留意します。／試験ポイント：SaaS利用の第一確認事項は、入力データの学習利用の可否。"},{"id":"P055","topic":"ソフトローの特性の理解","type":"scenario","syllabus":["L08"],"relatedQuestions":[28,79,92],"question":"AIをめぐる規範として、法律ではなくガイドラインを用いることの利点と課題の説明として最も適切なものはどれか。","choices":["改定に長い立法手続を要するため、機動的な見直しには向かない","法律と同じ強制力を持つため、実効性と柔軟性の双方を同時に満たせる","技術の変化へ柔軟かつ迅速に対応できる一方、遵守が任意であるため実効性の担保が課題となる","違反時に罰則が科されるため、事業者にとっては法律より負担が大きい"],"answer":3,"explanation":"ガイドラインなどのソフトローは法的拘束力を持たないため、技術や社会の変化に応じて迅速に見直せる反面、遵守するかどうかが各主体に委ねられ、実効性をどう確保するかが課題になります。／誤答を切るポイント：ソフトローは法律と同じ強制力を持ちません。立法手続を要するのはハードローの特徴です。罰則が科されるのもハードローの性質です。／混同ポイント：ソフトローとハードローは対立するものではなく、組み合わせて用いられます。日本はソフトロー中心、EUはハードロー中心という対比で整理されます。／試験ポイント：ソフトローの利点は柔軟性と迅速性、課題は実効性の担保。"},{"id":"P056","topic":"センシティブ属性の除去と代理変数","type":"scenario","syllabus":["L10"],"relatedQuestions":[53,54],"question":"採用選考を支援するモデルを開発するにあたり、公平性へ配慮して性別の項目を特徴量から除外した。しかし運用後、特定の性別の応募者が不利に扱われる傾向が残った。この原因の説明として最も適切なものはどれか。","choices":["性別と強く相関する他の特徴量が代理変数として働いているため","センシティブ属性を除外したことで、モデルの表現力が不足したため","公平性の指標は複数あり、どれを用いても同じ結果になるため","学習データの件数が不足しており、偶然そのような傾向が生じただけである"],"answer":1,"explanation":"センシティブ属性そのものを除いても、それと強く相関する特徴量が残っていれば、モデルは間接的にその属性を反映してしまいます。こうした特徴量を代理変数といいます。／誤答を切るポイント：属性を1つ除いたことによる表現力不足では、特定の属性が不利になるという偏りは説明できません。公平性の定義は複数あり、一般に同時には満たせないことが知られています。件数不足は一般論としてはありえますが、特定の方向へ一貫した傾向が残る理由としては弱い説明です。／混同ポイント：サンプリングバイアスは収集段階の偏り、代理変数は特徴量を通じた間接的な反映で、原因の所在が異なります。／試験ポイント：属性を消すだけでは公平にならない。代理変数を確認する。"},{"id":"P057","topic":"アルゴリズムを介した競争制限","type":"legal_case","syllabus":["L05"],"relatedQuestions":[50,88],"question":"同業の複数の小売事業者が、それぞれ独立に同じ事業者が提供する価格最適化アルゴリズムを導入した。その結果、事業者間で明示的な取り決めがないにもかかわらず、各社の販売価格が高い水準でそろう状態が続いた。この事象に関する説明として最も適切なものはどれか。","choices":["各社が独立に導入した以上、競争上の問題が生じる余地はない","価格が協調的に決まる状態は競争制限の観点から論点となりうる","アルゴリズムの判断であるため、事業者が責任を問われることはない","同一のアルゴリズムを使う限り、公正競争阻害性は当然に否定される"],"answer":2,"explanation":"明示的な合意がなくても、同一のアルゴリズムを介して価格が協調的に決まる状態は、市場における競争を実質的に制限しうるものとして議論されています。AIと独占禁止法をめぐる代表的な論点です。／誤答を切るポイント：独立に導入したことや、判断をアルゴリズムが行ったことは、それだけで問題を否定する理由にはなりません。導入と利用を決めたのは事業者であり、責任の所在が消えるわけではありません。同一のアルゴリズムを用いることが、公正競争阻害性を当然に否定する根拠になることもありません。／混同ポイント：競争制限は市場全体の競争が実質的に制限されるかを、公正競争阻害性は不公正な取引方法にあたるかを問う軸です。／試験ポイント：合意がなくてもアルゴリズムを介した価格協調は論点になりうる。"},{"id":"P058","topic":"生成技術の悪用への対応","type":"scenario","syllabus":["L12","L14"],"relatedQuestions":[55,57,97],"question":"実在の政治家が発言していない内容を話す精巧な動画が拡散し、選挙期間中に大きな混乱が生じた。この事象と対応の説明として最も適切なものはどれか。","choices":["エコーチェンバーにあたる事象であり、推薦アルゴリズムの停止が唯一の対策となる","生成物である以上、実在の人物の権利や社会的評価に影響することはない","フィルターバブルにあたる事象であり、利用者が自ら情報源を広げれば解消する","ディープフェイクにあたる事象であり、来歴情報の付与や検出技術、表示上の措置などが対応策となる"],"answer":4,"explanation":"生成技術によって実在の人物が話していない内容を作り出したものはディープフェイクにあたります。対応としては、コンテンツへ来歴情報や電子透かしを付与する、検出技術を整備する、プラットフォーム側で表示上の措置をとる、といった複数の手段が組み合わされます。／誤答を切るポイント：エコーチェンバーは同質な意見が反響して増幅される現象、フィルターバブルはアルゴリズムによる情報の偏りであり、いずれも偽の映像を作り出す事象そのものを指しません。生成物であっても名誉や社会的評価に影響するため、影響しないとする記述は誤りです。／混同ポイント：民主主義への影響という点では共通しますが、原因が生成技術か情報環境かで区別します。／試験ポイント：偽の映像・音声はディープフェイク。単一の対策では足りない。"},{"id":"P059","topic":"透明性を支える3つの概念の区別","type":"comparison","syllabus":["L13","L18"],"relatedQuestions":[56,96,99],"question":"与信審査AIについて、次の3つの取り組みを行った。\n\n（ア）判断に用いた特徴量とその寄与を、申込者へ示せるようにした。\n（イ）どのデータをどこから取得し、どのように加工したかを記録した。\n（ウ）同じ入力と同じ条件を与えれば、同じ出力が得られることを確認した。\n\n（ア）（イ）（ウ）に対応する概念の組み合わせとして最も適切なものはどれか。","choices":["（ア）再現性　（イ）説明可能性　（ウ）データの来歴","（ア）説明可能性　（イ）データの来歴　（ウ）再現性","（ア）説明可能性　（イ）再現性　（ウ）データの来歴","（ア）データの来歴　（イ）トレーサビリティ　（ウ）説明可能性"],"answer":2,"explanation":"（ア）は判断の根拠を人が理解できる形で示すことなので説明可能性、（イ）はデータの出所と加工の経緯を記録することなのでデータの来歴、（ウ）は同一条件で同一結果が得られることなので再現性です。／誤答を切るポイント：他の選択肢はいずれか以上の対応が入れ替わっています。トレーサビリティは経緯を追跡できることを指し、（イ）と近い概念ですが、（イ）の記述はデータの出所と加工に限定されているためデータの来歴がより適切です。／混同ポイント：説明可能性は「なぜその判断か」、来歴は「どこから来たデータか」、再現性は「同じ結果になるか」と、問うている対象が異なります。／試験ポイント：透明性を支える要素を対象ごとに分けて理解する。"},{"id":"P060","topic":"AIガバナンスにおける人間の関与の設計","type":"scenario","syllabus":["L18"],"relatedQuestions":[98,100,60],"question":"医療機関で、AIが画像から異常の候補を提示し、最終的な診断は必ず医師が行う運用とした。この設計の考え方として最も適切なものはどれか。","choices":["AIの精度が十分に高ければ、この運用は不要になるため過渡的な措置にすぎない","AIの判断根拠を可視化する取り組みであり、説明可能性の確保にあたる","重要な判断へ人間が介在する設計であり、人間の関与の考え方にあたる","運用開始後の性能劣化を監視する取り組みであり、モニタリングにあたる"],"answer":3,"explanation":"生命や重大な権利に関わる判断をAIに委ねきらず、人間が最終判断を担う設計は、人間の関与（Human-in-the-loop）の考え方にあたります。／誤答を切るポイント：精度が高ければ不要になるという整理は、責任の所在や説明責任という観点を欠いています。判断根拠の可視化は説明可能性、運用後の継続的な性能監視はモニタリングであり、いずれも今回の措置の説明としては当たりません。／混同ポイント：AIガバナンスの各手法は、事前評価（倫理アセスメント）、運用中の介在（人間の関与）、運用後の監視（モニタリング）と、関わる段階で整理すると混同しにくくなります。／試験ポイント：重要な判断に人間が介在する設計が人間の関与。"}];

      const o = JSON.parse(raw);

        STORE.settings = Object.assign(STORE.settings, o.settings || {});
      }
    }
  }catch(e){ console.warn('load failed', e); }
}

}

}
function answered(id){ const r = STORE.history[String(id)]; return !!(r && r.lastResult); }

function progressOf(list){
  const done = list.filter(q => answered(q.id));
  const ok = done.filter(q => lastResult(q.id) === 'o').length;
  return {total:list.length, done:done.length, ok,
          rate: done.length ? Math.round(ok/done.length*100) : 0};
}
function bar(p, cls){
  const pct = p.total ? Math.round(p.done/p.total*100) : 0;
  return `<div class="bar ${cls||''}"><span style="width:${pct}%"></span></div>`;
}
function progBlock(name, list, cls){
  const p = progressOf(list);
  const pct = p.total ? Math.round(p.done/p.total*100) : 0;
  return `<div class="prog-item">
    <div class="prog-top"><b>${name}</b>
      <span class="muted">${p.total}問中 回答済み ${p.done}問（${pct}%）／ 正答率 ${p.done?p.rate+'%':'—'}</span></div>
    ${bar(p, cls)}</div>`;
}

  $('#judSeg').onclick = e => {
    const b = e.target.closest('[data-jud]'); if(!b) return;
    STORE.settings.judge = b.dataset.jud; saveStore(); render('home');
  };
  $('#modeGrid').onclick = e => {

        ? shuffled(QUESTIONS.map(q => q.id)) : QUESTIONS.map(q => q.id);
      startSession(base.slice(0, n), n + '問');

/* ---------- 出題 ---------- */
function vQuiz(){
  if(!session){ render('home'); return; }
  const id = session.ids[session.cur];
  const q = byId(id);
  const pick = session.picks[id] || null;          // 仮選択（未採点）
  const done = session.graded[id] !== undefined;   // 採点済みか
  const ok = done && session.graded[id];
  const shown = !!session.revealed[id];
  const testing = session.testMode && !session.submitted;   // 解答中（未採点）
  const nPicked = session.ids.filter(i => session.picks[i]).length;
  const pct = Math.round((session.cur+1)/session.ids.length*100);

  const choices = q.choices.map((c,i) => {
    const n = i+1;
    let cls = '';
    if(done){
      if(n === q.answer) cls = 'correct';
      else if(n === pick) cls = 'wrong';
    } else if(pick === n) cls = 'sel';
    return `<button class="choice ${cls}" data-c="${n}" ${done?'disabled':''} type="button">
      <span class="num">${n}</span><span>${c}</span></button>`;
  }).join('');

  app.innerHTML = `
    <div class="qbar">
      <span class="idx">${session.cur+1} / ${session.ids.length}</span>
      ${testing ? `<span class="muted" style="font-size:12px">解答済み ${nPicked}</span>` : ''}
      <div class="qprog"><div class="bar"><span style="width:${pct}%"></span></div></div>
      <button class="btn ghost sm" id="quitBtn" type="button">中断</button>
    </div>

    <div class="card">
      <div><span class="qno">問${q.id}</span>
        ${q.syllabusIds.map(s => `<span class="badge">${s}</span>`).join('')}</div>
      ${done ? `<div class="qtitle">${esc(q.title)}</div>` : ''}
      <div class="qtext">${q.questionHtml}</div>
      <div id="choices">${choices}</div>
    </div>

    <div id="afterArea"></div>

    <div class="row" style="margin-top:10px">
      <button class="star-btn ${isWeak(id)?'on':''}" id="starBtn" type="button">
        ${isWeak(id)?'★ 苦手登録中':'☆ 苦手に登録'}</button>
    </div>

    <div class="navbtns">
      <button class="btn ghost" id="prevBtn" ${session.cur===0?'disabled':''} type="button">← 前へ</button>
      <button class="btn ${done||testing?'':'sub'}" id="nextBtn" type="button">
        ${session.cur === session.ids.length-1
          ? (testing ? '採点する' : '結果を見る') : '次の問題へ →'}</button>
    </div>`;

  const after = $('#afterArea');
  if(done){
    after.innerHTML = `
      <div class="verdict ${ok?'ok':'ng'}">${ok?'正解！':'不正解'}
        <span class="sm">${esc(q.title)}${q.syllabusIds.map(s=>`【${s}】`).join('')}</span>
        ${ok?'':`<span class="sm">正解は ${q.answer}：${q.choices[q.answer-1]}</span>`}</div>
      ${shown ? `<div class="exp">${q.explanationHtml}</div>`
              : `<button class="btn sub wide" id="expBtn" type="button">解説を見る</button>`}`;
    const eb = $('#expBtn');
    if(eb) eb.onclick = () => { session.revealed[id] = true; vQuiz(); };
  } else if(testing){
    after.innerHTML = `<div class="testnote">${pick
      ? `解答 <b>${pick}</b> を記録しました。選び直せます。`
      : '選択肢をタップして解答してください。'}<br>
      <span class="muted">テストモードです。採点と解説は全問終了後に表示します。</span></div>`;
  } else {
    after.innerHTML = `<button class="btn wide" id="ansBtn" type="button" ${pick?'':'disabled'}>回答する</button>`;
    $('#ansBtn').onclick = () => grade(id, pick);
  }

  $('#choices').onclick = e => {
    const b = e.target.closest('.choice'); if(!b || b.disabled) return;
    if(done) return;                 // 採点後は変更不可
    session.picks[id] = +b.dataset.c;  // 仮選択のみ。採点は「回答する」で行う
    vQuiz();
  };
  $('#starBtn').onclick = () => {
    const r = rec(id); r.weak = !r.weak; saveStore(); vQuiz();
  };
  $('#prevBtn').onclick = () => { if(session.cur>0){ session.cur--; vQuiz(); } };
  $('#nextBtn').onclick = () => {
    if(session.cur === session.ids.length-1){
      if(testing) submitTest(); else render('result');
    } else { session.cur++; vQuiz(); }
  };
  $('#quitBtn').onclick = () => {
    const msg = testing
      ? '中断すると、テストモードの解答は採点されずに破棄されます。よろしいですか？'
      : 'セッションを中断してホームへ戻りますか？';
    if(confirm(msg)){ session=null; render('home'); }
  };
}

function grade(id, pick){
  const q = byId(id);
  if(!pick) return;
  const r = rec(id);
  const ok = pick === q.answer;
  if(ok) r.correct++; else r.incorrect++;
  r.lastResult = ok ? 'o' : 'x';
  r.last = new Date().toISOString();
  session.graded[id] = ok;
  saveStore();
  vQuiz();
}

/* ---------- テストモードの一括採点 ---------- */
function submitTest(){
  const un = session.ids.filter(i => !session.picks[i]).length;
  if(un && !confirm(`未回答が${un}問あります。このまま採点しますか？`)) return;
  const now = new Date().toISOString();
  session.ids.forEach(id => {
    const p = session.picks[id];
    if(!p) return;
    const q = byId(id), r = rec(id), ok = (p === q.answer);
    if(ok) r.correct++; else r.incorrect++;
    r.lastResult = ok ? 'o' : 'x';
    r.last = now;
    session.graded[id] = ok;
  });
  session.submitted = true;
  saveStore();
  render('result');
}

    </div>

    ${session.testMode ? `<h2 class="sec">解答一覧</h2>

      <div class="card" style="padding:4px 12px">
        ${session.ids.map(i => { const q = byId(i); const gv = g[i];
          const m = gv === undefined ? ['n','－'] : gv ? ['o','✓'] : ['x','×'];
          const mine = session.picks[i] ? `あなたの解答 ${session.picks[i]}` : '未回答';
          return `<div class="qrow" data-goto="${i}"><span class="mark ${m[0]}">${m[1]}</span>
            <span class="nm">問${q.id}　${esc(q.title)}
              <small>正解 ${q.answer}　／　${mine}　／　${q.syllabusIds.join('・')}</small></span></div>`;
        }).join('')}
      </div>
      <button class="btn wide sub" id="reviewAllBtn" type="button">1問目から解答・解説を見る</button>` : ''}

    ${ngIds.length ? `${session.testMode ? '' : `<h2 class="sec">間違えた問題</h2>
      <div class="card" style="padding:4px 12px">
        ${ngIds.map(i => { const q = byId(i); return `
          <div class="qrow" data-goto="${i}"><span class="mark x">×</span>
            <span class="nm">問${q.id}　${esc(q.title)}<small>${q.syllabusIds.join('・')}</small></span></div>`;}).join('')}
      </div>`}
      <button class="btn wide" id="reviewBtn" type="button">間違えた問題だけ復習（${ngIds.length}問）</button>` : ''}

    <div class="navbtns">
      <button class="btn ghost" id="homeBtn2" type="button">ホームへ戻る</button>
    </div>`;

  const rb = $('#reviewBtn');
  if(rb) rb.onclick = () => startSession(ngIds, '間違えた問題の復習');
  const ra = $('#reviewAllBtn');
  if(ra) ra.onclick = () => { session.cur = 0; render('quiz'); };
  $('#homeBtn2').onclick = () => { session = null; render('home'); };
  app.querySelectorAll('[data-goto]').forEach(el => el.onclick = () => {
    const i = session.ids.indexOf(+el.dataset.goto);
    if(i >= 0){ session.cur = i; render('quiz'); }
  });
}

/* ============================================================
   実戦テスト
   ============================================================ */
let pSession = null;   // {ids, order{}, cur, picks{}, graded{}, submitted,
                       //  startedAt, elapsedMs, shownAt, timeMs{}, reviewIds, rcur}
let pTimerId = null;

/* 選択肢の並び替え表：order[i] = 表示i番目に出す「元の」選択肢の添字
   ユーザーの選択は必ず元の添字へ戻してから記録・採点する */
function makeOrder(){ return shuffled([0,1,2,3]); }

function pStart(ids, label){
  if(!ids.length){ alert('該当する問題がありません。'); return; }
  const list = shuffled(ids);                    // 出題順もシャッフル・重複なし
  const order = {};
  list.forEach(id => { order[id] = makeOrder(); });
  pSession = {ids:list, order, cur:0, picks:{}, graded:{}, submitted:false,
              label:label||'', startedAt:Date.now(), elapsedMs:0,
              shownAt:0, timeMs:{}, reviewIds:[], rcur:0};
  render('pquiz');
}
function pStopTimer(){ if(pTimerId){ clearInterval(pTimerId); pTimerId = null; } }
function pTick(){
  const el = document.getElementById('pTimer');
  if(!el || !pSession || pSession.submitted){ pStopTimer(); return; }
  el.textContent = fmtMs(Date.now() - pSession.startedAt);
}
/* 表示していた問題の滞在時間を積む */
function pLeave(){
  if(!pSession || !pSession.shownAt) return;
  if(pSession.submitted){ pSession.shownAt = 0; return; }   // 採点後の閲覧時間は加算しない
  const id = pSession.ids[pSession.cur];
  pSession.timeMs[id] = (pSession.timeMs[id] || 0) + (Date.now() - pSession.shownAt);
  pSession.shownAt = 0;
}

/* ---------- 実戦テスト セット選択 ---------- */
let pSetKey = null;
function vPractical(){
  pStopTimer();
  if(!pSetKey){
    const cards = PRACTICE_SETS.map(st => {
      const f = pFirstStats(st.items);
      const un = st.items.filter(q => !pSeen(q.id)).length;
      const status = f.answered === 0 ? '未受験'
        : (un === 0 ? '受験済み' : `受験中（未出題 ${un}問）`);
      return `<button class="mode" data-set="${st.key}" style="min-height:84px">
        <b>${st.name}　${st.items.length}問</b>
        <small>${status}</small>
        <small>初見正答率 ${f.answered ? f.rate + '%（' + f.ok + ' / ' + f.answered + '問）' : '—'}</small>
      </button>`;
    }).join('');
    app.innerHTML = `
      <div class="prac-hero">
        <h3>実戦テスト</h3>
        <p>セットを選んでください。テスト中は正誤も解説も表示せず、全問終えてからまとめて採点します。</p>
      </div>
      <h2 class="sec">セットを選ぶ</h2>
      <div class="grid" style="grid-template-columns:1fr">${cards}</div>
      <div class="navbtns"><button class="btn ghost" id="pBack2" type="button">ホームへ戻る</button></div>`;
    app.querySelectorAll('[data-set]').forEach(b => b.onclick = () => { pSetKey = b.dataset.set; render('practical'); });
    $('#pBack2').onclick = () => render('home');
    return;
  }

  const SET = PRACTICE_SETS.find(x => x.key === pSetKey) || PRACTICE_SETS[0];
  const fs = pFirstStats(SET.items);
  const unseen = SET.items.filter(q => !pSeen(q.id));
  const cnt = PSTORE.settings.count;
  const only = PSTORE.settings.unseenOnly;
  const pool = only ? unseen : SET.items;
  const maxN = pool.length;

  /* シラバス別の正答率（実戦問題のみ集計） */
  const agg = {};
  SET.items.forEach(q => {
    const r = PSTORE.history[q.id];
    if(!r || !r.lastResult) return;
    q.syllabus.forEach(sid => {
      agg[sid] = agg[sid] || {n:0, ok:0};
      agg[sid].n++; if(r.lastResult === 'o') agg[sid].ok++;
    });
  });
  const rows = Object.keys(agg).sort().map(sid => {
    const a = agg[sid], rate = Math.round(a.ok/a.n*100);
    return `<div class="sylrow ${rate<60?'weak':''}"><span class="sid">${sid}</span>
      <span class="sn">${esc(SYL_NAMES[sid]||'')}</span>
      <span class="sv">${a.ok} / ${a.n}　${rate}%</span></div>`;
  }).join('');

  app.innerHTML = `
    <div class="prac-hero">
      <h3>実戦テスト　${SET.name}</h3>
      <p>選択肢と出題順をシャッフルし、テスト中は正誤も解説も表示しません。全問終えてからまとめて採点します。</p>
      <div class="prac-stat">
        <div>初見で解答 ${fs.answered} / ${SET.items.length}問</div>
        <div>初見正答率 ${fs.answered ? fs.rate + '%' : '—'}</div>
        <div>未出題 ${unseen.length}問</div>
      </div>
    </div>

    <h2 class="sec">出題数</h2>
    <div class="seg prac" id="pCntSeg">
      ${[10,20,30].map(n => `<button type="button" data-n="${n}" class="${cnt===n?'on':''}">${n}問</button>`).join('')}
    </div>

    <h2 class="sec">出題範囲</h2>
    <div class="seg prac" id="pOnlySeg">
      <button type="button" data-only="0" class="${only?'':'on'}">すべての問題</button>
      <button type="button" data-only="1" class="${only?'on':''}">未出題だけ</button>
    </div>
    <p class="muted" style="margin:7px 0 0">${only
      ? `一度も表示していない問題だけを出題します（現在 ${unseen.length}問）。`
      : `${SET.name}の全${SET.items.length}問から出題します。一度表示した問題は初見ではなくなります。`}</p>

    <button class="btn prac wide" id="pStartBtn" type="button" style="margin-top:14px"
      ${maxN ? '' : 'disabled'}>テストを開始（${Math.min(cnt, maxN)}問）</button>
    ${maxN===0 ? '<p class="muted" style="margin-top:8px">未出題の問題がありません。「すべての問題」に切り替えてください。</p>' : ''}

    ${rows ? `<h2 class="sec">シラバス別の正答率</h2>
      <p class="muted">最新の解答結果で集計しています。60%未満は赤字で表示します。</p>
      <div class="card" style="padding:4px 12px">${rows}</div>` : ''}

    <div class="navbtns"><button class="btn ghost" id="pBack" type="button">セット選択へ戻る</button></div>`;

  $('#pCntSeg').onclick = e => { const b = e.target.closest('[data-n]'); if(!b) return;
    PSTORE.settings.count = +b.dataset.n; pSave(); render('practical'); };
  $('#pOnlySeg').onclick = e => { const b = e.target.closest('[data-only]'); if(!b) return;
    PSTORE.settings.unseenOnly = b.dataset.only === '1'; pSave(); render('practical'); };
  $('#pBack').onclick = () => { pSetKey = null; render('practical'); };
  const sb = $('#pStartBtn');
  if(sb) sb.onclick = () => pStart(shuffled(pool.map(q => q.id)).slice(0, cnt),
    SET.name + (only ? '（未出題）' : ''));
}

/* ---------- 実戦テスト 出題 ---------- */
function vPQuiz(){
  if(!pSession){ render('practical'); return; }
  const id = pSession.ids[pSession.cur];
  const q = pById(id);
  const ord = pSession.order[id];
  const testing = !pSession.submitted;

  if(testing) pMarkSeen(id);                       // 初見はここで消費する

  // 【時間計測】選択肢タップ等で再描画される前に、直前までの滞在時間を確定させる。
  // pNext/pPrev から来た場合は既に pLeave 済み（shownAt=0）なので二重計上されない。
  pLeave();
  pSession.shownAt = testing ? Date.now() : 0;     // 採点後の閲覧時間は計測しない

  const pickOrig = pSession.picks[id] || null;     // 元の添字ベース（1〜4）
  const done = pSession.graded[id] !== undefined;
  const ok = done && pSession.graded[id];
  const shown = !!pSession.revealed;
  const nPicked = pSession.ids.filter(i => pSession.picks[i]).length;
  const pct = Math.round((pSession.cur+1)/pSession.ids.length*100);
  const correctPos = ord.indexOf(q.answer-1) + 1;  // 表示上の正解位置

  const choices = ord.map((origIdx, i) => {
    const dispNo = i+1;
    let cls = '';
    if(done){
      if(dispNo === correctPos) cls = 'correct';
      else if(origIdx+1 === pickOrig) cls = 'wrong';
    } else if(origIdx+1 === pickOrig) cls = 'sel';
    return `<button class="choice ${cls}" data-o="${origIdx+1}" ${done?'disabled':''} type="button">
      <span class="num">${dispNo}</span><span>${esc(q.choices[origIdx])}</span></button>`;
  }).join('');

  app.innerHTML = `
    <div class="qbar">
      <span class="idx">${pSession.cur+1} / ${pSession.ids.length}</span>
      ${testing ? `<span class="timer" id="pTimer">${fmtMs(Date.now()-pSession.startedAt)}</span>
        <span class="muted" style="font-size:12px">解答済み ${nPicked}</span>` : ''}
      <div class="qprog"><div class="bar"><span style="width:${pct}%"></span></div></div>
      <button class="btn ghost sm" id="pQuit" type="button">中断</button>
    </div>

    <div class="card">
      ${done ? `<div><span class="qno">${q.id}</span>
          ${q.syllabus.map(x => `<span class="badge">${x}</span>`).join('')}</div>
        <div class="qtitle">${esc(q.topic)}</div>` : ''}
      <div class="qtext">${esc(q.question).replace(/\n/g,'<br>')}</div>
      <div id="pChoices">${choices}</div>
    </div>

    <div id="pAfter"></div>

    <div class="navbtns">
      <button class="btn ghost" id="pPrev" ${pSession.cur===0?'disabled':''} type="button">← 前へ</button>
      <button class="btn" id="pNext" type="button">${
        pSession.cur === pSession.ids.length-1
          ? (testing ? '採点する' : '結果へ戻る') : '次の問題へ →'}</button>
    </div>`;

  const after = $('#pAfter');
  if(done){
    after.innerHTML = `
      <div class="verdict ${ok?'ok':'ng'}">${ok?'正解！':'不正解'}
        <span class="sm">${esc(q.topic)}${q.syllabus.map(x=>`【${x}】`).join('')}</span>
        ${ok?'':`<span class="sm">正解は ${correctPos}：${esc(q.choices[q.answer-1])}</span>`}</div>
      <div class="exp"><p>${esc(q.explanation).replace(/／/g,'</p><p>')}</p></div>
      <button class="btn sub wide" id="pRelated" type="button">関連する基礎問題を復習（問${q.relatedQuestions.join('・問')}）</button>`;
    $('#pRelated').onclick = () => {
      pStopTimer(); pSession = null;
      startSession(q.relatedQuestions.slice(), '基礎問題の復習');
    };
  } else {
    after.innerHTML = `<div class="testnote">${pickOrig
      ? '解答を記録しました。選び直せます。'
      : '選択肢をタップして解答してください。'}<br>
      <span class="muted">実戦テストです。採点と解説は全問終了後に表示します。</span></div>`;
  }

  $('#pChoices').onclick = e => {
    const b = e.target.closest('.choice'); if(!b || b.disabled) return;
    pSession.picks[id] = +b.dataset.o;      // 元の添字で保存
    vPQuiz();
  };
  $('#pPrev').onclick = () => { if(pSession.cur>0){ pLeave(); pSession.cur--; vPQuiz(); } };
  $('#pNext').onclick = () => {
    pLeave();
    if(pSession.cur === pSession.ids.length-1){
      if(testing) pSubmit(); else render('presult');
    } else { pSession.cur++; vPQuiz(); }
  };
  $('#pQuit').onclick = () => {
    const msg = testing
      ? '中断すると、この回の解答は採点されずに破棄されます。\n（表示した問題は初見として消費済みです）'
      : 'テストを終了してホームへ戻りますか？';
    if(confirm(msg)){ pLeave(); pStopTimer(); pSession = null; render('home'); }
  };

  pStopTimer();
  if(testing) pTimerId = setInterval(pTick, 1000);
}

/* ---------- 一括採点 ---------- */
function pSubmit(){
  const un = pSession.ids.filter(i => !pSession.picks[i]).length;
  if(un && !confirm(`未回答が${un}問あります。このまま採点しますか？`)) return;
  pLeave();
  pStopTimer();
  pSession.elapsedMs = Date.now() - pSession.startedAt;
  const now = new Date().toISOString();
  pSession.ids.forEach(id => {
    const pick = pSession.picks[id];
    if(!pick) return;
    const q = pById(id), r = pRec(id), ok = (pick === q.answer);
    if(ok) r.correct++; else r.incorrect++;
    r.lastResult = ok ? 'o' : 'x';
    r.last = now;
    r.answerCount = (r.answerCount||0) + 1;
    r.totalTimeMs = (r.totalTimeMs||0) + (pSession.timeMs[id]||0);
    if(!r.firstAnsweredAt){                       // 初回解答は上書きしない
      r.firstAnsweredAt = now;
      r.firstResult = ok ? 'correct' : 'incorrect';
    }
    pSession.graded[id] = ok;
  });
  pSession.submitted = true;
  pSave();
  render('presult');
}

/* ---------- 実戦テスト 結果 ---------- */
function vPResult(){
  if(!pSession){ render('practical'); return; }
  pStopTimer();
  const g = pSession.graded;
  const ansIds = pSession.ids.filter(i => g[i] !== undefined);
  const okIds = ansIds.filter(i => g[i]);
  const ngIds = ansIds.filter(i => !g[i]);
  const unIds = pSession.ids.filter(i => g[i] === undefined);
  const rate = ansIds.length ? Math.round(okIds.length/ansIds.length*100) : 0;
  const avg = pSession.ids.length ? pSession.elapsedMs/pSession.ids.length : 0;
  const sumMs = pSession.ids.reduce((a,id) => a + (pSession.timeMs[id]||0), 0);

  const agg = {};
  pSession.ids.forEach(id => {
    if(g[id] === undefined) return;
    pById(id).syllabus.forEach(sid => {
      agg[sid] = agg[sid] || {n:0, ok:0};
      agg[sid].n++; if(g[id]) agg[sid].ok++;
    });
  });
  const sylRows = Object.keys(agg).sort().map(sid => {
    const a = agg[sid], r = Math.round(a.ok/a.n*100);
    return `<div class="sylrow ${r<60?'weak':''}"><span class="sid">${sid}</span>
      <span class="sn">${esc(SYL_NAMES[sid]||'')}</span>
      <span class="sv">${a.ok} / ${a.n}　${r}%</span></div>`;
  }).join('');

  app.innerHTML = `
    <h2 class="sec">実戦テスト結果</h2>
    <div class="card score">
      <div class="big">${ansIds.length}問中 ${okIds.length}問正解</div>
      <div class="rate">正答率 ${rate}%</div>
      <div class="tally">
        <div class="c">正解 ${okIds.length}</div>
        <div class="w">不正解 ${ngIds.length}</div>
        ${unIds.length ? `<div style="background:#eef1f6;color:#4b5563">未回答 ${unIds.length}</div>` : ''}
      </div>
      <div class="muted" style="margin-top:12px">
        所要時間 ${fmtMs(pSession.elapsedMs)}　／　平均 ${(avg/1000).toFixed(1)}秒 / 問</div>
      <div class="muted" style="margin-top:4px; font-size:12px">
        問題別の合計 ${fmtMs(sumMs)}（差 ${fmtMs(Math.max(0, pSession.elapsedMs - sumMs))} は採点確認などの時間）</div>
    </div>

    ${sylRows ? `<h2 class="sec">シラバス別の正答率</h2>
      <div class="card" style="padding:4px 12px">${sylRows}</div>` : ''}

    <h2 class="sec">解答一覧</h2>
    <p class="muted">行をタップすると、その問題の解説を開けます。</p>
    <div class="card" style="padding:4px 12px">
      ${pSession.ids.map((id,i) => { const q = pById(id); const gv = g[id];
        const m = gv === undefined ? ['n','－'] : gv ? ['o','✓'] : ['x','×'];
        return `<div class="qrow" data-pgo="${i}"><span class="mark ${m[0]}">${m[1]}</span>
          <span class="nm">${q.id}　${esc(q.topic)}
            <small>${q.syllabus.join('・')}　／　${fmtMs(pSession.timeMs[id]||0)}</small></span></div>`;
      }).join('')}
    </div>

    ${ngIds.length ? `<button class="btn prac wide" id="pReviewBtn" type="button">間違えた問題を確認（${ngIds.length}問）</button>` : ''}
    <button class="btn sub wide" id="pAllBtn" type="button" style="margin-top:8px">1問目から解説を見る</button>
    <div class="navbtns">
      <button class="btn ghost" id="pHome" type="button">実戦テストトップへ</button>
    </div>`;

  app.querySelectorAll('[data-pgo]').forEach(el => el.onclick = () => {
    pSession.cur = +el.dataset.pgo; render('pquiz');
  });
  const rb = $('#pReviewBtn');
  if(rb) rb.onclick = () => { pSession.reviewIds = ngIds.slice(); pSession.rcur = 0; render('preview'); };
  $('#pAllBtn').onclick = () => { pSession.cur = 0; render('pquiz'); };
  $('#pHome').onclick = () => { pSession = null; render('practical'); };
}

/* ---------- 間違えた問題の確認 ---------- */
function vPReview(){
  if(!pSession || !pSession.reviewIds.length){ render('presult'); return; }
  const id = pSession.reviewIds[pSession.rcur];
  const q = pById(id);
  const ord = pSession.order[id];
  const pickOrig = pSession.picks[id] || null;
  const correctPos = ord.indexOf(q.answer-1) + 1;

  app.innerHTML = `
    <h2 class="sec">間違えた問題の確認</h2>
    <div class="qbar"><span class="idx">${pSession.rcur+1} / ${pSession.reviewIds.length}</span></div>

    <div class="card">
      <div><span class="qno">${q.id}</span>
        ${q.syllabus.map(x => `<span class="badge">${x}</span>`).join('')}</div>
      <div class="qtitle">${esc(q.topic)}</div>
      <div class="qtext">${esc(q.question).replace(/\n/g,'<br>')}</div>
      <div>${ord.map((origIdx,i) => {
        const dispNo = i+1;
        const cls = dispNo === correctPos ? 'correct' : (origIdx+1 === pickOrig ? 'wrong' : '');
        return `<div class="choice ${cls}"><span class="num">${dispNo}</span>
          <span>${esc(q.choices[origIdx])}</span></div>`;
      }).join('')}</div>
    </div>

    <div class="verdict ng">不正解
      <span class="sm">あなたの解答 ${pickOrig ? ord.indexOf(pickOrig-1)+1 : '未回答'}　／　正解 ${correctPos}：${esc(q.choices[q.answer-1])}</span></div>

    <div class="exp"><p>${esc(q.explanation).replace(/／/g,'</p><p>')}</p></div>

    <button class="btn sub wide" id="pRel" type="button">基礎問題を復習（問${q.relatedQuestions.join('・問')}）</button>

    <div class="navbtns">
      <button class="btn ghost" id="rPrev" ${pSession.rcur===0?'disabled':''} type="button">← 前へ</button>
      <button class="btn ghost" id="rNext" ${pSession.rcur===pSession.reviewIds.length-1?'disabled':''} type="button">次へ →</button>
    </div>
    <button class="btn ghost wide" id="rBack" type="button">結果へ戻る</button>`;

  $('#pRel').onclick = () => { const rel = q.relatedQuestions.slice(); pSession = null;
    startSession(rel, '基礎問題の復習'); };
  $('#rPrev').onclick = () => { if(pSession.rcur>0){ pSession.rcur--; vPReview(); } };
  $('#rNext').onclick = () => { if(pSession.rcur<pSession.reviewIds.length-1){ pSession.rcur++; vPReview(); } };
  $('#rBack').onclick = () => render('presult');
}

/* ---------- 設定 ---------- */
function vSettings(){
  const done = QUESTIONS.filter(q => answered(q.id)).length;
  const weak = QUESTIONS.filter(q => isWeak(q.id)).length;
  const pf = pFirstStats();
  app.innerHTML = `
    <h2 class="sec">設定</h2>
    <div class="card">
      <b>学習履歴</b>
      <div class="muted" style="margin:6px 0 0">回答済み ${done}問 ／ 苦手登録 ${weak}問</div>
      <div class="muted">保存先：この端末のブラウザ（localStorage：${LS_KEY}）</div>
    </div>
    <div class="card">
      <b>採点方式</b>
      <div class="muted" style="margin:6px 0 0">現在：${STORE.settings.judge==='test'
        ? 'テストモード（全問終了後にまとめて採点）' : '1問ずつ採点'}　※ホーム画面で切り替えます</div>
    </div>
    <div class="card">
      <b>選択肢のシャッフル</b>
      <div class="muted" style="margin:6px 0 0">初期版ではOFF固定です。正本HTMLの正解番号との整合性を優先しています。</div>
    </div>
    <div class="card">
      <b>実戦問題の履歴</b>
      ${PRACTICE_SETS.map(st => { const f = pFirstStats(st.items);
        return `<div class="muted" style="margin:6px 0 0">${st.name}：初見で解答 ${f.answered} / ${st.items.length}問　／　初見正答率 ${f.answered?f.rate+'%':'—'}</div>`;
      }).join('')}
      <div class="muted" style="margin-top:6px">保存先：localStorage：${P_LS_KEY}（既存100問とは別キー）</div>
    </div>
    <div class="card">
      <b>学習履歴をリセット</b>
      <div class="muted" style="margin:6px 0 10px">2種類の履歴は別々にリセットできます。いずれも取り消せません。</div>
      <button class="btn wide" id="resetBtn" style="background:var(--ng)" type="button">既存100問の履歴をリセット</button>
      ${PRACTICE_SETS.map(st => `<button class="btn wide" data-preset="${st.key}" style="background:var(--ng); margin-top:8px" type="button">実戦${st.name}の履歴をリセット</button>`).join('')}
    </div>
    <div class="card">
      <b>データについて</b>
      <div class="muted" style="margin:6px 0 0">
        問題・選択肢・正解・解説は「G検定_v1.4_厳選良問100問_統合完成版.html」から機械抽出したもので、原文を一切改変していません。
        シラバスIDはJDLA公式シラバス2024 第1.4版の55項目に対応します（T11は該当問題なし）。<br>
        実戦問題（${PRACTICE_SETS.map(st=>st.name+' '+st.items.length+'問').join(' / ')}）は、既存100問の論点を応用形式で問い直すために別途作成したもので、既存100問とは独立したデータです。</div>
    </div>`;
  $('#resetBtn').onclick = () => {
    if(confirm('本当にリセットしますか？\n既存100問の回答履歴・苦手登録がすべて消去され、元に戻せません。\n（実戦問題の履歴は残ります）')){
      STORE.history = {}; saveStore(); alert('既存100問の学習履歴をリセットしました。'); render('home');
    }
  };
  app.querySelectorAll('[data-preset]').forEach(b => b.onclick = () => {
    const st = PRACTICE_SETS.find(x => x.key === b.dataset.preset);
    if(!st) return;
    if(confirm(`本当にリセットしますか？\n実戦${st.name}の履歴（初見正答率を含む）が消去され、元に戻せません。\n（他のセットと既存100問の履歴は残ります）`)){
      st.items.forEach(q => { delete PSTORE.history[q.id]; });
      pSave(); alert(`実戦${st.name}の履歴をリセットしました。`); render('home');
    }
  });
}
