<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#2457a6">
<title>G検定 厳選良問100問</title>
<style>
  :root{
    --navy:#2457a6; --navy-d:#1b4180; --navy-l:#edf3fb;
    --ink:#222; --muted:#6b7280; --line:#dfe4ec; --bg:#f5f7fa; --card:#fff;
    --ok:#1a7f4b; --ok-bg:#e8f6ee; --ng:#c0392b; --ng-bg:#fdecea;
    --warn:#8a6d00; --warn-bg:#fff8db; --warn-line:#e8c85a;
    --cmp:#5b4ba8; --cmp-bg:#f2eefc; --cmp-line:#c3b6e8;
    --star:#e6a417;
    --maxw:1000px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Yu Gothic","Hiragino Sans","Meiryo",sans-serif;
    background:var(--bg); color:var(--ink); line-height:1.75;
    font-size:16px; overflow-x:hidden;
  }
  .wrap{max-width:var(--maxw); margin:0 auto; padding:0 14px 96px;}

  /* ---------- Header ---------- */
  header{
    background:var(--navy); color:#fff; position:sticky; top:0; z-index:50;
    padding:10px 14px calc(10px + env(safe-area-inset-top,0px));
    padding-top:calc(10px + env(safe-area-inset-top,0px));
    box-shadow:0 1px 6px rgba(0,0,0,.15);
  }
  .hd-in{max-width:var(--maxw); margin:0 auto; display:flex; align-items:center; gap:10px;}
  .hd-title{font-weight:800; font-size:15px; letter-spacing:.02em; flex:1; min-width:0;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .hd-sub{font-size:11px; opacity:.85; font-weight:400;}
  .hd-btn{
    background:rgba(255,255,255,.15); color:#fff; border:0; border-radius:8px;
    padding:7px 11px; font-size:13px; font-weight:700; cursor:pointer; white-space:nowrap;
  }
  .hd-btn:active{background:rgba(255,255,255,.3);}

  /* ---------- Common ---------- */
  h2.sec{font-size:17px; margin:26px 0 12px; padding-left:10px; border-left:5px solid var(--navy);}
  .card{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin:12px 0;}
  .muted{color:var(--muted); font-size:13px;}
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
    background:var(--navy); color:#fff; border:0; border-radius:10px;
    padding:13px 18px; font-size:15px; font-weight:700; cursor:pointer;
    min-height:48px; font-family:inherit;
  }
  .btn:active{background:var(--navy-d);}
  .btn[disabled]{opacity:.4; cursor:default;}
  .btn.sub{background:#fff; color:var(--navy); border:1.5px solid var(--navy);}
  .btn.ghost{background:#eef1f6; color:#374151; border:1px solid var(--line);}
  .btn.sm{padding:8px 12px; font-size:13px; min-height:38px;}
  .btn.wide{width:100%;}
  .row{display:flex; gap:8px; flex-wrap:wrap;}

  /* ---------- Home ---------- */
  .hero{background:linear-gradient(135deg,var(--navy),#3a72c9); color:#fff;
    border-radius:14px; padding:18px; margin:14px 0 4px;}
  .hero h1{margin:0 0 4px; font-size:20px;}
  .hero p{margin:0; font-size:12.5px; opacity:.9;}

  .prog-item{margin:10px 0;}
  .prog-top{display:flex; justify-content:space-between; align-items:baseline;
    gap:10px; font-size:13px; margin-bottom:5px;}
  .prog-top b{white-space:nowrap;}
  .prog-top span{text-align:right;}
  .bar{height:10px; background:#e6eaf2; border-radius:6px; overflow:hidden;}
  .bar>span{display:block; height:100%; background:var(--navy); border-radius:6px; transition:width .3s;}
  .bar.tech>span{background:#3a72c9;} .bar.law>span{background:#7a5cc4;}

  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(148px,1fr)); gap:9px;}
  .mode{
    background:#fff; border:1.5px solid var(--line); border-radius:11px;
    padding:13px 12px; text-align:left; cursor:pointer; font-family:inherit;
    min-height:62px; display:flex; flex-direction:column; justify-content:center;
  }
  .mode:active{background:var(--navy-l);}
  .mode b{font-size:15px; display:block;}
  .mode small{color:var(--muted); font-size:11.5px;}
  .mode[disabled]{opacity:.45; cursor:default;}

  .seg{display:inline-flex; border:1.5px solid var(--navy); border-radius:9px; overflow:hidden;}
  .seg button{background:#fff; color:var(--navy); border:0; padding:9px 16px;
    font-size:13.5px; font-weight:700; cursor:pointer; font-family:inherit; min-height:40px;}
  .seg button.on{background:var(--navy); color:#fff;}

  /* ---------- Quiz ---------- */
  .qbar{display:flex; align-items:center; gap:10px; margin:14px 0 8px; flex-wrap:wrap;}
  .qbar .idx{font-weight:800; font-size:14px; color:var(--navy);}
  .qprog{flex:1; min-width:120px;}
  .badge{display:inline-block; background:var(--navy-l); color:var(--navy-d);
    border-radius:6px; padding:2px 8px; font-size:12px; font-weight:700; margin-right:4px;}
  .qno{font-weight:800; color:var(--navy); font-size:15px;}
  .qtitle{font-weight:800; font-size:18px; margin:2px 0 8px;}
  .qtext{font-size:16px; margin:10px 0 14px;}
  .qtext p{margin:0 0 8px;}

  .choice{
    display:flex; gap:11px; align-items:flex-start; width:100%; text-align:left;
    background:#fff; border:1.5px solid var(--line); border-radius:11px;
    padding:14px 13px; margin:9px 0; cursor:pointer; font-family:inherit;
    font-size:15.5px; line-height:1.6; min-height:54px; color:var(--ink);
  }
  .choice:active{background:#f0f4fa;}
  .choice .num{
    flex:0 0 26px; height:26px; border-radius:50%; background:#eef1f6; color:#4b5563;
    display:flex; align-items:center; justify-content:center; font-weight:800; font-size:13px; margin-top:1px;
  }
  .choice.sel{border-color:var(--navy); background:var(--navy-l);}
  .choice.sel .num{background:var(--navy); color:#fff;}
  .choice.correct{border-color:var(--ok); background:var(--ok-bg);}
  .choice.correct .num{background:var(--ok); color:#fff;}
  .choice.wrong{border-color:var(--ng); background:var(--ng-bg);}
  .choice.wrong .num{background:var(--ng); color:#fff;}
  .choice[disabled]{cursor:default;}

  .verdict{border-radius:11px; padding:13px 15px; margin:14px 0; font-weight:800; font-size:16px;}
  .verdict.ok{background:var(--ok-bg); color:var(--ok); border:1.5px solid var(--ok);}
  .verdict.ng{background:var(--ng-bg); color:var(--ng); border:1.5px solid var(--ng);}
  .verdict .sm{display:block; font-weight:600; font-size:14px; margin-top:5px; color:var(--ink);}

  .star-btn{background:none; border:1.5px solid var(--line); border-radius:9px;
    padding:8px 12px; cursor:pointer; font-size:13.5px; font-weight:700;
    color:var(--muted); font-family:inherit; min-height:40px;}
  .star-btn.on{color:var(--star); border-color:var(--star); background:#fffaf0;}

  /* ---------- 解説（原文HTMLをそのまま描画） ---------- */
  .exp{background:#fff; border:1px solid var(--line); border-radius:12px;
    padding:4px 16px 14px; margin:12px 0; font-size:15px;}
  .exp p{margin:12px 0;}
  .exp .correct-answer{color:var(--ok); font-size:15.5px;}
  .exp .formula{background:#f3f5f9; border-radius:8px; padding:9px 12px;
    font-family:"SF Mono",Consolas,monospace; font-size:14px;}
  .exp .compare-box{background:var(--cmp-bg); border-left:4px solid var(--cmp-line);
    border-radius:0 8px 8px 0; padding:11px 13px; color:#3d3168;}
  .exp .exam-point{background:var(--warn-bg); border:1.5px solid var(--warn-line);
    border-radius:8px; padding:11px 13px; color:var(--warn);}

  /* ---------- Result ---------- */
  .score{text-align:center; padding:22px 14px;}
  .score .big{font-size:46px; font-weight:800; color:var(--navy); line-height:1.1;}
  .score .rate{font-size:19px; font-weight:800; margin-top:4px;}
  .tally{display:flex; gap:10px; justify-content:center; margin-top:14px; flex-wrap:wrap;}
  .tally div{border-radius:10px; padding:9px 18px; font-weight:800; font-size:14px;}
  .tally .c{background:var(--ok-bg); color:var(--ok);}
  .tally .w{background:var(--ng-bg); color:var(--ng);}

  /* ---------- List ---------- */
  .qrow{display:flex; gap:10px; align-items:flex-start; padding:11px 4px;
    border-bottom:1px solid var(--line); cursor:pointer;}
  .qrow:active{background:var(--navy-l);}
  .mark{flex:0 0 22px; text-align:center; font-weight:800; font-size:15px;}
  .mark.o{color:var(--ok);} .mark.x{color:var(--ng);} .mark.n{color:#c3c9d4;}
  .qrow .nm{flex:1; min-width:0; font-size:14.5px;}
  .qrow .nm small{color:var(--muted); font-size:11.5px; display:block;}
  .qrow .st{color:var(--star); font-size:14px;}

  input[type=search],input[type=text]{
    width:100%; padding:12px 13px; border:1.5px solid var(--line); border-radius:10px;
    font-size:16px; font-family:inherit; background:#fff; color:var(--ink); min-height:46px;
  }
  input:focus{outline:2px solid var(--navy); outline-offset:-1px;}

  .chips{display:flex; flex-wrap:wrap; gap:6px; margin:8px 0;}
  .chip{background:#fff; border:1.5px solid var(--line); border-radius:8px;
    padding:7px 10px; font-size:13px; font-weight:700; cursor:pointer;
    font-family:inherit; color:var(--ink); min-height:36px;}
  .chip:active,.chip.on{background:var(--navy); color:#fff; border-color:var(--navy);}
  .chip .n{color:var(--muted); font-weight:600; font-size:11.5px; margin-left:3px;}
  .chip.on .n{color:rgba(255,255,255,.8);}
  .chip.zero{opacity:.55;}

  .empty{text-align:center; color:var(--muted); padding:34px 14px; font-size:14.5px;}

  /* ---------- Footer nav ---------- */
  .fnav{position:fixed; left:0; right:0; bottom:0; z-index:60;
    background:#fff; border-top:1px solid var(--line);
    display:flex; padding-bottom:env(safe-area-inset-bottom,0px);}
  .fnav button{flex:1; background:none; border:0; padding:9px 2px 8px; cursor:pointer;
    font-size:10.5px; color:var(--muted); font-family:inherit; font-weight:700;}
  .fnav button .ic{display:block; font-size:18px; line-height:1.25;}
  .fnav button.on{color:var(--navy);}

  .navbtns{display:flex; gap:8px; margin:16px 0 8px;}
  .navbtns .btn{flex:1;}

  @media(max-width:420px){
    .prog-top{flex-direction:column; gap:1px;}
    .prog-top span{text-align:left;}
    .grid{grid-template-columns:repeat(2,1fr);}
    .qtitle{font-size:17px;}
    .choice{font-size:15px;}
  }
  @media(min-width:760px){
    .wrap{padding:0 24px 96px;}
    .hd-title{font-size:17px;}
  }
</style>
</head>
<body>

<header>
  <div class="hd-in">
    <div class="hd-title">G検定 厳選良問100問<span class="hd-sub"> ／ シラバスv1.4準拠</span></div>
    <button class="hd-btn" id="homeBtn" type="button">ホーム</button>
  </div>
</header>

<div class="wrap" id="app"></div>

<nav class="fnav" id="fnav">
  <button type="button" data-nav="home"><span class="ic">🏠</span>ホーム</button>
  <button type="button" data-nav="list"><span class="ic">📋</span>問題一覧</button>
  <button type="button" data-nav="search"><span class="ic">🔍</span>検索</button>
  <button type="button" data-nav="exps"><span class="ic">📖</span>解説一覧</button>
  <button type="button" data-nav="settings"><span class="ic">⚙️</span>設定</button>
</nav>

<script>
/* ============================================================
   QUESTIONS ── 正本HTMLから機械抽出。原文は一切改変していない。
   出典: G検定_v1.4_厳選良問100問_統合完成版.html
   ============================================================ */
const QUESTIONS = [{"id":1,"title":"シンボルグラウンディング問題","syllabusIds":["T02"],"questionHtml":"<p>AIが「りんご」という記号を処理できても、それを現実世界の赤い果物として意味づけられるとは限らない。この問題を最も適切に表すものはどれか。</p>","choices":["フレーム問題","シンボルグラウンディング問題","トイ・プロブレム","知識獲得のボトルネック"],"answer":2,"explanationHtml":"<p class=\"correct-answer\"><strong>正解：② シンボルグラウンディング問題</strong></p>\n<p><strong>解説：</strong>\nシンボルグラウンディング問題とは、コンピュータが扱う記号と、現実世界の対象や意味をどのように結びつけるかという問題です。\n「りんご」という文字列を処理できることと、現実のりんごの意味を理解していることは同じではありません。\n</p>\n<p><strong>誤答を切るポイント：</strong>\nフレーム問題は、現実世界の膨大な情報から「何を考慮すべきか」を選ぶ難しさです。\nトイ・プロブレムは、現実より単純化された問題設定を指します。\n知識獲得のボトルネックは、専門知識をシステムへ取り込む困難さです。\n</p>\n<p class=\"compare-box\"><strong>混同注意：</strong>\nシンボルグラウンディング＝「記号と意味をどう結びつけるか」。\nフレーム問題＝「何を考慮し、何を無視するか」。\n</p>\n<p class=\"exam-point\"><strong>試験ポイント：</strong>\n「記号は扱えるが意味が分からない」ならシンボルグラウンディング問題。\n</p>"},{"id":2,"title":"フレーム問題","syllabusIds":["T02"],"questionHtml":"<p>現実世界でロボットが行動を決める際、理論上は無数の事柄を考慮できるため、「何を考慮し、何を無視するか」を決めることが困難になる。この問題はどれか。</p>","choices":["フレーム問題","勾配消失問題","多重共線性","シンボルグラウンディング問題"],"answer":1,"explanationHtml":"<p class=\"correct-answer\"><strong>正解：① フレーム問題</strong></p>\n<p><strong>解説：</strong>\nフレーム問題は、現実世界では考慮可能な事柄が膨大に存在するため、ある状況で本当に関係する情報だけを効率よく選ぶことが難しいという問題です。\n</p>\n<p><strong>誤答を切るポイント：</strong>\n勾配消失問題はニューラルネットワーク学習時の問題、多重共線性は回帰分析で説明変数間に強い相関がある問題、シンボルグラウンディングは記号と意味の結びつきに関する問題です。\n</p>\n<p class=\"compare-box\"><strong>混同注意：</strong>\n「意味づけ」ならシンボルグラウンディング、「考慮事項が多すぎる」ならフレーム問題。\n</p>\n<p class=\"exam-point\"><strong>試験ポイント：</strong>\n「無数の可能性から必要なものだけ選ぶ」がキーワードです。\n</p>"},{"id":3,"title":"ハイパーパラメータ","syllabusIds":["T16"],"questionHtml":"<p>次のうち、一般にモデルが学習によって自動的に獲得するパラメータではなく、人が学習前に設定・調整するハイパーパラメータはどれか。</p>","choices":["ニューラルネットワークの重み","ニューラルネットワークのバイアス","学習率","学習によって求めた回帰係数"],"answer":3,"explanationHtml":"<p class=\"correct-answer\"><strong>正解：③ 学習率</strong></p>\n<p><strong>解説：</strong>\n学習率は、勾配を使ってパラメータをどの程度更新するかを決める代表的なハイパーパラメータです。\n通常、学習前または学習過程で人が設定します。\n</p>\n<p><strong>誤答を切るポイント：</strong>\n重み、バイアス、回帰係数は通常、学習データから更新・推定されるモデルパラメータです。\n</p>\n<p class=\"compare-box\"><strong>混同注意：</strong>\nモデルパラメータ＝学習で求まる。\nハイパーパラメータ＝学習方法を人が設定する。\n</p>\n<p class=\"exam-point\"><strong>試験ポイント：</strong>\n学習率・バッチサイズ・エポック数は代表的ハイパーパラメータ。\n</p>"},{"id":4,"title":"ドロップアウト","syllabusIds":["T14"],"questionHtml":"<p>ニューラルネットワークの学習時に、一部のユニットを確率的に無効化することで過学習を抑制する手法はどれか。</p>","choices":["ドロップアウト","バッチ正規化","量子化","蒸留"],"answer":1,"explanationHtml":"<p class=\"correct-answer\"><strong>正解：① ドロップアウト</strong></p>\n<p><strong>解説：</strong>\nDropoutは、学習時に一部のユニットをランダムに無効化することで、特定ユニットへの過度な依存を防ぎ、過学習を抑える正則化手法です。\n</p>\n<p><strong>誤答を切るポイント：</strong>\nバッチ正規化は中間表現の分布を整えて学習を安定化する手法です。\n量子化と蒸留は主にモデル軽量化・高速化に用いられます。\n</p>\n<p class=\"exam-point\"><strong>試験ポイント：</strong>\n「学習時にランダムにニューロンを無効化」＝Dropout。\n</p>"},{"id":5,"title":"適合率","syllabusIds":["T10"],"questionHtml":"<p>ある迷惑メール検出AIが「迷惑メール」と判定した100件のうち、実際に迷惑メールだったものが80件だった。このAIの適合率はどれか。</p>","choices":["20%","80%","100%","実際の迷惑メール総数が不明なので計算できない"],"answer":2,"explanationHtml":"<p class=\"correct-answer\"><strong>正解：② 80%</strong></p>\n<p><strong>解説：</strong>\n適合率は、「陽性と予測したもののうち、実際に陽性だった割合」です。\n</p>\n<p class=\"formula\">適合率 = TP ÷ (TP + FP)</p>\n<p>\n今回は迷惑メールと判定した100件のうち80件が本当に迷惑メールなので、\n80 ÷ 100 = 0.8、したがって80%です。\n</p>\n<p class=\"compare-box\"><strong>混同注意：</strong>\n適合率＝予測陽性の正しさ。\n再現率＝実際の陽性をどれだけ拾えたか。\n</p>\n<p class=\"exam-point\"><strong>試験ポイント：</strong>\nPrecisionの分母は「陽性と予測した件数」。\n</p>"},{"id":6,"title":"再現率","syllabusIds":["T10"],"questionHtml":"<p>実際には迷惑メールが200件存在し、そのうちAIが迷惑メールとして正しく検出できたものが160件だった。再現率はどれか。</p>","choices":["20%","40%","80%","125%"],"answer":3,"explanationHtml":"<p class=\"correct-answer\"><strong>正解：③ 80%</strong></p>\n<p><strong>解説：</strong>\n再現率は、「実際に陽性であるもののうち、正しく陽性と検出できた割合」です。\n</p>\n<p class=\"formula\">再現率 = TP ÷ (TP + FN)</p>\n<p>\n実際の迷惑メール200件のうち160件を検出しているので、\n160 ÷ 200 = 0.8、80%です。\n</p>\n<p class=\"compare-box\"><strong>混同注意：</strong>\n適合率と再現率では分母が違います。\n</p>\n<p class=\"exam-point\"><strong>試験ポイント：</strong>\nRecallの分母は「実際の陽性総数」。\n</p>"},{"id":7,"title":"適合率 vs 再現率","syllabusIds":["T10"],"questionHtml":"<p>病気のスクリーニングAIで、病気の人を「正常」と見逃すことを特に避けたい。一般に、より重視すべき指標はどれか。</p>","choices":["再現率","適合率","決定係数","平均絶対誤差"],"answer":1,"explanationHtml":"<p class=\"correct-answer\"><strong>正解：① 再現率</strong></p>\n<p><strong>解説：</strong>\n病気の人を正常と判定する見逃しは偽陰性（FN）です。\nFNを減らしたい場合は、実際の陽性をどれだけ拾えるかを見る再現率を重視します。\n</p>\n<p><strong>誤答を切るポイント：</strong>\n適合率は「陽性と判定したものが本当に陽性だった割合」なので、見逃し最小化とは直接の目的が異なります。\n</p>\n<p class=\"exam-point\"><strong>試験ポイント：</strong>\n見逃しを避けたい＝再現率。\n誤警報を減らしたい＝適合率を意識。\n</p>"},{"id":8,"title":"STRIPS","syllabusIds":["T03"],"questionHtml":"<p>あるロボットについて、現在の状態、実行可能な行動、その行動によって状態がどう変化するかを記述し、目標状態までの行動系列を探索したい。関連が最も深いものはどれか。</p>","choices":["STRIPS","TF-IDF","Grad-CAM","VAE"],"answer":1,"explanationHtml":"<p class=\"correct-answer\"><strong>正解：① STRIPS</strong></p>\n<p><strong>解説：</strong>\nSTRIPSは、現在状態、行動の前提条件、行動による状態変化などを記述し、目標までの行動系列を求めるプランニングの代表的枠組みです。\n</p>\n<p><strong>誤答を切るポイント：</strong>\nTF-IDFは自然言語処理、Grad-CAMは説明可能AI、VAEは生成モデルです。\n</p>\n<p class=\"exam-point\"><strong>試験ポイント：</strong>\n「状態＋行動＋目標」から計画を立てる＝STRIPS。\n</p>"},{"id":9,"title":"Q学習","syllabusIds":["T09"],"questionHtml":"<p>Q学習におけるQ値の説明として最も適切なものはどれか。</p>","choices":["状態と行動の組み合わせに対する価値を表す","教師データと予測値の誤差だけを表す","入力データの分散を表す","ニューラルネットワークの層数を表す"],"answer":1,"explanationHtml":"<p class=\"correct-answer\"><strong>正解：① 状態と行動の組み合わせに対する価値を表す</strong></p>\n<p><strong>解説：</strong>\nQ値は、ある状態で特定の行動を選んだときに、将来得られる報酬を含めた期待価値を表します。\n</p>\n<p><strong>誤答を切るポイント：</strong>\n教師あり学習の誤差、入力分散、ニューラルネットワークの層数とは無関係です。\n</p>\n<p class=\"exam-point\"><strong>試験ポイント：</strong>\nQ(s,a)＝状態sで行動aを選ぶ価値。\n</p>"},{"id":10,"title":"ε-greedy","syllabusIds":["T09"],"questionHtml":"<p>ε-greedy法について最も適切な説明はどれか。</p>","choices":["常に現在最も価値の高い行動だけを選ぶ","一定確率でランダムな行動を選び、探索の機会を確保する","報酬を使用せずに方策を決める","教師データから正解行動を直接学習する"],"answer":2,"explanationHtml":"<p class=\"correct-answer\"><strong>正解：② 一定確率でランダムな行動を選び、探索の機会を確保する</strong></p>\n<p><strong>解説：</strong>\nε-greedy法では、多くの場合は現在最も価値が高い行動を選びつつ、確率εでランダムな行動を選びます。\nこれにより探索と活用のバランスを取ります。\n</p>\n<p class=\"exam-point\"><strong>試験ポイント：</strong>\n探索＝未知の行動を試す。\n活用＝現在最良と分かっている行動を選ぶ。\n</p>"},{"id":11,"title":"BPTT","syllabusIds":["T22"],"questionHtml":"<p>RNNの学習で、時間方向に展開したネットワークに対して誤差逆伝播を行う方法はどれか。</p>","choices":["BPTT","NMS","TF-IDF","Grad-CAM"],"answer":1,"explanationHtml":"<p class=\"correct-answer\"><strong>正解：① BPTT</strong></p>\n<p><strong>解説：</strong>\nBPTTはBackpropagation Through Timeの略で、RNNを時間方向に展開し、各時刻をまたいで誤差逆伝播を行う学習方法です。\n</p>\n<p><strong>誤答を切るポイント：</strong>\nNMSは物体検出、TF-IDFは自然言語処理、Grad-CAMは可視化手法です。\n</p>\n<p class=\"exam-point\"><strong>試験ポイント：</strong>\nRNN＋時間方向の誤差逆伝播＝BPTT。\n</p>"},{"id":12,"title":"Transformer","syllabusIds":["T23"],"questionHtml":"<p>Transformerについて最も適切なものはどれか。</p>","choices":["系列処理には必ずRNNを必要とする","Attentionを中心とした構造により系列情報を処理する","教師なしクラスタリング専用モデルである","画像データには原理的に利用できない"],"answer":2,"explanationHtml":"<p class=\"correct-answer\"><strong>正解：② Attentionを中心とした構造により系列情報を処理する</strong></p>\n<p><strong>解説：</strong>\nTransformerはAttention、特にSelf-Attentionを中心に系列データを処理するモデルです。\nRNNを必須とせず、並列処理しやすい点も特徴です。\n</p>\n<p><strong>誤答を切るポイント：</strong>\nTransformerは自然言語だけでなく画像などにも応用されています。\n</p>\n<p class=\"exam-point\"><strong>試験ポイント：</strong>\nTransformer＝Attention中心、RNN不要。\n</p>"},{"id":13,"title":"TF-IDF","syllabusIds":["T27"],"questionHtml":"<p>ある文書内では頻繁に出現するが、文書集合全体では珍しい単語を比較的重要と評価する代表的手法はどれか。</p>","choices":["TF-IDF","BPTT","Q学習","Batch Normalization"],"answer":1,"explanationHtml":"<p class=\"correct-answer\"><strong>正解：① TF-IDF</strong></p>\n<p><strong>解説：</strong>\nTF-IDFは、ある文書では頻出するが、文書集合全体では珍しい語ほど重要度を高く評価する手法です。\n</p>\n<p class=\"compare-box\"><strong>混同注意：</strong>\nTF＝その文書内での頻度。\nIDF＝全文書中での珍しさ。\n</p>\n<p class=\"exam-point\"><strong>試験ポイント：</strong>\n「その文書では多い＋全体では珍しい」＝TF-IDF。\n</p>"},{"id":14,"title":"VAE","syllabusIds":["T24"],"questionHtml":"<p>VAEについて最も適切な説明はどれか。</p>","choices":["潜在変数を確率分布として扱う生成モデルである","強化学習における価値関数である","決定木を多数組み合わせたモデルである","物体検出後の重複矩形を削除する手法である"],"answer":1,"explanationHtml":"<p class=\"correct-answer\"><strong>正解：① 潜在変数を確率分布として扱う生成モデル</strong></p>\n<p><strong>解説：</strong>\nVAEはVariational Autoencoderの略で、潜在空間を確率分布として扱い、その分布からサンプリングすることで新しいデータを生成できるモデルです。\n</p>\n<p><strong>誤答を切るポイント：</strong>\n強化学習の価値関数、ランダムフォレスト、NMSとは異なります。\n</p>\n<p class=\"exam-point\"><strong>試験ポイント：</strong>\nVAE＝潜在空間を「分布」として学習する生成モデル。\n</p>"},{"id":15,"title":"Diffusion Model","syllabusIds":["T30"],"questionHtml":"<p>Diffusion Modelの基本的な考え方として最も適切なものはどれか。</p>","choices":["データへ徐々にノイズを加える過程と、そのノイズを除去する過程を利用する","2つの決定木を競わせる","必ずRNNを用いて画像を1画素ずつ生成する","強化学習によってのみ生成モデルを学習する"],"answer":1,"explanationHtml":"<p class=\"correct-answer\"><strong>正解：① ノイズ付加とノイズ除去を利用する</strong></p>\n<p><strong>解説：</strong>\nDiffusion Modelは、データへ段階的にノイズを加える順過程と、そこからノイズを除去してデータを復元する逆過程を学習します。\n</p>\n<p class=\"compare-box\"><strong>混同注意：</strong>\nGANは生成器と識別器を競わせますが、Diffusion Modelはノイズ除去過程を学習します。\n</p>\n<p class=\"exam-point\"><strong>試験ポイント：</strong>\nDiffusion＝ノイズを加える→除去して生成。\n</p>"},{"id":16,"title":"個人識別符号","syllabusIds":["L01"],"questionHtml":"<p>次のうち、個人識別符号に該当するものとして最も適切なものはどれか。</p>","choices":["会社の代表電話番号","運転免許証番号","店舗の郵便番号","商品の商品番号"],"answer":2,"explanationHtml":"<p class=\"correct-answer\"><strong>正解：② 運転免許証番号</strong></p>\n<p><strong>解説：</strong>\n個人識別符号には、個人に割り当てられた公的な番号や、身体的特徴を変換した符号などが含まれます。\n運転免許証番号は代表例です。\n</p>\n<p><strong>誤答を切るポイント：</strong>\n会社代表番号、店舗郵便番号、商品番号は個人を識別する符号ではありません。\n</p>\n<p class=\"exam-point\"><strong>試験ポイント：</strong>\n個人識別符号＝個人を特定できる公的番号・生体情報等。\n</p>"},{"id":17,"title":"匿名加工情報 vs 仮名加工情報","syllabusIds":["L01"],"questionHtml":"<p>匿名加工情報と仮名加工情報について最も適切な説明はどれか。</p>","choices":["両者は法律上まったく同じものである","仮名加工情報は、他の情報と照合しなければ特定個人を識別できないよう加工した情報である","匿名加工情報は加工前の本人を容易に識別できる状態でなければならない","どちらも個人情報保護法とは無関係である"],"answer":2,"explanationHtml":"<p class=\"correct-answer\"><strong>正解：② 仮名加工情報は、他の情報と照合しなければ特定個人を識別できないよう加工した情報</strong></p>\n<p><strong>解説：</strong>\n仮名加工情報は、他の情報と照合しない限り本人を識別できないよう加工した情報です。\n匿名加工情報とは制度上の要件や利用条件が異なります。\n</p>\n<p class=\"compare-box\"><strong>混同注意：</strong>\n仮名加工情報と匿名加工情報は同じではありません。\n「匿名」のほうが本人との結びつきをより強く切り離す制度です。\n</p>\n<p class=\"exam-point\"><strong>試験ポイント：</strong>\n匿名加工情報と仮名加工情報は別制度として整理する。\n</p>"},{"id":18,"title":"GDPR","syllabusIds":["L01"],"questionHtml":"<p>日本企業がEU域内の個人に対してオンラインサービスを提供し、その行動データを処理している。最も適切な考え方はどれか。</p>","choices":["日本企業なのでGDPRは絶対に適用されない","EU域内に本社がなければGDPRは適用されない","条件によってはEU域外の企業にもGDPRが適用され得る","GDPRはAI企業には適用されない"],"answer":3,"explanationHtml":"<p class=\"correct-answer\"><strong>正解：③ 条件によってはEU域外の企業にもGDPRが適用され得る</strong></p>\n<p><strong>解説：</strong>\nGDPRはEU域内に法人がある企業だけに適用されるとは限りません。\nEU域内の個人への商品・サービス提供や行動監視など、一定条件で域外事業者にも適用され得ます。\n</p>\n<p class=\"exam-point\"><strong>試験ポイント：</strong>\n「日本企業だからGDPR無関係」は誤り。\n</p>"},{"id":19,"title":"著作物性と著作権侵害","syllabusIds":["L02"],"questionHtml":"<p>AI生成物について最も適切なものはどれか。</p>","choices":["AIを利用して作成したものは必ず著作物となる","AI生成物の著作物性と、既存著作物に対する著作権侵害の成否は別の論点である","AI生成物には著作権侵害が絶対に成立しない","AIを使った時点で著作権はAIサービス提供者だけに帰属する"],"answer":2,"explanationHtml":"<p class=\"correct-answer\"><strong>正解：② 著作物性と著作権侵害は別の論点</strong></p>\n<p><strong>解説：</strong>\nAI生成物そのものが著作物として保護されるかという問題と、その生成物が既存著作物の権利を侵害しているかという問題は分けて判断します。\n</p>\n<p class=\"compare-box\"><strong>混同注意：</strong>\n著作物性＝生成物そのものに著作権が成立するか。\n著作権侵害＝既存著作物との関係で権利侵害が成立するか。\n</p>\n<p class=\"exam-point\"><strong>試験ポイント：</strong>\n「著作物か」と「侵害か」は別問題。\n</p>"},{"id":20,"title":"著作権法30条の4","syllabusIds":["L02"],"questionHtml":"<p>AI学習における著作物利用について、最も適切なものはどれか。</p>","choices":["AI学習であれば、どのような場合でも著作物を自由に利用できる","30条の4は、一定の非享受目的利用等について権利制限を定めているが、無条件の自由利用を認める規定ではない","30条の4はAI生成物の著作物性を決定する条文である","30条の4は特許法の規定である"],"answer":2,"explanationHtml":"<p class=\"correct-answer\"><strong>正解：② 一定の非享受目的利用等について権利制限を定めるが、無条件ではない</strong></p>\n<p><strong>解説：</strong>\n著作権法30条の4は、著作物に表現された思想・感情を享受することを目的としない一定の利用等について権利制限を定めています。\nAI学習であれば常に自由という意味ではありません。\n</p>\n<p class=\"exam-point\"><strong>試験ポイント：</strong>\n「AI学習なら何でも自由」は×。\n</p>"},{"id":21,"title":"法律上の利用可否 vs 利用規約","syllabusIds":["L02"],"questionHtml":"<p>あるデータについて著作権法上利用できる可能性がある場合の説明として、最も適切なものはどれか。</p>","choices":["法律上利用可能なら、契約や利用規約は確認する必要がない","法律上の利用可否と、利用規約・契約上の利用可否は分けて確認する必要がある","利用規約は法律より常に優先する","AI開発では利用規約は適用されない"],"answer":2,"explanationHtml":"<p class=\"correct-answer\"><strong>正解：② 法律上の利用可否と利用規約上の利用可否は別に確認する</strong></p>\n<p><strong>解説：</strong>\n法律上は利用可能でも、契約や利用規約で利用条件が制限されている場合があります。\n法律と契約は別の判断軸です。\n</p>\n<p class=\"compare-box\"><strong>混同注意：</strong>\n「法律でOK＝契約でもOK」とは限りません。\n</p>\n<p class=\"exam-point\"><strong>試験ポイント：</strong>\n法的許容性と契約上の許容性を分けて考える。\n</p>"},{"id":22,"title":"特許：新規性 vs 進歩性","syllabusIds":["L03"],"questionHtml":"<p>新規性と進歩性の違いとして最も適切なものはどれか。</p>","choices":["新規性は既存技術と同一でないこと、進歩性は既存技術から容易に想到できないことに関係する","新規性と進歩性は同義である","新規性は著作権法、進歩性は個人情報保護法の概念である","進歩性があれば新規性は一切審査されない"],"answer":1,"explanationHtml":"<p class=\"correct-answer\"><strong>正解：① 新規性＝既存技術と同一でない、進歩性＝容易に想到できない</strong></p>\n<p><strong>解説：</strong>\n新規性は既に知られた技術と同一ではないこと、進歩性は既存技術から当業者が容易に考えつくものではないことに関係します。\n</p>\n<p class=\"compare-box\"><strong>混同注意：</strong>\n新しいか＝新規性。\n簡単に思いつくか＝進歩性。\n</p>\n<p class=\"exam-point\"><strong>試験ポイント：</strong>\n新規性と進歩性は別要件。\n</p>"},{"id":23,"title":"発明者","syllabusIds":["L03"],"questionHtml":"<p>AIシステムを開発するプロジェクトで、ある技術的アイデアを具体的に創作した者を考える際、発明者の判断として最も適切なのはどれか。</p>","choices":["資金を提供した人が必ず発明者になる","会社の代表者が必ず発明者になる","発明の創作に実質的に関与した者かどうかが重要である","プログラムを最後に実行した人が必ず発明者になる"],"answer":3,"explanationHtml":"<p class=\"correct-answer\"><strong>正解：③ 発明の創作に実質的に関与した者</strong></p>\n<p><strong>解説：</strong>\n発明者は、肩書や資金提供ではなく、発明の具体的な創作に実質的に関与した者かどうかが重要です。\n</p>\n<p><strong>誤答を切るポイント：</strong>\n資金提供者、会社代表者、単なる作業実施者が当然に発明者になるわけではありません。\n</p>\n<p class=\"exam-point\"><strong>試験ポイント：</strong>\n発明者＝創作への実質的関与。\n</p>"},{"id":24,"title":"営業秘密の三要件","syllabusIds":["L04"],"questionHtml":"<p>営業秘密として保護されるための三要件の組み合わせとして最も適切なものはどれか。</p>","choices":["秘密管理性・有用性・非公知性","新規性・進歩性・創作性","公開性・匿名性・独創性","希少性・公平性・透明性"],"answer":1,"explanationHtml":"<p class=\"correct-answer\"><strong>正解：① 秘密管理性・有用性・非公知性</strong></p>\n<p><strong>解説：</strong>\n営業秘密として保護されるための重要な三要件は、秘密として管理されていること、有用な情報であること、公然と知られていないことです。\n</p>\n<p class=\"exam-point\"><strong>試験ポイント：</strong>\n営業秘密＝秘密管理性＋有用性＋非公知性。\n</p>"},{"id":25,"title":"限定提供データ","syllabusIds":["L04"],"questionHtml":"<p>限定提供データについて最も適切なものはどれか。</p>","choices":["営業秘密と完全に同じ三要件が必要である","一定の条件で特定の者に提供され、電磁的方法で相当量蓄積・管理されたデータなどを保護する制度である","特許登録されたデータだけが対象となる","個人情報だけを対象とした制度である"],"answer":2,"explanationHtml":"<p class=\"correct-answer\"><strong>正解：② 一定の条件で提供・蓄積・管理されたデータを保護する制度</strong></p>\n<p><strong>解説：</strong>\n限定提供データは、一定の条件のもとで特定者へ提供され、相当量蓄積され、電磁的方法で管理されているデータ等の保護に関係します。\n</p>\n<p class=\"compare-box\"><strong>混同注意：</strong>\n営業秘密と完全に同じ制度ではありません。\n</p>\n<p class=\"exam-point\"><strong>試験ポイント：</strong>\n営業秘密と限定提供データの違いを比較で覚える。\n</p>"},{"id":26,"title":"PoC","syllabusIds":["L06"],"questionHtml":"<p>AI開発においてPoCを行う主な目的として最も適切なものはどれか。</p>","choices":["開発開始時点で最終製品の精度を法的に保証する","本格開発前に技術的・事業的な実現可能性を検証する","学習データをすべて廃棄する","特許権を自動取得する"],"answer":2,"explanationHtml":"<p class=\"correct-answer\"><strong>正解：② 本格開発前に技術的・事業的な実現可能性を検証する</strong></p>\n<p><strong>解説：</strong>\nPoCはProof of Conceptの略で、アイデアや技術が実際に成立するかを小規模に検証する段階です。\n最終製品の完成や精度保証を意味しません。\n</p>\n<p class=\"exam-point\"><strong>試験ポイント：</strong>\nPoC＝本格開発前の実現可能性検証。\n</p>"},{"id":27,"title":"請負 vs 準委任","syllabusIds":["L06"],"questionHtml":"<p>AIのPoC段階では、事前に期待した精度を必ず達成できるとは限らない。この性質を踏まえた契約上の考え方として最も適切なものはどれか。</p>","choices":["必ず完成を約束する請負契約しか利用できない","業務の遂行自体を目的とする準委任契約が適する場合がある","契約は一切不要である","PoCでは知的財産の取り扱いを決めてはいけない"],"answer":2,"explanationHtml":"<p class=\"correct-answer\"><strong>正解：② 準委任契約が適する場合がある</strong></p>\n<p><strong>解説：</strong>\nAI開発、とくにPoCでは事前に成果や精度が確定しにくいため、仕事の完成を約束する請負より、業務遂行を目的とする準委任が適する場合があります。\n</p>\n<p class=\"compare-box\"><strong>混同注意：</strong>\n請負＝仕事の完成。\n準委任＝業務の遂行。\n</p>\n<p class=\"exam-point\"><strong>試験ポイント：</strong>\nAIの探索的開発では成果確定性の低さを意識。\n</p>"},{"id":28,"title":"ソフトロー","syllabusIds":["L08"],"questionHtml":"<p>AIガバナンスにおけるソフトローについて最も適切な説明はどれか。</p>","choices":["必ず刑事罰を伴う法律","法律以外のガイドラインや原則等を通じて行動を促す規範","AIモデルのソースコード","ニューラルネットワークの正則化手法"],"answer":2,"explanationHtml":"<p class=\"correct-answer\"><strong>正解：② ガイドラインや原則等を通じて行動を促す規範</strong></p>\n<p><strong>解説：</strong>\nソフトローは、法律のような強制力を伴わない場合でも、ガイドライン、指針、原則等によって望ましい行動を促すものです。\n</p>\n<p class=\"compare-box\"><strong>混同注意：</strong>\nハードロー＝法的拘束力のある法律等。\nソフトロー＝柔軟なガイドライン・原則等。\n</p>\n<p class=\"exam-point\"><strong>試験ポイント：</strong>\n「刑罰がある＝ソフトロー」ではない。\n</p>"},{"id":29,"title":"モデル窃取","syllabusIds":["L11"],"questionHtml":"<p>機械学習モデルの窃取への対策として、最も不適切なものはどれか。</p>","choices":["モデルへのアクセスを制御する","不審な大量問い合わせを監視する","模倣モデルの存在を検知する仕組みを検討する","機械学習ライブラリを最新版にするだけで、モデル窃取を完全に防止できると考える"],"answer":4,"explanationHtml":"<p class=\"correct-answer\"><strong>正解：④ ライブラリ最新版化だけで完全防止できると考える</strong></p>\n<p><strong>解説：</strong>\nモデル窃取では、APIへの大量問い合わせ等からモデルの挙動を推定・模倣される可能性があります。\nアクセス制御や異常問い合わせ監視など複数の対策が必要です。\n</p>\n<p><strong>誤答を切るポイント：</strong>\n1〜3はモデル窃取に対する実際の防御方向です。\n</p>\n<p class=\"exam-point\"><strong>試験ポイント：</strong>\n「○○だけで完全防止」という極端な選択肢は要注意。\n</p>"},{"id":30,"title":"Adversarial Attack","syllabusIds":["L11"],"questionHtml":"<p>画像認識AIに対し、人間にはほとんど気づかないような入力の変化を意図的に加え、誤分類を引き起こした。最も関連するものはどれか。</p>","choices":["Adversarial Attack","k分割交差検証","蒸留","データポータビリティ"],"answer":1,"explanationHtml":"<p class=\"correct-answer\"><strong>正解：① Adversarial Attack</strong></p>\n<p><strong>解説：</strong>\nAdversarial Attackは、人間にはほとんど分からない程度の小さな入力変化を意図的に加えることで、AIに誤認識を起こさせる攻撃です。\n</p>\n<p class=\"compare-box\"><strong>混同注意：</strong>\nAdversarial Attack＝入力時の攻撃。\nデータ汚染＝学習データへの攻撃。\nモデル窃取＝モデル自体の模倣・抽出。\n</p>\n<p class=\"exam-point\"><strong>試験ポイント：</strong>\nいつ攻撃するか、何を狙うかで区別。\n</p>"},{"id":31,"title":"誤差関数の選択","syllabusIds":["T13"],"questionHtml":"<p>多クラス分類モデルで、正解クラスと予測確率分布のずれを評価したい。一般に最も適した誤差関数はどれか。</p>","choices":["交差エントロピー","平均二乗誤差だけ","L1正則化","コサイン類似度"],"answer":1,"explanationHtml":"<p class=\"correct-answer\"><strong>正解：① 交差エントロピー</strong></p>\n<p><strong>解説：</strong>\n多クラス分類では、正解ラベルとモデルの予測確率分布のずれを測るために交差エントロピーが代表的に使われます。\n</p>\n<p><strong>誤答を切るポイント：</strong>\n平均二乗誤差は回帰で代表的、L1正則化は正則化項、コサイン類似度はベクトル間の方向の近さを見る指標です。\n</p>\n<p class=\"exam-point\"><strong>試験ポイント：</strong>\n分類＝交差エントロピー、回帰＝MSEが基本。\n</p>"},{"id":32,"title":"平均二乗誤差","syllabusIds":["T13"],"questionHtml":"<p>住宅価格のような連続値を予測する回帰問題で、予測値と正解値の差を二乗して平均する指標はどれか。</p>","choices":["交差エントロピー","平均二乗誤差","適合率","AUC"],"answer":2,"explanationHtml":"<p class=\"correct-answer\"><strong>正解：② 平均二乗誤差</strong></p>\n<p><strong>解説：</strong>\n平均二乗誤差（MSE）は、予測値と実測値との差を二乗して平均した指標で、回帰問題で代表的に使われます。\n</p>\n<p class=\"formula\">MSE = 1/n × Σ(予測値 − 正解値)²</p>\n<p class=\"exam-point\"><strong>試験ポイント：</strong>\n連続値予測＝回帰＝MSE。\n</p>"},{"id":33,"title":"誤差逆伝播法","syllabusIds":["T15"],"questionHtml":"<p>ニューラルネットワークで、出力の誤差を出力層側から入力層側へ伝え、各重みの更新に必要な勾配を求める手法はどれか。</p>","choices":["誤差逆伝播法","k-means法","ブートストラップ法","蒸留"],"answer":1,"explanationHtml":"<p class=\"correct-answer\"><strong>正解：① 誤差逆伝播法</strong></p>\n<p><strong>解説：</strong>\n誤差逆伝播法は、出力層側で計算した誤差を前の層へ伝え、各重みについて損失の勾配を求める方法です。\n</p>\n<p class=\"exam-point\"><strong>試験ポイント：</strong>\n出力側→入力側へ勾配を伝える＝誤差逆伝播。\n</p>"},{"id":34,"title":"連鎖律","syllabusIds":["T15"],"questionHtml":"<p>多層ニューラルネットワークの誤差逆伝播で、複数の関数が合成された場合の微分計算に重要となる数学的原理はどれか。</p>","choices":["ベイズの定理","連鎖律","中心極限定理","コサイン定理"],"answer":2,"explanationHtml":"<p class=\"correct-answer\"><strong>正解：② 連鎖律</strong></p>\n<p><strong>解説：</strong>\nニューラルネットワークは複数の関数を合成した構造なので、微分を各層へ伝える際に連鎖律を利用します。\n</p>\n<p class=\"exam-point\"><strong>試験ポイント：</strong>\n誤差逆伝播の数学的基礎＝連鎖律。\n</p>"},{"id":35,"title":"全結合層","syllabusIds":["T17"],"questionHtml":"<p>CNNにおける全結合層の役割として最も適切なものはどれか。</p>","choices":["局所的な特徴を畳み込む","特徴マップを用いて最終的な分類などを行う","入力画像を必ず拡大する","時系列情報を保持する"],"answer":2,"explanationHtml":"<p class=\"correct-answer\"><strong>正解：② 特徴マップを用いて最終的な分類などを行う</strong></p>\n<p><strong>解説：</strong>\nCNNでは、畳み込み層などで抽出した特徴を全結合層へ入力し、最終的な分類などを行う構成が代表的です。\n</p>\n<p class=\"compare-box\"><strong>混同注意：</strong>\n局所特徴の抽出＝畳み込み層。\n最終判断＝全結合層。\n</p>\n<p class=\"exam-point\"><strong>試験ポイント：</strong>\n「特徴抽出」と「分類」の役割分担を整理。\n</p>"},{"id":36,"title":"畳み込み層","syllabusIds":["T18"],"questionHtml":"<p>畳み込み層の特徴として最も適切なものはどれか。</p>","choices":["画像の全画素と必ず独立した重みを持つ","フィルタを局所領域に適用して特徴マップを得る","出力を必ず1次元にする","RNNだけで利用できる"],"answer":2,"explanationHtml":"<p class=\"correct-answer\"><strong>正解：② フィルタを局所領域に適用して特徴マップを得る</strong></p>\n<p><strong>解説：</strong>\n畳み込み層では、小さなフィルタを入力の局所領域へ順番に適用し、エッジや模様などの特徴を表す特徴マップを作ります。\n</p>\n<p class=\"exam-point\"><strong>試験ポイント：</strong>\n畳み込み＝局所受容野＋重み共有。\n</p>"},{"id":37,"title":"パディング","syllabusIds":["T18"],"questionHtml":"<p>CNNで入力画像の周囲に0などの値を追加する主な目的として最も適切なものはどれか。</p>","choices":["勾配を必ず0にする","出力サイズの調整や画像端の情報を扱いやすくする","クラス数を増やす","教師データを生成する"],"answer":2,"explanationHtml":"<p class=\"correct-answer\"><strong>正解：② 出力サイズの調整や画像端の情報を扱いやすくする</strong></p>\n<p><strong>解説：</strong>\nPaddingは、入力の周囲に0などを追加する処理です。\n畳み込み後の空間サイズを調整したり、端の情報を失いにくくしたりする目的があります。\n</p>\n<p class=\"exam-point\"><strong>試験ポイント：</strong>\nPadding＝周囲を埋める、Stride＝フィルタを動かす幅。\n</p>"},{"id":38,"title":"バッチ正規化","syllabusIds":["T19"],"questionHtml":"<p>バッチ正規化について最も適切な説明はどれか。</p>","choices":["ミニバッチ単位で中間表現を正規化し、学習を安定させる","重みをすべて0にする","モデルを教師なし学習へ変換する","データ数を増やす"],"answer":1,"explanationHtml":"<p class=\"correct-answer\"><strong>正解：① ミニバッチ単位で中間表現を正規化し、学習を安定させる</strong></p>\n<p><strong>解説：</strong>\nBatch Normalizationは、ミニバッチごとに中間層の値を正規化し、学習の安定化や高速化に役立つ手法です。\n</p>\n<p class=\"compare-box\"><strong>混同注意：</strong>\nBatchNorm＝中間表現を正規化。\nDropout＝ユニットをランダムに無効化。\n</p>\n<p class=\"exam-point\"><strong>試験ポイント：</strong>\n正規化と正則化を混同しない。\n</p>"},{"id":39,"title":"スキップ結合","syllabusIds":["T21"],"questionHtml":"<p>ResNetで利用されるスキップ結合の説明として最も適切なものはどれか。</p>","choices":["ある層の入力を後段の層へ迂回して加える","学習データの一部を削除する","出力クラスをランダムに変更する","畳み込み演算を禁止する"],"answer":1,"explanationHtml":"<p class=\"correct-answer\"><strong>正解：① ある層の入力を後段の層へ迂回して加える</strong></p>\n<p><strong>解説：</strong>\nResNetのスキップ結合では、入力を途中の層を飛び越えて後段へ加えます。\nこれにより非常に深いネットワークでも学習しやすくなります。\n</p>\n<p class=\"exam-point\"><strong>試験ポイント：</strong>\nResNet＝Residual Block＋Skip Connection。\n</p>"},{"id":40,"title":"データ拡張","syllabusIds":["T25"],"questionHtml":"<p>画像分類で学習データが少ない場合、元画像を回転・反転・切り抜きなどして学習データの多様性を高める手法はどれか。</p>","choices":["データ拡張","モデル窃取","量子化","交差検証"],"answer":1,"explanationHtml":"<p class=\"correct-answer\"><strong>正解：① データ拡張</strong></p>\n<p><strong>解説：</strong>\nデータ拡張は、画像の回転・反転・クロップなどを使って学習データのバリエーションを増やし、過学習を抑え汎化性能向上を狙う手法です。\n</p>\n<p class=\"exam-point\"><strong>試験ポイント：</strong>\n新しい実データを集めずに多様性を増やす＝Data Augmentation。\n</p>"},{"id":41,"title":"転移学習","syllabusIds":["T31"],"questionHtml":"<p>大量データで学習済みの画像モデルを、新しい少量データの分類タスクに利用する考え方として最も適切なものはどれか。</p>","choices":["転移学習","バギング","Q学習","主成分分析"],"answer":1,"explanationHtml":"<p class=\"correct-answer\"><strong>正解：① 転移学習</strong></p>\n<p><strong>解説：</strong>\n転移学習は、別のタスクで学習済みのモデルや知識を、新しいタスクへ再利用する考え方です。\nデータが少ない場合にも有効なことがあります。\n</p>\n<p class=\"exam-point\"><strong>試験ポイント：</strong>\n学習済みモデルを新タスクへ再利用＝転移学習。\n</p>"},{"id":42,"title":"破滅的忘却","syllabusIds":["T31"],"questionHtml":"<p>あるモデルを新しいタスクで追加学習した結果、以前できていたタスクの性能が大きく低下した。この現象はどれか。</p>","choices":["次元の呪い","破滅的忘却","勾配爆発","過学習"],"answer":2,"explanationHtml":"<p class=\"correct-answer\"><strong>正解：② 破滅的忘却</strong></p>\n<p><strong>解説：</strong>\n破滅的忘却とは、新しいタスクを追加学習した結果、それ以前に学習していたタスクの性能が大きく失われる現象です。\n</p>\n<p class=\"compare-box\"><strong>混同注意：</strong>\n過学習は訓練データへ過度に適合すること。\n破滅的忘却は新規学習によって過去の知識を失うこと。\n</p>\n<p class=\"exam-point\"><strong>試験ポイント：</strong>\nv1.4では「破滅的忘却」の表記。\n</p>"},{"id":43,"title":"CLIP","syllabusIds":["T32"],"questionHtml":"<p>画像とテキストを同じ表現空間で対応づける代表的なマルチモーダルモデルはどれか。</p>","choices":["CLIP","k-means","LSTM","AdaGrad"],"answer":1,"explanationHtml":"<p class=\"correct-answer\"><strong>正解：① CLIP</strong></p>\n<p><strong>解説：</strong>\nCLIPは画像とテキストを対応づけ、共通の表現空間で扱えるよう学習する代表的なマルチモーダルモデルです。\n</p>\n<p class=\"exam-point\"><strong>試験ポイント：</strong>\n画像＋テキスト＝CLIP。\n</p>"},{"id":44,"title":"Visual Question Answering","syllabusIds":["T32"],"questionHtml":"<p>画像を入力し、「この画像に写っている動物は何ですか？」という自然言語の質問に回答するタスクはどれか。</p>","choices":["Visual Question Answering","強化学習","時系列予測","クラスタリング"],"answer":1,"explanationHtml":"<p class=\"correct-answer\"><strong>正解：① Visual Question Answering</strong></p>\n<p><strong>解説：</strong>\nVQAは、画像と自然言語による質問を入力し、その画像内容に基づいて回答するタスクです。\n</p>\n<p class=\"exam-point\"><strong>試験ポイント：</strong>\n画像＋質問→回答＝VQA。\n</p>"},{"id":45,"title":"Grad-CAM","syllabusIds":["T33"],"questionHtml":"<p>画像分類AIが画像のどの部分を重視して判断したかを可視化したい。代表的な手法はどれか。</p>","choices":["Grad-CAM","SGD","CTC","PCA"],"answer":1,"explanationHtml":"<p class=\"correct-answer\"><strong>正解：① Grad-CAM</strong></p>\n<p><strong>解説：</strong>\nGrad-CAMは、画像分類モデルが判断時に画像のどの部分を重視したかをヒートマップなどで可視化する代表的な説明手法です。\n</p>\n<p class=\"exam-point\"><strong>試験ポイント：</strong>\n画像モデルの注目領域可視化＝Grad-CAM。\n</p>"},{"id":46,"title":"XAI","syllabusIds":["T33"],"questionHtml":"<p>医療診断AIで「なぜその判断をしたのか」を医師が確認できるようにしたい。この要求に最も関係するものはどれか。</p>","choices":["XAI","モデル圧縮","データ拡張","バギング"],"answer":1,"explanationHtml":"<p class=\"correct-answer\"><strong>正解：① XAI</strong></p>\n<p><strong>解説：</strong>\nXAIはExplainable AIの略で、AIの判断理由や根拠を人間が理解できる形で説明することを目指します。\n</p>\n<p class=\"exam-point\"><strong>試験ポイント：</strong>\n「なぜその判断？」を説明＝XAI。\n</p>"},{"id":47,"title":"量子化","syllabusIds":["T34"],"questionHtml":"<p>モデル軽量化のため、32bit浮動小数点で表現していたパラメータを8bit整数など、より少ないビット数で表現する手法はどれか。</p>","choices":["量子化","交差検証","One-shot","TF-IDF"],"answer":1,"explanationHtml":"<p class=\"correct-answer\"><strong>正解：① 量子化</strong></p>\n<p><strong>解説：</strong>\n量子化では、たとえば32bit浮動小数点を8bit整数へ変換するなど、数値表現のビット数を減らしてモデルを軽量化します。\n</p>\n<p class=\"compare-box\"><strong>混同注意：</strong>\n量子化＝数値精度を下げる。\nプルーニング＝不要な重み等を削る。\n蒸留＝大モデルの知識を小モデルへ移す。\n</p>\n<p class=\"exam-point\"><strong>試験ポイント：</strong>\nINT8など少ないビット数＝量子化。\n</p>"},{"id":48,"title":"MLOps","syllabusIds":["T35"],"questionHtml":"<p>AIモデルを開発して終わりではなく、デプロイ後の監視・更新・再学習まで継続的に管理する考え方として最も適切なものはどれか。</p>","choices":["MLOps","TF-IDF","Mini-Max法","One-hot encoding"],"answer":1,"explanationHtml":"<p class=\"correct-answer\"><strong>正解：① MLOps</strong></p>\n<p><strong>解説：</strong>\nMLOpsは、機械学習モデルの開発だけでなく、デプロイ、監視、再学習、更新など運用ライフサイクル全体を継続的に管理する考え方です。\n</p>\n<p class=\"exam-point\"><strong>試験ポイント：</strong>\nAIは作って終わりではない＝MLOps。\n</p>"},{"id":49,"title":"データリーケージ","syllabusIds":["T36"],"questionHtml":"<p>モデルを評価する際、本来テスト時まで利用できない情報が学習データへ入り込み、不自然に高い精度が得られた。この問題はどれか。</p>","choices":["データリーケージ","蒸留","量子化","エコーチェンバー"],"answer":1,"explanationHtml":"<p class=\"correct-answer\"><strong>正解：① データリーケージ</strong></p>\n<p><strong>解説：</strong>\nデータリーケージは、本来予測時には利用できない情報が学習データや特徴量へ入り込み、実際以上に高い評価結果が出てしまう問題です。\n</p>\n<p class=\"exam-point\"><strong>試験ポイント：</strong>\n「未来の情報」「正解情報」が学習側へ漏れる＝リーケージ。\n</p>"},{"id":50,"title":"独占禁止法","syllabusIds":["L05"],"questionHtml":"<p>複数の競合企業が同一の価格決定アルゴリズムを利用し、市場で価格競争が実質的に弱まった場合、主に問題となり得る法領域はどれか。</p>","choices":["独占禁止法","著作権法だけ","特許法だけ","個人情報保護法だけ"],"answer":1,"explanationHtml":"<p class=\"correct-answer\"><strong>正解：① 独占禁止法</strong></p>\n<p><strong>解説：</strong>\nアルゴリズムによる価格調整等により企業間の競争が実質的に制限される場合、独占禁止法上の問題となり得ます。\n</p>\n<p class=\"exam-point\"><strong>試験ポイント：</strong>\n独禁法の判断軸＝競争制限・公正競争阻害性。\n</p>"},{"id":51,"title":"AIサービス提供契約","syllabusIds":["L07"],"questionHtml":"<p>SaaS型AIサービスを利用する企業が、入力したデータをサービス提供者が自社モデルの学習に再利用できるか確認したい。最も確認すべきものはどれか。</p>","choices":["データ利用権や利用規約","ReLUの傾き","GPUのコア数だけ","バッチサイズだけ"],"answer":1,"explanationHtml":"<p class=\"correct-answer\"><strong>正解：① データ利用権や利用規約</strong></p>\n<p><strong>解説：</strong>\nSaaS型AIサービスへ入力したデータが、提供者側のモデル学習やサービス改善へ再利用されるかは重要な契約論点です。\n利用規約やデータ利用権を確認します。\n</p>\n<p class=\"exam-point\"><strong>試験ポイント：</strong>\n入力データの二次利用可否は契約・利用規約で確認。\n</p>"},{"id":52,"title":"精度保証","syllabusIds":["L07"],"questionHtml":"<p>AIサービスの契約について最も適切な考え方はどれか。</p>","choices":["AIである以上、100%の精度を当然に保証できる","精度保証の範囲や条件は契約上明確にする必要がある","SaaSでは利用規約は不要である","AIサービスでは知的財産を考慮しなくてよい"],"answer":2,"explanationHtml":"<p class=\"correct-answer\"><strong>正解：② 精度保証の範囲や条件は契約上明確にする必要がある</strong></p>\n<p><strong>解説：</strong>\nAIの精度はデータや利用状況に左右されるため、当然に100%を保証できるものではありません。\nどの範囲で何を保証するか契約上整理します。\n</p>\n<p class=\"exam-point\"><strong>試験ポイント：</strong>\nAI＝必ず100%ではない。\n</p>"},{"id":53,"title":"代理変数","syllabusIds":["L10"],"questionHtml":"<p>採用AIから「性別」を入力項目から削除したが、性別と強く相関する別の変数を利用したため、結果として性別による差が再現された。この別の変数を何というか。</p>","choices":["代理変数","目的変数","潜在変数","ハイパーパラメータ"],"answer":1,"explanationHtml":"<p class=\"correct-answer\"><strong>正解：① 代理変数</strong></p>\n<p><strong>解説：</strong>\nセンシティブ属性そのものを削除しても、それと強く相関する別の特徴量を使うことで、結果的に同じ差別的影響が生じることがあります。\nそのような特徴量が代理変数です。\n</p>\n<p class=\"exam-point\"><strong>試験ポイント：</strong>\nセンシティブ属性を消しただけでは公平性は保証されない。\n</p>"},{"id":54,"title":"サンプリングバイアス","syllabusIds":["L10"],"questionHtml":"<p>顔認識モデルの学習データが特定の年齢層に大きく偏っており、他の年齢層で精度が低下した。主な原因として最も適切なものはどれか。</p>","choices":["サンプリングバイアス","量子化誤差","勾配爆発","特許侵害"],"answer":1,"explanationHtml":"<p class=\"correct-answer\"><strong>正解：① サンプリングバイアス</strong></p>\n<p><strong>解説：</strong>\n学習データが特定の属性や集団に偏っていると、別の集団で性能が低下したり不公平な結果が生じたりします。\n</p>\n<p class=\"exam-point\"><strong>試験ポイント：</strong>\nデータの集め方が偏る＝サンプリングバイアス。\n</p>"},{"id":55,"title":"ディープフェイク","syllabusIds":["L12"],"questionHtml":"<p>実在人物が実際には発言していない内容を、AIで生成した映像・音声によって本人が話しているように見せた。最も関連するものはどれか。</p>","choices":["ディープフェイク","PCA","MLOps","正則化"],"answer":1,"explanationHtml":"<p class=\"correct-answer\"><strong>正解：① ディープフェイク</strong></p>\n<p><strong>解説：</strong>\nディープフェイクは、AIを利用して実在人物の顔・声・発言等を本物らしく生成・加工する技術です。\n偽情報やなりすましへの悪用が問題になります。\n</p>\n<p class=\"exam-point\"><strong>試験ポイント：</strong>\n偽映像・偽音声＝ディープフェイク。\n</p>"},{"id":56,"title":"透明性","syllabusIds":["L13"],"questionHtml":"<p>AIによる融資審査について、利用者に判断理由を説明できず、どのデータを使ったかも追跡できない。最も直接的に問題となる観点はどれか。</p>","choices":["透明性・説明可能性","モデル軽量化","データ拡張","蒸留"],"answer":1,"explanationHtml":"<p class=\"correct-answer\"><strong>正解：① 透明性・説明可能性</strong></p>\n<p><strong>解説：</strong>\nAIがどの情報を使い、どのような根拠で判断したかを説明・追跡できない場合、透明性や説明可能性の問題が生じます。\n</p>\n<p class=\"exam-point\"><strong>試験ポイント：</strong>\nブラックボックス問題＝透明性・説明可能性と関連。\n</p>"},{"id":57,"title":"フィルターバブル","syllabusIds":["L14"],"questionHtml":"<p>推薦アルゴリズムによって、利用者が自分の興味や考えに近い情報ばかりを見るようになり、異なる意見に触れにくくなった。この現象として最も適切なものはどれか。</p>","choices":["フィルターバブル","勾配消失","データリーケージ","過学習"],"answer":1,"explanationHtml":"<p class=\"correct-answer\"><strong>正解：① フィルターバブル</strong></p>\n<p><strong>解説：</strong>\nフィルターバブルは、推薦アルゴリズムや検索の個人最適化によって、利用者が自分の好みに近い情報ばかり目にするようになる現象です。\n</p>\n<p class=\"compare-box\"><strong>混同注意：</strong>\nフィルターバブル＝アルゴリズムによる情報選別。\nエコーチェンバー＝同じ意見の人々の交流で意見が増幅。\n</p>\n<p class=\"exam-point\"><strong>試験ポイント：</strong>\nアルゴリズム選別＝フィルターバブル。\n</p>"},{"id":58,"title":"環境保護","syllabusIds":["L15"],"questionHtml":"<p>大規模AIモデルと環境保護の関係について、最も適切な説明はどれか。</p>","choices":["AIモデルの学習には電力を消費するため、環境負荷が論点となる","AIは電力を一切使用しない","環境問題はAI倫理とは無関係である","モデルが大きいほど必ず消費電力は減る"],"answer":1,"explanationHtml":"<p class=\"correct-answer\"><strong>正解：① AIモデルの学習には電力を消費するため、環境負荷が論点となる</strong></p>\n<p><strong>解説：</strong>\n大規模AIモデルの学習・運用には多くの計算資源と電力が必要になる場合があり、エネルギー消費や環境負荷が社会的論点になります。\n</p>\n<p class=\"exam-point\"><strong>試験ポイント：</strong>\nAIの社会影響には環境・電力消費も含まれる。\n</p>"},{"id":59,"title":"AIと労働","syllabusIds":["L16"],"questionHtml":"<p>AIと労働政策について最も適切な考え方はどれか。</p>","choices":["AIはすべての職業を必ず消滅させる","AIとの協働、スキルの喪失、労働力不足への対応など複数の観点がある","労働力不足とAIは無関係である","AIを導入すると人間のスキルは必ず向上する"],"answer":2,"explanationHtml":"<p class=\"correct-answer\"><strong>正解：② AIとの協働、スキルの喪失、労働力不足への対応など複数の観点がある</strong></p>\n<p><strong>解説：</strong>\nAIと労働の関係は「仕事がなくなる」という一方向の議論だけではありません。\n人間との協働、業務変化、リスキリング、スキル喪失、労働力不足への対応など幅広い論点があります。\n</p>\n<p class=\"exam-point\"><strong>試験ポイント：</strong>\nAIの労働影響は単純な代替だけではない。\n</p>"},{"id":60,"title":"AIガバナンス","syllabusIds":["L18"],"questionHtml":"<p>企業がAIを導入した後も、モデルの挙動を継続的に確認し、問題があれば是正する仕組みを設けている。最も関連するものはどれか。</p>","choices":["モニタリング","One-shot","プルーニング","Bag-of-Words"],"answer":1,"explanationHtml":"<p class=\"correct-answer\"><strong>正解：① モニタリング</strong></p>\n<p><strong>解説：</strong>\nAI導入後も、モデルの性能低下、異常な挙動、新たなリスクなどを継続的に確認する必要があります。\nこれがモニタリングです。\n</p>\n<p class=\"exam-point\"><strong>試験ポイント：</strong>\n導入後の継続監視＝モニタリング。\n</p>"},{"id":61,"title":"AIとロボット","syllabusIds":["T01"],"questionHtml":"<p>人工知能とロボットの関係について、最も適切なものはどれか。</p>","choices":["人工知能は必ず物理的な身体を持つ","ロボットであれば必ず人工知能を搭載している","人工知能は情報処理の仕組みであり、物理的な身体を持つ必要はない","人工知能とロボットは同義である"],"answer":3,"explanationHtml":"<p class=\"correct-answer\"><strong>正解：③ 人工知能は情報処理の仕組みであり、物理的な身体を持つ必要はない</strong></p>\n<p><strong>解説：</strong>\nAIはソフトウェアとして存在でき、物理的な身体を必要としません。\n一方ロボットは物理的機械を指しますが、高度なAIを必ず搭載しているわけでもありません。\n</p>\n<p class=\"compare-box\"><strong>混同注意：</strong>\nAI＝知的情報処理。\nロボット＝物理的機械。\n</p>\n<p class=\"exam-point\"><strong>試験ポイント：</strong>\nAIとロボットは同義ではない。\n</p>"},{"id":62,"title":"知識表現","syllabusIds":["T04"],"questionHtml":"<p>「犬は哺乳類である」「タイヤは自動車の一部である」のように、概念間の関係をネットワークとして表現したい。最も関連するものはどれか。</p>","choices":["意味ネットワーク","誤差逆伝播法","k-means法","バッチ正規化"],"answer":1,"explanationHtml":"<p class=\"correct-answer\"><strong>正解：① 意味ネットワーク</strong></p>\n<p><strong>解説：</strong>\n意味ネットワークは、概念をノード、概念間の関係をリンクとしてネットワーク状に表現する知識表現です。\n</p>\n<p class=\"exam-point\"><strong>試験ポイント：</strong>\nis-a、part-of、has-aなどの関係を整理。\n</p>"},{"id":63,"title":"機械学習","syllabusIds":["T05"],"questionHtml":"<p>従来型のルールベースシステムと機械学習の違いとして、最も適切なものはどれか。</p>","choices":["機械学習では、データから規則性やパターンを学習する","機械学習では、すべての判断規則を人間がif-then形式で記述する必要がある","ルールベースシステムは必ずニューラルネットワークを使用する","機械学習にはデータを利用できない"],"answer":1,"explanationHtml":"<p class=\"correct-answer\"><strong>正解：① データから規則性やパターンを学習する</strong></p>\n<p><strong>解説：</strong>\n機械学習では、人間がすべての判断ルールを明示的に記述するのではなく、データから規則性を学習します。\n</p>\n<p class=\"compare-box\"><strong>混同注意：</strong>\nルールベース＝人間がif-then等を記述。\n機械学習＝データから学習。\n</p>\n<p class=\"exam-point\"><strong>試験ポイント：</strong>\n人がルールを書くか、データから学ぶか。\n</p>"},{"id":64,"title":"ディープラーニング","syllabusIds":["T06"],"questionHtml":"<p>従来の機械学習と比較したディープラーニングの特徴として、最も適切なものはどれか。</p>","choices":["多層ニューラルネットワークを利用し、データから有用な表現を学習できる","必ず人間がすべての特徴量を手作業で設計しなければならない","ディープラーニングでは大量の計算資源を利用できない","画像や音声には利用できない"],"answer":1,"explanationHtml":"<p class=\"correct-answer\"><strong>正解：① 多層ニューラルネットワークを利用し、データから有用な表現を学習できる</strong></p>\n<p><strong>解説：</strong>\nディープラーニングは、多層ニューラルネットワークを用いて、複雑な特徴表現をデータから学習できる点が大きな特徴です。\n</p>\n<p class=\"exam-point\"><strong>試験ポイント：</strong>\n深いニューラルネットワーク＋表現学習。\n</p>"},{"id":65,"title":"教師あり学習","syllabusIds":["T07"],"questionHtml":"<p>過去の住宅について「面積・築年数」と「実際の販売価格」の組を用いて、新しい住宅の価格を予測したい。最も適切な学習方法はどれか。</p>","choices":["教師あり学習","教師なし学習","強化学習","ランダム探索"],"answer":1,"explanationHtml":"<p class=\"correct-answer\"><strong>正解：① 教師あり学習</strong></p>\n<p><strong>解説：</strong>\n入力である面積・築年数と、正解ラベルである販売価格の組が与えられているため教師あり学習です。\n予測対象が連続値なので回帰にあたります。\n</p>\n<p class=\"exam-point\"><strong>試験ポイント：</strong>\n正解ラベルあり＝教師あり。\n連続値予測＝回帰。\n</p>"},{"id":66,"title":"教師なし学習","syllabusIds":["T08"],"questionHtml":"<p>顧客の購買履歴だけがあり、あらかじめ正解となる顧客グループは与えられていない。似た顧客同士を自動的にグループ化したい。最も適切な手法はどれか。</p>","choices":["クラスタリング","教師あり分類","Q学習","誤差逆伝播法"],"answer":1,"explanationHtml":"<p class=\"correct-answer\"><strong>正解：① クラスタリング</strong></p>\n<p><strong>解説：</strong>\nあらかじめ正解ラベルがなく、似た特徴を持つデータ同士をまとめたい場合は教師なし学習のクラスタリングを利用します。\n</p>\n<p class=\"exam-point\"><strong>試験ポイント：</strong>\nラベルなし＋グループ分け＝クラスタリング。\n</p>"},{"id":67,"title":"活性化関数","syllabusIds":["T12"],"questionHtml":"<p>ニューラルネットワークで活性化関数を用いる主な理由として最も適切なものはどれか。</p>","choices":["非線形性を導入し、複雑な関係を表現できるようにする","学習データを自動的に100倍にする","著作権侵害を防止する","モデルのパラメータを必ず0にする"],"answer":1,"explanationHtml":"<p class=\"correct-answer\"><strong>正解：① 非線形性を導入し、複雑な関係を表現できるようにする</strong></p>\n<p><strong>解説：</strong>\n活性化関数がなければ、層を重ねても全体として単純な線形変換になってしまいます。\n非線形活性化関数によって複雑な関係を学習できます。\n</p>\n<p class=\"exam-point\"><strong>試験ポイント：</strong>\n活性化関数の本質＝非線形性の導入。\n</p>"},{"id":68,"title":"プーリング層","syllabusIds":["T20"],"questionHtml":"<p>CNNで2×2の領域から最大値だけを取り出し、特徴マップの空間サイズを小さくする処理はどれか。</p>","choices":["Max Pooling","Batch Normalization","Dropout","Self-Attention"],"answer":1,"explanationHtml":"<p class=\"correct-answer\"><strong>正解：① Max Pooling</strong></p>\n<p><strong>解説：</strong>\nMax Poolingは、一定領域内の最大値を代表値として取り出し、特徴マップの空間サイズを縮小する処理です。\n</p>\n<p class=\"compare-box\"><strong>混同注意：</strong>\nMax Pooling＝最大値。\nAverage Pooling＝平均値。\n</p>\n<p class=\"exam-point\"><strong>試験ポイント：</strong>\n2×2領域から最大値を採る＝Max Pooling。\n</p>"},{"id":69,"title":"画像認識タスク","syllabusIds":["T26"],"questionHtml":"<p>画像内に複数の自動車があり、それぞれの自動車を別個の物体として認識しながら、画素単位で領域を特定したい。最も適切なタスクはどれか。</p>","choices":["画像分類","セマンティックセグメンテーション","インスタンスセグメンテーション","回帰分析"],"answer":3,"explanationHtml":"<p class=\"correct-answer\"><strong>正解：③ インスタンスセグメンテーション</strong></p>\n<p><strong>解説：</strong>\nインスタンスセグメンテーションは、画素単位で領域を分類しつつ、同じクラスの複数物体も個体ごとに区別します。\n</p>\n<p class=\"compare-box\"><strong>混同注意：</strong>\n画像分類＝画像全体。\n物体検出＝物体の位置。\nセマンティックセグメンテーション＝画素ごとのクラス。\nインスタンスセグメンテーション＝個体も区別。\n</p>\n<p class=\"exam-point\"><strong>試験ポイント：</strong>\n「同じクラスでも個体を別々に識別」がインスタンス。\n</p>"},{"id":70,"title":"自然言語処理","syllabusIds":["T27"],"questionHtml":"<p>「この映画は最高だった」「この映画は退屈だった」といった文章から、肯定的・否定的な評価を判定するタスクはどれか。</p>","choices":["感情分析","姿勢推定","物体検出","音声合成"],"answer":1,"explanationHtml":"<p class=\"correct-answer\"><strong>正解：① 感情分析</strong></p>\n<p><strong>解説：</strong>\n文章から肯定・否定などの評価や感情を推定するタスクが感情分析です。\n</p>\n<p><strong>誤答を切るポイント：</strong>\n姿勢推定・物体検出は画像系、音声合成は音声生成です。\n</p>\n<p class=\"exam-point\"><strong>試験ポイント：</strong>\nポジティブ／ネガティブ判定＝感情分析。\n</p>"},{"id":71,"title":"音声処理","syllabusIds":["T28"],"questionHtml":"<p>複数人の会話音声について、「誰が話しているか」を識別したい。最も関連する音声処理タスクはどれか。</p>","choices":["話者識別","物体検出","トピックモデル","画像生成"],"answer":1,"explanationHtml":"<p class=\"correct-answer\"><strong>正解：① 話者識別</strong></p>\n<p><strong>解説：</strong>\n話者識別は、音声の特徴から「誰が話しているか」を識別するタスクです。\n本問では話者そのものを識別したいので、話者識別が適切です。\n</p>\n<p><strong>誤答を切るポイント：</strong>\n物体検出は画像、トピックモデルは文書、画像生成は生成AIの画像タスクです。\n</p>\n<p class=\"compare-box\"><strong>混同注意：</strong>\n話者識別＝誰が話したか。\n音声認識＝何を話したか。\n</p>\n<p class=\"exam-point\"><strong>試験ポイント：</strong>\n誰？＝話者識別／何を？＝音声認識。\n</p>"},{"id":72,"title":"深層強化学習","syllabusIds":["T29"],"questionHtml":"<p>従来のQ学習では状態数が非常に多くQテーブルで扱うことが困難になったため、ニューラルネットワークで行動価値関数を近似した。最も関連する手法はどれか。</p>","choices":["DQN","VAE","BERT","k-means"],"answer":1,"explanationHtml":"<p class=\"correct-answer\"><strong>正解：① DQN</strong></p>\n<p><strong>解説：</strong>\nDQNはDeep Q-Networkの略で、Q学習の行動価値関数をニューラルネットワークで近似します。\n状態空間が大きくQテーブルで扱えない問題へ対応します。\n</p>\n<p class=\"exam-point\"><strong>試験ポイント：</strong>\nQ学習＋ニューラルネットワーク＝DQN。\n</p>"},{"id":73,"title":"数理統計","syllabusIds":["T37"],"questionHtml":"<p>データ「2, 3, 3, 4, 100」の代表値を考える。外れ値100の影響を平均値より受けにくいものはどれか。</p>","choices":["中央値","分散","標準偏差","平均値"],"answer":1,"explanationHtml":"<p class=\"correct-answer\"><strong>正解：① 中央値</strong></p>\n<p><strong>解説：</strong>\nデータを小さい順に並べると 2, 3, 3, 4, 100 なので中央値は3です。\n中央値は極端な外れ値の影響を平均値より受けにくい代表値です。\n</p>\n<p class=\"compare-box\"><strong>混同注意：</strong>\n平均値は外れ値に引っ張られやすい。\n中央値は順序の中央を見る。\n</p>\n<p class=\"exam-point\"><strong>試験ポイント：</strong>\n外れ値に強い代表値＝中央値。\n</p>"},{"id":74,"title":"プライバシー・バイ・デザイン","syllabusIds":["L09"],"questionHtml":"<p>顔認識カメラを利用するAIサービスを開発する際、サービス完成後に問題が起きてから対策するのではなく、設計段階から取得データの範囲・保存期間・アクセス制御などを検討した。最も関連する考え方はどれか。</p>","choices":["プライバシー・バイ・デザイン","データリーケージ","蒸留","オーバーサンプリング"],"answer":1,"explanationHtml":"<p class=\"correct-answer\"><strong>正解：① プライバシー・バイ・デザイン</strong></p>\n<p><strong>解説：</strong>\nPrivacy by Designは、問題が起きてから対応するのではなく、企画・設計段階からプライバシー保護を組み込む考え方です。\n</p>\n<p class=\"compare-box\"><strong>混同注意：</strong>\nPrivacy by Design＝プライバシーを設計段階から組み込む。\nSecurity by Design＝セキュリティを設計段階から組み込む。\n</p>\n<p class=\"exam-point\"><strong>試験ポイント：</strong>\n後付けではなく最初から組み込む。\n</p>"},{"id":75,"title":"人間の自律性","syllabusIds":["L17"],"questionHtml":"<p>動画推薦AIが、利用者本人が十分に意識しないまま特定の選択へ誘導されるよう、行動データを利用して推薦を繰り返している。AI倫理上、最も直接的に関係する価値はどれか。</p>","choices":["人間の自律性","モデル圧縮","量子化","交差検証"],"answer":1,"explanationHtml":"<p class=\"correct-answer\"><strong>正解：① 人間の自律性</strong></p>\n<p><strong>解説：</strong>\n推薦AIなどが人間の意思決定へ過度に介入すると、人間自身が自分の意思で選択する能力・機会が損なわれる可能性があります。\n</p>\n<p class=\"exam-point\"><strong>試験ポイント：</strong>\nAIによる過度な誘導＝人間の自律性の論点。\n</p>"},{"id":76,"title":"教師あり・教師なし・強化学習","syllabusIds":["T07","T08","T09"],"questionHtml":"<p>次の組み合わせとして最も適切なものはどれか。</p>\n<p>\n（ア）正解ラベル付きの過去データから、住宅価格を予測する<br>\n（イ）正解ラベルのない購買履歴から、似た顧客をグループ化する<br>\n（ウ）エージェントが環境内で行動し、得られる報酬を最大化するよう学習する\n</p>","choices":["（ア）教師あり学習　（イ）教師なし学習　（ウ）強化学習","（ア）教師なし学習　（イ）教師あり学習　（ウ）強化学習","（ア）強化学習　（イ）教師なし学習　（ウ）教師あり学習","（ア）教師あり学習　（イ）強化学習　（ウ）教師なし学習"],"answer":1,"explanationHtml":"<p class=\"correct-answer\"><strong>正解：①</strong></p>\n<p><strong>解説：</strong>\n（ア）は正解ラベル付きデータによる価格予測なので教師あり学習、\n（イ）はラベルなしデータのグループ分けなので教師なし学習、\n（ウ）は報酬最大化を目指すので強化学習です。\n</p>\n<p class=\"compare-box\"><strong>横断整理：</strong><br>\n教師あり＝ラベルあり。<br>\n教師なし＝ラベルなし。<br>\n強化学習＝行動と報酬。\n</p>\n<p class=\"exam-point\"><strong>試験ポイント：</strong>\nまず「正解ラベルがあるか」「報酬があるか」を見る。\n</p>"},{"id":77,"title":"Sigmoid・Softmax・ReLU","syllabusIds":["T12"],"questionHtml":"<p>活性化関数の代表的な使い分けとして最も適切な組み合わせはどれか。</p>","choices":["ReLU＝隠れ層で利用されることが多い、Sigmoid＝2値分類の出力に利用されることがある、Softmax＝多クラス分類の出力に利用されることがある","ReLU＝確率の総和を1にする、Sigmoid＝多クラス専用、Softmax＝負の入力を必ず0にする","ReLU＝回帰でしか使えない、Sigmoid＝画像専用、Softmax＝強化学習専用","3つは機能上まったく同じである"],"answer":1,"explanationHtml":"<p class=\"correct-answer\"><strong>正解：①</strong></p>\n<p><strong>解説：</strong>\nReLUは隠れ層で広く使われ、Sigmoidは2値分類の出力など、Softmaxは多クラス分類の出力などで使われる代表的な組み合わせです。\n</p>\n<p class=\"compare-box\"><strong>横断整理：</strong><br>\nReLU＝負を0、正をそのまま通す代表的活性化関数。<br>\nSigmoid＝0〜1へ変換。<br>\nSoftmax＝複数クラスの出力を確率分布として扱う。\n</p>\n<p class=\"exam-point\"><strong>試験ポイント：</strong>\n隠れ層＝ReLU、2値＝Sigmoid、多クラス＝Softmax。\n</p>"},{"id":78,"title":"画像分類・物体検出・セグメンテーション","syllabusIds":["T26"],"questionHtml":"<p>画像認識タスクの説明として最も適切な組み合わせはどれか。</p>\n<p>\n（ア）画像全体が「犬」か「猫」かを判定する<br>\n（イ）画像中の自動車の位置を矩形領域などで特定する<br>\n（ウ）画像の各画素にクラスを割り当てる\n</p>","choices":["（ア）画像分類　（イ）物体検出　（ウ）セマンティックセグメンテーション","（ア）物体検出　（イ）画像分類　（ウ）回帰","（ア）セマンティックセグメンテーション　（イ）画像分類　（ウ）物体検出","（ア）画像分類　（イ）クラスタリング　（ウ）強化学習"],"answer":1,"explanationHtml":"<p class=\"correct-answer\"><strong>正解：①</strong></p>\n<p><strong>解説：</strong>\n画像全体のラベル判定が画像分類、画像中の物体位置を矩形等で求めるのが物体検出、各画素にクラスを割り当てるのがセマンティックセグメンテーションです。\n</p>\n<p class=\"compare-box\"><strong>横断整理：</strong><br>\n画像分類＝何が写っている？<br>\n物体検出＝何がどこにある？<br>\nセマンティックセグメンテーション＝各画素は何？<br>\nインスタンスセグメンテーション＝個体まで区別。\n</p>\n<p class=\"exam-point\"><strong>試験ポイント：</strong>\nタスクの出力形式を見ると切り分けやすい。\n</p>"},{"id":79,"title":"ハードロー・ソフトロー・リスクベースアプローチ","syllabusIds":["L08"],"questionHtml":"<p>AIガバナンスに関する説明として最も適切なものはどれか。</p>","choices":["ハードローは法的拘束力を伴う法律等、ソフトローはガイドライン・原則等による柔軟な規範、リスクベースアプローチはリスクの大きさに応じて対応の強度を変える考え方である","ハードローとソフトローは完全に同じ意味である","リスクベースアプローチとは、すべてのAIを同じ強度で規制する考え方である","ソフトローは必ず刑事罰を伴う"],"answer":1,"explanationHtml":"<p class=\"correct-answer\"><strong>正解：①</strong></p>\n<p><strong>解説：</strong>\nハードローは法的拘束力のある法律・規制等、ソフトローはガイドライン・原則等による柔軟な規範です。\nリスクベースアプローチは、AIの危険性や影響の大きさに応じて対応強度を変える考え方です。\n</p>\n<p class=\"compare-box\"><strong>横断整理：</strong><br>\nHard Law＝強制力。<br>\nSoft Law＝柔軟性。<br>\nRisk-based＝リスクに応じて強弱を変える。\n</p>\n<p class=\"exam-point\"><strong>試験ポイント：</strong>\nリスクベース＝一律規制ではない。\n</p>"},{"id":80,"title":"特許権・営業秘密・限定提供データ","syllabusIds":["L03","L04"],"questionHtml":"<p>AI関連の技術・データを保護する制度について、最も適切な説明はどれか。</p>","choices":["特許権は一定の要件を満たす発明を権利として保護し、営業秘密は秘密管理性・有用性・非公知性が重要であり、限定提供データは一定の条件で提供・蓄積・管理されるデータの保護に関係する","特許権、営業秘密、限定提供データはすべて同じ制度である","営業秘密として保護するためには必ず特許登録が必要である","限定提供データとして保護されるものは必ず著作物でなければならない"],"answer":1,"explanationHtml":"<p class=\"correct-answer\"><strong>正解：①</strong></p>\n<p><strong>解説：</strong>\n特許権は一定の要件を満たす発明を公開と引き換えに権利として保護します。\n営業秘密は秘密管理性・有用性・非公知性が重要です。\n限定提供データは一定条件で提供・蓄積・管理されるデータの保護に関係します。\n</p>\n<p class=\"compare-box\"><strong>横断整理：</strong><br>\n特許＝発明を権利化。<br>\n営業秘密＝秘密として守る。<br>\n限定提供データ＝共有されるデータの一定の保護。\n</p>\n<p class=\"exam-point\"><strong>試験ポイント：</strong>\n3制度を「何をどう守るか」で比較。\n</p>"},{"id":81,"title":"個人情報・個人データ・保有個人データ","syllabusIds":["L01"],"questionHtml":"<p>個人情報保護法における情報の関係について、最も適切なものはどれか。</p>","choices":["個人情報・個人データ・保有個人データはすべて同義である","個人データは個人情報データベース等を構成する個人情報であり、保有個人データは事業者が開示・訂正・利用停止等の権限を有する個人データである","保有個人データは個人情報には含まれない","個人識別符号を含む情報は個人情報に該当しない"],"answer":2,"explanationHtml":"<p class=\"correct-answer\"><strong>正解：②</strong></p>\n<p><strong>解説：</strong>\n個人情報のうち、個人情報データベース等を構成するものが個人データ、そのうち事業者が開示・訂正・利用停止等の権限を持つものが保有個人データです。\n</p>\n<p class=\"compare-box\"><strong>横断整理：</strong>\n個人情報 ＞ 個人データ ＞ 保有個人データ\nという包含関係で整理すると覚えやすいです。\n</p>\n<p class=\"exam-point\"><strong>試験ポイント：</strong>\n3概念を「全部同じ」としない。\n</p>"},{"id":82,"title":"要配慮個人情報","syllabusIds":["L01"],"questionHtml":"<p>次のうち、要配慮個人情報に関する説明として最も適切なものはどれか。</p>","choices":["商品の購入金額は必ず要配慮個人情報に該当する","人種・信条・病歴などが含まれ、取得には原則として本人同意が必要である","要配慮個人情報は自由にオプトアウト方式で第三者提供できる","法人名はすべて要配慮個人情報である"],"answer":2,"explanationHtml":"<p class=\"correct-answer\"><strong>正解：② 人種・信条・病歴などが含まれ、取得には原則本人同意が必要</strong></p>\n<p><strong>解説：</strong>\n要配慮個人情報には、人種、信条、病歴など、不当な差別や偏見につながり得る情報が含まれます。\n通常の個人情報より慎重な取り扱いが求められます。\n</p>\n<p class=\"exam-point\"><strong>試験ポイント：</strong>\n要配慮個人情報＝差別・偏見につながり得るセンシティブ情報。\n</p>"},{"id":83,"title":"第三者提供 vs 委託","syllabusIds":["L01"],"questionHtml":"<p>企業AがAI分析業務を企業Bへ委託し、その業務に必要な個人データをBへ渡す場合について、最も適切なものはどれか。</p>","choices":["委託であっても必ず第三者提供として本人同意が必要である","委託は原則として「第三者」に該当しないが、委託元には委託先を監督する責任がある","委託をすると個人情報保護法の適用対象外になる","個人データを渡した時点で委託元の責任は消滅する"],"answer":2,"explanationHtml":"<p class=\"correct-answer\"><strong>正解：② 委託は原則「第三者」に該当しないが、委託元には監督責任がある</strong></p>\n<p><strong>解説：</strong>\n利用目的達成に必要な範囲での委託では、委託先は原則として第三者提供の「第三者」にはあたりません。\nただし委託元は委託先に対して必要かつ適切な監督を行う必要があります。\n</p>\n<p class=\"compare-box\"><strong>混同注意：</strong>\n「第三者ではない」＝「責任がなくなる」ではありません。\n</p>\n<p class=\"exam-point\"><strong>試験ポイント：</strong>\n委託＝本人同意不要の場合があるが、監督責任は残る。\n</p>"},{"id":84,"title":"GDPRの権利","syllabusIds":["L01"],"questionHtml":"<p>あるサービス利用者が、自分についてサービスが保有している個人データを、別サービスでも利用できる形式で受け取りたいと要求した。最も関連する権利はどれか。</p>","choices":["データポータビリティ権","特許権","著作者人格権","営業秘密"],"answer":1,"explanationHtml":"<p class=\"correct-answer\"><strong>正解：① データポータビリティ権</strong></p>\n<p><strong>解説：</strong>\nデータポータビリティ権は、自分の個人データを機械可読な形式等で受け取り、他サービスへ移転できるようにする権利です。\n</p>\n<p class=\"exam-point\"><strong>試験ポイント：</strong>\n「自分のデータを持ち運ぶ」＝データポータビリティ。\n</p>"},{"id":85,"title":"AI生成・利用段階と著作権","syllabusIds":["L02"],"questionHtml":"<p>AIによって生成された画像を利用する際、既存著作物への著作権侵害の判断で重要となる観点として最も適切なものはどれか。</p>","choices":["類似性と依拠性","新規性と進歩性","秘密管理性と有用性","適合率と再現率"],"answer":1,"explanationHtml":"<p class=\"correct-answer\"><strong>正解：① 類似性と依拠性</strong></p>\n<p><strong>解説：</strong>\n生成・利用段階で既存著作物への著作権侵害を考える際には、既存著作物とどの程度似ているかという類似性と、既存著作物に基づいて作成されたかという依拠性が重要な判断要素となります。\n</p>\n<p class=\"compare-box\"><strong>混同注意：</strong>\n新規性・進歩性＝特許。\n秘密管理性・有用性＝営業秘密。\n</p>\n<p class=\"exam-point\"><strong>試験ポイント：</strong>\n著作権侵害＝類似性＋依拠性を意識。\n</p>"},{"id":86,"title":"職務発明","syllabusIds":["L03"],"questionHtml":"<p>職務発明に関する説明として最も適切なものはどれか。</p>","choices":["従業者が職務上行った発明は職務発明となり得る","職務発明は著作権法だけで規定される","職務発明では発明者が必ず法人になる","従業者が行った発明はすべて自動的に無効になる"],"answer":1,"explanationHtml":"<p class=\"correct-answer\"><strong>正解：① 従業者が職務上行った発明は職務発明となり得る</strong></p>\n<p><strong>解説：</strong>\n従業者が業務の範囲内で行った発明は職務発明となり得ます。\n発明者そのものが法人になるわけではありません。\n</p>\n<p class=\"exam-point\"><strong>試験ポイント：</strong>\n職務発明でも「発明者」は創作した自然人。\n</p>"},{"id":87,"title":"営業秘密 vs 限定提供データ","syllabusIds":["L04"],"questionHtml":"<p>営業秘密と限定提供データの違いとして最も適切なものはどれか。</p>","choices":["両者とも非公知性が必須である","営業秘密では非公知性が要件となるが、限定提供データでは非公知性を要しない","限定提供データは特許登録しなければ保護されない","営業秘密には秘密管理性は不要である"],"answer":2,"explanationHtml":"<p class=\"correct-answer\"><strong>正解：② 営業秘密では非公知性が要件だが、限定提供データでは非公知性を要しない</strong></p>\n<p><strong>解説：</strong>\n営業秘密には秘密管理性・有用性・非公知性が必要です。\n一方、限定提供データは、一定の条件で特定者へ提供されるデータを対象とする制度で、営業秘密と要件が異なります。\n</p>\n<p class=\"compare-box\"><strong>混同注意：</strong>\n限定提供データを「秘密でなければならない」と覚えない。\n</p>\n<p class=\"exam-point\"><strong>試験ポイント：</strong>\n営業秘密との比較では「非公知性」が重要な識別軸。\n</p>"},{"id":88,"title":"独占禁止法の判断軸","syllabusIds":["L05"],"questionHtml":"<p>AI・アルゴリズムの利用が独占禁止法上問題となるかを考える際、重要な判断軸の組み合わせはどれか。</p>","choices":["新規性・進歩性","競争制限・公正競争阻害性","秘密管理性・非公知性","適合率・再現率"],"answer":2,"explanationHtml":"<p class=\"correct-answer\"><strong>正解：② 競争制限・公正競争阻害性</strong></p>\n<p><strong>解説：</strong>\nAI・アルゴリズム利用が独占禁止法上問題となるかでは、市場競争を制限するか、公正な競争を害するかといった観点が重要です。\n</p>\n<p class=\"exam-point\"><strong>試験ポイント：</strong>\n独禁法＝競争への影響を見る。\n</p>"},{"id":89,"title":"NDA","syllabusIds":["L06"],"questionHtml":"<p>AI開発プロジェクトのアセスメント段階で、ユーザー企業がベンダーへ秘密情報を含むデータを渡す前に締結する契約として、最も関連が深いものはどれか。</p>","choices":["NDA","特許実施許諾だけ","雇用契約だけ","不動産売買契約"],"answer":1,"explanationHtml":"<p class=\"correct-answer\"><strong>正解：① NDA</strong></p>\n<p><strong>解説：</strong>\nNDAはNon-Disclosure Agreement、秘密保持契約です。\nAI開発では、ユーザー企業がベンダーへデータや技術情報を開示する前に締結することがあります。\n</p>\n<p class=\"exam-point\"><strong>試験ポイント：</strong>\n秘密情報を渡す前＝NDA。\n</p>"},{"id":90,"title":"AI開発のフェーズ","syllabusIds":["L06"],"questionHtml":"<p>AI開発で、本番運用開始後に新たなデータを使ってモデルを再学習し、精度維持・改善を図るフェーズとして最も適切なものはどれか。</p>","choices":["追加学習","アセスメントのみ","特許出願","第三者提供"],"answer":1,"explanationHtml":"<p class=\"correct-answer\"><strong>正解：① 追加学習</strong></p>\n<p><strong>解説：</strong>\n本番運用開始後に新しいデータでモデルを再学習し、性能維持や改善を行う段階が追加学習です。\n</p>\n<p class=\"exam-point\"><strong>試験ポイント：</strong>\n運用後の新データで再学習＝追加学習。\n</p>"},{"id":91,"title":"SLAと精度保証","syllabusIds":["L07"],"questionHtml":"<p>SaaS型AIサービスにおけるSLAとAIモデルの精度について、最も適切なものはどれか。</p>","choices":["SLAで可用性を定めれば、AIの予測精度も100%保証されたことになる","サービスの可用性に関するSLAと、AIモデルの精度保証は別の論点である","SaaSでは精度について一切契約できない","SLAは著作権法上の制度である"],"answer":2,"explanationHtml":"<p class=\"correct-answer\"><strong>正解：② SLAの可用性とAIモデルの精度保証は別の論点</strong></p>\n<p><strong>解説：</strong>\nSLAでは稼働率や応答時間などサービス品質を定めることがありますが、AIモデルの予測精度とは別の概念です。\nサービスが常時利用できても、予測が常に正しいとは限りません。\n</p>\n<p class=\"compare-box\"><strong>混同注意：</strong>\n可用性＝サービスが使えるか。\n精度＝AI出力がどれだけ正しいか。\n</p>\n<p class=\"exam-point\"><strong>試験ポイント：</strong>\nSLA 99.9% ≠ AI精度99.9%。\n</p>"},{"id":92,"title":"リスクベースアプローチ","syllabusIds":["L08"],"questionHtml":"<p>AI規制でリスクベースアプローチを採用する理由として、最も適切なものはどれか。</p>","choices":["すべてのAIを同一の強度で規制するため","高リスク用途には強い対応を行いつつ、低リスク用途への過度な萎縮を避けるため","AIを一切規制しないため","すべてのAI利用を禁止するため"],"answer":2,"explanationHtml":"<p class=\"correct-answer\"><strong>正解：② 高リスク用途には強い対応を行いつつ、低リスク用途への過度な萎縮を避ける</strong></p>\n<p><strong>解説：</strong>\nリスクベースアプローチは、AIの用途や影響の大きさに応じて規制・管理の強度を変える考え方です。\n</p>\n<p class=\"compare-box\"><strong>混同注意：</strong>\nリスクベース＝一律規制ではない。\n</p>\n<p class=\"exam-point\"><strong>試験ポイント：</strong>\n高リスクほど強く、低リスクほど相対的に軽く。\n</p>"},{"id":93,"title":"プライバシー：収集段階 vs 推論段階","syllabusIds":["L09"],"questionHtml":"<p>プライバシー問題に関する説明として最も適切なものはどれか。</p>","choices":["プライバシー問題はデータ収集段階にしか生じない","収集時には問題のない情報でも、AIによる推論からセンシティブな属性が推定されることが問題となり得る","AIによる推論結果はプライバシーと無関係である","個人情報でないデータからは、いかなる属性も推定できない"],"answer":2,"explanationHtml":"<p class=\"correct-answer\"><strong>正解：② AIによる推論からセンシティブ属性が推定されることも問題となり得る</strong></p>\n<p><strong>解説：</strong>\nプライバシー問題は、情報を集める段階だけでなく、収集済みデータからAIが本人の健康状態や信条等を推定する段階でも生じ得ます。\n</p>\n<p class=\"compare-box\"><strong>混同注意：</strong>\n収集していない情報でも、推論によって導出される可能性があります。\n</p>\n<p class=\"exam-point\"><strong>試験ポイント：</strong>\nプライバシー＝収集時＋推論時の両方を見る。\n</p>"},{"id":94,"title":"セキュリティ・バイ・デザイン","syllabusIds":["L11"],"questionHtml":"<p>AIシステム完成後に脆弱性が見つかってから対策するのではなく、企画・設計段階からセキュリティ対策を組み込む考え方はどれか。</p>","choices":["セキュリティ・バイ・デザイン","データリーケージ","蒸留","交差検証"],"answer":1,"explanationHtml":"<p class=\"correct-answer\"><strong>正解：① セキュリティ・バイ・デザイン</strong></p>\n<p><strong>解説：</strong>\nSecurity by Designは、システム完成後に対策するのではなく、企画・設計段階からセキュリティを組み込む考え方です。\n</p>\n<p class=\"compare-box\"><strong>混同注意：</strong>\nPrivacy by Design＝プライバシー。\nSecurity by Design＝安全性・防御。\n</p>\n<p class=\"exam-point\"><strong>試験ポイント：</strong>\n設計段階から組み込む点は共通、守る対象が違う。\n</p>"},{"id":95,"title":"データ汚染","syllabusIds":["L11"],"questionHtml":"<p>攻撃者が学習データへ悪意あるデータを混入させ、学習後のモデルの挙動を意図的に歪めた。最も関連するものはどれか。</p>","choices":["データ汚染","モデル圧縮","k分割交差検証","プルーニング"],"answer":1,"explanationHtml":"<p class=\"correct-answer\"><strong>正解：① データ汚染</strong></p>\n<p><strong>解説：</strong>\n攻撃者が学習データへ悪意あるデータを混入し、学習結果を歪める攻撃はデータ汚染、データポイズニングなどと呼ばれます。\n</p>\n<p class=\"compare-box\"><strong>混同注意：</strong>\nデータ汚染＝学習段階。\nAdversarial Attack＝推論時入力。\nモデル窃取＝モデルを模倣・取得。\n</p>\n<p class=\"exam-point\"><strong>試験ポイント：</strong>\nどの段階を攻撃しているかを見る。\n</p>"},{"id":96,"title":"データの来歴","syllabusIds":["L13"],"questionHtml":"<p>AIモデルで使用したデータが「どこから取得され、どのような加工を経て学習に使われたか」を追跡できるようにした。最も関連する概念はどれか。</p>","choices":["データの来歴","Dropout","Max Pooling","Q値"],"answer":1,"explanationHtml":"<p class=\"correct-answer\"><strong>正解：① データの来歴</strong></p>\n<p><strong>解説：</strong>\nデータの来歴は、そのデータがどこから取得され、どのような加工を受け、どのモデルや工程で使われたかを追跡できることに関係します。\n</p>\n<p class=\"exam-point\"><strong>試験ポイント：</strong>\nデータの出所・加工履歴＝データの来歴。\n</p>"},{"id":97,"title":"エコーチェンバー vs フィルターバブル","syllabusIds":["L14"],"questionHtml":"<p>同じ意見を持つ利用者同士がSNS上で交流を続け、同質な意見が繰り返し増幅される現象として最も適切なものはどれか。</p>","choices":["エコーチェンバー","フィルターバブル","破滅的忘却","データリーケージ"],"answer":1,"explanationHtml":"<p class=\"correct-answer\"><strong>正解：① エコーチェンバー</strong></p>\n<p><strong>解説：</strong>\nエコーチェンバーは、同じ意見を持つ人同士が交流を続けることで、似た意見が繰り返し増幅・強化される現象です。\n</p>\n<p class=\"compare-box\"><strong>混同注意：</strong>\nエコーチェンバー＝人間関係・コミュニティによる増幅。\nフィルターバブル＝アルゴリズムによる情報選別。\n</p>\n<p class=\"exam-point\"><strong>試験ポイント：</strong>\n人同士＝Echo Chamber、推薦アルゴリズム＝Filter Bubble。\n</p>"},{"id":98,"title":"Human-in-the-loop","syllabusIds":["L18"],"questionHtml":"<p>医療や採用など重要な判断で、AIの出力だけで最終決定せず、人間が確認・判断に介在する設計として最も関連するものはどれか。</p>","choices":["Human-in-the-loop","Zero-shot","Batch Normalization","Quantization"],"answer":1,"explanationHtml":"<p class=\"correct-answer\"><strong>正解：① Human-in-the-loop</strong></p>\n<p><strong>解説：</strong>\nHuman-in-the-loopは、AIに判断を完全委任せず、人間が確認・修正・最終判断などに介在する設計です。\n</p>\n<p class=\"exam-point\"><strong>試験ポイント：</strong>\n高影響な判断ほど「人間の関与」が重要。\n</p>"},{"id":99,"title":"再現性 vs トレーサビリティ","syllabusIds":["L18"],"questionHtml":"<p>AIガバナンスに関する説明として最も適切なものはどれか。</p>","choices":["再現性は同一条件で同様の結果を検証できること、トレーサビリティはデータ・学習・判断の履歴を追跡できることに関係する","再現性とトレーサビリティは完全に同義である","トレーサビリティとはモデルを必ず軽量化することである","再現性とは学習データを削除することである"],"answer":1,"explanationHtml":"<p class=\"correct-answer\"><strong>正解：①</strong></p>\n<p><strong>解説：</strong>\n再現性は、同じ条件で同様の結果を再現・検証できることに関係します。\nトレーサビリティは、データ、学習、判断等の履歴を後から追跡できることに関係します。\n</p>\n<p class=\"compare-box\"><strong>横断整理：</strong>\n再現性＝同じ結果を再現できる。\nトレーサビリティ＝経緯を追える。\n</p>\n<p class=\"exam-point\"><strong>試験ポイント：</strong>\n「再現する」と「追跡する」を分ける。\n</p>"},{"id":100,"title":"AIガバナンスの事前・運用後対応","syllabusIds":["L18"],"questionHtml":"<p>AIガバナンスの取り組みに関する組み合わせとして最も適切なものはどれか。</p>\n<p>\n（ア）AI導入前に倫理的リスクを評価する<br>\n（イ）AI導入後にモデルの挙動や性能劣化を継続的に確認する<br>\n（ウ）重要な判断で人間が介在する\n</p>","choices":["（ア）倫理アセスメント　（イ）モニタリング　（ウ）人間の関与","（ア）量子化　（イ）蒸留　（ウ）Dropout","（ア）モデル窃取　（イ）データ汚染　（ウ）ディープフェイク","（ア）BPTT　（イ）TF-IDF　（ウ）k-means"],"answer":1,"explanationHtml":"<p class=\"correct-answer\"><strong>正解：①</strong></p>\n<p><strong>解説：</strong>\nAI導入前の倫理的リスク評価が倫理アセスメント、導入後の継続監視がモニタリング、重要な判断でAIへ完全委任しないことが人間の関与です。\n</p>\n<p class=\"compare-box\"><strong>横断整理：</strong><br>\n事前＝倫理アセスメント。<br>\n運用後＝モニタリング。<br>\n意思決定＝人間の関与。\n</p>\n<p class=\"exam-point\"><strong>試験ポイント：</strong>\nAIガバナンスは「導入前・運用中・意思決定」の3段階で整理。\n</p>"}];

/* ============================================================
   localStorage（他アプリと完全分離）
   ============================================================ */
const LS_KEY = 'gkentei_100q_v1';
let STORE = {version:1, history:{}, settings:{order:'seq', shuffleChoices:false}};

function loadStore(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(raw){
      const o = JSON.parse(raw);
      if(o && typeof o === 'object'){
        STORE.history  = o.history  || {};
        STORE.settings = Object.assign(STORE.settings, o.settings || {});
      }
    }
  }catch(e){ console.warn('load failed', e); }
}
function saveStore(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(STORE)); }
  catch(e){ console.warn('save failed', e); }
}
function rec(id){
  const k = String(id);
  if(!STORE.history[k]) STORE.history[k] = {correct:0, incorrect:0, weak:false, last:null, lastResult:null};
  return STORE.history[k];
}
function answered(id){ const r = STORE.history[String(id)]; return !!(r && r.lastResult); }
function isWeak(id){ const r = STORE.history[String(id)]; return !!(r && r.weak); }
function lastResult(id){ const r = STORE.history[String(id)]; return r ? r.lastResult : null; }

  const t = []; for(let i=1;i<=37;i++) t.push('T'+String(i).padStart(2,'0'));
  const l = []; for(let i=1;i<=18;i++) l.push('L'+String(i).padStart(2,'0'));

function countFor(sid){ return QUESTIONS.filter(q => q.syllabusIds.includes(sid)).length; }

function shuffled(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

function startSession(ids, label){
  if(!ids.length){ alert('該当する問題がありません。'); return; }
  let list = ids.slice();
  if(STORE.settings.order === 'random') list = shuffled(list);   // 同一セッション中は重複なし
  session = {ids:list, cur:0, picks:{}, graded:{}, revealed:{}, label:label||''};
  render('quiz');
}

/* ---------- ホーム ---------- */
function progressOf(list){
  const done = list.filter(q => answered(q.id));
  const ok = done.filter(q => lastResult(q.id) === 'o').length;
  return {total:list.length, done:done.length, ok,
          rate: done.length ? Math.round(ok/done.length*100) : 0};
}
function bar(p, cls){
  const pct = p.total ? Math.round(p.done/p.total*100) : 0;
  return `<div class="bar ${cls||''}"><span style="width:${pct}%"></span></div>`;
}
function progBlock(name, list, cls){
  const p = progressOf(list);
  const pct = p.total ? Math.round(p.done/p.total*100) : 0;
  return `<div class="prog-item">
    <div class="prog-top"><b>${name}</b>
      <span class="muted">${p.total}問中 回答済み ${p.done}問（${pct}%）／ 正答率 ${p.done?p.rate+'%':'—'}</span></div>
    ${bar(p, cls)}</div>`;
}
