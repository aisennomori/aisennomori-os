<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light dark" />
<link rel="icon" href="data:," />
<title>エネルギー自己治癒ハンドブック検索 V10</title>
<style>
:root{
  --bg:#faf6ef; --bg2:#f3ecdd; --surface:#fffdf8; --surface2:#f7f1e3;
  --ink:#2e2440; --ink2:#5d5470; --ink3:#8a7f9c;
  --purple:#5b3a8e; --purple-deep:#3d2766; --purple-soft:#ece4f7; --purple-mid:#7a5bb0;
  --gold:#b8912f; --gold-soft:#f3e8c8; --gold-line:#d9c37a;
  --line:#e3d9c4; --line2:#d5c9e8;
  --warn-bg:#fdf3e3; --warn-line:#d99a2b; --warn-ink:#6b4a0e;
  --aff-bg:#f1eaf9;
  --shadow:0 1px 3px rgba(61,39,102,.08),0 4px 14px rgba(61,39,102,.06);
  --radius:14px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#1d1730; --bg2:#171226; --surface:#2a2142; --surface2:#332a52;
    --ink:#f0eafc; --ink2:#c9bfe0; --ink3:#9d90b8;
    --purple:#c4aef0; --purple-deep:#e6dcfa; --purple-soft:#3a2d5e; --purple-mid:#a98ad9;
    --gold:#e3c56e; --gold-soft:#3d3420; --gold-line:#8a7434;
    --line:#453a66; --line2:#453a66;
    --warn-bg:#3a2f16; --warn-line:#c9902e; --warn-ink:#f3d9a0;
    --aff-bg:#372b58;
    --shadow:0 1px 3px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
  }
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion: reduce){ html{scroll-behavior:auto} *{transition:none!important} }
body{margin:0;background:linear-gradient(180deg,var(--bg) 0%,var(--bg2) 100%);color:var(--ink);
  font-family:"Hiragino Mincho ProN","Hiragino Mincho Pro","Yu Mincho","YuMincho","Noto Serif JP",serif;
  line-height:1.75;-webkit-font-smoothing:antialiased}
.sans{font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic UI","Yu Gothic",sans-serif}
.wrap{max-width:860px;margin:0 auto;padding:0 16px 48px}

/* header */
header{padding:12px 4px 0;text-align:center}
header .orn{display:none}
header h1{font-size:clamp(19px,4.6vw,27px);line-height:1.3;margin:0 0 3px;color:var(--purple-deep);font-weight:700;letter-spacing:.02em}
header .sub{color:var(--ink2);font-size:14px;margin:0}
header .source{color:var(--ink3);font-size:11.5px;margin:2px 0 0}
.rule{display:flex;align-items:center;gap:12px;margin:7px auto 0;max-width:420px}
.rule::before,.rule::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--gold-line))}
.rule::after{background:linear-gradient(90deg,var(--gold-line),transparent)}
.rule span{color:var(--gold);font-size:13px}

/* controls */
.controls{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);padding:10px 0 10px;margin-top:4px}
.searchbox{position:relative}
.searchbox svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:var(--ink3);pointer-events:none}
#q{width:100%;min-height:52px;padding:12px 48px 12px 44px;border:1.5px solid var(--line2);border-radius:999px;background:var(--surface);color:var(--ink);font-size:16px;font-family:inherit;outline:none;box-shadow:var(--shadow)}
#q:focus{border-color:var(--purple-mid)}
#q::placeholder{color:var(--ink3)}
#clearQ{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:40px;height:40px;border:none;border-radius:50%;background:transparent;color:var(--ink3);font-size:20px;cursor:pointer;display:none}
.fgroup{margin-top:12px}
.fgroup .flabel{font-size:12px;letter-spacing:.14em;color:var(--ink3);margin:0 2px 6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:40px;padding:7px 14px;border-radius:999px;border:1.5px solid var(--line2);background:var(--surface);color:var(--ink2);font-size:13.5px;cursor:pointer;font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic",sans-serif;line-height:1.3}
.chip[aria-pressed="true"]{background:var(--purple);border-color:var(--purple);color:#fff;font-weight:700}
@media (prefers-color-scheme: dark){ .chip[aria-pressed="true"]{background:var(--purple-mid);border-color:var(--purple-mid);color:#1d1730} }
.chip .cdot,.badge .cdot,.detail .cdot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:1px;border:1px solid rgba(0,0,0,.15)}
.count{margin:14px 2px 0;font-size:13.5px;color:var(--ink2)}
.count b{color:var(--purple);font-size:16px}
#resetBtn{margin-left:10px;min-height:36px;padding:4px 12px;border-radius:999px;border:1px solid var(--line2);background:var(--surface);color:var(--purple);font-size:13px;cursor:pointer;display:none}

/* groups */
.cat-head{display:flex;align-items:baseline;gap:10px;margin:30px 2px 12px;border-bottom:2px solid var(--gold-line);padding-bottom:6px}
.cat-head h2{font-size:19px;margin:0;color:var(--purple-deep)}
.cat-head .n{font-size:12.5px;color:var(--ink3)}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:12px;overflow:hidden}
.sheet summary{list-style:none;cursor:pointer;padding:16px 18px;min-height:56px;display:block}
.sheet summary::-webkit-details-marker{display:none}
.sheet summary:focus-visible{outline:2px solid var(--purple-mid);outline-offset:-2px}
.s-top{display:flex;align-items:flex-start;gap:12px}
.s-no{flex:none;width:38px;height:38px;border-radius:50%;background:var(--purple-soft);color:var(--purple);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;font-family:"Hiragino Kaku Gothic ProN",sans-serif;margin-top:2px}
.s-main{flex:1;min-width:0}
.s-name{font-size:17.5px;font-weight:700;line-height:1.5}
.s-tag{color:var(--ink2);font-size:13.5px;line-height:1.6;margin-top:2px}
.s-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.badge{font-size:11.5px;padding:2px 9px;border-radius:999px;background:var(--gold-soft);color:var(--ink2);font-family:"Hiragino Kaku Gothic ProN",sans-serif;line-height:1.6}
.badge.chakra{background:var(--purple-soft);color:var(--purple)}
.chev{flex:none;color:var(--ink3);font-size:15px;margin-top:8px;transition:transform .25s}
.sheet[open ] .chev{transform:rotate(180deg)}
.detail{border-top:1px dashed var(--line2);padding:6px 18px 20px}
.detail h3{font-size:13px;letter-spacing:.12em;color:var(--purple);margin:20px 0 6px;font-family:"Hiragino Kaku Gothic ProN",sans-serif}
.detail h3:first-child{margin-top:14px}
.detail p{margin:0;font-size:15px}
.items{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.items li{display:flex;gap:12px;background:var(--surface2);border-radius:10px;padding:12px 14px}
.items .num{flex:none;width:28px;height:28px;border-radius:50%;background:var(--purple);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13.5px;font-weight:700;font-family:"Hiragino Kaku Gothic ProN",sans-serif;margin-top:2px}
@media (prefers-color-scheme: dark){ .items .num{color:#1d1730;background:var(--purple-mid)} }
.items .iname{font-weight:700;font-size:15px}
.items .itext{font-size:14px;color:var(--ink2);line-height:1.7}
.doctor{background:var(--warn-bg);border:1.5px solid var(--warn-line);border-radius:10px;padding:12px 14px;margin-top:6px}
.doctor p{color:var(--warn-ink);font-size:14.5px}
.doctor .dh{font-weight:700;font-size:13px;letter-spacing:.08em;margin-bottom:4px;color:var(--warn-ink);font-family:"Hiragino Kaku Gothic ProN",sans-serif}
.aff{background:var(--aff-bg);border-radius:10px;padding:14px 16px;text-align:center;margin-top:6px}
.aff p{font-size:16px;font-weight:700;color:var(--purple-deep)}
.aff .ah{font-size:11.5px;letter-spacing:.16em;color:var(--ink3);margin-bottom:4px;font-family:"Hiragino Kaku Gothic ProN",sans-serif}
.pagenote{margin-top:16px;text-align:right;font-size:12.5px;color:var(--ink3)}
.empty{display:none;text-align:center;padding:44px 16px;color:var(--ink2)}
.empty .big{font-size:17px;font-weight:700;color:var(--purple-deep);margin-bottom:6px}
footer{margin-top:44px;border-top:1px solid var(--gold-line);padding-top:18px;text-align:center}
footer .disc{font-size:13px;color:var(--ink2);max-width:560px;margin:0 auto}
footer .src{font-size:12.5px;color:var(--ink3);margin-top:10px}
footer .orn{color:var(--gold);letter-spacing:.55em;text-indent:.55em;font-size:13px;margin-top:14px}
mark{background:var(--gold-soft);color:inherit;border-radius:2px;padding:0 1px}

/* Chakra multi-select: checked options use OR matching. */
.chakra-checks{gap:8px}
.chakra-option{display:inline-flex;align-items:center;gap:7px;min-height:40px;padding:7px 12px;border:1.5px solid var(--line2);border-radius:12px;background:var(--surface);color:var(--ink2);font-size:13px;cursor:pointer;font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}
.chakra-option:has(input:checked){border-color:var(--purple-mid);background:var(--purple-soft);color:var(--purple);font-weight:700}
.chakra-option input{width:17px;height:17px;accent-color:var(--purple);margin:0}
.chakra-option:focus-within{outline:2px solid var(--purple-mid);outline-offset:2px}
.chakra-option .cdot{display:inline-block;width:9px;height:9px;border-radius:50%;border:1px solid rgba(0,0,0,.15)}
.supplement{margin:14px 0;padding:10px 12px;border:1px solid #d6d6d0;border-radius:9px}.supplement summary{cursor:pointer;font-weight:600}.supplement[open] summary{margin-bottom:10px}

/* V9: quiet, refined, mobile-first reading design */
:root{--bg:#f7f5f0;--bg2:#f1eee8;--surface:#fffefa;--surface2:#f7f5ef;--line:#e7e0d6;--line2:#ddd4e5;--shadow:0 3px 18px rgba(44,34,64,.055);--radius:18px}
body{background:linear-gradient(145deg,var(--bg),var(--bg2));}
.wrap{max-width:920px;padding:0 clamp(12px,3vw,28px) 64px}
header{padding:18px 0 5px}
header h1{font-size:clamp(19px,3.4vw,25px);letter-spacing:.025em}
header .sub{font-size:12px}
header .source{font-size:11px}
.rule{max-width:260px}
.controls{border-bottom:1px solid var(--line);padding:12px 0;background:color-mix(in srgb,var(--bg) 95%,transparent)}
#q{min-height:48px;box-shadow:0 2px 12px rgba(44,34,64,.045)}
.fgroup{margin-top:9px}.fgroup .flabel{margin-bottom:4px}
.chips{gap:6px}.chip,.chakra-option{min-height:36px;padding:6px 11px;font-size:12.5px}
.cat-head{margin-top:26px;border-bottom:1px solid var(--gold-line)}
.cat-head h2{font-size:17px}
.sheet{border-radius:18px;margin-bottom:10px;transition:box-shadow .2s,border-color .2s}
.sheet[open]{border-color:var(--line2);box-shadow:0 8px 28px rgba(50,32,77,.09)}
.sheet summary{padding:14px 17px}
.s-name{font-size:17px}.s-tag{font-size:13px}
.s-no{width:35px;height:35px;font-size:12px}
.detail{padding:4px clamp(14px,3.5vw,25px) 20px;border-top:1px solid var(--line)}
.content-section{padding:14px 0;border-bottom:1px solid var(--line)}
.content-section h3{display:flex;align-items:baseline;gap:11px;margin:0 0 8px;font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;font-size:11px;letter-spacing:.06em;color:var(--gold)}
.content-section h3 span{font-size:14px;color:var(--purple-deep);font-weight:700;letter-spacing:.02em}
.content-section p{font-size:14.5px;line-height:1.85}
.chakra-panel{background:var(--purple-soft);border:1px solid var(--line2);border-radius:13px;padding:13px 15px;margin:12px 0 0}
.chakra-panel h3{margin-bottom:5px}.chakra-panel p{font-weight:600;color:var(--purple-deep)}
.ritual-panel{padding:15px 0}
.ritual-panel p{border-left:3px solid var(--gold-line);padding:8px 0 8px 15px}
.aff{margin:0;padding:19px 17px;border:1px solid var(--line2);border-radius:13px;background:linear-gradient(135deg,var(--aff-bg),var(--surface));}
.aff p{font-size:17px;line-height:1.85;letter-spacing:.025em}
.doctor{margin:0;padding:12px 14px;border-width:1px;border-radius:12px}
.doctor p{font-size:13.5px;line-height:1.8}
.supplement{margin:16px 0 0;padding:0;border:1px solid var(--line);border-radius:13px;background:var(--surface2)}
.supplement summary{padding:13px 15px;font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;font-size:13px;color:var(--ink2);list-style-position:inside}
.supplement[open] summary{margin-bottom:0;border-bottom:1px solid var(--line)}
.supplement .items{padding:13px}
.items li{background:var(--surface);border:1px solid var(--line)}
.pagenote{margin-top:12px}
@media(max-width:560px){.controls{position:relative;backdrop-filter:none}.sheet summary{padding:13px 12px}.s-top{gap:9px}.detail{padding-bottom:16px}.content-section p{font-size:14px}.aff p{font-size:16px}}
@media(prefers-color-scheme:dark){:root{--bg:#1d1730;--bg2:#171226;--surface:#2a2142;--surface2:#332a52;--line:#453a66;--line2:#51436c;--shadow:0 3px 18px rgba(0,0,0,.2)}.aff{background:var(--aff-bg)}}

/* V10: botanical pearl palette and calmer reading rhythm */
:root{
 --bg:#f7f8f4;--bg2:#edf3ee;--surface:#fffefa;--surface2:#f4f7f2;
 --ink:#273a36;--ink2:#53665f;--ink3:#697b73;
 --purple:#376f66;--purple-deep:#244e49;--purple-mid:#4d887d;--purple-soft:#e4f0eb;
 --gold:#9b7840;--gold-soft:#f5ecda;--gold-line:#d6bc8d;
 --line:#dde6df;--line2:#c9ded5;--aff-bg:#eaf3ef;
 --warn-bg:#fff7ed;--warn-line:#c48d54;--warn-ink:#73512d;
 --shadow:0 4px 22px rgba(30,67,55,.055);
}
body{background:radial-gradient(ellipse at 80% 0%,#e9f3ed 0%,transparent 43%),linear-gradient(165deg,var(--bg),var(--bg2));}
header h1{color:var(--purple-deep)}
.rule span{color:var(--gold)}
#q:focus-visible,.chip:focus-visible,#resetBtn:focus-visible,#clearQ:focus-visible{outline:3px solid var(--purple-mid);outline-offset:2px}
.chip[aria-pressed="true"]{background:var(--purple);border-color:var(--purple);color:#fff}
.sheet{border-color:var(--line)}
.sheet[open]{border-color:var(--line2);box-shadow:0 8px 30px rgba(27,76,61,.09)}
.s-no{background:var(--purple-soft);color:var(--purple-deep)}
.cat-head{border-bottom-color:var(--gold-line)}
.content-section h3{color:var(--gold)}
.chakra-panel{background:linear-gradient(110deg,var(--purple-soft),var(--surface2));border-color:var(--line2)}
.ritual-panel p{border-left-color:var(--gold-line)}
.aff{background:linear-gradient(120deg,var(--aff-bg),var(--surface));border-color:var(--line2)}
.aff p{color:var(--purple-deep)}
.supplement{background:var(--surface2)}
.chakra-option:has(input:checked){background:var(--purple-soft);border-color:var(--purple-mid);color:var(--purple-deep)}
@media (prefers-color-scheme:dark){
 :root{--bg:#172623;--bg2:#11201d;--surface:#22332e;--surface2:#2b4038;
 --ink:#eef5ef;--ink2:#c5d7ce;--ink3:#a5bdb1;
 --purple:#9ad8c4;--purple-deep:#d3f0e4;--purple-mid:#83c9b2;--purple-soft:#304c42;
 --gold:#e5c68c;--gold-soft:#453c2b;--gold-line:#927a51;
 --line:#3c554b;--line2:#4a6a5b;--aff-bg:#2e4b40;
 --warn-bg:#3b3026;--warn-line:#bc8d59;--warn-ink:#f0d6b4;
 --shadow:0 4px 22px rgba(0,0,0,.22)}
 body{background:linear-gradient(165deg,var(--bg),var(--bg2))}
 .chip[aria-pressed="true"]{background:var(--purple-mid);border-color:var(--purple-mid);color:#13241e}
 .items .num{background:var(--purple-mid);color:#13241e}
 .aff{background:linear-gradient(120deg,var(--aff-bg),var(--surface))}
}

/* V11: unified seven-section visual hierarchy; ritual and affirmation lead. */
.detail>.content-section{position:relative;margin:10px 0 0;padding:15px 16px;border:1px solid var(--line);border-radius:14px;background:var(--surface);}
.detail>.content-section h3{margin:0 0 10px;align-items:center;gap:10px;line-height:1.55}
.detail>.content-section h3 span{font-size:14px}
.detail>.content-section h3::first-letter{color:var(--gold)}
/* Understanding: quiet neutral cards. */
.detail>.content-section:nth-of-type(1),.detail>.content-section:nth-of-type(2){background:var(--surface2);border-color:var(--line)}
/* Chakra: distinctive but restrained, with original per-chakra dots intact. */
.detail>.chakra-panel{background:linear-gradient(115deg,var(--purple-soft),var(--surface));border-color:var(--line2)}
/* Ritual: primary actionable section. */
.detail>.ritual-panel{background:linear-gradient(120deg,var(--surface),var(--gold-soft));border-color:var(--gold-line);box-shadow:0 3px 14px rgba(91,77,43,.055)}
.detail>.ritual-panel h3 span{color:var(--purple-deep)}
.detail>.ritual-panel p{margin:0;border-left:3px solid var(--gold);padding:7px 0 7px 14px;line-height:1.95}
/* Affirmation: second focal section, with one clean integrated panel. */
.detail>.content-section:has(>.aff){background:linear-gradient(120deg,var(--aff-bg),var(--surface));border-color:var(--line2);box-shadow:0 3px 14px rgba(34,89,66,.055)}
.detail>.content-section:has(>.aff) .aff{border:0;background:transparent;padding:8px 6px 6px;margin:0}
.detail>.content-section:has(>.aff) .aff p{font-size:clamp(16px,2.5vw,19px);line-height:1.9}
/* Consultation: readable and clearly distinct without dominating the flow. */
.detail>.content-section:has(>.doctor){background:var(--surface);border-color:var(--line)}
.detail>.content-section:has(>.doctor) .doctor{background:var(--warn-bg);border-color:var(--warn-line);margin:0}
/* Supplement remains optional and visually secondary. */
.detail>.supplement{margin-top:12px;border-color:var(--line)}
@media(max-width:560px){.detail>.content-section{padding:13px 12px;margin-top:9px}.detail>.ritual-panel p{padding-left:11px}.detail>.content-section:has(>.aff) .aff{padding:6px 2px}}

</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="orn" aria-hidden="true">✦ ✦ ✦</div>
  <h1>エネルギー自己治癒ハンドブック検索</h1>
  <p class="sub">80のセルフケアシートを検索</p>
  <p class="source">出典：『エネルギー自己治癒ハンドブック』</p>
  <div class="rule" aria-hidden="true"><span>◆</span></div>
</header>

<div class="controls">
  <div class="searchbox">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="症状名・キーワードで検索（例：頭痛、眠れない、アメジスト）" aria-label="キーワード検索" autocomplete="off">
    <button id="clearQ" aria-label="検索を消す">×</button>
  </div>
  <div class="fgroup">
    <p class="flabel sans">カテゴリー</p>
    <div class="chips" id="catChips" role="group" aria-label="カテゴリーで絞り込み"></div>
  </div>
  <div class="fgroup">
    <p class="flabel sans">チャクラ</p>
    <div class="chips" id="chakraChips" role="group" aria-label="チャクラで絞り込み"></div>
  </div>
  <p class="count sans"><span id="countText"></span><button id="resetBtn">絞り込みをリセット</button></p>
</div>

<main id="list"></main>
<div class="empty" id="empty">
  <p class="big">見つかりませんでした</p>
  <p>キーワードや絞り込みを変えて、もう一度お試しください。</p>
</div>

<footer>
  <p class="disc">補完的なウェルビーイングの実践です。医師の診察や治療の代わりにならず、治癒を約束するものではありません。</p>
  <p class="src">出典：『エネルギー自己治癒ハンドブック』（イラストガイド）</p>
  <div class="orn" aria-hidden="true">✦ ✦ ✦</div>
</footer>

ame":"かぜをひきやすい","category":"呼吸とのど","page":62,"tagline":"自分に与えていない休みを、体が求めているとき。","items":[{"name":"ガーネット","text":"活力の石。休んでいるあいだ手に持ちます。"},{"name":"しょうがとレモン","text":"しょうがの薄切りとレモンの輪切り1枚を、お湯で5分。"},{"name":"ウールの靴下","text":"足を温かくして、しっかり休みます。"}],"signs":"1年に何度もかぜをひき、鼻水やのどの痛み、だるさがなかなか抜けません。","meaning":"伝統では、強制的な休止と捉えられています。頭が止まれないとき、体がブレーキをかけるのです。","chakra":"第４チャクラ：人を思うように自分を大切にすること","ritual":"【5分間】温かくして座るか横になり、ガーネットをそばに置きます。無理なく呼吸し、今日は休むことを自分に許します。【日常の調整】予定を減らし、十分な休息をとります。","doctor":"高熱や3日以上続く熱がある、息苦しい、耳や胸が痛む、またはとても頻繁に体調をくずすとき。","affirmation":"体に求められる前に、自分から休みます。"},{"affirmation":"周期を大切にし、自分にやさしくします。","category":"月経周期とホルモン","chakra":"第２チャクラ：周期、お腹、創造性","doctor":"痛みで日常生活が送れない、出血がとても多い、性交時に痛む、または年々悪化しているとき。","items":[{"name":"ムーンストーン","text":"周期の石。お腹の上にのせます。"},{"name":"ジンジャーティー","text":"薄切り2〜3枚で5分。ぬるめを少しずつ。"},{"name":"湯たんぽ","text":"布で包んで、下腹部にのせます。"}],"meaning":"自分の周期を尊重しないことと関係があるとされます。月のどの日も、同じ成果を自分に求めるのです。","name":"生理痛","no":51,"page":63,"ritual":"【5分間】お腹が楽になる姿勢で休み、心地よければ下腹部をほんのり温めます。ムーンストーンはそばに置いても構いません。無理に深呼吸せず、今日はペースを落としてよいと自分に伝えます。","signs":"生理の前や生理中に起こる、下腹部のさしこむような痛み。腰や脚の痛みを伴うこともあります。","tagline":"がまんではなく、耳を傾けてほしいと訴える周期。"},{"affirmation":"私のリズムを聴き、大切にします。","category":"月経周期とホルモン","chakra":"第２チャクラ：リズムと周期","doctor":"3か月以上来ない、生理以外のときや性交後に出血する、または妊娠の可能性があるとき。","items":[{"name":"ロードクロサイト","text":"体へのいたわりを。お腹の上にのせます。"},{"name":"ローズティー","text":"乾燥した花びらをカップに小さじ1、5分蒸らします。"},{"name":"ノート","text":"周期ごとに、日付・気分・エネルギーを記録。"}],"meaning":"伝統では、リズムの乱れと結びつけられています。自分のではなく、人のリズムに合わせて生きている状態です。","name":"月経不順","no":52,"page":64,"ritual":"【5分間】周期や体調について、書ける範囲で短く記録します。ムーンストーンなど好きな石をそばに置いても構いません。月の満ち欠けに合わせる必要はなく、今の身体のリズムをそのまま受け止めます。","signs":"生理が早まる、遅れる、または来ない状態。ストレスや体重の変化、人生の節目によることもあります。","tagline":"内なるリズムが乱れたとき。"},{"affirmation":"知恵と自由とともに、この時期を抱きしめます。","category":"月経周期とホルモン","chakra":"第７チャクラ：知恵と新しいステージ","doctor":"生理が止まって1年たってから出血した、ほてりで日常生活が送れない、または深い悲しみや骨の痛みがあるとき。","items":[{"name":"アメジスト","text":"静けさと知恵の石。ベッドサイドに。"},{"name":"レモンバームティー","text":"夜にぬるめを。休息に寄り添います。"},{"name":"扇子","text":"ほてったときに、落ち着いたまま涼しい風を。"}],"meaning":"老いや、役に立たなくなることへの恐れと関係があるとされます。同時に、賢者の席につくようにという招きでもあります。","name":"更年期","no":53,"page":65,"ritual":"【5分間】楽な姿勢で休み、今までの経験から得たことをひとつ思い出します。アメジストは手に持っても構いません。飲み物は好みと体調に合わせて選び、無理に準備しなくても大丈夫です。","signs":"生理が終わりを迎える時期。45〜55歳ごろで、ほてりや睡眠・気分・肌の変化を伴います。","tagline":"終わりではなく、知恵のステージへの入り口。"},{"affirmation":"私の声にも、私の思いにも、大切な居場所があります。","category":"月経周期とホルモン","chakra":"第５チャクラ：あなたの声と、あなたの番","doctor":"体調に変化があるとき。薬を自己判断でやめたり量を変えたりは、決してしないでください。動悸や極度の疲れがあるときも。","items":[{"name":"ソーダライト","text":"のどの上に置き、自分らしい表現の助けに。"},{"name":"ルイボスティー","text":"朝の薬とは時間をあけて飲みます。"},{"name":"キャンドル","text":"毎日の静かなひとときを照らす灯り。"}],"meaning":"伝統では、自分を後回しにすることと結びつけられています。話すのも選ぶのも輝くのも、自分の番は来ないと感じるのです。","name":"甲状腺機能低下症","no":54,"page":66,"ritual":"【5分間】楽な姿勢で、のどの力を抜いて休みます。ソーダライトをそばに置き、今の自分が伝えたい言葉をひとつ心の中で選びます。声を出す必要はありません。","signs":"甲状腺の働きがゆっくりになり、疲れやすさ、寒がり、肌の乾燥、体重の増加、気分の落ち込みがみられます。診断は医師が行います。","tagline":"自分の声とリズムが、居場所を求めているとき。"},{"affirmation":"自分に耳を傾け、必要なものを与えます。","category":"月経周期とホルモン","chakra":"第２チャクラ：感情と周期","doctor":"症状のせいで仕事や人づきあいができない、または深い悲しみや、自分を傷つけたい気持ちがあるとき。","items":[{"name":"ムーンストーン","text":"心の落ち着きに。その時期は持ち歩きます。"},{"name":"カモミールティー","text":"その時期に、ぬるめを1〜2杯。"},{"name":"手帳","text":"その日に印をつけ、予定を減らします。"}],"meaning":"ひと月分たまった感情と関係があるとされます。黙っていたことが、その時期に出口を見つけるのです。","name":"PMS（月経前症候群）","no":55,"page":67,"ritual":"【5分間】ムーンストーンを手に、今の気分や身体の状態を短く書き留めます。今月、自分に必要な休息をひとつ考えます。【日常の調整】可能なら予定を減らして休息を増やします。","signs":"生理前の数日に起こる、イライラ、落ち込み、むくみ、食欲の高まり、胸の痛み。","tagline":"すべてがいつもより重く感じる日々。"},{"affirmation":"感じたことを外に出し、落ち着きを取り戻します。","category":"月経周期とホルモン","chakra":"第３チャクラ：火とそのバランス","doctor":"動悸、体重減少、発熱を伴うとき、または更年期以外で寝汗が出るとき。","items":[{"name":"アクアマリン","text":"水と涼しさの石。ほてりのあいだ、手に持ちます。"},{"name":"冷たいミントティー","text":"冷やして少しずつ。胸やけがあれば控えて。"},{"name":"冷たいタオル","text":"ほてりが始まったら、すぐ首の後ろに。"}],"meaning":"伝統では、抑えた怒りや欲求の表れとされています。表現を求めて、こみ上げてくる感情です。","name":"ホットフラッシュ","no":56,"page":68,"ritual":"【5分間】ほてりを感じたら、涼しい場所で楽な姿勢を取ります。心地よければ首元を冷たいタオルで冷やします。アクアマリンはそばに置いても構いません。呼吸を無理に長くせず、落ち着くまで休みます。","signs":"顔や胸が急にカッと熱くなり、汗や赤みを伴います。更年期によくみられます。","tagline":"こみ上げて、外へ出たがる火。"},{"affirmation":"私も、自分をいたわっていい。","category":"月経周期とホルモン","chakra":"第４チャクラ：人に注ぐ愛を、自分にも","doctor":"しこりがある、皮膚や乳頭に変化がある、分泌物が出る、または痛みが周期と関係なく起こるとき。","items":[{"name":"ローズクォーツ","text":"いたわるように胸の上に。"},{"name":"レモンバームティー","text":"心を静め、寄り添うお茶。カップに小さじ1。"},{"name":"温かい湿布","text":"胸の上に数分間、やさしくあてます。"}],"meaning":"人に尽くしすぎることと関係があるとされます。際限なく与え、自分のケアを後回しにすることです。","name":"胸の張り","no":57,"notes":"ritual内の「今日自分のためだけににすることを」は原文の表記のまま転記した（「だけににする」は原文の癖・誤植の可能性あり）。","page":69,"ritual":"【5分間】胸を圧迫しない楽な姿勢で休みます。温める場合は心地よい範囲で。ローズクォーツはそばに置いても構いません。今日、自分のためにできることをひとつ考えます。","signs":"胸が敏感になる、張る、痛む状態。特に生理前に起こります。","tagline":"みんなの世話をして、自分を忘れているとき。"},{"affirmation":"楽しむこと、体を感じることを自分に許します。","category":"月経周期とホルモン","chakra":"第２チャクラ：心地よさ、欲求、創造性","doctor":"性交時に痛む、深い悲しみやホルモンの変化がある、または新しい薬を飲み始めてから起きたとき。","items":[{"name":"カーネリアン","text":"セイクラルの石。活力と楽しむ心を。"},{"name":"シナモンティー","text":"スティック半分をお湯に。ぬくもりと香りを。"},{"name":"キャンドル","text":"自分だけのひとときに、温かな灯りを。"}],"meaning":"伝統では、喜びから切り離されることと結びつけられています。義務のために生き、楽しむことも自分のものだと忘れている状態です。","name":"性欲の低下","no":58,"page":70,"ritual":"【5分間】自分だけの落ち着ける時間をつくり、心地よい音や香りなどをひとつ選びます。刺激が苦手なら何も使わなくて構いません。カーネリアンはそばに置き、今の自分が心地よいと感じることを探します。","signs":"以前より親密なふれあいを求めなくなる状態。疲れやストレス、ホルモンの変化、薬が関係していることもあります。","tagline":"喜びが、やることリストの最後に回ったとき。"},{"affirmation":"感情は移り変わり、私はそれに寄り添います。","category":"月経周期とホルモン","chakra":"第２チャクラ：感情の流れ","doctor":"仕事や人間関係に影響が出ている、または深い悲しみ、激しい怒りの爆発、自分を傷つけたい気持ちがあるとき。","items":[{"name":"レピドライト","text":"心のバランスに。持ち歩きます。水にはつけません。"},{"name":"リンデンティー","text":"神経を落ち着かせる助けに。カップに小さじ1。"},{"name":"ノート","text":"毎日の気分を記録。パターンが見えてきます。"}],"meaning":"周期にあらがうことと関係があるとされます。変わるのが本来の姿なのに、いつも同じでいようとするのです。","name":"周期による気分の波","no":59,"page":71,"ritual":"【5分間】レピドライトを手に、今日の気分をひとことで書き留めます。今の自分に求めることをひとつ減らしてみます。【日常の記録】気分の変化を継続して記録します。","signs":"周期の特定の日に、喜びから怒りや悲しみへと気分が移りやすくなります。","tagline":"満ち引きする感情にも、知恵が宿っています。"},{"affirmation":"休むことも、私の周期の一部です。","category":"月経周期とホルモン","chakra":"第１チャクラ：身体のエネルギーと血","doctor":"出血が多いか血のかたまりが出る、または顔色が悪い、めまい、息切れがあるとき。鉄分不足かもしれません。","items":[{"name":"ガーネット","text":"血と活力の石。"},{"name":"しょうがとシナモン","text":"しょうがの薄切り2枚と、シナモンスティック半分。"},{"name":"ブランケット","text":"その時期は、いつもより休んでいい。"}],"meaning":"伝統では、静かにこもる時期への呼びかけと捉えます。することを減らし、ただ在ることを求める日々です。","name":"生理中のだるさ","no":60,"page":72,"ritual":"【5分間】ブランケットなどで心地よく整え、楽な姿勢で休みます。ガーネットはそばに置いても構いません。眠れなくても構いません。今日は休むことを自分に許す時間にします。","signs":"生理中の気力不足、眠気、脱力感。出血が多いことが原因の場合もあります。","tagline":"その時期、体はいつもより働きます。休ませてあげて。"},{"affirmation":"今の身体を責めずに、私に合う選択を少しずつ重ねます。","category":"エネルギーと活力","chakra":"第３チャクラ：自己肯定感と自分の力","doctor":"体重の計画は、必ず専門家と立てます。この実践は寄り添うもので、体重を減らすものではありません。","items":[{"name":"シトリン","text":"自信と意志の石。キッチンの見える場所に。"},{"name":"緑茶","text":"朝に1〜2杯、砂糖なしで。"},{"name":"水のボトル","text":"いつも持ち歩きます。渇きを空腹と感じることも。"}],"meaning":"伝統では、守られたいという思いと結びつけます。痛みや怖さを遠ざける盾としての体です。","name":"肥満","no":61,"page":73,"ritual":"【5分間】食事や身体への評価をいったん脇に置き、呼吸を整えます。今の自分にとって心地よいケアをひとつ考えます。シトリンをそばに置いても構いません。","signs":"健康や心身の調子に影響するほどの体重過多。原因はさまざまで、専門家とともに向き合うものです。","tagline":"責めるのではなく、いたわりながら体を大切に。"},{"affirmation":"充電する時間を、自分に許します。","category":"エネルギーと活力","chakra":"第１チャクラ：生命エネルギーと支え","doctor":"2週間以上続く、または発熱、体重減少、顔色の悪さ、息切れ、出血、深い悲しみがあるとき。","items":[{"name":"レッドジャスパー","text":"体のエネルギーの石。手に握ります。"},{"name":"ローズマリーティー","text":"朝に。カップに小さじ1、5分蒸らします。"},{"name":"手帳","text":"今週、急ぎでないことに線を引きます。"}],"meaning":"受け取る以上に与えていることと結びつくとされます。みんなを支え、自分を満たす場所がない状態です。","name":"極度の疲労","no":62,"page":74,"ritual":"【5分間】安全で楽な姿勢で休み、今日の予定から急がなくてよいことをひとつ選びます。レッドジャスパーはそばに置いても構いません。立つことや深呼吸を無理にせず、今は身体を休めます。","signs":"眠っても抜けない深い疲れ。毎日のことをこなすのが難しくなります。","tagline":"休んでも、元気が戻らないとき。"},{"affirmation":"無理なことには、無理と言っていい。私の境界線を大切にします。","category":"エネルギーと活力","chakra":"第４チャクラ：大切なものを守ること、まずは自分から","doctor":"とても頻繁に体調を崩す、感染症が重いか長引く、または発熱、発汗、体重減少があるとき。","items":[{"name":"ブラックトルマリン","text":"守りと境界線の石。持ち歩きます。"},{"name":"しょうが・レモン・はちみつ","text":"ぬるめで。はちみつは1歳未満には与えません。"},{"name":"色とりどりの果物","text":"いろいろな果物と野菜を毎日。"}],"meaning":"伝統では、境界線のなさと捉えます。自分のエネルギーを守らず、何でも誰でも受け入れてしまうのです。","name":"免疫力の低下","no":63,"page":75,"ritual":"【5分間】温かい飲み物など、負担のない方法でひと息つきます。ブラックトルマリンはそばに置いても構いません。今週、断ってもよいことをひとつ思い浮かべ、無理をしない選択を自分に許します。","signs":"よく体調を崩す、なかなか回復しない、何でもうつってしまう気がする。","tagline":"自分で境界線を引かないと、体が引こうとします。"},{"affirmation":"今は立ち止まってもいい。自分のペースを大切にします。","category":"エネルギーと活力","chakra":"第１チャクラ：足元、安定、方向","doctor":"激しい頭痛、物が二重に見える、話しにくさ、脱力感、失神を伴うとき。すぐ救急（119）に連絡してください。","items":[{"name":"ヘマタイト","text":"グラウンディングの石。床に足をつけて手に。"},{"name":"ジンジャーティー","text":"吐き気に寄り添う一杯。少しずつ飲みます。"},{"name":"椅子","text":"転ばないよう、始まったらすぐ座ります。"}],"meaning":"方向を見失うことと結びつくとされます。多くの変化が一度に訪れ、頼れる場所がないと感じる状態です。","name":"めまい","no":64,"page":76,"ritual":"【5分間】安全な場所で座るか横になり、無理に動かず休みます。呼吸は自然なままで構いません。立ち上がることを儀式の目標にしません。","signs":"周りが回る感覚やふらつき。姿勢を変えたときや緊張したときに起こり、吐き気を伴うこともあります。","tagline":"足元がぐらつくように感じるとき。"},{"affirmation":"感じることを流れにまかせ、何もため込みません。","category":"エネルギーと活力","chakra":"第２チャクラ：水、流れ、感情","doctor":"片脚だけがむくむ、痛みや皮膚の赤み・熱感、息切れがある、またはむくみが急に増すとき。","items":[{"name":"アクアマリン","text":"水の石。ポケットに入れて持ち歩きます。"},{"name":"フェンネルティー","text":"つぶした種を小さじ半分。"},{"name":"クッション","text":"一日の終わりに、脚を10分高く上げます。"}],"meaning":"伝統では、感情をため込むことと結びつけます。流すのを自分に許さない涙や怒りです。","name":"むくみ","no":65,"page":77,"ritual":"【5分間】楽な姿勢で脚を休ませ、アクアマリンをそばに置きます。呼吸を整えながら、今日という日をそっと送り出します。【別の時間に】脚を高くして休む場合は、無理のない姿勢で行います。","signs":"足首、脚、手、まぶたのむくみと重だるさ。特に一日の終わりに目立ちます。","tagline":"内側でとどこおるものも、重さになります。"},{"affirmation":"疲れを感じる私にも、休む時間が必要です。","category":"エネルギーと活力","chakra":"第３チャクラ：エネルギーとその休息","doctor":"消耗が何週間も続く、悲しみ、不眠、動悸、体重減少がある、または働けなくなったとき。","items":[{"name":"スモーキークォーツ","text":"たまった緊張を手放すために。"},{"name":"ルイボスティー","text":"ノンカフェイン。午後のひと息に。"},{"name":"シンギングボウル","text":"1分間の音で、警戒モードを断ち切ります。"}],"meaning":"非常事態の中で暮らすことと結びつくとされます。回復する間もなく、たえず高い要求に応え続ける状態です。","name":"副腎疲労","no":66,"page":78,"ritual":"【5分間】スモーキークォーツを手に、静かな場所で楽な姿勢を取ります。無理のない範囲で吐く息を少し長くし、身体の力を抜きます。【日常の習慣】短い休憩をこまめに取ります。","signs":"慢性的なストレスによる消耗の通称です。医学的な診断名ではありません。疲れは医師に相談を。","tagline":"いつも警戒モードで動き続けているとき。"},{"affirmation":"私のエネルギーは私が守ります。","category":"エネルギーと活力","chakra":"第３チャクラ：あなたの力とあなたの盾","doctor":"疲れや不調がいつも続くようになった、または悲しみ、不安、恐れが消えないとき。","items":[{"name":"ブラックトルマリン","text":"守りの石。ポケットに入れます。"},{"name":"ローズマリーティー","text":"朝に。自分のエネルギーで一日を始めます。"},{"name":"粗塩","text":"器に盛って玄関に置き、毎週取り替えます。"}],"meaning":"伝統では、境界線がもろい状態と捉えます。他人のエネルギーを吸い込み、その視線に揺さぶられてしまうのです。","name":"嫉妬とエネルギーの消耗","no":67,"page":79,"ritual":"【5分間】落ち着ける場所で手を洗うなど、気持ちの切り替えになる行動をひとつ選びます。ブラックトルマリンはそばに置いても構いません。光に包まれるイメージが心地よければ思い描き、自分の境界線を確かめます。","signs":"特定の人と過ごしたあとや、特定の場所に行ったあとに現れる疲れ、頭痛、イライラ。","tagline":"特定の人と会ったあと、力が抜けてしまうとき。"},{"affirmation":"一度に全部できなくてもいい。今はひとつに向き合います。","category":"エネルギーと活力","chakra":"第６チャクラ：明晰さと集中","doctor":"もの忘れを周りの人が心配している、または混乱、激しい頭痛、深い悲しみがあるとき。","items":[{"name":"フローライト","text":"集中の石。机の上に置きます。"},{"name":"ローズマリーとミント","text":"それぞれ小さじ半分ずつ、昼前に。"},{"name":"砂時計","text":"25分ずつ区切り、終わるたびにひと休み。"}],"meaning":"散漫さと結びつくとされます。何でも一度にやろうとし、ひとつに絞ることを自分に許さない状態です。","name":"集中力の低下","no":68,"page":80,"ritual":"【5分間】机の上から気になるものをひとつだけ片づけます。フローライトをそばに置いても構いません。小さな作業をひとつ選び、途中で疲れたら休みます。","signs":"注意が続かない、もの忘れ、考えが散らばる感覚。特に疲れているときに目立ちます。","tagline":"考えがあちこちに飛んでしまうとき。"},{"affirmation":"さまざまな形で自分を甘やかします。","category":"エネルギーと活力","chakra":"第２チャクラ：楽しみと甘やかさ","doctor":"強いのどの渇き、頻尿、体重減少、極度の疲れを伴うとき。糖尿病でないか確認が必要です。","items":[{"name":"ローズクォーツ","text":"心にやさしい甘さを。手に握ります。"},{"name":"シナモンティー","text":"スティック半分。砂糖なしで自然な甘さ。"},{"name":"果物","text":"欲しくなったときに備え、果物をひとつ手元に。"}],"meaning":"伝統では、日々に足りない甘やかさと結びつけます。自分で自分を甘やかさない分、外に求めるのです。","name":"甘いものがやめられない","no":69,"page":81,"ritual":"【5分間】ローズクォーツをそばに置き、飲み物を楽しみながら、今の自分が本当に求めているものを考えます。食べたい気持ちを責めず、選択を急がなくても大丈夫です。","signs":"甘いものへの強い欲求。特に午後や夜、疲れやストレスがあるときに起こります。","tagline":"足りない甘やかさを、食べ物に求めてしまうとき。"},{"affirmation":"重だるい日は無理をしなくていい。自分の身体をいたわります。","category":"エネルギーと活力","chakra":"第１チャクラ：軽やかで、しっかりした足どり","doctor":"片脚が腫れる、痛む、赤くなる、熱をもつ、息切れがある、または血管が浮き出て痛むとき。","items":[{"name":"オブシディアン","text":"重荷を下ろす助けに。儀式のときはそばに。"},{"name":"リンデンティー","text":"一日の終わりに、ぬるめで。"},{"name":"ヨガマット","text":"一日の終わりに、脚を壁に上げて5分。"}],"meaning":"荷を背負ったままの歩みと結びつくとされます。過去の重さを下ろさずに進み続けるのです。","name":"脚の重だるさ","no":70,"page":82,"ritual":"【5分間】脚が楽になる姿勢で休みます。壁に脚を上げることは必須ではありません。オブシディアンをそばに置き、今の身体の感覚を確かめながら静かに呼吸します。","signs":"一日の終わりの、脚の疲れや重さ、しびれ。暑いときや長く立ったあとに強まります。","tagline":"抱えたものが重く、前に進みにくいとき。"},{"no":71,"name":"不安","category":"感情とスピリチュアリティ","page":83,"tagline":"まだ起きていない未来に、心が住んでいるとき。","items":[{"name":"レピドライト","text":"安らぎの石。手に持ち、水にはつけません。"},{"name":"リンデンとレモンバーム","text":"合わせて1杯に小さじ。ふたをして蒸らします。"},{"name":"キャンドル","text":"呼吸しながら炎を見つめ、「今」に戻ります。"}],"signs":"絶え間ない心配、胃が締めつけられる感じ、動悸、緊張、リラックスしにくさ。","meaning":"伝統では、人生を信頼できない状態と捉えます。今の恐れを感じないように、未来をコントロールしようとするのです。","chakra":"第３チャクラ：信頼と心の静けさ","ritual":"【5分間】周囲を見渡し、見えるものや聞こえる音など、今ここで気づける感覚をひとつずつ確かめます。レピドライトはそばに置いても構いません。感覚を数え切る必要はなく、つらければ途中でやめて構いません。","doctor":"生活に支障がある、パニック発作がある、眠れない、自分を傷つけたい気持ちがあるとき。助けを求めてください。","affirmation":"不安があっても、今ここにいる自分を感じていい。"},{"no":72,"name":"自己肯定感の低さ","category":"感情とスピリチュアリティ","page":84,"tagline":"誰よりも厳しい目で自分を見るとき。","items":[{"name":"シトリン","text":"自分の輝きの石。ポケットか机の上に。"},{"name":"ローズティー","text":"乾燥した花びらで。自分への5分のごほうび。"},{"name":"手鏡","text":"自分の目を見て、やさしいひと言を。"}],"signs":"自分の価値を疑う、人と比べる、何をしても足りないと感じる、ほめ言葉を受け取りにくい。","meaning":"信じ込んできた古いメッセージと結びつくとされます。「十分じゃない」と今も告げる、過去の声です。","chakra":"第３チャクラ：自分の力と価値","ritual":"【5分間】昨日できたことをひとつ思い出します。思い浮かばない日は、今日ここまで過ごした自分を認めるだけでも構いません。鏡を見るかどうかは自由に選びます。","doctor":"人との関わりを避ける、自分を大切にしなくなる、または深い悲しみを伴うとき。心理の専門家が寄り添ってくれます。","affirmation":"私は、ありのままで十分です。"},{"no":73,"name":"悲しみと喪失の悲嘆","category":"感情とスピリチュアリティ","page":85,"tagline":"行き場を探し続けている愛。","items":[{"name":"ローズクォーツ","text":"胸の上にのせ、両手を重ねます。"},{"name":"レモンバームティー","text":"悲しみに寄り添う一杯。ぬるめを急がずに。"},{"name":"手紙","text":"失った人へ、言えなかったことを書きます。"}],"signs":"喪失のあとの深い悲しみ。涙、疲れ、食欲のなさ、胸の締めつけを伴うことがあります。","meaning":"伝統では、行き先を見つけられない愛と捉えます。絆は続いていて、痛みはそれを伝えるかたちなのです。","chakra":"第４チャクラ：感じて、大切にして、変えていくこと","ritual":"【5分間】落ち着ける場所で、思い出したいことをひとつ心に浮かべます。望むなら短い手紙を書きます。涙が出ても、何も浮かばなくても構いません。声に出して読む必要はありません。","doctor":"何か月も悲しみが和らがない、毎日を送れない、自分を傷つけたい気持ちがあるとき。今日、助けを求めてください。","affirmation":"愛したものを胸に、進むことを許します。"},{"no":74,"name":"見捨てられる不安","category":"感情とスピリチュアリティ","page":86,"tagline":"素顔を見せたら、去られそうで怖いとき。","items":[{"name":"レッドジャスパー","text":"安心と根づく力。両手で包んで持ちます。"},{"name":"リンデンティー","text":"気持ちを落ち着ける一杯。カップに小さじ1。"},{"name":"ブランケット","text":"くるまると、体が安心することを覚えていきます。"}],"signs":"つながりへの不安、たえず確かめずにいられない気持ち、距離や沈黙への苦しさ。","meaning":"幼いころの傷と結びつくとされます。ひとりになるのが怖かった自分の一部が、今も外に安心を探しているのです。","chakra":"第１チャクラ：内側の安心感","ritual":"【5分間】心地よければブランケットを使い、片手を胸かお腹にそっと添えます。レッドジャスパーは手に持っても構いません。「不安な私も、そのままでいい」と心の中で語りかけます。","doctor":"不安に押しつぶされそう、人間関係や仕事に影響が出る、またはパニック発作があるとき。心理の専門家に相談を。","affirmation":"不安な私も、そのままでいい。私は私の味方です。"},{"no":75,"name":"過度な罪悪感","category":"感情とスピリチュアリティ","page":87,"tagline":"もう償った過ちを、まだ背負っているとき。","items":[{"name":"ロードナイト","text":"許しの石。胸の上に置きます。"},{"name":"カモミールティー","text":"ぬるめで、この時間のおともに。"},{"name":"水を入れたボウル","text":"手をぬらし、背負わなくていいものを手放します。"}],"signs":"何でも自分の責任だと思う、何かにつけて謝る、楽しむと自分にはその資格がないと感じてしまう。","meaning":"伝統では、自分への厳しさと結びつけます。返し終えた借りを、内なる裁判官が今も取り立てるのです。","chakra":"第４チャクラ：許すこと、自分のことも","ritual":"【5分間】自分を責めている気持ちがあれば、書ける範囲で短く言葉にします。ロードナイトはそばに置いても構いません。「今の私にも、いたわりが必要」と静かに確かめます。書くのがつらい日は休むだけでも構いません。","doctor":"罪悪感で日常が送れない、または深い悲しみや自分を傷つけたい気持ちを伴うとき。専門家の助けを求めてください。","affirmation":"あのときの私を責め続けなくていい。今の私にも優しさを向けます。"},{"no":76,"name":"完璧主義","category":"感情とスピリチュアリティ","page":88,"tagline":"何をしても、十分だと思えないとき。","items":[{"name":"タイガーアイ","text":"しなやかな自信の石。机の上に。"},{"name":"ラベンダーティー","text":"カップに花をひとつまみ。緊張をゆるめます。"},{"name":"砂時計","text":"時間を決め、そこで終わりにします。"}],"signs":"自分への要求がとても高い、間違いを恐れる、何度も見直す、完璧にできないならと先延ばしにする。","meaning":"受け入れられない恐れと結びつくとされます。一度も失敗しなければ愛される、と信じているのです。","chakra":"第３チャクラ：自分を責めない意志","ritual":"【5分間】取り組めそうな小さな作業をひとつ選び、時間を決めて始めます。タイガーアイはそばに置いても構いません。時間が来たら、できたところまでを認めます。完璧に終える必要はありません。","doctor":"不安が絶えない、何も終えられない、眠れない、または深い悲しみがあるとき。助けを求めてください。","affirmation":"完璧でなくても、ここまで進めた自分を認めます。"},{"no":77,"name":"先延ばし","category":"感情とスピリチュアリティ","page":89,"tagline":"先延ばしは怠けではなく、多くの場合は恐れです。","items":[{"name":"カーネリアン","text":"始める勢いの石。手に持ちます。"},{"name":"ローズマリーティー","text":"朝に。すっきり始めるために。"},{"name":"紙と鉛筆","text":"笑ってしまうほど小さな、最初の一歩を書きます。"}],"signs":"あとで困るとわかっていても大事なことを後回しにし、進まないことに罪悪感を覚える。","meaning":"伝統では、失敗や批判への恐れと捉えます。始めなければ、誰にも評価されずにすむのです。","chakra":"第２チャクラ：創造の衝動","ritual":"【5分間】やりたいことの最小の一歩を紙に書き、できそうならその一歩だけ試します。カーネリアンはそばに置いても構いません。始められない日も責めず、準備できたことを認めます。","doctor":"仕事や勉強ができない、強い不安や悲しみを伴う、または注意欠如かもしれないと思うとき。","affirmation":"小さな一歩からでいい。始める時を自分で選びます。"},{"no":78,"name":"孤独","category":"感情とスピリチュアリティ","page":90,"tagline":"人といても、遠くにいるように感じる。","items":[{"name":"ローズクォーツ","text":"胸の上に。まずは自分自身に寄り添って。"},{"name":"ローズティー","text":"大切な人をもてなすように、自分にいれます。"},{"name":"鉢植え","text":"生きものの世話も、心の支えに。"}],"signs":"孤立している、誰にもわかってもらえないという感覚。疲れや悲しみ、意欲のなさを伴うこともあります。","meaning":"自分自身と離れていることと結びつくとされます。自分に寄り添えないと、外にも空しさを感じるのです。","chakra":"第４チャクラ：つながり、まずは自分から","ritual":"【5分間】自分のために温かい飲み物を用意するなど、心地よい時間をつくります。つながりたい人が浮かべば、送らなくてもよいメッセージを書いてみます。","doctor":"悲しみが和らがない、自分をいたわれない、自分を傷つけたい気持ちがあるとき。今日、助けを求めてください。","affirmation":"まず私が私に寄り添い、人にも心を開きます。"},{"no":79,"name":"自己妨害","category":"感情とスピリチュアリティ","page":91,"tagline":"あと一歩なのに、心にブレーキがかかるとき。","items":[{"name":"オブシディアン","text":"隠れているものを映す石。正直な目で見つめます。"},{"name":"ジンジャーティー","text":"薄切り2〜3枚を5分。勢いとぬくもりを。"},{"name":"ノート","text":"ブレーキがかかったら記録を。パターンが見えます。"}],"signs":"何かを達成する直前でやめる、大事なことを後回しにする、自分によくないとわかっているものを選ぶ。","meaning":"伝統では、資格がないという思い込みと結びつけます。成功したあとのことを、心の一部が恐れているのです。","chakra":"第１チャクラ：成長するための安心感","ritual":"【5分間】『うまくいったら怖いのは……』の続きを、書ける範囲でひとつだけ書きます。答えが出なくても構いません。今の気持ちを責めずに眺めます。","doctor":"何事も同じパターンをくり返す、または不安、飲酒や薬物の問題、深い悲しみを伴うとき。心理の専門家が力になってくれます。","affirmation":"私はよいものに値します。受け取っていい。"},{"no":80,"name":"インポスター症候群","category":"感情とスピリチュアリティ","page":92,"tagline":"いつ見抜かれてもおかしくない、と感じるとき。","items":[{"name":"ラブラドライト","text":"自分の光に気づくために。"},{"name":"レモンバーベナティー","text":"やさしい香りの一杯。カップに小さじ1。"},{"name":"できたことの瓶","text":"できたことを小さな紙に書いてためます。"}],"signs":"成果は自分にふさわしくない、運がよかっただけ、もうすぐ「実はわかっていない」と見抜かれる、と感じる。","meaning":"自分の立ち位置になじめないことと結びつくとされます。自己イメージが追いつかないほど速く成長してきたのです。","chakra":"第５チャクラ：自分が知っていることから話すこと","ritual":"【5分間】今日できたことをひとつ、小さな紙に書きます。ラブラドライトをそばに置き、その事実を自分の言葉で認めます。【日常の習慣】紙を瓶にため、気持ちが揺らぐ日に読み返します。","doctor":"身動きが取れなくなる、不安が絶えない、または仕事で成長できなくなっているとき。支えを求めてください。","affirmation":"ここまで歩んできた私の努力を、私自身が認めていい。"}];

  {key:"第４チャクラ",label:"第４チャクラ",color:"#3d9970"},
  {key:"第５チャクラ",label:"第５チャクラ",color:"#2f7fc4"},
  {key:"第６チャクラ",label:"第６チャクラ",color:"#4b4fa0"},
  {key:"第７チャクラ",label:"第７チャクラ",color:"#7d4fa6"}
];
var state = { q:"", cat:"", chakras:[] };

function chakraKeys(chakraStr){
  var keys=[];
  CHAKRAS.forEach(function(c){ if(chakraStr.indexOf(c.key)===0 || chakraStr.indexOf("と"+c.key)>-1){ keys.push(c.key); } });
  return keys;
}
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function matches(s){
  if(state.cat && s.category!==state.cat) return false;
  if(state.chakras.length && !state.chakras.some(function(key){ return chakraKeys(s.chakra).indexOf(key)>=0; })) return false;
  if(state.q){
    var q=state.q.toLowerCase();
    var hay=[s.name,s.tagline,s.signs,s.meaning,s.chakra,s.category].join(" ");
    s.items.forEach(function(it){ hay+=" "+it.name+" "+it.text; });
    var terms=q.split(/[\s　]+/).filter(Boolean);
    for(var i=0;i<terms.length;i++){ if(hay.toLowerCase().indexOf(terms[i])<0) return false; }
  }
  return true;
}
function chakraColor(key){
  var found="";
  CHAKRAS.forEach(function(c){ if(c.key===key) found=c.color; });
  return found;
}
function chakraHeadHTML(head){
  return head.split("と").map(function(part){
    var key=part.trim();
    var color=chakraColor(key);
    return (color?'<span class="cdot" style="background:'+color+'"></span>':"")+esc(key);
  }).join("と");
}
function chakraBadgeHTML(chakraStr){
  return chakraHeadHTML(chakraStr.split("：")[0]);
}
function chakraFullHTML(chakraStr){
  var parts=chakraStr.split("：");
  var head=chakraHeadHTML(parts[0]);
  return parts.length>1 ? head+"："+esc(parts.slice(1).join("：")) : head;
}
function detailHTML(s){
  var items=s.items.map(function(it,i){
    return '<li><span class="num">'+(i+1)+'</span><span><span class="iname">'+esc(it.name)+'</span><br><span class="itext">'+esc(it.text)+'</span></span></li>';
  }).join("");
  return '<div class="detail">'
    +'<section class="content-section"><h3>01 <span>からだのサイン</span></h3><p>'+esc(s.signs)+'</p></section>'
    +'<section class="content-section"><h3>02 <span>心と身体への気づき（伝統的な解釈）</span></h3><p>'+esc(s.meaning)+'</p></section>'
    +'<section class="content-section chakra-panel"><h3>03 <span>関連チャクラ</span></h3><p>'+chakraFullHTML(s.chakra)+'</p></section>'
    +'<section class="content-section ritual-panel"><h3>04 <span>5分間の儀式</span></h3><p>'+esc(s.ritual)+'</p></section>'
    +'<section class="content-section"><h3>05 <span>アファメーション</span></h3><div class="aff"><p>'+esc(s.affirmation)+'</p></div></section>'
    +'<section class="content-section"><h3>06 <span>こんなときは医師に相談を</span></h3><div class="doctor"><p>'+esc(s.doctor)+'</p></div></section>'
    +'<details class="supplement"><summary>07　おすすめアイテムを見る（任意）</summary><ol class="items">'+items+'</ol></details>'
    +'<p class="pagenote sans">本の'+s.page+'ページ</p>'
    +'</div>';
}
var expandedSheetNos = {};
function render(){
  var list=document.getElementById("list");
  // Expanded sheet IDs persist even when a filter temporarily hides them.
  var filtered=SHEETS.filter(matches);
  var html="";
  CATS.forEach(function(cat){
    var group=filtered.filter(function(s){return s.category===cat;});
    if(!group.length) return;
    html+='<section><div class="cat-head"><h2>'+esc(cat)+'</h2><span class="n sans">'+group.length+'件</span></div>';
    group.forEach(function(s){
      html+='<details class="sheet" data-no="'+s.no+'">'
        +'<summary><span class="s-top"><span class="s-no">'+s.no+'</span>'
        +'<span class="s-main"><span class="s-name">'+esc(s.name)+'</span>'
        +'<span class="s-tag" style="display:block">'+esc(s.tagline)+'</span>'
        +'<span class="s-meta"><span class="badge chakra">'+chakraBadgeHTML(s.chakra)+'</span><span class="badge">本の'+s.page+'ページ</span></span></span>'
        +'<span class="chev" aria-hidden="true">▽</span></span></summary>'
        +detailHTML(s)
        +'</details>';
    });
    html+='</section>';
  });
  list.innerHTML=html;
  list.querySelectorAll("details.sheet").forEach(function(el){
    if(expandedSheetNos[el.getAttribute("data-no")]) el.open=true;
  });
  list.querySelectorAll("details.sheet").forEach(function(el){
    el.addEventListener("toggle", function(){
      if(el.open) expandedSheetNos[el.getAttribute("data-no")]=true;
      else delete expandedSheetNos[el.getAttribute("data-no")];
    });
  });
  document.getElementById("empty").style.display = filtered.length? "none":"block";
  document.getElementById("countText").innerHTML = "全80シート中 <b>"+filtered.length+"</b> 件";
  var active = state.q||state.cat||state.chakras.length;
  document.getElementById("resetBtn").style.display = active? "inline-block":"none";
  document.getElementById("clearQ").style.display = state.q? "block":"none";
}
function buildChips(){
  var cc=document.getElementById("catChips");
  var all=[{v:"",label:"すべて"}].concat(CATS.map(function(c){return{v:c,label:c};}));
  cc.innerHTML=all.map(function(o){return '<button class="chip" data-v="'+esc(o.v)+'" aria-pressed="'+(state.cat===o.v)+'">'+esc(o.label)+'</button>';}).join("");
  cc.querySelectorAll(".chip").forEach(function(b){ b.addEventListener("click",function(){ state.cat=b.getAttribute("data-v"); syncChips(); render(); }); });
  var kc=document.getElementById("chakraChips");
  kc.classList.add("chakra-checks");
  kc.innerHTML=CHAKRAS.map(function(c){
    return '<label class="chakra-option"><input type="checkbox" value="'+esc(c.key)+'"'+(state.chakras.indexOf(c.key)>=0?' checked':'')+'><span class="cdot" style="background:'+c.color+'"></span><span>'+esc(c.label)+'</span></label>';
  }).join("");
  kc.querySelectorAll('input[type="checkbox"]').forEach(function(cb){
    cb.addEventListener("change",function(){
      state.chakras=Array.from(kc.querySelectorAll('input:checked'),function(el){return el.value;});
      render();
    });
  });
}
function syncChips(){
  document.querySelectorAll("#catChips .chip").forEach(function(b){ b.setAttribute("aria-pressed", b.getAttribute("data-v")===state.cat ? "true":"false"); });
  document.querySelectorAll("#chakraChips input[type=checkbox]").forEach(function(cb){ cb.checked=state.chakras.indexOf(cb.value)>=0; });
}
var qEl=document.getElementById("q");
qEl.addEventListener("input",function(){ state.q=qEl.value.trim(); render(); });
document.getElementById("clearQ").addEventListener("click",function(){ qEl.value=""; state.q=""; render(); qEl.focus(); });
document.getElementById("resetBtn").addEventListener("click",function(){ state={q:"",cat:"",chakras:[]}; qEl.value=""; syncChips(); render(); });
buildChips();
render();
</script>
</body>
</html>
