  .controls {

    border: 1px solid #e2ddd5;
    border-radius: 10px;
    padding: 14px 18px;

    flex-wrap: wrap;

    align-items: center;

  .controls label {
    font-weight: 600;
    font-size: 0.9rem;
  }
  select, input[type="text"] {
    padding: 6px 10px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 0.9rem;
  }
  select { min-width: 220px; }
  input[type="text"] { min-width: 220px; }
  .count {

  }
  .clear-btn {

    border-radius: 6px;

    cursor: pointer;

  .cards {

  .card {

  .card .name {

    margin-bottom: 6px;
  }
  .card .point {

    white-space: pre-wrap;
    color: #3a3a3a;
  }
  .no-result {
    text-align: center;
    color: #999;
    padding: 30px;
  }
  .footnote {
    max-width: 1000px;
    margin: 20px auto 0 auto;
    font-size: 0.78rem;
    color: #999;
    line-height: 1.6;
  }
  mark {
    background: #ffe8b3;
    padding: 0 1px;
    border-radius: 2px;
  }
</style>
</head>

  <button class="clear-btn" id="clearBtn">条件をクリア</button>

    { cat: "フライヤー【フライ層】", name: "手仕込みロースとんかつ",
      point: "170℃ 2分→ベンチ4分（とんかつは揚げ網に立てかける!!）→180℃ 20秒 放熱10分" },

      point: "170℃ 4分30秒" },
    { cat: "フライヤー【フライ層】", name: "一口豚ヒレかつ",

    { cat: "フライヤー【フライ層】", name: "いかフライ",
      point: "170℃ 4分(最大投入10枚)" },
    { cat: "フライヤー【フライ層】", name: "あじフライ",
      point: "170℃ 5分(最大投入8枚)" },
    { cat: "フライヤー【フライ層】", name: "かにクリームコロッケ",
      point: "170℃ 6分（最大投入16個）" },
    { cat: "フライヤー【フライ層】", name: "北海道産男爵いもコロッケ",
      point: "170℃ 4分30秒(最大投入20個)" },
    { cat: "フライヤー【フライ層】", name: "中華春巻",
      point: "170℃ 5分（最大投入30本） 投入1分後網をかぶせ揚げムラが出ないようにする 放熱10分以上" },

      point: "170℃ 5分" },
    { cat: "フライヤー【フライ層】", name: "ぷりぷり海老の薄衣揚",
      point: "重ならないように並べる 170℃ 3分40秒（最大投入1Cs）" },
    { cat: "フライヤー【フライ層】", name: "薄衣仕立ての串揚6種盛合せ",
      point: "じゃがいも・れんこん・豚ロース各1B 170℃3分（最大投入36本）→豚ロースにパセリトッピング\n海老・うずら・白身魚各1B 170℃3分(最大投入36本)" },
    { cat: "フライヤー【フライ層】", name: "サクサクチーズ",
      point: "170℃ 2分30秒（最大投入2B）" },
    { cat: "フライヤー【フライ層】", name: "揚じゃが",
      point: "唐揚げ粉200g+水200gを混ぜ合わせる→皮付きポテト1Bと混ぜ合わせる→170℃6分油調" },
    { cat: "フライヤー【フライ層】", name: "黒胡椒香る♪塩ねぎメンチ",
      point: "玉ねぎメンチかつ：170℃ 3分30秒\n九条ねぎ：ざるにあけ油90cc×3杯かけ混ぜる→さらに3杯かけ混ぜる→ボウルにあけ塩だれ10g混ぜる" },
    { cat: "フライヤー【フライ層】", name: "冷凍グリル野菜ミックス",
      point: "170℃ 1分30秒" },
    { cat: "フライヤー【フライ層】", name: "彩野菜の薄衣揚",
      point: "グリル野菜となすに塩こしょうを振る→天ぷら粉を混ぜる→鶏卵を混ぜる→パン粉をつけて油調（170℃1分30秒）→15分放熱→順番に注意して盛り込む" },

    { cat: "米飯　類", name: "乱切りなす",
      point: "170℃ 1分30秒" },
    { cat: "米飯　類", name: "牛タンスライス",
      point: "一枚一枚手で剥がしながら、揚げ網に乗せる。170℃10秒" },
    { cat: "米飯　類", name: "かつ重用ハーフかつ",
      point: "170℃ 1分30秒" },
    { cat: "米飯　類", name: "ブロッコリー",
      point: "50g以下170℃5秒 50g以上170℃10秒 油調後味塩こしょう大1振り" },
    { cat: "米飯　類", name: "豚重キット",
      point: "豚肉：フライ層の油90ccレードル4杯 170℃20秒 玉ねぎ：170℃10秒\n→ボウルにマグロールを敷き油を吸着させる" },
    { cat: "米飯　類", name: "焼そば用キャベツ",
      point: "170℃10秒 味塩こしょう大口10振り" },
    { cat: "米飯　類", name: "蓮根チップ",
      point: "170℃5分" },

  const itemSelect = document.getElementById("itemSelect");
  const catSelect = document.getElementById("catSelect");
  const searchInput = document.getElementById("searchInput");
  const cardsArea = document.getElementById("cardsArea");
  const countLabel = document.getElementById("countLabel");
  const clearBtn = document.getElementById("clearBtn");
  const footnote = document.getElementById("footnote");

  // 商品名プルダウン（登場順）
  data.forEach(item => {
    const opt = document.createElement("option");
    opt.value = item.name;
    opt.textContent = item.name;
    itemSelect.appendChild(opt);
  });

  // 層（カテゴリ）プルダウン
  const uniqueCats = [...new Set(data.map(i => i.cat))];
  uniqueCats.forEach(c => {
    const opt = document.createElement("option");
    opt.value = c;
    opt.textContent = c;
    catSelect.appendChild(opt);
  });

  // あいまい検索用の正規化（全角/半角スペース除去、ひらがな→カタカナ統一、大文字小文字統一）
  function normalize(str) {
    return str
      .replace(/[\s　]+/g, "")
      .replace(/[ぁ-ゔ]/g, ch => String.fromCharCode(ch.charCodeAt(0) + 0x60)) // ひらがな→カタカナ
      .toLowerCase();
  }

  function highlight(text, keywords) {
    if (!keywords.length) return escapeHtml(text);
    let escaped = escapeHtml(text);
    keywords.forEach(kw => {
      if (!kw) return;
      const esc = kw.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
      const re = new RegExp("(" + esc + ")", "gi");
      escaped = escaped.replace(re, "<mark>$1</mark>");
    });
    return escaped;
  }

  function escapeHtml(str) {
    return str.replace(/[&<>"']/g, c => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[c]));
  }

  function render() {
    const selectedItem = itemSelect.value;
    const selectedCat = catSelect.value;
    const rawKeyword = searchInput.value.trim();
    const keywordTokens = rawKeyword.split(/[\s　]+/).filter(Boolean);
    const normTokens = keywordTokens.map(normalize);

    const rows = data.filter(item => {
      const matchesItem = !selectedItem || item.name === selectedItem;
      const matchesCat = !selectedCat || item.cat === selectedCat;
      const haystack = normalize(item.name + " " + item.point);
      const matchesSearch = normTokens.every(t => haystack.includes(t));
      return matchesItem && matchesCat && matchesSearch;
    });

    cardsArea.innerHTML = "";
    countLabel.textContent = rows.length + " 件表示中";

    if (rows.length === 0) {
      const div = document.createElement("div");
      div.className = "no-result";
      div.textContent = "該当する商品が見つかりませんでした。";
      cardsArea.appendChild(div);
      return;
    }

    rows.forEach(item => {
      const card = document.createElement("div");
      card.className = "card";

      const cat = document.createElement("div");
      cat.className = "cat";
      cat.textContent = item.cat;

      const name = document.createElement("div");
      name.className = "name";
      name.innerHTML = highlight(item.name, keywordTokens);

      const point = document.createElement("div");
      point.className = "point";
      point.innerHTML = highlight(item.point, keywordTokens);

      card.appendChild(cat);
      card.appendChild(name);
      card.appendChild(point);
      cardsArea.appendChild(card);
    });
  }

  itemSelect.addEventListener("change", () => { searchInput.value = ""; render(); });
  catSelect.addEventListener("change", render);
  searchInput.addEventListener("input", () => { itemSelect.value = ""; render(); });
  clearBtn.addEventListener("click", () => {
    itemSelect.value = "";
    catSelect.value = "";
    searchInput.value = "";
    render();
  });

  footnote.innerHTML =
    "※用語・数字はPDF記載のまま転記しています。<br>" +
    "※セルフ再鑑にて全43品目を原本と照合済みです。「豚重キット」内の「マグロール」は原本画像のまま残しています。";

  render();
</script>

</body>
</html>
