<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>惣菜部門 業務ツール</title>
<style>
  :root{
    --paper:#F6F4EE;
    --card:#FFFFFF;
    --ink:#1F2A24;
    --ink-soft:#5B6560;
    --brand:#C7000A;
    --brand-deep:#7B0006;
    --tag:#B9762F;
    --tag-bg:#FBEEDD;
    --line:#E4E0D4;
    --line-strong:#CFC9B8;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic","Meiryo",sans-serif;
    line-height:1.6;
    min-height:100vh;
    padding-bottom:40px;
  }
  header{
    background:linear-gradient(180deg,var(--brand-deep) 0%,var(--brand) 100%);
    color:#F5F2E8;
    padding:30px 20px 26px;
  }
  header h1{
    margin:0 0 4px;
    font-size:1.4rem;
    font-weight:700;
    letter-spacing:.02em;
  }
  header p{
    margin:0;
    font-size:.82rem;
    color:#F5D8D8;
  }

  main{
    max-width:720px;
    margin:0 auto;
    padding:22px 16px 0;
  }

  .menu-list{
    display:flex;
    flex-direction:column;
    gap:12px;
  }

  .menu-item{
    display:flex;
    align-items:center;
    gap:14px;
    background:var(--card);
    border:1px solid var(--line);
    border-left:5px solid var(--brand);
    border-radius:10px;
    padding:16px 18px;
    text-decoration:none;
    color:var(--ink);
    transition:border-color .15s ease, background .15s ease;
  }
  .menu-item:hover{
    background:#FFFBF5;
    border-left-color:var(--brand-deep);
  }
  .menu-item .icon{
    flex:0 0 auto;
    width:42px;
    height:42px;
    border-radius:8px;
    background:var(--tag-bg);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:1.35rem;
  }
  .menu-item .body{
    flex:1 1 auto;
    min-width:0;
  }
  .menu-item .title{
    font-weight:700;
    font-size:1rem;
    margin-bottom:2px;
  }
  .menu-item .desc{
    font-size:.8rem;
    color:var(--ink-soft);
  }
  .menu-item .chev{
    flex:0 0 auto;
    color:var(--ink-soft);
    font-size:1.1rem;
  }

  .section-label{
    font-size:.75rem;
    font-weight:700;
    color:var(--ink-soft);
    letter-spacing:.04em;
    margin:26px 0 10px 2px;
  }

  footer{
    max-width:720px;
    margin:34px auto 0;
    padding:0 16px;
    font-size:.72rem;
    color:var(--ink-soft);
  }
</style>
</head>
<body>

<header>
  <h1>🍱 惣菜部門 業務ツール</h1>
  <p>Wakaba Walk店 ／ 冷惣菜・惣菜 部門</p>
</header>

<main>
  <div class="section-label">日常業務</div>
  <div class="menu-list">

    <a class="menu-item" href="wakaba-shift.html">
      <div class="icon">📅</div>
      <div class="body">
        <div class="title">日別勤務表</div>
        <div class="desc">スタッフのシフト・勤務状況を日別に確認</div>
      </div>
      <div class="chev">›</div>
    </a>

    <a class="menu-item" href="fryer_manual.html">
      <div class="icon">🍤</div>
      <div class="body">
        <div class="title">フライヤー① 商品化基準書</div>
        <div class="desc">揚げ物の商品化タイミング・基準の簡易マニュアル</div>
      </div>
      <div class="chev">›</div>
    </a>

    <a class="menu-item" href="yaoko-store-search.html">
      <div class="icon">🔎</div>
      <div class="body">
        <div class="title">ヤオコー店舗検索</div>
        <div class="desc">全204店舗を店名・エリアから検索</div>
      </div>
      <div class="chev">›</div>
    </a>

  </div>
</main>

<footer>
  ヤオコー ワカバウォーク店 惣菜部門内利用ツール
</footer>

</body>
</html>
